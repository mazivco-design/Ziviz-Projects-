<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="הפרויקטים שלי">
<title>הפרויקטים שלי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: launcher board — grouped tiles by kind, big touch targets for iPad, RTL */
:root{
  --bg:#f3f4ef; --surface:#ffffff; --ink:#1e2a2f; --muted:#5f6b6e; --line:#d9ddd3;
  --accent:#1f6f6b; --accent-soft:#e1efe9; --warn:#a2621b; --warn-soft:#f7ead8;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a1c; --surface:#1d2528; --ink:#e7ece8; --muted:#9aa6a6; --line:#2f3a3d;
  --accent:#5fc1b5; --accent-soft:#1f3634; --warn:#e3a35a; --warn-soft:#3a2c1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1c; --surface:#1d2528; --ink:#e7ece8; --muted:#9aa6a6; --line:#2f3a3d;
  --accent:#5fc1b5; --accent-soft:#1f3634; --warn:#e3a35a; --warn-soft:#3a2c1b; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
#q{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:min(260px,100%)}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile h3{margin:0;font-size:19px;font-weight:700;line-height:1.25}
.tile p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px}
.btn.open{background:var(--accent);color:var(--bg)}
.btn.code{border:1px solid var(--line);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.missing{font-size:14px;color:var(--warn);font-weight:600;align-self:center}
.ideas .tile{background:transparent;border-style:dashed}
.empty{color:var(--muted)}
.tile{padding:0;overflow:hidden}
.tile .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--line);max-width:100%}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tbtn{font:inherit;font-weight:700;font-size:15px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tbtn.on{background:var(--warn);border-color:var(--warn);color:var(--bg)}
.tbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.editbar{display:none;background:var(--warn-soft);color:var(--ink);border-radius:12px;padding:12px 16px;gap:10px;flex-wrap:wrap;align-items:center}
.editing .editbar{display:flex}
.editbar p{margin:0;flex:1 1 260px;font-size:15px}
.edit{display:none;flex-direction:column;gap:8px}
.editing .edit{display:flex}
.editing .view-desc{display:none}
.edit textarea{font:inherit;font-size:15px;width:100%;min-height:84px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.edit .row{display:flex;flex-wrap:wrap;gap:8px}
.edit label.tbtn{display:inline-flex;align-items:center}
.edit input[type=file]{display:none}
.changed{font-size:12px;color:var(--warn);font-weight:700}
.fhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fold{all:unset;cursor:pointer;display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-size:22px}
.fold:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.fold .chev{display:inline-block;transition:transform .2s;font-size:16px;color:var(--muted)}
section.closed .chev{transform:rotate(90deg)}
section.closed .grid{display:none}
.fold small{font-family:var(--body);font-size:13px;color:var(--muted);letter-spacing:.02em}
.fedit{display:none;gap:6px;flex-wrap:wrap;align-items:center}
.editing .fedit{display:flex}
.editing .fold small,.editing .fold span:not(.chev){display:none}
.fedit input{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:min(220px,60vw)}
.sbtn{font:inherit;font-weight:700;min-width:44px;min-height:40px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.sbtn:disabled{opacity:.35;cursor:default}
.move{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.move select{font:inherit;font-size:15px;min-height:40px;padding:0 8px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);max-width:100%}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted);text-align:center}
#msg:empty{display:none}#msg{color:var(--warn);font-weight:600;margin:0}
footer{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>הפרויקטים שלי</h1>
      <p class="sub">כל הפרויקטים מבוססי הווב במקום אחד</p>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="חיפוש פרויקט…" aria-label="חיפוש פרויקט">
      <button id="editBtn" class="tbtn" type="button">עריכה</button>
    </div>
  </header>
  <div class="editbar">
    <p>מצב עריכה. השינויים נשמרים במכשיר הזה. כדי שיופיעו בכל מכשיר, הורד קובץ שינויים ושלח אותו ל-Claude.</p>
    <button id="newFolderBtn" class="tbtn" type="button">תיקייה חדשה</button>
    <button id="exportBtn" class="tbtn" type="button">הורד קובץ שינויים</button>
    <label class="tbtn" for="importFile" style="display:inline-flex;align-items:center">טען קובץ שינויים</label>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>
  <p id="msg" role="status"></p>
  <div id="board"></div>
  <footer>פרויקטים גדולים יושבים במאגר משלהם. פרויקטים קטנים יושבים כאן כתיקייה, כמו אתגר המספרים.</footer>
</main>
<script>
const GH='https://mazivco-design.github.io/', REPO='https://github.com/mazivco-design/';
const KEY='hub-edits-v1', LKEY='hub-layout-v1', CKEY='hub-closed-v1';
let data={groups:[],projects:[]}, edits={}, layout=null, closed={};
const $=s=>document.querySelector(s), board=$('#board'), q=$('#q'), msg=$('#msg');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function say(t){msg.textContent=t; if(t) setTimeout(()=>{if(msg.textContent===t)msg.textContent=''},4000)}
function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){say('אין מספיק מקום במכשיר לשמירה. נסה תמונה קטנה יותר.');return false}}
function view(p){const e=edits[p.id]||{};return {...p,desc:e.desc??p.desc,image:e.image??p.image,changed:!!(e.desc!=null||e.image!=null)}}

// layout = folders (with their order) and the order of projects inside each folder
function fullLayout(){
  const base=layout||{folders:data.groups.map(g=>({id:g.id,title:g.title,note:g.note,items:[]}))};
  const L={folders:base.folders.map(f=>({...f,items:[...(f.items||[])]}))};
  const known=new Set(data.projects.map(p=>p.id)), placed=new Set();
  L.folders.forEach(f=>{f.items=f.items.filter(id=>known.has(id)&&!placed.has(id)&&placed.add(id))});
  for(const p of data.projects){ if(placed.has(p.id)) continue;
    let f=L.folders.find(f=>f.id===p.group)||L.folders[0];
    if(!f){f={id:'misc',title:'שונות',note:'',items:[]};L.folders.push(f)}
    f.items.push(p.id); placed.add(p.id);
  }
  return L;
}
function saveLayout(L){layout=L; return put(LKEY,L)}

function tile(p0,fi,ii,L){
  const p=view(p0), url=p.url||(p.repo?GH+p.repo+'/':null), f=L.folders[fi];
  let a='';
  if(url) a+=`<a class="btn open" href="${esc(url)}" target="_blank" rel="noopener">פתח</a>`;
  if(p.extra) a+=`<a class="btn code" href="${esc(p.extra.url)}" target="_blank" rel="noopener">${esc(p.extra.label)}</a>`;
  if(p.repo) a+=`<a class="btn code" href="${REPO+p.repo}" target="_blank" rel="noopener">קוד</a>`;
  const tags=p.tags.map(t=>`<span class="tag${p.idea?' warn':''}">${esc(t)}</span>`).join('');
  const opts=L.folders.map((g,k)=>`<option value="${esc(g.id)}"${k===fi?' selected':''}>${esc(g.title)}</option>`).join('');
  return `<article class="tile" data-id="${p.id}">
   <img class="cover" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">
   <div class="body">
    <h3>${esc(p.name)}</h3>
    <p class="view-desc">${esc(p.desc)}</p>
    <div class="edit">
      <div class="move">
        <button class="sbtn" type="button" data-act="up" aria-label="הזז קודם"${ii===0?' disabled':''}>→</button>
        <button class="sbtn" type="button" data-act="down" aria-label="הזז אחר כך"${ii===f.items.length-1?' disabled':''}>←</button>
        <select id="m-${p.id}" data-act="folder" aria-label="העבר לתיקייה">${opts}</select>
      </div>
      <textarea id="d-${p.id}" aria-label="תיאור ${esc(p.name)}">${esc(p.desc)}</textarea>
      <div class="row">
        <button class="tbtn" type="button" data-act="save">שמור תיאור</button>
        <label class="tbtn" for="f-${p.id}">החלף תמונה</label>
        <input id="f-${p.id}" type="file" accept="image/*" data-act="img">
        ${p.changed?'<button class="tbtn" type="button" data-act="reset">החזר למקור</button>':''}
      </div>
      ${p.changed?'<span class="changed">שונה במכשיר הזה</span>':''}
    </div>
    <div class="tags">${tags}</div>
    ${a?`<div class="actions">${a}</div>`:''}
   </div></article>`;
}
function render(){
  const L=fullLayout(), term=q.value.trim().toLowerCase(), editing=document.body.classList.contains('editing');
  const byId=Object.fromEntries(data.projects.map(p=>[p.id,p]));
  let html='',n=0;
  L.folders.forEach((f,fi)=>{
    const ids=f.items.filter(id=>{const p=view(byId[id]);return !term||(p.name+p.desc+p.tags.join(' ')).toLowerCase().includes(term)});
    if(!ids.length&&!editing) return; n+=ids.length;
    const isIdea=f.items.length&&f.items.every(id=>byId[id].idea);
    const isClosed=closed[f.id]&&!term&&!editing;
    html+=`<section class="${isIdea?'ideas':''}${isClosed?' closed':''}" data-folder="${esc(f.id)}">
      <div class="fhead">
        <button class="fold" type="button" data-act="toggle" aria-expanded="${!isClosed}"><span class="chev">▾</span><span>${esc(f.title)}</span><small>${f.note?esc(f.note)+' · ':''}${ids.length}</small></button>
        <div class="fedit">
          <input id="t-${esc(f.id)}" value="${esc(f.title)}" aria-label="שם התיקייה" data-act="rename">
          <button class="sbtn" type="button" data-act="fup" aria-label="תיקייה למעלה"${fi===0?' disabled':''}>↑</button>
          <button class="sbtn" type="button" data-act="fdown" aria-label="תיקייה למטה"${fi===L.folders.length-1?' disabled':''}>↓</button>
          <button class="sbtn" type="button" data-act="fdel"${f.items.length?' disabled title="אפשר למחוק רק תיקייה ריקה"':''}>מחק תיקייה</button>
        </div>
      </div>
      ${ids.length?`<div class="grid">${ids.map(id=>tile(byId[id],fi,f.items.indexOf(id),L)).join('')}</div>`:'<div class="dropzone">תיקייה ריקה. העבר אליה פרויקטים בעזרת הרשימה שבכרטיס.</div>'}
    </section>`;
  });
  board.innerHTML=n||editing?`<div style="display:flex;flex-direction:column;gap:36px">${html}</div>`:'<p class="empty">לא נמצא פרויקט בשם הזה.</p>';
}
function shrink(file){return new Promise((ok,bad)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const W=640,s=Math.min(1,W/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.8))};
  img.onerror=()=>bad();img.src=u})}
function swap(a,i,j){[a[i],a[j]]=[a[j],a[i]]}

board.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled||b.tagName==='INPUT'||b.tagName==='SELECT') return;
  const act=b.dataset.act, sec=b.closest('section'), fid=sec&&sec.dataset.folder, tileEl=b.closest('.tile'), id=tileEl&&tileEl.dataset.id;
  if(act==='toggle'){ if(document.body.classList.contains('editing')) return; closed[fid]=!closed[fid]; put(CKEY,closed); render(); return }
  const L=fullLayout(), fi=L.folders.findIndex(f=>f.id===fid), f=L.folders[fi];
  if(act==='up'||act==='down'){const i=f.items.indexOf(id), j=act==='up'?i-1:i+1; if(j<0||j>=f.items.length) return; swap(f.items,i,j); saveLayout(L); render(); return}
  if(act==='fup'||act==='fdown'){const j=act==='fup'?fi-1:fi+1; swap(L.folders,fi,j); saveLayout(L); render(); return}
  if(act==='fdel'){ if(f.items.length) return; L.folders.splice(fi,1); saveLayout(L); render(); say('התיקייה נמחקה'); return}
  if(act==='save'){edits[id]={...edits[id],desc:$('#d-'+id).value.trim()}; if(put(KEY,edits)){render();say('התיאור נשמר')}}
  if(act==='reset'){delete edits[id]; put(KEY,edits); render(); say('הוחזר למקור')}
});
board.addEventListener('change',async e=>{
  const el=e.target, act=el.dataset.act;
  if(act==='folder'){const id=el.closest('.tile').dataset.id, L=fullLayout();
    L.folders.forEach(f=>f.items=f.items.filter(x=>x!==id)); const t=L.folders.find(f=>f.id===el.value); t.items.push(id);
    saveLayout(L); render(); say(`הועבר לתיקייה "${t.title}"`); return}
  if(act==='rename'){const L=fullLayout(), f=L.folders.find(f=>f.id===el.closest('section').dataset.folder), v=el.value.trim();
    if(!v){el.value=f.title;return} f.title=v; saveLayout(L); render(); say('שם התיקייה עודכן'); return}
  if(act==='img'&&el.files[0]){const id=el.closest('.tile').dataset.id;
    try{const url=await shrink(el.files[0]); edits[id]={...edits[id],image:url}; if(put(KEY,edits)){render();say('התמונה הוחלפה')}}
    catch(err){say('לא הצלחתי לקרוא את התמונה. נסה קובץ אחר.')}}
});
$('#newFolderBtn').onclick=()=>{const L=fullLayout(); let k=1; while(L.folders.some(f=>f.id==='f'+k)) k++;
  L.folders.unshift({id:'f'+k,title:'תיקייה חדשה',note:'',items:[]}); saveLayout(L); render();
  const inp=document.getElementById('t-f'+k); if(inp){inp.focus();inp.select()} say('נוספה תיקייה למעלה. תן לה שם.')};
$('#editBtn').onclick=()=>{const on=document.body.classList.toggle('editing');$('#editBtn').classList.toggle('on',on);$('#editBtn').textContent=on?'סיום עריכה':'עריכה';render()};
$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify({kind:'hub-edits',date:new Date().toISOString(),edits,layout:fullLayout()},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hub-edits.json';document.body.appendChild(a);a.click();a.remove();
  say('הקובץ hub-edits.json ירד');
};
$('#importFile').onchange=async e=>{
  try{const o=JSON.parse(await e.target.files[0].text()); if(!o.edits) throw 0; edits={...edits,...o.edits}; put(KEY,edits); if(o.layout) saveLayout(o.layout); render(); say('השינויים נטענו')}
  catch(err){say('הקובץ הזה הוא לא קובץ שינויים של האתר.')}
  e.target.value='';
};
q.addEventListener('input',render);
edits=get(KEY,{}); layout=get(LKEY,null); closed=get(CKEY,{});
fetch('projects.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{data=d; if(d.layout&&!layout) layout=d.layout; render()})
 .catch(()=>{board.innerHTML='<p class="empty">לא הצלחתי לטעון את רשימת הפרויקטים. רענן את הדף.</p>'});
</script>
</body>
</html>

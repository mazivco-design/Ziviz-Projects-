<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קלפי ABC נינג'גו</title>
<style>
  :root { --primary:#d32f2f; --dark:#212121; --gold:#ffb300; --bg:#f5f5f5; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); margin:0; padding:20px; color:var(--dark); }
  .controls-bar { max-width:1050px; margin:0 auto 25px auto; background:#fff; padding:15px 25px; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.08);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; }
  .controls-bar h1 { margin:0; font-size:24px; color:var(--primary); }
  .btn-group { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button, .btn { background:var(--primary); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:15px; font-weight:bold; cursor:pointer; transition:.2s; text-decoration:none; font-family:inherit; }
  button:hover, .btn:hover { background:#b71c1c; }
  button.secondary, .btn.secondary { background:#555; }
  button.secondary:hover, .btn.secondary:hover { background:#333; }
  #syncBtn.on { background:#2e7d32; }
  #status { font-size:13px; color:#666; min-width:9em; }
  .cards-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:20px; max-width:1250px; margin:0 auto; align-items:start; }
  .card { background:#fff; border:3px solid #222; border-radius:12px; padding:15px; box-shadow:0 4px 10px rgba(0,0,0,.05); display:flex; flex-direction:column; justify-content:space-between; position:relative; box-sizing:border-box; }
  .card-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #eee; padding-bottom:10px; }
  .letters-group { display:flex; align-items:center; gap:8px; direction:ltr; }
  .letter-box { font-size:26px; font-weight:900; font-family:'Courier New',monospace; width:44px; height:44px; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; transition:transform .1s,background .2s; user-select:none; }
  .letter-box:hover { transform:scale(1.08); }
  .letter-upper { background:#fff3e0; border:2px solid var(--gold); color:#e65100; }
  .letter-lower { background:#e8f5e9; border:2px solid #66bb6a; color:#2e7d32; }
  .ninjago-name-container { display:flex; align-items:center; gap:6px; direction:ltr; }
  .ninjago-name { font-size:18px; font-weight:bold; color:var(--primary); outline:none; min-width:70px; display:inline-block; }
  .ninjago-name:empty::before { content:'name...'; color:#bbb; font-weight:normal; }
  .ninjago-name:focus { border-bottom:2px solid var(--gold); }
  .action-icon-btn { background:#f0f0f0; border:1px solid #ccc; border-radius:6px; padding:4px 7px; cursor:pointer; font-size:14px; color:#222; text-decoration:none; }
  .action-icon-btn:hover { background:#e0e0e0; }
  .image-container { width:100%; height:205px; border:2px dashed #bbb; border-radius:8px; margin:12px 0; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; background:#fafafa; overflow:hidden; outline:none; cursor:pointer; }
  .image-container:focus, .image-container.dragover { border-color:var(--primary); background:#fff8e1; }
  .image-container.pasting { border:3px solid var(--primary); background:#fff8e1; caret-color:transparent; -webkit-user-select:text; user-select:text; }
  .image-container img { width:100%; height:100%; object-fit:contain; background:#fff; }
  .delete-img-btn { position:absolute; top:8px; left:8px; background:rgba(211,47,47,.9); color:#fff; border:none; border-radius:50%; width:28px; height:28px; padding:0; font-size:13px; display:flex; align-items:center; justify-content:center; z-index:5; }
  .image-placeholder-text { font-size:13px; color:#777; text-align:center; line-height:1.5; padding:10px; pointer-events:none; }
  .img-toolbar { position:absolute; bottom:6px; background:rgba(255,255,255,.94); padding:3px 10px; border-radius:6px; display:flex; gap:8px; font-size:11px; border:1px solid #ddd; z-index:4; }
  .img-toolbar a, .img-toolbar span { color:#333; text-decoration:none; cursor:pointer; font-weight:bold; }
  .tabbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; direction:ltr; margin-bottom:10px; }
  .tab { display:flex; align-items:center; gap:4px; background:#eee; border:2px solid #ddd; border-radius:8px 8px 0 0; padding:5px 10px; font-size:14px; font-weight:bold; color:#444; cursor:pointer; user-select:none; max-width:160px; }
  .tab span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tab.active { background:#fff3e0; border-color:var(--gold); color:#e65100; }
  .tab .x { font-size:11px; color:#999; padding:0 2px; border-radius:4px; }
  .tab .x:hover { background:#ffcdd2; color:#b71c1c; }
  .tab.add { background:#e8f5e9; border-color:#66bb6a; color:#2e7d32; font-size:18px; line-height:1; padding:3px 10px; }
  .pane { display:none; }
  .search-row { display:flex; gap:6px; align-items:center; margin-top:8px; direction:ltr; }
  .search-row input { flex:1; min-width:0; border:1px solid #ccc; border-radius:8px; padding:7px 10px; font-size:15px; outline:none; }
  .search-row input:focus { border-color:var(--primary); }
  .search-row button { padding:7px 12px; font-size:14px; }
  .results { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-top:8px; }
  .results:empty { display:none; }
  .results img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; border:2px solid #ddd; cursor:pointer; background:#f3f3f3; display:block; }
  .results img:hover { border-color:var(--primary); transform:scale(1.04); }
  .results .more { grid-column:1 / -1; }
  .results .more button { width:100%; background:#555; font-size:13px; padding:6px; }
  .search-msg { font-size:12px; color:#777; margin-top:4px; }
  .search-msg:empty { display:none; }
  .pane.active { display:block; }
  #importBox { max-width:1050px; margin:0 auto 20px; background:#fff; border-radius:12px; padding:15px 25px; box-shadow:0 4px 12px rgba(0,0,0,.08); display:none; }
  #importBox.open { display:block; }
  #importBox textarea { width:100%; box-sizing:border-box; min-height:90px; font-size:14px; }
  @media print {
    body { background:#fff; padding:0; }
    .controls-bar, #importBox, .img-toolbar, .action-icon-btn, .image-placeholder-text, .delete-img-btn, .search-row, .results, .search-msg { display:none !important; }
    .cards-grid { grid-template-columns:1fr 1fr; gap:15mm; width:100%; }
    .tabbar { display:none !important; }
    .card { display:contents; }
    .pane { display:block !important; break-inside:avoid; border:2px solid #000; border-radius:12px; padding:15px; height:125mm; box-sizing:border-box; }
    .pane .image-container { height:95mm; }
  }
</style>
</head>
<body>

<div class="controls-bar">
  <div>
    <h1>קלפי ABC נינג'גו 🔊</h1>
    <small>הכול נשמר אוטומטית. חפש תמונה בוויקי של נינג'גו מתחת לכל קלף ולחץ עליה – או הדבק/גרור. (+) להוספת דמויות לאות.</small>
  </div>
  <div class="btn-group">
    <span id="status" role="status"></span>
    <button id="syncBtn" type="button" hidden>☁️ התחבר לסנכרון</button>
    <a class="btn" href="game.html">🎮 משחק: תמונה לאות</a>
    <button class="secondary" type="button" onclick="document.getElementById('importBox').classList.toggle('open')">📥 העברה מהגרסה הישנה</button>
    <button class="secondary" type="button" onclick="window.print()">🖨️ הדפס קלפים</button>
    <a class="btn secondary" href="../">כל הפרויקטים</a>
  </div>
</div>

<div id="importBox">
  <p style="margin-top:0">בגרסה הישנה (ב-Claude) לחץ <b>"העתק להעברה"</b>, ואז הדבק כאן ולחץ <b>"טען"</b>. קלפים שכבר מילאת כאן לא יידרסו אם הם ריקים בגרסה הישנה.</p>
  <textarea id="importText" placeholder="הדבק כאן…"></textarea>
  <p><button type="button" id="importBtn">טען</button></p>
</div>

<div class="cards-grid" id="cardsGrid"></div>

<script>
const data = [
  { upper:'A', lower:'a', name:'Airjitzu' }, { upper:'B', lower:'b', name:'Borg' }, { upper:'C', lower:'c', name:'Cole' },
  { upper:'D', lower:'d', name:'Dareth' }, { upper:'E', lower:'e', name:'Elemental Masters' }, { upper:'F', lower:'f', name:'First Spinjitzu Master' },
  { upper:'G', lower:'g', name:'Garmadon' }, { upper:'H', lower:'h', name:'Harumi' }, { upper:'I', lower:'i', name:'Ice Dragon' },
  { upper:'J', lower:'j', name:'Jay' }, { upper:'K', lower:'k', name:'Kai' }, { upper:'L', lower:'l', name:'Lloyd' },
  { upper:'M', lower:'m', name:'Misako' }, { upper:'N', lower:'n', name:'Nya' }, { upper:'O', lower:'o', name:'Overlord' },
  { upper:'P', lower:'p', name:'Pixal' }, { upper:'Q', lower:'q', name:'Quiet One' }, { upper:'R', lower:'r', name:'Ronin' },
  { upper:'S', lower:'s', name:'Spinjitzu' }, { upper:'T', lower:'t', name:'Tournament of Elements' }, { upper:'U', lower:'u', name:'Ultra Dragon' },
  { upper:'V', lower:'v', name:'Vex' }, { upper:'W', lower:'w', name:'Master Wu' }, { upper:'X', lower:'x', name:'Samurai X' },
  { upper:'Y', lower:'y', name:'Master Yang' }, { upper:'Z', lower:'z', name:'Zane' }
];
const KEY = 'ninjago_abc_v3';
const $ = id => document.getElementById(id);
function status(t){ $('status').textContent = t; }

/* ---------- voice ---------- */
let voices = [];
function loadVoices(){ if ('speechSynthesis' in window) voices = speechSynthesis.getVoices(); }
loadVoices();
if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
function getBestVoice(){
  if (!voices.length) loadVoices();
  return voices.find(v => v.lang.startsWith('en') && /Natural|Online|Neural|Google US English/.test(v.name))
      || voices.find(v => v.lang.startsWith('en') && /Google|Microsoft|Samantha/.test(v.name))
      || voices.find(v => v.lang.startsWith('en')) || null;
}
function speak(text){
  if (!text || !text.trim() || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  text = text.trim();
  if (/^[A-Za-z]$/.test(text)) text = text.toLowerCase(); // a single letter: say its name only, without "capital"
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = .88; u.pitch = 1.05;
  const v = getBestVoice(); if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ---------- saved state ----------
   cards = { 'card_3': {name, img, t},  'card_3_1': {...}, 'card_3_2': {...}, ... }
   'card_i' is the first tab of letter i, 'card_i_n' are extra tabs. A deleted tab is kept as {del:true, t}
   so that the deletion also reaches the other devices. */
function loadAll(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ return {}; } }
let cards = loadAll();
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(cards)); return true; }
  catch(e){ status('אין מקום במכשיר. מחק תמונה או השתמש בתמונה קטנה יותר.'); return false; }
}
const letterOf = key => parseInt(key.split('_')[1], 10);
const numOf = key => parseInt(key.split('_')[2] || '0', 10);
const isKeyOf = (key, i) => key === 'card_' + i || key.startsWith('card_' + i + '_');
function tabOf(key){ const c = cards[key] || {}; return { name:c.name||'', img:c.img||'', t:c.t||0, del:!!c.del }; }
function defaultName(key){ return numOf(key) === 0 ? data[letterOf(key)].name : ''; }
function nextKey(i){
  let n = 0; Object.keys(cards).forEach(k => { if (isKeyOf(k, i)) n = Math.max(n, numOf(k)); });
  return 'card_' + i + '_' + (n + 1);
}
function keysOf(i){ // live tabs of letter i, in order; always at least one
  const out = Object.keys(cards).filter(k => isKeyOf(k, i) && !cards[k].del).sort((a, b) => numOf(a) - numOf(b));
  if (!out.length) out.push(cards['card_' + i] ? nextKey(i) : 'card_' + i);
  return out;
}
const active = {}; // letter index -> key of the open tab

/* ---------- build cards ---------- */
const grid = $('cardsGrid');
data.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card'; card.id = 'card_' + i;
  grid.appendChild(card);
  renderCard(i);
});

function paneHTML(key){
  const item = data[letterOf(key)];
  return `<div class="pane" id="pane_${key}" data-key="${key}">
    <div class="card-header">
      <div class="letters-group">
        <div class="letter-box letter-upper" data-say="${item.upper}">${item.upper}</div>
        <div class="letter-box letter-lower" data-say="${item.lower}">${item.lower}</div>
      </div>
      <div class="ninjago-name-container">
        <span class="ninjago-name" id="title_${key}" contenteditable="true" data-name-of="${key}"></span>
        <button class="action-icon-btn" type="button" data-say-el="title_${key}" title="השמע מילה">🔊</button>
      </div>
    </div>
    <div class="image-container" id="img_wrap_${key}" tabindex="0" data-img-of="${key}" title="לחץ כאן והדבק תמונה, או גרור תמונה">
      <button class="delete-img-btn" type="button" data-del-img="${key}" title="מחק תמונה">✕</button>
      <img id="img_${key}" alt="">
      <div class="image-placeholder-text" id="placeholder_${key}">לחץ כאן והדבק תמונה<br>או גרור תמונה 🖼️</div>
      <div class="img-toolbar">
        <a id="search_${key}" href="#" target="_blank" rel="noopener">🔍 חפש בגוגל</a>
        <span>|</span>
        <span data-paste-of="${key}" title="הדבק תמונה מהלוח">📋 הדבק</span>
        <span>|</span>
        <label for="file_${key}" style="cursor:pointer;font-weight:bold">📁 מהמכשיר</label>
        <input type="file" id="file_${key}" accept="image/*" style="display:none" data-file-of="${key}">
      </div>
    </div>
    <div class="search-row">
      <input type="search" id="q_${key}" data-q-of="${key}" placeholder="חפש בוויקי של נינג'גו..." autocomplete="off" enterkeyhint="search">
      <button type="button" data-search-btn="${key}">🔍 חפש</button>
    </div>
    <div class="results" id="res_${key}"></div>
    <div class="search-msg" id="msg_${key}"></div>
  </div>`;
}
function tabLabel(key){ return tabOf(key).name || defaultName(key) || 'חדש'; }
function renderCard(i){
  const keys = keysOf(i);
  if (!keys.includes(active[i])) active[i] = keys[0];
  const card = $('card_' + i);
  card.innerHTML = `<div class="tabbar" id="tabs_${i}">` +
    keys.map(k => `<div class="tab${k === active[i] ? ' active' : ''}" data-tab="${k}"><span>${esc(tabLabel(k))}</span><span class="x" data-del-tab="${k}" title="מחק לשונית">✕</span></div>`).join('') +
    `<div class="tab add" data-add-tab="${i}" title="הוסף דמות או מושג לאות ${data[i].upper}">+</div></div>` +
    keys.map(paneHTML).join('');
  keys.forEach(fillPane);
  $('pane_' + active[i]).classList.add('active');
}
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fillPane(key){
  const c = tabOf(key), title = $('title_' + key), name = c.name || defaultName(key);
  if (title.innerText !== name && document.activeElement !== title) title.innerText = name;
  setImg(key, c.img);
  updateSearch(key);
}
function setImg(key, src){
  const img = $('img_' + key);
  if (src) img.src = src; else img.removeAttribute('src');
  img.style.display = src ? 'block' : 'none';
  $('placeholder_' + key).style.display = src ? 'none' : 'block';
  $('pane_' + key).querySelector('.delete-img-btn').style.display = src ? 'flex' : 'none';
}
function updateSearch(key){
  const word = ($('title_' + key).innerText || '').trim();
  const q = word ? 'lego ninjago ' + word : 'lego ninjago';
  $('search_' + key).href = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q);
  const box = $('q_' + key);
  if (box && !box.dataset.touched) box.value = word;
}

/* ---------- image search inside the card (Ninjago wiki on Fandom – free, no key) ----------
   1st request: pages matching the words → the main picture of each page.
   "more": every picture on the best-matching page. */
const WIKI = 'https://ninjago.fandom.com/api.php?format=json&origin=*&';
const searchState = {}; // key -> { q, pages:[titles], pageIdx }
function wikiFetch(params){ return fetch(WIKI + params).then(r => r.json()); }
function addResult(res, key, full, thumb, title){
  if (res.querySelector(`img[data-full="${CSS.escape(full)}"]`)) return false;
  const im = document.createElement('img');
  im.src = thumb || full; im.alt = ''; im.title = title || '';
  im.dataset.full = full; im.dataset.thumb = thumb || full; im.dataset.pick = key; im.loading = 'lazy';
  res.appendChild(im); return true;
}
function moreButton(res, key){
  const w = document.createElement('div'); w.className = 'more';
  w.innerHTML = '<button type="button" data-more="' + key + '">⬇️ עוד תמונות</button>'; res.appendChild(w);
}
async function runSearch(key, more){
  const box = $('q_' + key), res = $('res_' + key), msg = $('msg_' + key);
  const q = (box.value || '').replace(/^lego\s+ninjago\s+/i, '').trim();
  if (!q) { msg.textContent = 'כתוב מה לחפש.'; box.focus(); return; }
  res.querySelectorAll('.more').forEach(n => n.remove());
  msg.textContent = 'מחפש…';
  try {
    if (!more || !searchState[key] || searchState[key].q !== q) {
      res.innerHTML = '';
      const d = await wikiFetch('action=query&generator=search&gsrsearch=' + encodeURIComponent(q) + '&gsrlimit=12&gsrnamespace=0&prop=pageimages&piprop=original|thumbnail&pithumbsize=300');
      const pages = Object.values((d.query || {}).pages || {}).sort((x, y) => x.index - y.index);
      let n = 0;
      pages.forEach(pg => { if (pg.original && addResult(res, key, pg.original.source, pg.thumbnail && pg.thumbnail.source, pg.title)) n++; });
      searchState[key] = { q, pages: pages.map(pg => pg.title), pageIdx: 0 };
      if (!pages.length) { msg.textContent = 'לא נמצא בוויקי של נינג\'גו. נסה שם אחר, או "חפש בגוגל".'; return; }
      msg.textContent = n ? '' : 'לדפים שנמצאו אין תמונה ראשית – לחץ "עוד תמונות".';
      moreButton(res, key); return;
    }
    const st = searchState[key];
    if (st.pageIdx >= st.pages.length) { msg.textContent = 'אין עוד תמונות.'; return; }
    const title = st.pages[st.pageIdx++];
    const d = await wikiFetch('action=query&generator=images&titles=' + encodeURIComponent(title) + '&gimlimit=40&prop=imageinfo&iiprop=url|size&iiurlwidth=300');
    let n = 0;
    Object.values((d.query || {}).pages || {}).forEach(f => {
      const ii = f.imageinfo && f.imageinfo[0]; if (!ii || !/\.(png|jpe?g|webp)$/i.test(f.title)) return;
      if (ii.width && ii.width < 120) return;
      if (addResult(res, key, ii.url, ii.thumburl, f.title.replace(/^File:/, ''))) n++;
    });
    msg.textContent = n ? '' : 'אין תמונות נוספות בדף ' + title + '.';
    if (st.pageIdx < st.pages.length) moreButton(res, key);
  } catch(e) {
    msg.textContent = 'החיפוש נכשל: ' + (e.message || e);
  }
}
/* chosen picture: fetch it, shrink it and store it like a pasted one; if the site blocks us, keep the thumbnail */
async function pickResult(key, full, thumb){
  const msg = $('msg_' + key); msg.textContent = 'טוען תמונה…';
  const toDataUrl = src => new Promise((ok, bad) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => { try { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; c.getContext('2d').drawImage(im, 0, 0); ok(c.toDataURL('image/png')); } catch(e) { bad(e); } };
    im.onerror = () => bad(new Error('load')); im.src = src;
  });
  let src = '';
  try { src = await toDataUrl(full); } catch(e) { try { src = await toDataUrl(thumb); } catch(e2) { src = thumb; } }
  setImg(key, await shrink(src)); changed(key);
  msg.textContent = ''; $('res_' + key).innerHTML = '';
}
function readPane(key){
  const img = $('img_' + key), name = ($('title_' + key).innerText || '').trim();
  return { img: img.style.display !== 'none' ? (img.getAttribute('src') || '') : '',
           name: name && name !== defaultName(key) ? name : '' };
}
function updateTabLabel(key){
  const t = $('tabs_' + letterOf(key)).querySelector(`[data-tab="${key}"] span`);
  if (t) t.textContent = ($('title_' + key).innerText || '').trim() || defaultName(key) || 'חדש';
}

/* ---------- tabs ---------- */
function addTab(i){
  const key = nextKey(i);
  cards[key] = { name:'', img:'', t: Date.now() };
  active[i] = key; persist(); pushCard(key); renderCard(i);
  $('title_' + key).focus();
}
function deleteTab(key){
  const i = letterOf(key), c = tabOf(key);
  const label = c.name || defaultName(key);
  if (!confirm('למחוק את הלשונית "' + (label || 'חדש') + '"' + (c.img ? ' כולל התמונה' : '') + '?')) return;
  cards[key] = { del:true, t: Date.now() };
  dirty.delete(key); persist(); pushCard(key); renderCard(i);
}

/* ---------- events (one listener for the whole grid) ---------- */
grid.addEventListener('click', e => {
  const t = e.target;
  const say = t.closest('[data-say]'); if (say) return speak(say.dataset.say);
  const sayEl = t.closest('[data-say-el]'); if (sayEl) return speak($(sayEl.dataset.sayEl).innerText);
  const delImg = t.closest('[data-del-img]'); if (delImg) { e.stopPropagation(); setImg(delImg.dataset.delImg, ''); return changed(delImg.dataset.delImg); }
  const delTab = t.closest('[data-del-tab]'); if (delTab) { e.stopPropagation(); return deleteTab(delTab.dataset.delTab); }
  const paste = t.closest('[data-paste-of]'); if (paste) { e.stopPropagation(); return pasteFromClipboard(paste.dataset.pasteOf); }
  const sb = t.closest('[data-search-btn]'); if (sb) return runSearch(sb.dataset.searchBtn, false);
  const mb = t.closest('[data-more]'); if (mb) return runSearch(mb.dataset.more, true);
  const pk = t.closest('[data-pick]'); if (pk) return pickResult(pk.dataset.pick, pk.dataset.full, pk.dataset.thumb);
  const add = t.closest('[data-add-tab]'); if (add) return addTab(+add.dataset.addTab);
  const tab = t.closest('[data-tab]'); if (tab) { const i = letterOf(tab.dataset.tab); active[i] = tab.dataset.tab; return renderCard(i); }
});
grid.addEventListener('input', e => {
  const el = e.target.closest('[data-name-of]'); if (!el) return;
  const key = el.dataset.nameOf; updateSearch(key); updateTabLabel(key); changed(key);
});
grid.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.closest('[data-name-of]')) { e.preventDefault(); e.target.blur(); }
  const q = e.target.closest('[data-q-of]'); if (q) { e.preventDefault(); runSearch(q.dataset.qOf, false); }
});
grid.addEventListener('input', e => { const q = e.target.closest('[data-q-of]'); if (q) q.dataset.touched = '1'; });
grid.addEventListener('change', e => {
  const inp = e.target.closest('[data-file-of]'); if (!inp) return;
  const f = inp.files[0]; if (f) readFile(inp.dataset.fileOf, f); inp.value = '';
});
grid.addEventListener('paste', e => {
  const wrap = e.target.closest('[data-img-of]'); if (!wrap) return;
  const key = wrap.dataset.imgOf, cd = e.clipboardData || {}, items = cd.items || [], files = cd.files || [];
  e.preventDefault(); endPasteFallback(wrap);
  for (const f of files) if (f.type.startsWith('image/')) return readFile(key, f);
  for (const it of items) if (it.type.indexOf('image') !== -1) return readFile(key, it.getAsFile());
  const url = imageUrlFromText(cd.getData('text/uri-list')) || imageUrlFromText(cd.getData('text/plain')) || imageUrlFromText(cd.getData('text/html'));
  if (url) { setImg(key, url); changed(key); } else status('אין תמונה בלוח.');
});
grid.addEventListener('focusout', e => { const w = e.target.closest && e.target.closest('[data-img-of].pasting'); if (w) setTimeout(() => endPasteFallback(w), 300); });
grid.addEventListener('dragover', e => { const w = e.target.closest('[data-img-of]'); if (w) { e.preventDefault(); w.classList.add('dragover'); } });
grid.addEventListener('dragleave', e => { const w = e.target.closest('[data-img-of]'); if (w) w.classList.remove('dragover'); });
grid.addEventListener('drop', e => {
  const w = e.target.closest('[data-img-of]'); if (!w) return;
  e.preventDefault(); w.classList.remove('dragover'); const key = w.dataset.imgOf;
  if (e.dataTransfer.files && e.dataTransfer.files[0]) return readFile(key, e.dataTransfer.files[0]);
  const m = (e.dataTransfer.getData('text/html') || '').match(/src=["'](.*?)["']/);
  if (m && m[1]) { setImg(key, m[1]); changed(key); }
});

/* paste button: read the clipboard directly (works on iPad, where there is no Ctrl+V) */
function imageUrlFromText(text){
  text = (text || '').trim();
  if (/^(https?:\/\/|data:image\/)/.test(text)) return text;
  const m = text.match(/<img[^>]+src=["']([^"']+)["']/i); return m ? m[1] : '';
}
async function pasteFromClipboard(key){
  if (!navigator.clipboard || !navigator.clipboard.read) return pasteFallback(key, 'הדפדפן לא מאפשר קריאה מהלוח');
  try {
    const items = await navigator.clipboard.read();
    const types = [];
    for (const it of items) {
      it.types.forEach(t => types.push(t));
      const imgType = it.types.find(t => t.startsWith('image/'));
      if (imgType) { readFile(key, await it.getType(imgType)); return; }
    }
    for (const it of items) for (const t of ['text/uri-list', 'text/plain', 'text/html']) {
      if (!it.types.includes(t)) continue;
      const url = imageUrlFromText(await (await it.getType(t)).text());
      if (url) { setImg(key, url); changed(key); return; }
    }
    pasteFallback(key, 'אין תמונה בלוח' + (types.length ? ' (' + types.join(', ') + ')' : ''));
  } catch(e) {
    pasteFallback(key, e && e.name === 'NotAllowedError' ? 'ההדבקה לא אושרה' : 'שגיאה: ' + (e && e.message || e));
  }
}
/* second way: an editable spot inside the picture area, so a long press shows the system "Paste" menu */
function pasteFallback(key, why){
  const wrap = $('img_wrap_' + key);
  wrap.classList.add('pasting');
  wrap.setAttribute('contenteditable', 'true'); wrap.setAttribute('inputmode', 'none');
  wrap.focus();
  status(why + '. לחץ לחיצה ארוכה על אזור התמונה ובחר "הדבק".');
}
function endPasteFallback(wrap){
  wrap.classList.remove('pasting'); wrap.removeAttribute('contenteditable'); wrap.removeAttribute('inputmode');
  wrap.querySelectorAll('br, div:not([class]), span:not([class])').forEach(n => n.remove());
}

/* ---------- autosave ---------- */
const dirty = new Set(); let saveTimer = null;
function changed(key){ dirty.add(key); status('שומר…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700); }
function flush(){
  const now = Date.now(), keys = [...dirty]; dirty.clear();
  keys.forEach(k => { if ($('pane_' + k)) cards[k] = { ...readPane(k), t: now }; });
  if (persist()) status('נשמר ✓');
  keys.forEach(pushCard);
}

/* pictures: shrink before saving so they fit on the device and in the account */
function shrink(src){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 700 / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      try { res(c.toDataURL('image/jpeg', .82)); } catch(e) { res(src); }
    };
    im.onerror = () => res(src);
    im.src = src;
  });
}
function readFile(key, file){
  const r = new FileReader();
  r.onload = async ev => { setImg(key, await shrink(ev.target.result)); changed(key); };
  r.readAsDataURL(file);
}

/* transfer from the old version in Claude */
$('importBtn').onclick = async () => {
  let o; try { o = JSON.parse($('importText').value.trim()); } catch(e) { return status('הטקסט שהודבק לא תקין. נסה להעתיק שוב.'); }
  if (o && o.cards) o = o.cards;
  if (!o || typeof o !== 'object') return status('הטקסט שהודבק לא תקין.');
  let n = 0;
  for (let i = 0; i < data.length; i++) {
    const src = o['card_' + i]; if (!src || !(src.img || src.name)) continue;
    const img = src.img && src.img.startsWith('data:') ? await shrink(src.img) : (src.img || '');
    cards['card_' + i] = { img, name: src.name || '', t: Date.now() };
    renderCard(i); n++;
  }
  persist(); Object.keys(cards).forEach(pushCard);
  $('importText').value = ''; $('importBox').classList.remove('open');
  status(`הועברו ${n} קלפים ✓`);
};

/* ---------- sync (shared ZSync from the projects site) ---------- */
const APP = 'abc-cards';
let Z = null, ready = false, unsub = null, remote = {};
function pushCard(k){
  if (!ready || !Z || !Z.user) return;
  const c = cards[k]; if (!c) return;
  const v = JSON.stringify(c);
  if (remote[k] === v) return;
  if (v.length > 1000000) return status('תמונה גדולה מדי לסנכרון.');
  Z.saveItem(APP, k, v).catch(() => status('הסנכרון נכשל. השינוי נשמר במכשיר.'));
}
function onRemote(items){
  remote = items;
  const touched = new Set();
  Object.keys(items).forEach(k => {
    if (!/^card_\d+(_\d+)?$/.test(k) || isNaN(letterOf(k)) || !data[letterOf(k)]) return;
    let r = null; try { r = JSON.parse(items[k]); } catch(e) {}
    const l = cards[k];
    if (r && (!l || (r.t || 0) > (l.t || 0))) { cards[k] = r; if (!dirty.has(k)) touched.add(letterOf(k)); }
  });
  if (touched.size) { persist(); touched.forEach(renderCard); }
  if (!ready) { ready = true; Object.keys(cards).forEach(pushCard); } // first time: send what's newer here
}
function setSyncUI(){
  const b = $('syncBtn'); b.hidden = false;
  if (Z.user) { b.textContent = '☁️ מסונכרן'; b.classList.add('on'); b.title = Z.user.email || ''; }
  else { b.textContent = '☁️ התחבר לסנכרון'; b.classList.remove('on'); b.title = ''; }
}
$('syncBtn').onclick = async () => {
  if (!Z) return;
  if (Z.user) return status('מחובר בתור ' + (Z.user.email || ''));
  try { await Z.signIn(); } catch(e) { if (!e || e.code !== 'auth/popup-closed-by-user') status('הכניסה לא הצליחה. נסה שוב.'); }
};
function hook(){
  if (Z || !window.ZSync) return; Z = window.ZSync;
  Z.onUser(u => {
    if (unsub) { unsub(); unsub = null; }
    ready = false; remote = {}; setSyncUI();
    if (u) unsub = Z.watchItems(APP, onRemote);
  });
}
window.addEventListener('zsync-ready', hook); hook();
</script>

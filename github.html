<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המאגרים שלי ב-GitHub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{--bg:#f3f4ef;--surface:#fff;--ink:#1e2a2f;--muted:#5f6b6e;--line:#d9ddd3;--accent:#1f6f6b;--accent-soft:#e1efe9;
  --display:"Secular One","Assistant",system-ui,sans-serif;--body:"Assistant",system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root{--bg:#141a1c;--surface:#1d2528;--ink:#e7ece8;--muted:#9aa6a6;--line:#2f3a3d;--accent:#5fc1b5;--accent-soft:#1f3634;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
main{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;line-height:1.1}
.sub{color:var(--muted);margin:6px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn.open{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:10px}
.repo{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.repo .info{flex:1 1 260px;min-width:0}
.repo h2{margin:0;font-size:18px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.repo p{margin:2px 0 0;color:var(--muted);font-size:14px}
.repo .acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-inline-start:6px}
#status{color:var(--muted);margin:0}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>המאגרים שלי ב-GitHub</h1>
      <p class="sub">כל המאגרים של mazivco-design, מהמעודכן ביותר</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="https://github.com/mazivco-design?tab=repositories" target="_blank" rel="noopener">הפרופיל ב-GitHub</a>
      <a class="btn" href="./">חזרה לכל הפרויקטים</a>
    </div>
  </header>
  <p id="status">טוען את רשימת המאגרים…</p>
  <div class="list" id="list"></div>
</main>
<script>
const USER='mazivco-design';
// used only if GitHub can't be reached
const FALLBACK=['Ziviz-Projects-','Smart-reading-page','israel-map','LIVE-BOOK','canvas-sheli','ninja-voice-game','NINJGO-GAME-HEBREW-WRITING','Noam-writing-game-claude','-']
  .map(n=>({name:n,html_url:'https://github.com/'+USER+'/'+n,has_pages:true}));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ago(iso){if(!iso)return'';const d=(Date.now()-new Date(iso))/864e5;
  return d<1?'עודכן היום':d<2?'עודכן אתמול':d<30?`עודכן לפני ${Math.floor(d)} ימים`:'עודכן ב-'+new Date(iso).toLocaleDateString('he-IL')}
function render(repos,live){
  document.getElementById('status').textContent=live?`${repos.length} מאגרים`:'אין חיבור ל-GitHub כרגע, מוצגת רשימה שמורה.';
  document.getElementById('list').innerHTML=repos.map(r=>{
    const site=`https://${USER}.github.io/${r.name}/`;
    return `<article class="repo"><div class="info"><h2>${esc(r.name)}${r.private?'<span class="pill">פרטי</span>':''}</h2>
      <p>${esc(r.description||'')}${r.description?' · ':''}${ago(r.pushed_at)}</p></div>
      <div class="acts">${r.has_pages?`<a class="btn open" href="${site}" target="_blank" rel="noopener">האתר</a>`:''}
      <a class="btn" href="${esc(r.html_url)}" target="_blank" rel="noopener">הקוד</a></div></article>`}).join('');
}
fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
  .then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>render(d,true)).catch(()=>render(FALLBACK,false));
</script>
</body>
</html>

<title>מטוס האותיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap">
<style>
  /* Layout: letter strip on top, one big tracing stage below. Single deliberate night-sky look. */
  :root {
    --sky: #141a33;
    --sky-2: #1d2547;
    --card: #fff1c2;
    --card-ink: #d9a21b;
    --active: #ff9a1f;
    --track: #2b5d7c;
    --lit: #4fc8f2;
    --dot: #ffc83d;
    --plane-bg: #7b6cf0;
    --ink: #eef1ff;
    --muted: #9aa3d6;
    --font-ui: 'Varela Round', 'Arial Hebrew', Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--font-ui);
    margin: 0;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  .app { height: 100%; display: flex; flex-direction: column; padding-inline: 16px; padding-block: 12px; gap: 10px; }
  .strip {
    display: flex; direction: rtl; gap: 10px; overflow-x: auto; padding: 6px 2px 10px;
    scrollbar-width: none; flex: none;
  }
  .strip::-webkit-scrollbar { display: none; }
  .card {
    flex: none; width: 76px; height: 76px; border-radius: 14px; border: 4px solid transparent;
    background: var(--card); cursor: pointer; padding: 6px; position: relative;
    transition: transform .2s ease, border-color .2s ease;
  }
  .card svg { width: 100%; height: 100%; display: block; }
  .card path { fill: none; stroke: var(--card-ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .card.active { background: #fff; border-color: var(--active); transform: scale(1.08); }
  .card.active path { stroke: var(--active); }
  .card.done::after {
    content: '★'; position: absolute; top: -10px; left: -8px; font-size: 20px; color: var(--dot);
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .card:focus-visible { outline: 3px solid var(--lit); outline-offset: 2px; }
  .stage { position: relative; flex: 1; min-height: 0; border-radius: 22px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 40%, var(--sky-2), var(--sky) 70%); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .tools { position: absolute; bottom: 14px; inset-inline: 14px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; }
  .tools button {
    pointer-events: auto; font-family: var(--font-ui); font-size: 18px; color: var(--ink);
    background: rgba(123,108,240,.25); border: 2px solid var(--plane-bg); border-radius: 999px;
    padding: 10px 18px; cursor: pointer;
  }
  .tools button:active { transform: scale(.96); }
  .tools button:focus-visible { outline: 3px solid var(--lit); }
  .hint { position: absolute; top: 14px; inset-inline: 0; text-align: center; color: var(--muted); font-size: 18px; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

<div class="app">
  <div class="strip" id="strip" role="tablist" aria-label="אותיות"></div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="לוח כתיבה"></canvas>
    <div class="hint" id="hint">שים את האצבע על המטוס וטוס לאורך המסלול</div>
    <div class="tools">
      <button id="btnDemo" type="button">הראה לי 👀</button>
      <button id="btnAgain" type="button">שוב ↺</button>
    </div>
  </div>
</div>

function arc(cx, cy, rx, ry, a0, a1, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
    pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]);
  }
  return pts;
}

/* Catmull-Rom smoothing + even resampling (1 unit spacing) */
function smooth(ctrl) {
  if (ctrl.length < 3) return ctrl.slice();
  const out = [], P = [ctrl[0], ...ctrl, ctrl[ctrl.length - 1]];
  for (let i = 1; i < P.length - 2; i++) {
    const [p0, p1, p2, p3] = [P[i - 1], P[i], P[i + 1], P[i + 2]];
    for (let t = 0; t < 1; t += 1 / 12) {
      const t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(ctrl[ctrl.length - 1]);
  return out;
}
function resample(pts, step) {
  const out = [pts[0]];
  let prev = pts[0], carry = 0;
  for (let i = 1; i < pts.length; i++) {
    let cur = pts[i];
    let seg = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]);
    while (carry + seg >= step) {
      const r = (step - carry) / seg;
      const np = [prev[0] + (cur[0] - prev[0]) * r, prev[1] + (cur[1] - prev[1]) * r];
      out.push(np); prev = np; seg = Math.hypot(cur[0] - prev[0], cur[1] - prev[1]); carry = 0;
    }
    carry += seg; prev = cur;
  }
  const last = pts[pts.length - 1], tail = out[out.length - 1];
  if (Math.hypot(last[0] - tail[0], last[1] - tail[1]) > 0.3) out.push(last);
  return out;
}
LETTERS.forEach(L => {
  L.paths = L.strokes.map(s => resample(smooth(s), 1));
  // cusps: points where the path turns back on itself (e.g. up then down the same line)
  L.cusps = L.paths.map(p => {
    const c = [];
    for (let k = 3; k < p.length - 3; k++) {
      const ax = p[k][0] - p[k - 3][0], ay = p[k][1] - p[k - 3][1], bx = p[k + 3][0] - p[k][0], by = p[k + 3][1] - p[k][1];
      const dot = (ax * bx + ay * by) / (Math.hypot(ax, ay) * Math.hypot(bx, by) || 1);
      if (dot < -0.3) c.push(k);
    }
    return c;
  });
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  L.paths.forEach(p => p.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }));
  L.box = { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
});

const strip = document.getElementById('strip');

LETTERS.forEach((L, i) => {
  const b = document.createElement('button');
  b.className = 'card'; b.type = 'button'; b.id = 'card-' + i;
  b.setAttribute('aria-label', 'האות ' + L.ch);
  const d = L.paths.map(p => 'M' + p.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L')).join(' ');
  const B = L.box, side = Math.max(B.w, B.h, 100) + 16;
  const vx = B.x0 + B.w / 2 - side / 2, vy = B.y0 + B.h / 2 - side / 2;
  b.innerHTML = `<svg viewBox="${vx} ${vy} ${side} ${side}" aria-hidden="true"><path d="${d}"/></svg>`;
  b.addEventListener('click', () => { unlockAudio(); loadLetter(i); });
  strip.appendChild(b);
});

/* ---------- state ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), hint = document.getElementById('hint');
let W = 0, H = 0, S = 1, OX = 0, OY = 0, DPR = 1;
let li = 0, si = 0, prog = 0, dragging = false, letterDone = false;
let particles = [], demo = null, tAnim = 0;

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth; H = stage.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  placeLetter();
}
function placeLetter() {
  const B = LETTERS[li].box;
  const box = Math.min(W * 0.62, (H - 120) * 0.82);
  S = box / Math.max(100, B.w, B.h);
  OX = W / 2 - (B.x0 + B.w / 2) * S;
  OY = (H - 10) / 2 - (B.y0 + B.h / 2) * S;
}
const toScr = p => [OX + p[0] * S, OY + p[1] * S];

function loadLetter(i) {
  li = i; placeLetter(); si = 0; prog = 0; dragging = false; letterDone = false; demo = null; particles = [];
  document.querySelectorAll('.card').forEach((c, k) => c.classList.toggle('active', k === i));
  document.getElementById('card-' + i).scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  hint.textContent = 'שים את האצבע על המטוס וטוס לאורך המסלול';
}

/* ---------- sound ---------- */
let AC = null;
function unlockAudio() {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {}
}
function tone(freq, at, dur, vol) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  const t = AC.currentTime + at;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
const chime = () => { tone(660, 0, .25, .15); tone(880, .1, .35, .15); };
const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .45, .16));
let lastTick = 0;
function tick() { if (prog - lastTick >= 6) { lastTick = prog; tone(1200 + prog * 4, 0, .05, .03); } }

/* ---------- input ---------- */
const START_TOL = 14, TOL = 12, LOOK = 8;
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - OX) / S, (e.clientY - r.top - OY) / S]; }
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

cv.addEventListener('pointerdown', e => {
  unlockAudio();
  if (letterDone || demo) return;
  const path = LETTERS[li].paths[si], p = pos(e);
  if (dist(p, path[prog]) < START_TOL) {
    dragging = true; cv.setPointerCapture(e.pointerId); hint.textContent = '';
  } else {
    hint.textContent = 'מתחילים מהמטוס ✈️';
  }
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const path = LETTERS[li].paths[si], p = pos(e);
  // advance to the path point CLOSEST to the finger (not the farthest one in range),
  // so corners and loops never make the plane skip ahead
  let best = -1, bestD = Math.min(TOL, dist(p, path[prog]) + 0.01);
  // never look past the next turn-back point until the plane has reached it
  const cusp = LETTERS[li].cusps[si].find(c => c > prog);
  const limit = Math.min(prog + LOOK, path.length - 1, cusp === undefined ? Infinity : cusp);
  for (let j = prog + 1; j <= limit; j++) {
    const d = dist(p, path[j]);
    if (d < bestD) { bestD = d; best = j; }
  }
  if (best > prog) {
    for (let k = prog; k < best; k += 3) spark(path[k], 1);
    prog = best; tick();
    if (prog >= path.length - 2) finishStroke();
  }
});
const stop = () => { dragging = false; };
cv.addEventListener('pointerup', stop);
cv.addEventListener('pointercancel', stop);

function finishStroke() {
  dragging = false;
  const L = LETTERS[li];
  prog = L.paths[si].length - 1;
  if (si < L.paths.length - 1) { si++; prog = 0; lastTick = 0; chime(); hint.textContent = 'יופי! עכשיו הקו הבא'; return; }
  letterDone = true; fanfare(); doneSet.add(li);
  document.getElementById('card-' + li).classList.add('done');
  hint.textContent = 'כל הכבוד! ⭐';
  setTimeout(() => { if (li < LETTERS.length - 1) loadLetter(li + 1); else hint.textContent = 'סיימת את כל האותיות! 🎉'; }, 1600);
}

document.getElementById('btnAgain').addEventListener('click', () => { unlockAudio(); loadLetter(li); });
document.getElementById('btnDemo').addEventListener('click', () => {
  unlockAudio(); loadLetter(li); demo = { s: 0, i: 0 }; hint.textContent = 'תסתכל לאן המטוס טס';
});

/* ---------- particles ---------- */
function spark(q, power) {
  const n = power === 2 ? 3 : 1;
  for (let k = 0; k < n; k++) particles.push({
    x: q[0], y: q[1], vx: (Math.random() - .5) * .6 * power, vy: (Math.random() - .5) * .6 * power,
    life: 1, hue: Math.random() < .5 ? '#ffffff' : '#ffe27a'
  });
}

/* ---------- drawing ---------- */
function strokePath(path, from, to, color, width, glow) {
  if (to - from < 1) return;
  ctx.beginPath();
  let p = toScr(path[from]); ctx.moveTo(p[0], p[1]);
  for (let k = from + 1; k <= to; k++) { p = toScr(path[k]); ctx.lineTo(p[0], p[1]); }
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.stroke(); ctx.shadowBlur = 0;
}
function drawPlane(path, k, pulse) {
  const a = path[Math.max(0, Math.min(k, path.length - 1))];
  const b = path[Math.min(k + 3, path.length - 1)], c = path[Math.max(k - 3, 0)];
  const ang = Math.atan2(b[1] - c[1], b[0] - c[0]);
  const [x, y] = toScr(a), r = 6.5 * S;
  if (pulse) {
    const pr = r * (1.25 + .25 * Math.sin(tAnim / 220));
    ctx.beginPath(); ctx.arc(x, y, pr, 0, 7); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = getVar('--plane-bg'); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke();
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(r / 10, r / 10);
  ctx.fillStyle = getVar('--dot');
  ctx.beginPath(); // simple plane pointing +x
  ctx.moveTo(7, 0); ctx.lineTo(4, -1.2); ctx.lineTo(0, -1.2); ctx.lineTo(-3, -6.5); ctx.lineTo(-5, -6.5); ctx.lineTo(-3, -1.2);
  ctx.lineTo(-6, -1.2); ctx.lineTo(-7.5, -3.5); ctx.lineTo(-8.5, -3.5); ctx.lineTo(-7.5, 0); ctx.lineTo(-8.5, 3.5); ctx.lineTo(-7.5, 3.5);
  ctx.lineTo(-6, 1.2); ctx.lineTo(-3, 1.2); ctx.lineTo(-5, 6.5); ctx.lineTo(-3, 6.5); ctx.lineTo(0, 1.2); ctx.lineTo(4, 1.2); ctx.closePath();
  ctx.fill(); ctx.restore();
}
const varCache = {};
function getVar(n) { return varCache[n] || (varCache[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim()); }

function frame(t) {
  tAnim = t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const L = LETTERS[li], trackW = 12 * S, litW = 10 * S;

  L.paths.forEach((path, k) => {
    const isDone = letterDone || k < si, isCur = !letterDone && k === si;
    ctx.globalAlpha = (!isDone && !isCur) ? 0.45 : 1;
    strokePath(path, 0, path.length - 1, getVar('--track'), trackW);
    ctx.globalAlpha = 1;
    if (isDone) strokePath(path, 0, path.length - 1, getVar('--lit'), litW, 18);
    if (isCur && !demo) {
      strokePath(path, 0, prog, getVar('--lit'), litW, 18);
    }
  });

  if (demo) {
    const path = L.paths[demo.s];
    for (let k = 0; k < demo.s; k++) strokePath(L.paths[k], 0, L.paths[k].length - 1, 'rgba(255,255,255,.55)', litW * .5);
    strokePath(path, 0, Math.floor(demo.i), 'rgba(255,255,255,.55)', litW * .5);
    drawPlane(path, Math.floor(demo.i), false);
    demo.i += 0.7;
    if (demo.i >= path.length - 1) {
      demo.s++; demo.i = 0;
      if (demo.s >= L.paths.length) { demo = null; hint.textContent = 'עכשיו תורך!'; }
    }
  } else if (!letterDone) {
    drawPlane(L.paths[si], prog, !dragging);
  }

  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.life -= 0.025;
    const [x, y] = toScr([p.x, p.y]);
    ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.hue;
    ctx.beginPath(); ctx.arc(x, y, 0.9 * S, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

window.addEventListener('resize', layout);
layout(); loadLetter(0); requestAnimationFrame(frame);
</script>

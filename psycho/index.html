הבנות הוא 85. הממוצע של כל השכבה הוא 79. כמה אחוזים מתלמידי השכבה הם בנים?","pt":null,"table":null,"o":["60%","45%","40%","35%"],"a":2,"x":"מרחקים מהממוצע: בנים 9, בנות 6. היחס בין מספר הבנים לבנות הפוך: 6:9 = 2:3, ולכן הבנים הם 2/5 = 40%. בדיקה: 0.4·70 + 0.6·85 = 79 ✓."}]},{"id":"prb-work","title":"הספק ועבודה משותפת","tag":"בעיות","en":false,"source":"ספר בעיות, פרק \"הספק\" (עמ' 139-164)","rule":["<b>עבודה = הספק × זמן.<\/b> הספק הוא תמיד \"עבודה ליחידת זמן\" — כלומר שבר (למשל 8 עוגות ב־2 שעות = 4 עוגות לשעה). כשההספק קבוע, את רוב השאלות פותרים ב<b>יחסים זהים<\/b> או בערך משולש.","<b>הספק משותף:<\/b> כשכמה פועלים עובדים יחד מחברים <b>הספקים<\/b> — לא זמנים. דרך נוחה: <b>השוואת זמנים<\/b> — בוחרים זמן משותף (למשל 6 שעות למי שמסיים ב־2 וב־3), סופרים כמה עבודות כל אחד מסיים בו ומחברים. צינור שמרוקן מחוסר מההספק.","<b>שאלות צוות<\/b> (פועלים זהים): משנים כל נתון בנפרד ובודקים את השפעתו — יותר עבודה ← יותר זמן (יחס ישר); יותר פועלים ← פחות זמן (יחס הפוך). <b>ימי עבודה<\/b> = מספר פועלים × מספר ימים — זה הזמן שהיה לוקח לפועל אחד לבדו."],"f":["עבודה = הספק × זמן","שניים יחד: T = a·b ÷ (a + b)","ימי עבודה = פועלים × ימים","פועלים × זמן ÷ עבודה = קבוע"],"traps":["לחבר זמנים או לחשב ממוצע זמנים במקום לחבר הספקים","לשכוח לחסר צינור מרוקן","יחס הפוך: יותר פועלים — פחות זמן","אי־התאמת יחידות (דקות מול שעות)"],"ex":{"q":"ברז א' ממלא בריכה ב־4 שעות, וברז ב' ממלא אותה ב־6 שעות. בכמה זמן ימלאו שני הברזים יחד את הבריכה?","pt":null,"steps":["<b>משווים זמנים<\/b>: זמן משותף נוח הוא 12 שעות. ב־12 שעות ברז א' ממלא 3 בריכות וברז ב' ממלא 2.","יחד: 5 בריכות ב־12 שעות.","בריכה אחת: 12 ÷ 5 = 2.4 שעות = <b>שעתיים ו־24 דקות<\/b>. (5 שעות — ממוצע הזמנים — לא הגיוני: יחד חייבים להיות מהירים מהמהיר שבהם.)"]},"g":{"q":"מדפסת מדפיסה 45 עמודים ב־3 דקות. כמה עמודים תדפיס ב־10 דקות?","pt":null,"o":["135","150","120","160"],"a":1,"g":["מצא את ההספק לדקה: 45 ÷ 3.","הכפל את ההספק בזמן החדש."],"x":"הספק: 15 עמודים לדקה. ב־10 דקות: 150 עמודים."},"solo":{"q":"6 פועלים בונים קיר ב־10 ימים. בכמה ימים יבנו 15 פועלים קיר זהה (כל הפועלים עובדים באותו קצב)?","pt":null,"o":["5","25","4","6"],"a":2,"x":"ימי עבודה: 6 · 10 = 60. ‏15 פועלים: 60 ÷ 15 = 4 ימים. ‏25 מתקבל אם חושבים בטעות שיותר פועלים צריכים יותר זמן."},"bank":[{"t":"יחסים זהים","lvl":1,"q":"קונדיטור אופה 12 עוגות ב־4 שעות. כמה שעות ידרשו לו כדי לאפות 30 עוגות באותו קצב?","pt":null,"table":null,"o":["8","12","10","9"],"a":2,"x":"הספק: 3 עוגות לשעה. ‏30 ÷ 3 = 10 שעות."},{"t":"הספק משותף","lvl":2,"q":"דן צובע חדר ב־3 שעות, ורות צובעת את אותו חדר ב־6 שעות. בכמה שעות יצבעו אותו יחד?","pt":null,"table":null,"o":["4.5","2","1.5","3"],"a":1,"x":"ב־6 שעות: דן צובע 2 חדרים ורות 1 — יחד 3 חדרים ב־6 שעות, כלומר חדר בשעתיים. ‏4.5 הוא ממוצע הזמנים — מלכודת."},{"t":"ממלא ומרוקן","lvl":3,"q":"ברז ממלא מיכל ריק ב־3 שעות, ופתח ניקוז מרוקן מיכל מלא ב־12 שעות. אם פותחים את שניהם כשהמיכל ריק, תוך כמה שעות יתמלא המיכל?","pt":null,"table":null,"o":["2.4","4","9","3.6"],"a":1,"x":"ב־12 שעות הברז ממלא 4 מיכלים והניקוז מרוקן 1 — נטו 3 מיכלים ב־12 שעות, כלומר מיכל ב־4 שעות. ‏2.4 מתקבל אם מחברים במקום לחסר."},{"t":"צוות","lvl":3,"q":"5 מכונות זהות מייצרות 400 מוצרים ב־8 שעות. כמה מוצרים ייצרו 3 מכונות כאלה ב־10 שעות?","pt":null,"table":null,"o":["240","300","320","375"],"a":1,"x":"מכונה אחת בשעה: 400 ÷ (5·8) = 10 מוצרים. ‏3 מכונות × 10 שעות × 10 = 300."},{"t":"ימי עבודה","lvl":3,"q":"בבניית גדר עבדו 8 פועלים במשך 6 ימים, ואחר כך 4 פועלים סיימו את העבודה ב־5 ימים נוספים. כל הפועלים עובדים באותו קצב. בכמה ימים היה פועל אחד בונה את כל הגדר לבדו?","pt":null,"table":null,"o":["58","17","72","68"],"a":3,"x":"ימי עבודה: 8·6 + 4·5 = 48 + 20 = 68. זה בדיוק הזמן שפועל יחיד היה צריך."},{"t":"ביטוי אלגברי","lvl":4,"q":"x פועלים מסיימים עבודה מסוימת ב־d ימים. בכמה ימים יסיימו 2x פועלים (באותו קצב) עבודה גדולה פי 3?","pt":null,"table":null,"o":["6d","3d/2","2d/3","d/6"],"a":1,"x":"עבודה פי 3 ← זמן פי 3; פועלים פי 2 ← זמן חלקי 2. סך הכול d · 3 ÷ 2 = 3d/2."},{"t":"שלבים","lvl":5,"q":"אלון מסיים עבודה לבדו ב־10 שעות, ובני מסיים אותה לבדו ב־15 שעות. הם עבדו יחד 4 שעות, ואז בני הלך ואלון סיים לבד. כמה זמן עבד אלון לבד?","pt":null,"table":null,"o":["2 שעות","3 שעות ו־20 דקות","3 שעות","6 שעות ו־40 דקות"],"a":1,"x":"ב־30 שעות: אלון 3 עבודות, בני 2 — יחד 5, כלומר עבודה ב־6 שעות. ב־4 שעות ביצעו 4/6 = 2/3 מהעבודה. את השליש שנשאר אלון עושה ב־10 ÷ 3 = 3⅓ שעות = 3 שעות ו־20 דקות."}]},{"id":"prb-motion","title":"תנועה","tag":"בעיות","en":false,"source":"ספר בעיות, פרק \"תנועה\" (עמ' 165-192)","rule":["תנועה היא סוג של הספק: <b>דרך = מהירות × זמן<\/b> (משולש: דרך למעלה, מהירות וזמן למטה). מקפידים על התאמת יחידות — ק\"מ עם שעות, מטרים עם שניות — ומעבירים יחידות בעזרת יחסים זהים.","<b>מהירות יחסית:<\/b> מתייחסים כאילו האיטי עומד במקום. גופים שנעים זה לקראת זה (או מתרחקים) — <b>מחברים<\/b> מהירויות; מרדף באותו כיוון — <b>מחסרים<\/b>. אחר כך פותרים כשאלת תנועה רגילה עם המרחק ביניהם.","<b>יחסי מרחקים:<\/b> כששני גופים נעים אותו זמן, המרחקים שעברו ביחס של המהירויות (מי שמהיר פי 2 עובר 2/3 מהדרך עד המפגש). כשאין מספרים בשאלה — מציבים מספרים נוחים. בתנועה בזווית ישרה עוזר משפט פיתגורס.","<b>מהירות ממוצעת<\/b> = כל הדרך ÷ כל הזמן — לא ממוצע המהירויות."],"f":["דרך = מהירות × זמן","לקראת זה/מתרחקים: מחברים מהירויות; מרדף: מחסרים","מהירות ממוצעת = כל הדרך ÷ כל הזמן","1 מ'/ש' = 3.6 קמ\"ש"],"traps":["לחשב מהירות ממוצעת כממוצע של המהירויות","לערבב דקות ושעות (40 דקות = 2/3 שעה, לא 0.4)","במרדף לחבר מהירויות במקום לחסר","לשכוח שאחד יצא מוקדם יותר ולכן יש לו \"ראש\" של מרחק"],"ex":{"q":"המרחק בין שתי ערים הוא 300 ק\"מ. בשעה 9:00 יצאה מכונית מעיר אחת במהירות 70 קמ\"ש, ובאותה שעה יצאה מכונית מהעיר השנייה לקראתה במהירות 80 קמ\"ש. באיזו שעה ייפגשו?","pt":null,"steps":["הן נוסעות זו לקראת זו — <b>מחברים מהירויות<\/b>: 70 + 80 = 150 קמ\"ש. זה הקצב שבו המרחק ביניהן נסגר.","זמן = דרך ÷ מהירות = 300 ÷ 150 = 2 שעות.","הן ייפגשו בשעה <b>11:00<\/b>."]},"g":{"q":"מכונית נוסעת במהירות קבועה של 90 קמ\"ש. כמה ק\"מ תעבור ב־40 דקות?","pt":null,"o":["36","60","54","75"],"a":1,"g":["המר את הזמן לשעות: 40 דקות הן 2/3 שעה.","דרך = מהירות × זמן."],"x":"90 · 2/3 = 60 ק\"מ. מי שמציב 0.4 שעה מקבל 36 — טעות: 40 דקות הן לא 0.4 שעה."},"solo":{"q":"רוכב נסע 60 ק\"מ ממקום א' למקום ב' במהירות 30 קמ\"ש, וחזר באותה דרך במהירות 60 קמ\"ש. מה הייתה מהירותו הממוצעת בכל הנסיעה?","pt":null,"o":["45","40","42","50"],"a":1,"x":"הלוך: 2 שעות, חזור: שעה. כל הדרך 120 ק\"מ בכל הזמן 3 שעות — 40 קמ\"ש. ‏45 הוא ממוצע המהירויות, שאינו נכון כי ברוב הזמן נסע לאט."},"bank":[{"t":"המרת יחידות","lvl":1,"q":"רץ נע במהירות 15 מטרים בשנייה. מהי מהירותו בקמ\"ש?","pt":null,"table":null,"o":["45","54","90","25"],"a":1,"x":"בשעה (3600 שניות) הוא עובר 15 · 3600 = 54,000 מטרים = 54 ק\"מ. כלל אצבע: כופלים ב־3.6."},{"t":"מרדף","lvl":2,"q":"בשעה 8:00 יצא הולך רגל מנקודה מסוימת במהירות 5 קמ\"ש. בשעה 9:00 יצא אחריו רוכב אופניים מאותה נקודה, באותה דרך, במהירות 15 קמ\"ש. באיזו שעה ישיג הרוכב את הולך הרגל?","pt":null,"table":null,"o":["9:20","10:00","9:45","9:30"],"a":3,"x":"ב־9:00 להולך הרגל יש \"ראש\" של 5 ק\"מ. במרדף מחסרים מהירויות: 15 − 5 = 10 קמ\"ש. זמן: 5 ÷ 10 = חצי שעה, כלומר 9:30."},{"t":"יחסי מרחקים","lvl":3,"q":"שני חברים יוצאים באותו זמן זה לקראת זה משני כפרים שהמרחק ביניהם 24 ק\"מ. מהירותו של יואב גדולה פי 3 ממהירותו של בני. כמה ק\"מ הלך בני עד המפגש?","pt":null,"table":null,"o":["8","6","18","12"],"a":1,"x":"באותו זמן יואב עובר פי 3 מבני, כלומר הדרך מתחלקת ל־4 חלקים: בני חלק אחד ויואב שלושה. בני הלך 24 ÷ 4 = 6 ק\"מ."},{"t":"פיתגורס","lvl":3,"q":"שני רוכבים יוצאים מאותה נקודה באותו זמן: אחד צפונה במהירות 12 קמ\"ש והשני מזרחה במהירות 16 קמ\"ש. מה המרחק ביניהם (בק\"מ) כעבור חצי שעה?","pt":null,"table":null,"o":["14","20","10","7"],"a":2,"x":"אחרי חצי שעה: 6 ק\"מ צפונה ו־8 ק\"מ מזרחה, בזווית ישרה. לפי פיתגורס המרחק √(36+64) = 10 ק\"מ. ‏14 הוא סכום הדרכים, שמתאים רק אם נסעו בכיוונים מנוגדים."},{"t":"יחס הפוך","lvl":3,"q":"נסיעה במהירות 80 קמ\"ש נמשכת 3 שעות. כמה זמן תימשך אותה נסיעה במהירות 60 קמ\"ש?","pt":null,"table":null,"o":["2.25 שעות","3.5 שעות","5 שעות","4 שעות"],"a":3,"x":"הדרך: 80 · 3 = 240 ק\"מ. ‏240 ÷ 60 = 4 שעות. כשהדרך קבועה, מהירות וזמן ביחס הפוך."},{"t":"מהירות ממוצעת","lvl":4,"q":"מכונית עברה את המחצית הראשונה של הדרך במהירות 40 קמ\"ש ואת המחצית השנייה במהירות 60 קמ\"ש. מה מהירותה הממוצעת?","pt":null,"table":null,"o":["50","52","45","48"],"a":3,"x":"מציבים דרך נוחה: 240 ק\"מ. מחצית ראשונה 120 ÷ 40 = 3 שעות, שנייה 120 ÷ 60 = 2 שעות. ‏240 ÷ 5 = 48 קמ\"ש. ‏50 הוא ממוצע המהירויות — מלכודת."},{"t":"אורך הגוף הנע","lvl":5,"q":"רכבת באורך 200 מטרים נוסעת במהירות 72 קמ\"ש וחוצה גשר באורך 400 מטרים. כמה שניות עוברות מהרגע שחזית הרכבת נכנסת לגשר ועד שסופה יוצא ממנו?","pt":null,"table":null,"o":["20","10","25","30"],"a":3,"x":"72 קמ\"ש = 20 מ'/ש'. החזית צריכה לעבור את הגשר <b>ועוד<\/b> את אורך הרכבת: 400 + 200 = 600 מטרים. ‏600 ÷ 20 = 30 שניות. (20 שניות מתעלם מאורך הרכבת.)"}]},{"id":"prb-comb","title":"צירופים (קומבינטוריקה)","tag":"בעיות","en":false,"source":"ספר בעיות, פרק \"צרופים\" (עמ' 193-212)","rule":["שואלים כמה אפשרויות יש לבחור או לסדר. השיטה: מפרקים לשלבי בחירה, בודקים כמה אפשרויות יש בכל שלב ו<b>כופלים<\/b> (\"וגם\"). כשיש מקרים נפרדים (\"או\") — מחשבים כל מקרה לבד ו<b>מחברים<\/b>.","<b>עם החזרה / בלי החזרה:<\/b> אם אפשר לבחור שוב אותו איבר — ה\"מאגר\" נשאר זהה בכל שלב; אם לא — הוא קטן ב־1 בכל שלב. סידור n איברים שונים בשורה הוא n! (למשל 5! = 120). ספרה שמאלית במספר לא יכולה להיות 0.","<b>פעולה הדדית<\/b> (לחיצות ידיים, משחקים בין קבוצות, קווים בין נקודות): כל זוג נספר פעמיים, ולכן מחלקים ב־2: n(n−1)/2. בבחירת <b>קבוצה<\/b> שאין בה סדר — מחשבים כרגיל ומחלקים במספר הסידורים הפנימיים (k!).","קיצורים: בחירת n−1 מתוך n — יש בדיוק n אפשרויות (בוחרים את מי שנשאר בחוץ). כשקל יותר לספור את האסור: <b>מותר = סך הכול − אסור<\/b>. וכשהמספרים קטנים — פשוט פורטים את כל האפשרויות."],"f":["\"וגם\" ← כפל; \"או\" ← חיבור","n איברים בשורה: n! ‏(2!=2, 3!=6, 4!=24, 5!=120)","פעולה הדדית בין n: ‏n(n−1)/2","מותר = סך הכול − אסור"],"traps":["לשכוח שהספרה הראשונה במספר לא יכולה להיות 0","לספור זוגות הדדיים פעמיים (לא לחלק ב־2)","לבלבל בין סידור (יש סדר) לבין בחירת קבוצה (אין סדר)","לכפול בין מקרים נפרדים במקום לחבר"],"ex":{"q":"כמה קודים בני 4 ספרות אפשר ליצור מהספרות 1-6, אם אסור שספרה תחזור על עצמה?","pt":null,"steps":["ארבעה שלבי בחירה, <b>בלי החזרה<\/b>: לספרה הראשונה 6 אפשרויות, לשנייה 5, לשלישית 4, לרביעית 3.","\"וגם\" — כופלים: 6 · 5 · 4 · 3.","התשובה: <b>360<\/b> קודים. (עם החזרה היו 6⁴ = 1296.)"]},"g":{"q":"לנועם 4 חולצות, 3 מכנסיים ו־2 כובעים. כמה תלבושות שונות של חולצה, מכנסיים וכובע הוא יכול להרכיב?","pt":null,"o":["9","24","12","18"],"a":1,"g":["יש כאן שלושה שלבי בחירה: חולצה וגם מכנסיים וגם כובע.","\"וגם\" ← כופלים את מספרי האפשרויות."],"x":"4 · 3 · 2 = 24. התשובה 9 מחברת במקום לכפול."},"solo":{"q":"בטורניר 8 קבוצות, וכל קבוצה משחקת נגד כל קבוצה אחרת פעם אחת בדיוק. כמה משחקים ייערכו?","pt":null,"o":["56","16","28","64"],"a":2,"x":"משחק הוא פעולה הדדית: 8 · 7 = 56 סופר כל משחק פעמיים (א' נגד ב' וב' נגד א'), ולכן 56 ÷ 2 = 28."},"bank":[{"t":"סידור בשורה","lvl":1,"q":"בכמה דרכים שונות אפשר לסדר 4 ספרים שונים על מדף?","pt":null,"table":null,"o":["16","12","24","4"],"a":2,"x":"4! = 4 · 3 · 2 · 1 = 24."},{"t":"n−1 מתוך n","lvl":2,"q":"בכמה דרכים אפשר לבחור 7 שחקנים מתוך קבוצה של 8 שחקנים?","pt":null,"table":null,"o":["8","56","7","28"],"a":0,"x":"בוחרים את השחקן היחיד שנשאר בחוץ — 8 אפשרויות."},{"t":"ספרות ו־0","lvl":3,"q":"כמה מספרים תלת־ספרתיים יש שכל הספרות שלהם שונות זו מזו?","pt":null,"table":null,"o":["720","648","504","900"],"a":1,"x":"ספרת מאות: 9 אפשרויות (לא 0). עשרות: 9 (כל ספרה חוץ מזו שנבחרה, כולל 0). אחדות: 8. ‏9 · 9 · 8 = 648. ‏720 שוכח שהספרה הראשונה לא יכולה להיות 0."},{"t":"אלכסונים במצולע","lvl":3,"q":"כמה אלכסונים יש במשושה (מצולע בעל 6 צלעות)?","pt":null,"table":null,"o":["15","12","9","6"],"a":2,"x":"קווים בין כל זוג קודקודים: 6·5/2 = 15. מתוכם 6 הם צלעות, ולכן 15 − 6 = 9 אלכסונים."},{"t":"חיבור מקרים","lvl":3,"q":"בבית קפה אפשר להזמין <b>או<\/b> כריך (5 סוגים) עם שתייה (4 סוגים), <b>או<\/b> מרק (3 סוגים) עם לחם (2 סוגים). כמה ארוחות שונות אפשר להזמין?","pt":null,"table":null,"o":["120","26","14","60"],"a":1,"x":"מקרה ראשון: 5 · 4 = 20. מקרה שני: 3 · 2 = 6. אלה מקרים נפרדים (\"או\") — מחברים: 26. ‏120 כופל את כל הנתונים."},{"t":"בחירת קבוצה","lvl":4,"q":"בכמה דרכים אפשר לבחור ועדה של 3 חברים מתוך 6 מועמדים (אין תפקידים בוועדה)?","pt":null,"table":null,"o":["120","18","216","20"],"a":3,"x":"אם היה סדר: 6 · 5 · 4 = 120. אבל כל שלישייה נספרה 3! = 6 פעמים, ולכן 120 ÷ 6 = 20."},{"t":"מותר = סה״כ − אסור","lvl":5,"q":"5 אנשים, וביניהם דן ומיה, עומדים בשורה. בכמה סידורים דן ומיה <b>לא<\/b> עומדים זה ליד זה?","pt":null,"table":null,"o":["48","96","72","60"],"a":2,"x":"סך הכול 5! = 120. אסור: דן ומיה צמודים — מתייחסים אליהם כ\"גוש\" אחד: 4! = 24 סידורים, כפול 2 (דן־מיה או מיה־דן) = 48. מותר: 120 − 48 = 72."}]},{"id":"prb-prob","title":"הסתברות","tag":"בעיות","en":false,"source":"ספר בעיות, פרק \"הסתברות\" (עמ' 213-234)","rule":["<b>הסתברות = מספר האפשרויות הרצויות ÷ מספר האפשרויות הכולל<\/b> (\"רצוי חלקי מצוי\"). היא תמיד בין 0 (בלתי אפשרי) ל־1 (ודאי).","כמה מאורעות: \"<b>וגם<\/b>\" (אחד אחרי השני) — <b>כופלים<\/b> הסתברויות; \"<b>או<\/b>\" (מקרים נפרדים) — <b>מחברים<\/b>. בבחירה <b>בלי החזרה<\/b> המכנה (וגם המונה) קטנים בכל שלב. כשהבחירה הראשונה \"לא משנה\" (למשל שתי קוביות זהות) — ההסתברות שלה 1, ומחשבים רק את השנייה.","<b>הסתברות משלימה:<\/b> P(לא קורה) = 1 − P(קורה) — שימושי במיוחד ל\"לפחות אחד\". <b>להסתברות אין היסטוריה:<\/b> תוצאות קודמות של מטבע או קובייה לא משפיעות על ההטלה הבאה.","<b>סימטריה בשתי קוביות:<\/b> הסכום 7 הוא השכיח ביותר (6 מתוך 36), וככל שמתרחקים ממנו ההסתברות יורדת. סכומים במרחק שווה מ־7 (כמו 4 ו־10) — הסתברות שווה."],"f":["P = רצוי ÷ מצוי","\"וגם\" ← כפל; \"או\" (מקרים זרים) ← חיבור","P(לפחות אחד) = 1 − P(אף אחד)","שתי קוביות: P(סכום 7) = 6/36; ‏P(s) = P(14 − s)"],"traps":["לשכוח להקטין את המאגר בבחירה בלי החזרה","לחשוב שאחרי רצף של \"עץ\" גדל הסיכוי ל\"פלי\"","לחבר הסתברויות של מאורעות שאינם זרים (למשל \"6 בקובייה א' או בקובייה ב'\")","לספור סדר במונה ולא במכנה (או להפך)"],"ex":{"q":"בכד 4 כדורים אדומים ו־6 כחולים. מוציאים 2 כדורים בזה אחר זה, בלי החזרה. מה ההסתברות ששניהם אדומים?","pt":null,"steps":["הכדור הראשון אדום: 4 מתוך 10, כלומר 4/10.","<b>בלי החזרה<\/b>: נשארו 9 כדורים, מתוכם 3 אדומים — 3/9.","\"וגם\" — כופלים: 4/10 · 3/9 = 12/90 = <b>2/15<\/b>."]},"g":{"q":"מטילים קובייה הוגנת אחת (1-6). מה ההסתברות לקבל מספר זוגי שגדול מ־2?","pt":null,"o":["1/2","1/3","1/6","2/3"],"a":1,"g":["רשום את כל התוצאות הרצויות: זוגיות וגדולות מ־2.","רצוי חלקי מצוי — מתוך 6 תוצאות אפשריות."],"x":"התוצאות הרצויות: 4 ו־6 — שתיים מתוך שש, כלומר 1/3."},"solo":{"q":"מטילים 3 מטבעות הוגנים. מה ההסתברות לקבל \"עץ\" לפחות פעם אחת?","pt":null,"o":["3/8","1/2","7/8","3/4"],"a":2,"x":"הסתברות משלימה: הסיכוי שאין אף \"עץ\" (שלוש פעמים \"פלי\") הוא 1/2 · 1/2 · 1/2 = 1/8. לכן לפחות \"עץ\" אחד: 1 − 1/8 = 7/8."},"bank":[{"t":"רצוי חלקי מצוי","lvl":1,"q":"בקופסה 3 כדורים לבנים, 5 שחורים ו־2 ירוקים. מוציאים כדור אחד באקראי. מה ההסתברות שהוא <b>לא<\/b> שחור?","pt":null,"table":null,"o":["1/5","1/2","3/10","1/3"],"a":1,"x":"לא שחורים: 3 + 2 = 5 מתוך 10, כלומר 1/2."},{"t":"בחירה ראשונה לא משנה","lvl":2,"q":"מטילים שתי קוביות הוגנות. מה ההסתברות ששתיהן יראו אותו מספר?","pt":null,"table":null,"o":["1/36","1/12","1/6","1/3"],"a":2,"x":"הקובייה הראשונה יכולה להראות כל מספר (הסתברות 1). השנייה צריכה להתאים לה: 1/6. ‏1/36 היא ההסתברות למספר <b>מסוים<\/b> בשתיהן (למשל שתי שישיות)."},{"t":"אין היסטוריה","lvl":2,"q":"יעל הטילה מטבע הוגן 5 פעמים, ובכל הפעמים יצא \"פלי\". מה ההסתברות שבהטלה השישית ייצא \"פלי\"?","pt":null,"table":null,"o":["1/32","1/64","1/6","1/2"],"a":3,"x":"למטבע אין זיכרון: כל הטלה עומדת בפני עצמה, וההסתברות היא 1/2. ‏1/64 היא ההסתברות לשש הצלחות ברצף <b>מראש<\/b> — לא מה שנשאל."},{"t":"סימטריה בקוביות","lvl":3,"q":"A היא ההסתברות לקבל סכום 5 בהטלת שתי קוביות הוגנות, ו־B היא ההסתברות לקבל סכום 9. איזו טענה נכונה?","pt":null,"table":null,"o":["A > B","A < B","A = B","אי אפשר לדעת"],"a":2,"x":"5 ו־9 נמצאים שניהם במרחק 2 מ־7, ולכן ההסתברויות שוות (4/36 כל אחת)."},{"t":"בלי החזרה — או","lvl":3,"q":"בכד 3 כדורים אדומים ו־2 צהובים. מוציאים 2 כדורים בזה אחר זה, בלי החזרה. מה ההסתברות שהכדורים יהיו בצבעים שונים?","pt":null,"table":null,"o":["2/5","3/5","6/25","12/25"],"a":1,"x":"אדום ואז צהוב: 3/5 · 2/4 = 6/20; או צהוב ואז אדום: 2/5 · 3/4 = 6/20. מחברים: 12/20 = 3/5. ‏12/25 מתקבל אם שוכחים שאין החזרה."},{"t":"מציאת כמות","lvl":4,"q":"בקופסה 12 כדורים, אדומים וכחולים. ההסתברות להוציא 2 כדורים אדומים (בזה אחר זה, בלי החזרה) היא 1/11. כמה כדורים אדומים בקופסה?","pt":null,"table":null,"o":["3","6","4","2"],"a":2,"x":"אם יש r אדומים: r/12 · (r−1)/11 = 1/11, כלומר r(r−1) = 12, ולכן r = 4 (‏4·3 = 12). עם 3 אדומים ההסתברות 6/132 = 1/22."},{"t":"לפחות אחד","lvl":5,"q":"מטילים שתי קוביות הוגנות. מה ההסתברות שלפחות באחת מהן יתקבל 6?","pt":null,"table":null,"o":["1/3","1/6","11/36","5/18"],"a":2,"x":"משלים: הסיכוי שאין 6 באף קובייה הוא 5/6 · 5/6 = 25/36, ולכן לפחות 6 אחד: 11/36. ‏1/3 מתקבל מחיבור 1/6 + 1/6 — שסופר פעמיים את המקרה של שתי שישיות."}]},{"id":"geo-lines-angles","title":"ישרים וזוויות","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרקים 'ישרים - יסודות' ו'ישרים' (עמ' 5-22), ותחילת 'משולשים - יסודות' (עמ' 23-24)","rule":["כל שאלת זוויות נפתרת בכמה כללים קבועים: <b>זוויות צמודות<\/b> (על קו ישר) משלימות ל־180°, <b>זוויות קודקודיות<\/b> שוות זו לזו, וכל הזוויות סביב נקודה אחת משלימות ל־360°.","ישר שחותך שני <b>ישרים מקבילים<\/b> יוצר 8 זוויות משני סוגים בלבד: כל הזוויות ה'קטנות' שוות זו לזו, כל ה'גדולות' שוות זו לזו, וקטנה + גדולה = 180°. אין צורך לזכור שמות כמו 'מתחלפות' ו'מתאימות' – מספיק לזהות קטנה או גדולה.","במשולש: סכום הזוויות 180°, ו<b>זווית חיצונית<\/b> שווה לסכום שתי הזוויות הפנימיות שאינן צמודות לה. חוצה זווית מחלק אותה לשתי זוויות שוות.","השיטה: מסמנים על השרטוט (או בדמיון) כל זווית שמוצאים, ומתקדמים צעד־צעד מהנתונים אל הזווית המבוקשת. כשיש 'שבירה' בין שני מקבילים – מעבירים דרך נקודת השבירה ישר שלישי מקביל להם."],"f":["צמודות: α + β = 180° ; קודקודיות: α = β","מקבילים: קטנה = קטנה, גדולה = גדולה, קטנה + גדולה = 180°","זווית חיצונית למשולש = סכום שתי הפנימיות הרחוקות","'שבירה' בין שני מקבילים: זווית השבירה = סכום שתי הזוויות שבקצוות"],"traps":["להניח שישרים מקבילים רק כי הם נראים כך – מקבילות חייבת להיות נתונה.","להתבלבל בין זוויות צמודות (סכום 180°) לבין קודקודיות (שוות).","שרטוט במבחן אינו בהכרח בקנה מידה – אל תמדוד זוויות 'בעין' אלא אם כן נאמר שהשרטוט מדויק.","בזווית חיצונית – לחבר את שתי הזוויות הרחוקות, לא את הזווית הצמודה."],"ex":{"q":"a ו־b הם ישרים מקבילים אופקיים (a למעלה). הנקודה P נמצאת בין שני הישרים. הנקודה A נמצאת על a והנקודה B על b, ושתיהן משמאל ל־P. הזווית בין הקטע AP לבין הקרן היוצאת מ־A ימינה לאורך a היא 30°, והזווית בין הקטע BP לבין הקרן היוצאת מ־B ימינה לאורך b היא 45°. מה גודל הזווית APB?","pt":null,"steps":["מעבירים דרך P ישר שלישי c המקביל ל־a ול־b. הוא מחלק את הזווית APB לשני חלקים: חלק עליון (בין PA ל־c) וחלק תחתון (בין PB ל־c).","החלק העליון 'קטן' כמו הזווית 30° שב־A (זוויות 'קטנות' בין מקבילים שוות), ולכן הוא 30°. באותו אופן החלק התחתון שווה ל־45°.","<b>∢APB = 30° + 45° = 75°<\/b>. זה כלל ה'שבירה': זווית השבירה בין שני מקבילים שווה לסכום הזוויות בקצוות."]},"g":{"q":"שני ישרים נחתכים בנקודה O. אחת הזוויות שנוצרו גדולה פי 3 מהזווית הצמודה לה. מה גודל הזווית הקטנה מבין השתיים?","pt":null,"o":["30°","60°","45°","135°"],"a":2,"g":["זוויות צמודות משלימות ל־180°. סמן את הקטנה ב־x – מה גודל הגדולה?","פתור x + 3x = 180°."],"x":"x + 3x = 180°, כלומר 4x = 180° ולכן x = 45°. התשובה 135° היא הזווית הגדולה – שים לב מה נשאל."},"solo":{"q":"במשולש ABC הנקודה D נמצאת על המשך הצלע BC מעבר ל־C. הזווית החיצונית ACD שווה ל־120°, וידוע ש־∢BAC גדולה פי 2 מ־∢ABC. מה גודל ∢BAC?","pt":null,"o":["40°","60°","70°","80°"],"a":3,"x":"הזווית החיצונית שווה לסכום שתי הזוויות הרחוקות: ∢A + ∢B = 120°. אם ∢B = x אז 2x + x = 120°, x = 40° ולכן ∢A = 80°. התשובה 60° היא הזווית הפנימית ACB, לא ∢A."},"bank":[{"t":"זוויות סביב נקודה","lvl":1,"q":"שלושה ישרים עוברים כולם דרך נקודה אחת O ויוצרים סביבה 6 זוויות. שתי זוויות סמוכות זו לזו הן 50° ו־70°. מה גודל הזווית הבאה בתור, הסמוכה לזווית של 70° (ולא לזו של 50°)?","pt":null,"table":null,"o":["60°","50°","70°","120°"],"a":0,"x":"כל זווית שווה לקודקודית שלה, ולכן 6 הזוויות הן x, y, z, x, y, z ו־x + y + z = 180° (חצי סיבוב). 50° + 70° + z = 180°, ולכן z = 60°."},{"t":"מקבילים וחותך","lvl":1,"q":"הישר c חותך שני ישרים מקבילים a ו־b ונוצרות 8 זוויות, שאף אחת מהן אינה ישרה. בוחרים זווית חדה אחת וזווית קהה אחת מתוך ה־8. מה סכומן?","pt":null,"table":null,"o":["140°","180°","220°","360°"],"a":1,"x":"בין מקבילים יש רק שני גדלים של זוויות: 'קטנה' ו'גדולה', וסכומן תמיד 180° – לא משנה איזו קטנה ואיזו גדולה בחרת."},{"t":"חוצה זווית","lvl":2,"q":"הזווית AOB היא 80°. OC חוצה את הזווית AOB, והקרן OD היא ההמשך של הקרן OA מעבר לנקודה O. מה גודל הזווית COD?","pt":null,"table":null,"o":["100°","120°","160°","140°"],"a":3,"x":"החוצה נותן ∢AOC = 40°. הקרניים OA ו־OD יוצרות קו ישר, ולכן ∢COD משלימה את ∢AOC ל־180°: 180° − 40° = 140°."},{"t":"שבירה בין מקבילים","lvl":3,"q":"a ו־b ישרים מקבילים אופקיים (a למעלה), והנקודה P נמצאת ביניהם. A על a ו־B על b, ושתיהן משמאל ל־P. הזווית בין AP לקרן היוצאת מ־A ימינה לאורך a היא 35°, והזווית APB היא 100°. מה הזווית בין BP לקרן היוצאת מ־B ימינה לאורך b?","pt":null,"table":null,"o":["55°","65°","75°","45°"],"a":1,"x":"לפי כלל השבירה (מעבירים דרך P ישר מקביל): ∢APB = 35° + הזווית שב־B. לכן הזווית שב־B היא 100° − 35° = 65°."},{"t":"זווית חיצונית","lvl":3,"q":"במשולש ABC הנקודה D נמצאת על המשך BC מעבר ל־C. נתון: ∢ACD = 3x, ∢BAC = x + 20°, ∢ABC = x + 10°. מה גודל הזווית ACB?","pt":null,"table":null,"o":["60°","75°","90°","100°"],"a":2,"x":"זווית חיצונית = סכום הרחוקות: 3x = (x + 20°) + (x + 10°), ולכן x = 30°. ∢ACD = 90° ולכן ∢ACB = 180° − 90° = 90°. בדיקה: 50° + 40° + 90° = 180°."},{"t":"חוצה זווית במשולש","lvl":3,"q":"במשולש ABC נתון ∢B = 70° ו־∢C = 30°. AD חוצה את הזווית A (הנקודה D על BC). מה גודל הזווית ADC?","pt":null,"table":null,"o":["100°","120°","70°","110°"],"a":3,"x":"∢A = 180° − 70° − 30° = 80°, ולכן ∢DAC = 40°. במשולש ADC: ∢ADC = 180° − 40° − 30° = 110°. (100° היא הזווית ADB – הצמודה.)"},{"t":"חוצי זוויות נפגשים","lvl":4,"q":"במשולש ABC נתון ∢A = 50°. חוצי הזוויות B ו־C נפגשים בנקודה I. מה גודל הזווית BIC?","pt":null,"table":null,"o":["115°","130°","105°","125°"],"a":0,"x":"∢B + ∢C = 130°, ולכן חצאיהן יחד 65°. במשולש BIC: ∢BIC = 180° − 65° = 115°. (כלל שימושי: ∢BIC = 90° + ∢A/2.)"},{"t":"חוצים בין מקבילים","lvl":4,"q":"a ו־b ישרים מקבילים. A על a ו־B על b. הקטע AB יוצר עם a ועם b שתי זוויות פנימיות שנמצאות באותו צד של AB (בין המקבילים). חוצי שתי הזוויות האלה נפגשים בנקודה P. מה גודל הזווית APB?","pt":null,"table":null,"o":["60°","120°","אי אפשר לדעת","90°"],"a":3,"x":"שתי הזוויות הפנימיות באותו צד הן 'קטנה' ו'גדולה', וסכומן 180°. החצאים שלהן יחד 90°, ולכן במשולש APB נשאר ∢APB = 180° − 90° = 90° – תמיד, בלי קשר לשיפוע של AB. הפיתוי 'אי אפשר לדעת' נובע מכך שלא נתונה אף זווית."}]},{"id":"geo-triangles","title":"משולשים: צלעות, שטח ופיתגורס","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרקים 'משולשים - יסודות' ו'משולשים' (עמ' 23-70)","rule":["<b>צלע מול זווית:<\/b> הצלע הגדולה במשולש נמצאת מול הזווית הגדולה. <b>אי־שוויון המשולש:<\/b> כל צלע קטנה מסכום שתי האחרות וגדולה מהפרשן (ההסבר האינטואיטיבי: דרך 'עוקפת' תמיד ארוכה יותר מהדרך הישרה).","<b>משולש שווה־שוקיים:<\/b> זוויות הבסיס שוות, והגובה לבסיס הוא גם תיכון וגם חוצה זווית. <b>שטח משולש<\/b> = צלע × הגובה אליה ÷ 2; במשולש ישר־זווית – מכפלת הניצבים ÷ 2. תיכון מחלק משולש לשני משולשים שווי שטח.","אין מחשבון במבחן, ולכן מחשבים צלעות בעזרת <b>פיתגורס<\/b> וכדאי לזהות מיד <b>שלשות פיתגוריות<\/b> (3:4:5, 5:12:13 וכפולותיהן, כמו 6:8:10 או 9:12:15).","שני משולשים מיוחדים חוסכים חישוב, כי מספיקה צלע אחת כדי לדעת את כולן: <b>'משולש זהב'<\/b> 30°-60°-90° ביחס a : a√3 : 2a, ו<b>'משולש כסף'<\/b> 45°-45°-90° ביחס a : a : a√2."],"f":["|b − a| < c < a + b","שטח = צלע × גובה ÷ 2 ; שווה־צלעות: a²√3/4","פיתגורס: a² + b² = c² ; שלשות 3:4:5 , 5:12:13","30-60-90 → a : a√3 : 2a ; 45-45-90 → a : a : a√2"],"traps":["בשלשה פיתגורית היתר הוא תמיד הגדול ביותר: ניצב 5 ויתר 13 נותנים ניצב 12, לא 'יתר 12'.","במשולש זהב הצלע הקטנה (a) נמצאת מול הזווית 30° – לא מול 60°.","אי־שוויון המשולש חזק: צלעות 4, 4, 8 אינן יוצרות משולש.","במשולש שווה־שוקיים עם שתי צלעות נתונות – בדוק איזו מהן יכולה להיות השוק."],"ex":{"q":"במשולש ABC הזווית B ישרה, ∢A = 60° והיתר AC = 10. מה שטח המשולש?","pt":null,"steps":["∢C = 30°, ולכן זה <b>משולש זהב<\/b> ביחס a : a√3 : 2a. היתר AC = 2a = 10, ולכן a = 5.","הצלע הקטנה נמצאת מול הזווית 30° (שב־C), כלומר AB = 5. הניצב הגדול BC = 5√3.","שטח = מכפלת הניצבים ÷ 2 = 5 × 5√3 ÷ 2 = <b>12.5√3<\/b>."]},"g":{"q":"שתיים מצלעות משולש הן 4 ו־9. איזה מהמספרים הבאים יכול להיות אורך הצלע השלישית?","pt":null,"o":["5","13","6","14"],"a":2,"g":["הצלע השלישית חייבת להיות גדולה מההפרש 9 − 4.","והיא חייבת להיות קטנה מהסכום 9 + 4. איזו תשובה בטווח?"],"x":"5 < x < 13. רק 6 נמצא בטווח. 5 ו־13 הם בדיוק הגבולות ולכן אסורים (המשולש 'נשטח' לקו)."},"solo":{"q":"במשולש שווה־שוקיים אורך כל שוק הוא 13 ואורך הבסיס 10. מה שטח המשולש?","pt":null,"o":["65","60","120","78"],"a":1,"x":"הגובה לבסיס חוצה אותו, ולכן נוצר משולש ישר־זווית עם ניצב 5 ויתר 13 – השלשה 5:12:13, כלומר הגובה 12. שטח = 10 × 12 ÷ 2 = 60. (120 – שכחת לחלק ב־2.)"},"bank":[{"t":"פיתגורס ושלשות","lvl":1,"q":"ניצבי משולש ישר־זווית הם 6 ו־8. מה היקף המשולש?","pt":null,"table":null,"o":["24","14","28","20"],"a":0,"x":"6:8:10 היא השלשה 3:4:5 כפול 2, ולכן היתר 10 וההיקף 6 + 8 + 10 = 24."},{"t":"צלע מול זווית","lvl":1,"q":"במשולש ABC נתון ∢A = 50° ו־∢B = 60°. איזו צלע היא הארוכה ביותר?","pt":null,"table":null,"o":["BC","AC","AB","כל הצלעות שוות"],"a":2,"x":"∢C = 70° היא הזווית הגדולה, והצלע שמולה היא AB (הצלע שאינה נוגעת ב־C)."},{"t":"שטח בעזרת תיכון","lvl":2,"q":"שטח המשולש ABC הוא 48. D היא אמצע BC, ו־E היא אמצע AD. מה שטח המשולש EBD?","pt":null,"table":null,"o":["16","24","12","8"],"a":2,"x":"תיכון מחלק משולש לשני חלקים שווי שטח: AD הוא תיכון ב־ABC ולכן שטח ABD = 24. במשולש ABD, BE הוא תיכון לצלע AD, ולכן שטח EBD = 12."},{"t":"שווה־שוקיים – איזו השוק?","lvl":3,"q":"שתיים מצלעותיו של משולש שווה־שוקיים הן 4 ו־9. מה היקף המשולש?","pt":null,"table":null,"o":["17","22","17 או 22","אי אפשר לדעת"],"a":1,"x":"אם השוקיים 4: הצלעות 4, 4, 9 – ו־4 + 4 < 9, אין משולש. לכן השוקיים 9 והצלעות 9, 9, 4: ההיקף 22. הפיתוי '17 או 22' מתעלם מאי־שוויון המשולש."},{"t":"שווה־צלעות","lvl":3,"q":"גובהו של משולש שווה־צלעות הוא 3√3. מה שטחו?","pt":null,"table":null,"o":["18√3","6√3","27","9√3"],"a":3,"x":"הגובה מחלק את המשולש לשני משולשי זהב: הגובה הוא הניצב הגדול a√3 = 3√3, ולכן a = 3 וצלע המשולש 2a = 6. שטח = 6²·√3/4 = 9√3."},{"t":"מרדף זוויות בשווה־שוקיים","lvl":3,"q":"במשולש ABC נתון AB = AC ו־∢A = 40°. הנקודה D נמצאת על AC כך ש־BD = BC. מה גודל הזווית ABD?","pt":null,"table":null,"o":["20°","30°","40°","35°"],"a":1,"x":"זוויות הבסיס: (180° − 40°)/2 = 70°. במשולש BCD (BD = BC) גם ∢BDC = ∢C = 70°, ולכן ∢DBC = 40°. לכן ∢ABD = 70° − 40° = 30°."},{"t":"משולש זהב","lvl":4,"q":"במשולש ABC הזווית B ישרה, ∢C = 30° ו־AB = 3. AD חוצה את הזווית A (הנקודה D על BC). מה אורך DC?","pt":null,"table":null,"o":["3","√3","3√3","2√3"],"a":3,"x":"∢A = 60°, ולכן ∢BAD = ∢DAC = 30°. במשולש ADC שתי זוויות של 30°, כלומר הוא שווה־שוקיים ו־DC = AD. במשולש הזהב ABD: AB = 3 הוא הניצב מול 60°, לכן BD = 3/√3 = √3 ו־AD = 2√3. לכן DC = 2√3 (ואכן BC = 3√3 = √3 + 2√3)."},{"t":"יתר ושטח","lvl":4,"q":"יתרו של משולש ישר־זווית הוא 10 ושטחו 24. מה היקפו?","pt":null,"table":null,"o":["24","28","22","34"],"a":0,"x":"a·b/2 = 24 ⇒ ab = 48, ו־a² + b² = 100. לכן (a + b)² = 100 + 2·48 = 196 ו־a + b = 14. היקף = 14 + 10 = 24. (הניצבים הם 6 ו־8.)"}]},{"id":"geo-quadrilaterals","title":"מרובעים","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרקים 'מרובעים - יסודות' ו'מרובעים' (עמ' 71-114), וקיצורי דרך בגיאומטריה עמ' 1","rule":["סכום הזוויות בכל מרובע 360°. <b>מקבילית:<\/b> צלעות נגדיות שוות ומקבילות, זוויות נגדיות שוות, זוויות סמוכות משלימות ל־180°, האלכסונים חוצים זה את זה. שטח = צלע × הגובה אליה.","<b>מלבן<\/b> – אלכסונים שווים. <b>מעוין<\/b> – אלכסונים מאונכים וחוצים זוויות; שטח = מכפלת האלכסונים ÷ 2. <b>ריבוע<\/b> – כל התכונות; שטח = a² או אלכסון² ÷ 2. <b>דלתון<\/b> – שני משולשים שווי־שוקיים על בסיס משותף; אלכסונים מאונכים, שטח = d₁·d₂ ÷ 2.","<b>טרפז:<\/b> שטח = (סכום הבסיסים) × גובה ÷ 2. בטרפז שווה־שוקיים מורידים שני גבהים ומקבלים מלבן באמצע ושני משולשים ישרי־זווית חופפים בצדדים; כל 'בליטה' שווה ל־(הבסיס הגדול − הקטן) ÷ 2.","קיצורי דרך: משולש שבסיסו צלע של מלבן/מקבילית וקודקודו על הצלע שמולה – שטחו חצי מהמרובע. האלכסונים במקבילית מחלקים אותה ל־4 משולשים שווי שטח."],"f":["מקבילית: שטח = צלע × גובה לצלע","מעוין/דלתון/ריבוע: שטח = d₁·d₂ ÷ 2","טרפז: שטח = (a + b)·h ÷ 2","ריבוע: אלכסון = a√2"],"traps":["שטח מקבילית אינו מכפלת שתי צלעות סמוכות – צריך את הגובה.","במעוין האלכסונים אינם שווים (רק בריבוע).","בטרפז שווה־שוקיים לחלק את הפרש הבסיסים בשניים לפני פיתגורס.","באלכסוני מעוין – עובדים עם חצאי אלכסונים כדי למצוא את הצלע."],"ex":{"q":"בטרפז שווה־שוקיים הבסיסים 6 ו־14 ואורך כל שוק 5. מה שטח הטרפז?","pt":null,"steps":["מורידים שני גבהים מקצות הבסיס הקטן. באמצע נוצר מלבן ברוחב 6, ובצדדים שני משולשים ישרי־זווית חופפים.","כל 'בליטה' = (14 − 6) ÷ 2 = 4. במשולש: ניצב 4 ויתר 5 – השלשה 3:4:5, ולכן הגובה 3.","שטח = (6 + 14) × 3 ÷ 2 = <b>30<\/b>."]},"g":{"q":"אורכי האלכסונים של מעוין הם 10 ו־24. מה שטח המעוין?","pt":null,"o":["240","120","60","130"],"a":1,"g":["במעוין השטח הוא מכפלת האלכסונים חלקי 2.","10 × 24 = 240. עכשיו חלק ב־2."],"x":"10 × 24 ÷ 2 = 120. התשובה 240 שוכחת לחלק ב־2."},"solo":{"q":"אורכי האלכסונים של מעוין הם 10 ו־24. מה היקף המעוין?","pt":null,"o":["48","34","52","68"],"a":2,"x":"האלכסונים מאונכים וחוצים זה את זה, ולכן כל צלע היא יתר של משולש עם ניצבים 5 ו־12 – השלשה 5:12:13. היקף = 4 × 13 = 52. (68 מתקבל אם לוקחים את האלכסונים השלמים במקום חצאים.)"},"bank":[{"t":"זוויות במקבילית","lvl":1,"q":"במקבילית אחת הזוויות גדולה פי 4 מהזווית הסמוכה לה. מה גודל הזווית הגדולה?","pt":null,"table":null,"o":["120°","135°","144°","150°"],"a":2,"x":"זוויות סמוכות במקבילית משלימות ל־180°: x + 4x = 180°, x = 36°, והגדולה 144°."},{"t":"ריבוע לפי אלכסון","lvl":1,"q":"אורך האלכסון של ריבוע הוא 8. מה שטחו?","pt":null,"table":null,"o":["64","32","16","32√2"],"a":1,"x":"שטח ריבוע = אלכסון² ÷ 2 = 64 ÷ 2 = 32. (64 הוא האלכסון בריבוע, לא השטח.)"},{"t":"משולש בתוך מלבן","lvl":2,"q":"במלבן ABCD אורך AB הוא 12 ואורך BC הוא 5. P היא נקודה כלשהי על הצלע CD. מה שטח המשולש ABP?","pt":null,"table":null,"o":["30","60","תלוי במיקום של P","26"],"a":0,"x":"הבסיס AB = 12 והגובה מ־P אל AB הוא תמיד רוחב המלבן, 5 – בכל מקום על CD. שטח = 12 × 5 ÷ 2 = 30, חצי משטח המלבן."},{"t":"שטח מקבילית","lvl":3,"q":"במקבילית ABCD נתון AB = 10, AD = 6 ו־∢DAB = 30°. מה שטח המקבילית?","pt":null,"table":null,"o":["60","30","15√3","30√3"],"a":1,"x":"מורידים גובה מ־D אל AB: נוצר משולש זהב שהיתר שלו AD = 6, והגובה מול הזווית 30° הוא החצי – 3. שטח = 10 × 3 = 30. (60 הוא מכפלת הצלעות – הפיתוי הקלאסי.)"},{"t":"דלתון","lvl":3,"q":"ABCD הוא דלתון קמור שבו AB = AD = 5 ו־CB = CD = 4√2. האלכסון BD = 8. מה שטח הדלתון?","pt":null,"table":null,"o":["32","24","56","28"],"a":3,"x":"האלכסון AC מאונך ל־BD וחוצה אותו (4 לכל צד). מ־A: ניצב 4 ויתר 5 ⇒ 3. מ־C: ניצב 4 ויתר 4√2 ⇒ 4 (משולש כסף). AC = 3 + 4 = 7, ושטח = 7 × 8 ÷ 2 = 28."},{"t":"טרפז ישר־זווית","lvl":3,"q":"ABCD טרפז ישר־זווית: AD ∥ BC, ∢B = 90°, AD = 4, BC = 10 והשוק CD = 10. מה שטח הטרפז?","pt":null,"table":null,"o":["56","70","48","112"],"a":0,"x":"מורידים גובה מ־D אל BC: ההפרש בין הבסיסים 10 − 4 = 6, והיתר CD = 10 ⇒ הגובה 8 (6:8:10). שטח = (4 + 10) × 8 ÷ 2 = 56. (70 = השוק 10 כגובה – טעות: השוק המשופעת אינה הגובה.)"},{"t":"שטחים במקבילית","lvl":4,"q":"שטח המקבילית ABCD הוא 40. O היא נקודת החיתוך של האלכסונים, ו־M היא אמצע הצלע AB. מה שטח המשולש AOM?","pt":null,"table":null,"o":["אי אפשר לדעת","10","5","4"],"a":2,"x":"האלכסונים מחלקים את המקבילית ל־4 משולשים שווי שטח, ולכן שטח AOB = 10. OM הוא תיכון במשולש AOB ומחלק אותו לשניים: 5."},{"t":"מלבן ומשולש זהב","lvl":4,"q":"האלכסונים של המלבן ABCD נחתכים בנקודה O. נתון ∢AOB = 120° ו־AC = 8. מה שטח המלבן?","pt":null,"table":null,"o":["32","16√3","8√3","16"],"a":1,"x":"במלבן האלכסונים שווים וחוצים זה את זה: OB = OC = 4. ∢BOC = 60°, לכן המשולש BOC שווה־צלעות ו־BC = 4. במשולש ABC (ישר־זווית ב־B): יתר 8 וניצב 4 ⇒ משולש זהב, AB = 4√3. שטח = 4 × 4√3 = 16√3."}]},{"id":"geo-circles","title":"מעגלים","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרקים 'מעגלים - יסודות' ו'מעגלים' (עמ' 115-158), וקיצורי דרך בגיאומטריה עמ' 2-3","rule":["מונחים: <b>רדיוס<\/b> (כל הרדיוסים במעגל שווים – זה הכלי החשוב ביותר: כל משולש עם שני רדיוסים הוא שווה־שוקיים), <b>מיתר<\/b>, <b>קוטר<\/b> = 2r והמיתר הארוך ביותר.","<b>הכלל הראשי:<\/b> זווית מרכזית שווה לפעמיים זווית היקפית הנשענת על אותה קשת. ממנו נובעים: זוויות היקפיות על אותה קשת שוות; זווית היקפית על קוטר = 90°; במרובע חסום במעגל סכום זוויות נגדיות = 180°.","<b>משיק<\/b> מאונך לרדיוס בנקודת ההשקה, ושני משיקים מאותה נקודה שווים באורכם (ויחד עם הרדיוסים יוצרים דלתון).","שטח πr², היקף 2πr. <b>גזרה וקשת<\/b> הן 'חלק יחסי' של המעגל: זווית של 90° היא רבע, 120° שליש, 60° שישית וכו'. שטח 'מקווקו' מחשבים כמעט תמיד כ'שלם פחות חלק'."],"f":["היקף = 2πr ; שטח = πr²","זווית מרכזית = 2 × זווית היקפית (על אותה קשת)","גזרה = (α/360)·πr² ; קשת = (α/360)·2πr","ריבוע חסום במעגל: צלע r√2, שטח 2r²"],"traps":["להתבלבל בין רדיוס לקוטר (נתון 'קוטר 10' ⇒ r = 5).","זווית היקפית יכולה להישען על הקשת הגדולה – אז הזווית המרכזית המתאימה גדולה מ־180°.","הכפלת הרדיוס פי 2 מכפילה את השטח פי 4, לא פי 2.","שטח 'מקטע' (בין מיתר לקשת) = גזרה פחות משולש, לא הגזרה עצמה."],"ex":{"q":"במעגל שמרכזו O ורדיוסו 6 נמצא המיתר AB, ונתון ∢AOB = 60°. מה השטח הכלוא בין המיתר AB לבין הקשת הקטנה AB?","pt":null,"steps":["המשולש AOB שווה־שוקיים (שני רדיוסים) עם זווית ראש 60°, ולכן הוא שווה־צלעות בצלע 6. שטחו 6²·√3/4 = 9√3.","הגזרה AOB היא 60/360 = שישית מהמעגל: 36π ÷ 6 = 6π.","השטח המבוקש = גזרה − משולש = <b>6π − 9√3<\/b>."]},"g":{"q":"שטחו של מעגל הוא 36π. מה היקפו?","pt":null,"o":["6π","36π","18π","12π"],"a":3,"g":["מתוך πr² = 36π מצא את r.","היקף = 2πr."],"x":"r² = 36 ⇒ r = 6, והיקף = 2π·6 = 12π. (6π היא טעות של πr בלי ה־2.)"},"solo":{"q":"A, B ו־C הן נקודות על מעגל שמרכזו O. הזווית המרכזית AOB, הנשענת על הקשת AB שאינה מכילה את C, היא 140°. מה גודל הזווית ACB?","pt":null,"o":["110°","40°","70°","140°"],"a":2,"x":"∢ACB היא זווית היקפית הנשענת על אותה קשת כמו הזווית המרכזית, ולכן היא חצי ממנה: 70°. (110° היא הזווית ההיקפית שנשענת על הקשת השנייה.)"},"bank":[{"t":"שטח והיקף","lvl":1,"q":"היקפו של מעגל הוא 10π. מה שטחו?","pt":null,"table":null,"o":["25π","100π","10π","50π"],"a":0,"x":"2πr = 10π ⇒ r = 5, ושטח = π·5² = 25π. (100π מתקבל אם מתבלבלים וחושבים שהקוטר הוא הרדיוס.)"},{"t":"זווית על קוטר","lvl":1,"q":"AB הוא קוטר במעגל ו־C נקודה על המעגל (שונה מ־A ומ־B). נתון ∢CAB = 35°. מה גודל ∢CBA?","pt":null,"table":null,"o":["35°","45°","65°","55°"],"a":3,"x":"זווית היקפית על קוטר ישרה: ∢ACB = 90°. לכן ∢CBA = 180° − 90° − 35° = 55°."},{"t":"שטח גזרה","lvl":2,"q":"רדיוס מעגל הוא 6. מה שטח גזרה שהזווית המרכזית שלה 40°?","pt":null,"table":null,"o":["2π","6π","8π","4π"],"a":3,"x":"40° הם 1/9 מ־360°. שטח המעגל 36π, ולכן הגזרה 36π ÷ 9 = 4π."},{"t":"משיקים","lvl":3,"q":"מהנקודה P שמחוץ למעגל שמרכזו O יוצאים שני משיקים, המשיקים למעגל בנקודות A ו־B. נתון ∢APB = 50°. מה גודל הזווית OAB?","pt":null,"table":null,"o":["25°","40°","65°","50°"],"a":0,"x":"PA = PB, ולכן במשולש PAB זוויות הבסיס (180° − 50°)/2 = 65°. הרדיוס OA מאונך למשיק, ולכן ∢OAB = 90° − 65° = 25°. (65° היא ∢PAB.)"},{"t":"מרובע חסום","lvl":3,"q":"המרובע ABCD חסום במעגל. נתון ∢A = 2·∢C ו־∢B = 85°. מה הסכום ∢A + ∢D?","pt":null,"table":null,"o":["180°","200°","215°","235°"],"a":2,"x":"זוויות נגדיות משלימות ל־180°: ∢A + ∢C = 180° ו־∢A = 2∢C ⇒ ∢C = 60°, ∢A = 120°. ∢D = 180° − 85° = 95°. סכום: 120° + 95° = 215°."},{"t":"ריבוע חסום","lvl":3,"q":"ריבוע חסום במעגל שרדיוסו 5 (כל קודקודי הריבוע על המעגל). מה שטח הריבוע?","pt":null,"table":null,"o":["25","50","100","25π"],"a":1,"x":"אלכסוני הריבוע הם קטרים של המעגל: אורך כל אלכסון 10. שטח = 10² ÷ 2 = 50."},{"t":"קשת ומיתר","lvl":4,"q":"במעגל שמרכזו O ורדיוסו 9, אורך הקשת הקטנה AB הוא 3π. מה אורך המיתר AB?","pt":null,"table":null,"o":["9√3","4.5","3π","9"],"a":3,"x":"היקף המעגל 18π, והקשת היא 3π/18π = שישית ממנו, כלומר ∢AOB = 60°. המשולש AOB שווה־שוקיים עם זווית ראש 60° – שווה־צלעות, ולכן AB = 9. (3π הוא אורך הקשת, לא המיתר.)"},{"t":"שטח בין קשתות","lvl":5,"q":"ABCD ריבוע שצלעו 4. משרטטים בתוכו שתי קשתות מ־B ל־D: רבע מעגל שמרכזו A ורדיוסו 4, ורבע מעגל שמרכזו C ורדיוסו 4. מה שטח האזור הכלוא בין שתי הקשתות?","pt":null,"table":null,"o":["8π − 16","16 − 4π","4π − 8","8π"],"a":0,"x":"האלכסון BD מחלק את האזור לשני חלקים זהים. כל חלק = רבע מעגל (4π) פחות המשולש ABD (4·4/2 = 8), כלומר 4π − 8. שני החלקים: 8π − 16. (4π − 8 הוא רק חצי מהאזור.)"}]},{"id":"geo-polygons","title":"מצולעים","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרק 'מצולעים' (עמ' 159-180), וקיצורי דרך בגיאומטריה עמ' 3-5","rule":["סכום הזוויות הפנימיות במצולע בעל n צלעות הוא (n − 2)·180° – כל צלע נוספת מוסיפה 180° (משולש 180°, מרובע 360°, מחומש 540°...). סכום הזוויות החיצוניות (אחת בכל קודקוד) הוא תמיד 360°.","<b>מצולע משוכלל<\/b> – כל הצלעות וכל הזוויות שוות. כל זווית = 180° − 360°/n, והיא משלימה ל־180° את הזווית המרכזית של המעגל החוסם. אלכסונים מאותו קודקוד מחלקים את זווית המצולע לזוויות שוות. זוויות שכדאי לזכור: מחומש 108°, משושה 120°, מתומן 135°.","לחישוב שטח – מפרקים לצורות מוכרות. <b>משושה משוכלל<\/b> = 6 משולשים שווי־צלעות. <b>מתומן משוכלל<\/b> = ריבוע באמצע, 4 מלבנים ו־4 'משולשי כסף' בפינות (שטח 4 המשולשים יחד שווה לשטח הריבוע)."],"f":["סכום זוויות פנימיות: (n − 2)·180°","זווית במשוכלל: 180° − 360°/n ; חיצונית: 360°/n","משושה משוכלל: שטח = 6 · a²√3/4","מתומן משוכלל: שטח = 2a² + 2a²√2"],"traps":["להתבלבל בין סכום הזוויות לבין זווית אחת במצולע משוכלל.","סכום הזוויות החיצוניות אינו תלוי ב־n – תמיד 360°.","במשושה משוכלל האלכסון הארוך = 2a והאלכסון הקצר = a√3.","נוסחת הזווית נכונה רק למצולע משוכלל."],"ex":{"q":"מה שטחו של משושה משוכלל שאורך צלעו 4?","pt":null,"steps":["מעבירים את שלושת האלכסונים הארוכים: המשושה מתחלק ל־6 משולשים שווי־צלעות שצלעם 4.","שטח משולש אחד: 4²·√3/4 = 4√3.","שטח המשושה: 6 × 4√3 = <b>24√3<\/b>."]},"g":{"q":"מה סכום הזוויות הפנימיות של מצולע בעל 7 צלעות?","pt":null,"o":["720°","1080°","1260°","900°"],"a":3,"g":["הנוסחה: (n − 2)·180°.","הצב n = 7: 5 × 180°."],"x":"(7 − 2)·180° = 900°. (1260° = 7 × 180° – שוכח להחסיר 2.)"},"solo":{"q":"כל זווית פנימית במצולע משוכלל היא 150°. כמה צלעות יש לו?","pt":null,"o":["9","10","12","15"],"a":2,"x":"הזווית החיצונית = 180° − 150° = 30°, וסכום החיצוניות 360°, ולכן n = 360/30 = 12."},"bank":[{"t":"זווית במשוכלל","lvl":1,"q":"מה גודלה של זווית פנימית במחומש משוכלל?","pt":null,"table":null,"o":["108°","120°","72°","100°"],"a":0,"x":"סכום הזוויות (5 − 2)·180° = 540°, ובחלוקה ל־5: 108°. (72° היא הזווית החיצונית/המרכזית.)"},{"t":"זווית חיצונית","lvl":1,"q":"הזווית החיצונית של מצולע משוכלל היא 45°. כמה צלעות יש לו?","pt":null,"table":null,"o":["6","8","9","10"],"a":1,"x":"סכום הזוויות החיצוניות 360°, ולכן n = 360/45 = 8 (מתומן)."},{"t":"סכום זוויות","lvl":2,"q":"ארבע מזוויות מחומש (לא משוכלל) הן 100°, 110°, 120° ו־90°. מה הזווית החמישית?","pt":null,"table":null,"o":["100°","110°","120°","130°"],"a":2,"x":"סכום זוויות המחומש 540°. 540° − (100° + 110° + 120° + 90°) = 540° − 420° = 120°."},{"t":"אלכסונים במשושה","lvl":3,"q":"ABCDEF משושה משוכלל שאורך צלעו 6. מה אורך האלכסון AC?","pt":null,"table":null,"o":["12","6√2","9","6√3"],"a":3,"x":"במשולש ABC: AB = BC = 6 והזווית B = 120°. הגובה מ־B חוצה את AC ויוצר שני משולשי זהב עם יתר 6: החצי של AC הוא 3√3, ולכן AC = 6√3. (12 הוא האלכסון הארוך AD.)"},{"t":"זוויות במחומש","lvl":3,"q":"ABCDE מחומש משוכלל. מה גודלה של הזווית ACD?","pt":null,"table":null,"o":["36°","54°","72°","108°"],"a":2,"x":"במשולש ABC: AB = BC וזווית B = 108°, ולכן ∢BCA = (180° − 108°)/2 = 36°. זווית המחומש ב־C היא 108°, ולכן ∢ACD = 108° − 36° = 72°."},{"t":"שטח משושה","lvl":3,"q":"שטחו של משושה משוכלל הוא 54√3. מה היקפו?","pt":null,"table":null,"o":["36","18","24","54"],"a":0,"x":"6·a²√3/4 = 54√3 ⇒ a² = 36 ⇒ a = 6. היקף = 6 × 6 = 36."},{"t":"שטח מתומן","lvl":4,"q":"מה שטחו של מתומן משוכלל שאורך צלעו 2?","pt":null,"table":null,"o":["16","4 + 4√2","8 + 8√2","8√2"],"a":2,"x":"מפרקים: ריבוע באמצע 2 × 2 = 4; ארבעה משולשי כסף שיתרם 2 – ניצביהם √2 ושטח כל אחד 1, יחד 4; ארבעה מלבנים 2 × √2, יחד 8√2. סה\"כ 4 + 4 + 8√2 = 8 + 8√2."},{"t":"משולש בתוך משושה","lvl":4,"q":"ABCDEF משושה משוכלל ששטחו 60. מה שטח המשולש ACE?","pt":null,"table":null,"o":["20","30","40","45"],"a":1,"x":"המשושה מורכב מ־6 משולשים שווי־צלעות, כל אחד 10. המשולש ABC הוא בדיוק חצי מהמעוין ABCO (O המרכז), כלומר 10 – שישית מהמשושה. שלושת המשולשים ABC, CDE, EFA יחד = 30, ולכן ACE = 60 − 30 = 30."}]},{"id":"geo-solids","title":"תלת־ממד: נפח ושטח פנים","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרק 'תלת־ממד' (עמ' 181-204), וקיצורי דרך בגיאומטריה עמ' 6-7","rule":["מונחים: <b>מקצוע<\/b> (צלע של גוף), <b>פאה<\/b>, <b>בסיס<\/b>, <b>מנסרה<\/b> (גוף ששני בסיסיו זהים – תיבה, קובייה, גליל). <b>שטח פנים<\/b> = כל הפאות; <b>שטח מעטפת<\/b> = בלי שני הבסיסים.","במנסרה: נפח = שטח בסיס × גובה, מעטפת = היקף בסיס × גובה, שטח פנים = מעטפת + 2 בסיסים. <b>גוף מחודד<\/b> (פירמידה, חרוט) – נפחו שליש ממנסרה בעלת אותו בסיס ואותו גובה.","<b>קוביות בתוך תיבה:<\/b> משווים ממד לממד ולא נפח לנפח – בודקים כמה קוביות נכנסות לאורך, לרוחב ולגובה (בעיגול כלפי מטה) ומכפילים.","כשמשנים רדיוס וגובה של גליל או חרוט: השינוי ברדיוס עולה בריבוע, השינוי בגובה נשאר כמו שהוא, ומכפילים. אלכסון תיבה: √(a² + b² + c²); בקובייה a√3."],"f":["תיבה: נפח abc, שטח פנים 2(ab + bc + ac)","גליל: נפח πr²h ; שטח פנים 2πrh + 2πr²","פירמידה/חרוט: נפח = ⅓ · בסיס · גובה","אלכסון קובייה = a√3 ; אלכסון פאה = a√2"],"traps":["לחלק נפח בנפח כשמכניסים קוביות לתיבה – מתעלם מ'שאריות' בכל ממד.","להתבלבל בין שטח מעטפת לשטח פנים.","רדיוס פי 2 ⇒ נפח הגליל פי 4, לא פי 2.","גובה פירמידה אינו הגובה של הפאה המשולשת (גובה צדדי)."],"ex":{"q":"מידות תיבה הן 3, 4 ו־12. מה אורך האלכסון הפנימי שלה (מקודקוד אחד לקודקוד הרחוק ממנו ביותר)?","pt":null,"steps":["קודם אלכסון הבסיס 3 × 4: לפי השלשה 3:4:5 הוא 5.","האלכסון הפנימי הוא יתר של משולש ישר־זווית שניצביו אלכסון הבסיס (5) והגובה (12).","השלשה 5:12:13 ⇒ האלכסון <b>13<\/b>. (באופן כללי: √(9 + 16 + 144) = √169.)"]},"g":{"q":"שטח הפנים של קובייה הוא 54. מה נפחה?","pt":null,"o":["9","81","18","27"],"a":3,"g":["לקובייה 6 פאות זהות – מה שטח פאה אחת?","שטח פאה = a². מצא את a וחשב a³."],"x":"54 ÷ 6 = 9 ⇒ a = 3, ונפח = 3³ = 27. (9 הוא שטח פאה אחת.)"},"solo":{"q":"רדיוס בסיסו של גליל הוא 3 וגובהו 5. מה שטח הפנים שלו (כולל שני הבסיסים)?","pt":null,"o":["30π","48π","45π","39π"],"a":1,"x":"מעטפת: 2π·3·5 = 30π. שני בסיסים: 2·π·3² = 18π. יחד 48π. (30π – רק המעטפת; 45π – זה הנפח.)"},"bank":[{"t":"שטח פנים תיבה","lvl":1,"q":"מידות תיבה הן 2, 3 ו־5. מה שטח הפנים שלה?","pt":null,"table":null,"o":["30","62","31","60"],"a":1,"x":"שלושה זוגות פאות: 2·(2·3 + 3·5 + 2·5) = 2·(6 + 15 + 10) = 62. (30 הוא הנפח; 31 – שכחת להכפיל ב־2.)"},{"t":"קוביות בתיבה","lvl":2,"q":"כמה קוביות שמקצוען 3 אפשר להכניס לכל היותר לתוך תיבה שמידותיה 7, 9 ו־10 (בלי לחתוך קוביות)?","pt":null,"table":null,"o":["18","23","27","20"],"a":0,"x":"ממד לממד: לאורך 7 נכנסות 2, לאורך 9 – 3, לאורך 10 – 3. סה\"כ 2 × 3 × 3 = 18. (חלוקת נפחים 630/27 ≈ 23 מתעלמת מהשאריות.)"},{"t":"שינוי ממדי גליל","lvl":2,"q":"מגדילים את רדיוס הבסיס של גליל פי 3 ומקטינים את גובהו פי 2. פי כמה משתנה נפחו?","pt":null,"table":null,"o":["גדל פי 1.5","גדל פי 3","גדל פי 4.5","גדל פי 9"],"a":2,"x":"הרדיוס עולה בריבוע: פי 9. הגובה: פי ½. יחד 9 × ½ = 4.5."},{"t":"חרוט וגליל","lvl":3,"q":"חרוט וגליל בעלי אותו בסיס ואותו גובה, 15. ממלאים את החרוט במים עד הסוף ושופכים לגליל הריק שעומד על בסיסו. לאיזה גובה יגיעו המים בגליל?","pt":null,"table":null,"o":["7.5","3","5","10"],"a":2,"x":"נפח החרוט שליש מנפח הגליל, ולכן המים ימלאו שליש מגובה הגליל: 15 ÷ 3 = 5."},{"t":"פירמידה","lvl":3,"q":"בסיס פירמידה הוא ריבוע שצלעו 6, והקודקוד העליון נמצא בדיוק מעל מרכז הבסיס. הגובה של כל פאה צדדית (מהקודקוד העליון לאמצע צלע הבסיס) הוא 5. מה נפח הפירמידה?","pt":null,"table":null,"o":["60","48","36","144"],"a":1,"x":"גובה הפירמידה, מרחק המרכז מאמצע הצלע (3) וגובה הפאה (5) יוצרים משולש ישר־זווית: הגובה 4 (3:4:5). נפח = ⅓ × 36 × 4 = 48. (60 – אם משתמשים ב־5 כגובה.)"},{"t":"אלכסון קובייה","lvl":3,"q":"האלכסון הפנימי של קובייה הוא 6√3. מה נפחה?","pt":null,"table":null,"o":["216","108","72√3","36"],"a":0,"x":"אלכסון קובייה = a√3, ולכן a = 6 ונפח = 6³ = 216."},{"t":"קובייה הונגרית","lvl":4,"q":"קובייה גדולה בנויה מ־27 קוביות יחידה (3 × 3 × 3). מוציאים את קוביית היחידה שבמרכז אחת הפאות (הקובייה שנוגעת בפאה החיצונית רק בפאה אחת שלה). מה שטח הפנים של הגוף שנוצר?","pt":null,"table":null,"o":["54","56","58","50"],"a":2,"x":"שטח הפנים המקורי 6 × 9 = 54. הוצאת הקובייה מורידה ריבוע חיצוני אחד אבל חושפת 5 פאות פנימיות של החור: שינוי של +4. סה\"כ 58. (קובייה פינתית לא הייתה משנה את השטח; קובייה מאמצע מקצוע מוסיפה 2.)"},{"t":"גליל בתוך קובייה","lvl":5,"q":"גליל חסום בתוך קובייה: בסיסיו נוגעים בשתי פאות נגדיות ודופנו נוגעת בארבע הפאות האחרות. מה היחס בין נפח הגליל לנפח הקובייה?","pt":null,"table":null,"o":["π/2","π/6","3/4","π/4"],"a":3,"x":"אם רדיוס הגליל r, מקצוע הקובייה 2r וגם גובה הגליל 2r. נפח גליל πr²·2r = 2πr³, נפח קובייה 8r³. היחס 2π/8 = π/4."}]},{"id":"geo-similarity","title":"דמיון: יחס קווי, שטחים ונפחים","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרק 'דמיון' (עמ' 205-232)","rule":["צורות דומות הן אותה צורה בגודל אחר. <b>היחס הקווי<\/b> (פי כמה אחת גדולה מהשנייה) זהה בין כל זוג קווים מתאימים – צלעות, גבהים, אלכסונים, תיכונים ואפילו היקפים.","<b>יחס שטחים = (יחס קווי)²<\/b>, <b>יחס נפחים = (יחס קווי)³<\/b>. כל הצורות המשוכללות מאותו סוג (ריבועים, מעגלים, קוביות, משושים...) תמיד דומות; צורות אחרות – רק אם כל היחסים שווים (למשל גלילים: גם רדיוס וגם גובה באותו יחס).","משולשים דומים אם שתי זוויות שוות. צלעות מתאימות הן אלה <b>שמול זוויות שוות<\/b>. שלושה מבנים שחוזרים במבחן: <b>קו מקביל לבסיס<\/b> בתוך משולש, <b>'דמיון באלכסון'<\/b> (קו שאינו מקביל אבל יוצר זוויות שוות בהצלבה), ו<b>'שעון חול'<\/b> (שני ישרים החותכים שני מקבילים)."],"f":["יחס שטחים = k² ; יחס נפחים = k³","DE ∥ BC ⇒ AD/AB = AE/AC = DE/BC","שעון חול (AB ∥ CD, נחתכים ב־E): AE/EC = BE/ED = AB/CD"],"traps":["כשנתון AD ו־DB – היחס הקווי הוא AD : AB, כי DB אינו צלע של אף משולש.","כששואלים על השטח ה'לבן' (טרפז) – זה הגדול פחות הקטן, לא המשולש הגדול.","ב'דמיון באלכסון' הצלעות מתאימות בהצלבה – לא AD מול AB.","מיחס שטחים ליחס קווי צריך להוציא שורש."],"ex":{"q":"במשולש ABC הנקודה D על AB והנקודה E על AC, ו־DE ∥ BC. נתון AD = 3, DB = 2, ושטח המשולש ADE הוא 18. מה שטח הטרפז DBCE?","pt":null,"steps":["המשולשים ADE ו־ABC דומים. היחס הקווי הוא AD : AB = 3 : 5 (ולא 3 : 2!).","יחס השטחים 9 : 25. שטח ADE = 18 = 9 × 2, ולכן שטח ABC = 25 × 2 = 50.","הטרפז = 50 − 18 = <b>32<\/b>."]},"g":{"q":"שטחו של משושה משוכלל קטן הוא 5. צלעו של משושה משוכלל גדול ארוכה פי 3 מצלע המשושה הקטן. מה שטח המשושה הגדול?","pt":null,"o":["15","30","45","90"],"a":2,"g":["משושים משוכללים תמיד דומים. היחס הקווי 1 : 3.","יחס השטחים = יחס קווי בריבוע."],"x":"יחס קווי 1 : 3 ⇒ יחס שטחים 1 : 9. 5 × 9 = 45. (15 – הכפלת ביחס הקווי במקום בריבועו.)"},"solo":{"q":"AB ∥ CD, והקטעים AC ו־BD נחתכים בנקודה E (מבנה 'שעון חול'). נתון AB = 4, CD = 10, AE = 6. מה אורך EC?","pt":null,"o":["9","15","12","21"],"a":1,"x":"בגלל המקבילות, המשולשים EAB ו־ECD דומים, ו־A מתאים ל־C. היחס הקווי 4 : 10, ולכן EC = 6 × 10/4 = 15. (21 הוא כל AC.)"},"bank":[{"t":"יחס קווי והיקף","lvl":1,"q":"היחס בין צלעות שני מחומשים משוכללים הוא 2 : 5. מה היחס בין היקפיהם?","pt":null,"table":null,"o":["2 : 5","4 : 25","8 : 125","5 : 2"],"a":0,"x":"היקף הוא קו, ולכן היחס בין ההיקפים שווה ליחס הקווי, 2 : 5. (4 : 25 הוא יחס השטחים.)"},{"t":"קוביות דומות","lvl":1,"q":"נפחה של קובייה אחת גדול פי 8 מנפחה של קובייה אחרת. מה היחס בין שטחי הפנים שלהן (קטנה : גדולה)?","pt":null,"table":null,"o":["1 : 2","1 : 4","1 : 8","1 : 16"],"a":1,"x":"יחס נפחים 1 : 8 ⇒ יחס קווי 1 : 2 (שורש שלישי) ⇒ יחס שטחים 1 : 4."},{"t":"קו מקביל לבסיס","lvl":2,"q":"במשולש ABC הנקודה D על AB והנקודה E על AC, ו־DE ∥ BC. נתון AD = 4, AB = 10, BC = 15. מה אורך DE?","pt":null,"table":null,"o":["9","7.5","10","6"],"a":3,"x":"יחס קווי AD : AB = 4 : 10 = 2 : 5. DE = 15 × 2/5 = 6."},{"t":"דמיון באלכסון","lvl":3,"q":"במשולש ABC הנקודה D על הצלע AB והנקודה E על הצלע AC, כך ש־∢ADE = ∢ACB. נתון AD = 4, AE = 6, AC = 8. מה אורך DB?","pt":null,"table":null,"o":["3","8","12","10"],"a":1,"x":"למשולשים ADE ו־ACB זווית A משותפת ו־∢ADE = ∢ACB, ולכן הם דומים כש־D מתאים ל־C ו־E מתאים ל־B. AD/AC = AE/AB ⇒ 4/8 = 6/AB ⇒ AB = 12, ו־DB = 12 − 4 = 8. (12 הוא AB כולו.)"},{"t":"שטח הטרפז","lvl":3,"q":"שטח המשולש ABC הוא 54. DE ∥ BC, כאשר D על AB ו־E על AC, ו־AD : DB = 1 : 2. מה שטח הטרפז DBCE?","pt":null,"table":null,"o":["18","36","6","48"],"a":3,"x":"AD : AB = 1 : 3 ⇒ יחס שטחים 1 : 9, ולכן שטח ADE = 54/9 = 6. הטרפז = 54 − 6 = 48. (מי שחושב 1 : 2 כיחס קווי יטעה.)"},{"t":"גובה ליתר","lvl":3,"q":"במשולש ABC הזווית C ישרה, ו־CD הוא הגובה ליתר AB. נתון AD = 4 ו־DB = 9. מה אורך CD?","pt":null,"table":null,"o":["6","5","6.5","√13"],"a":0,"x":"הגובה ליתר יוצר שני משולשים דומים ACD ו־CBD: AD/CD = CD/DB ⇒ CD² = 4 × 9 = 36 ⇒ CD = 6."},{"t":"גלילים דומים","lvl":4,"q":"לגליל A רדיוס 2 וגובה 5, ולגליל B רדיוס 6 וגובה 15. נפח גליל A הוא 20π. מה נפח גליל B?","pt":null,"table":null,"o":["60π","180π","540π","1620π"],"a":2,"x":"גם הרדיוסים וגם הגבהים ביחס 1 : 3, ולכן הגלילים דומים ויחס הנפחים 1 : 27. 20π × 27 = 540π (ובדיקה ישירה: π·36·15)."},{"t":"חלוקה לשטחים שווים","lvl":5,"q":"במשולש ABC, AB = 10. הקטע DE מקביל ל־BC (D על AB, E על AC) ומחלק את המשולש לשני חלקים שווי שטח. מה אורך AD?","pt":null,"table":null,"o":["5","10/3","5√2","5√3"],"a":2,"x":"שטח ADE הוא חצי משטח ABC, כלומר יחס שטחים 1 : 2 ⇒ יחס קווי 1 : √2. AD = 10/√2 = 5√2. (5 הוא הפיתוי – חצי מהצלע נותן רבע מהשטח.)"}]},{"id":"geo-coordinates","title":"מערכת צירים","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרק 'מערכת צירים' (עמ' 233-258)","rule":["כל נקודה נכתבת (x, y): המספר השמאלי הוא תמיד ערך ה־x. נקודה על ציר ה־x היא (x, 0) ועל ציר ה־y היא (0, y). אם לשתי נקודות אותו x – הקו ביניהן מקביל לציר ה־y; אותו y – מקביל לציר ה־x.","<b>אורך קטע:<\/b> קטע מקביל לציר – ההפרש בין הערכים (כשיש מעבר דרך ציר, מחברים את שני החלקים: מ־−5 עד 9 זה 14). קטע אלכסוני – משלימים <b>משולש ישר־זווית<\/b> שהקטע הוא היתר שלו, ומשתמשים בפיתגורס (ובשלשות).","<b>שיפוע<\/b> של ישר קבוע: אפשר לצייר עליו 'מדרגות' זהות – אותו רוחב ואותו גובה. כך מוצאים נקודות שוות מרחק לאורך ישר. <b>מעגל<\/b> במערכת צירים – הרדיוס נמצא בעזרת משולש ישר־זווית מהמרכז לנקודה על ההיקף."],"f":["אורך: √((x₂ − x₁)² + (y₂ − y₁)²)","אמצע קטע: ((x₁ + x₂)/2 , (y₁ + y₂)/2)","שיפוע = גובה מדרגה ÷ רוחב מדרגה = (y₂ − y₁)/(x₂ − x₁)"],"traps":["לחסר בטעות כשהנקודות משני צדי ציר: המרחק בין −3 ל־5 הוא 8, לא 2.","להחליף בין x ל־y.","שטח משולש: הגובה הוא המרחק האנכי לבסיס, לא אורך צלע משופעת.","'מקביל לציר ה־x' פירושו ערכי y שווים."],"ex":{"q":"מה אורך הקטע שבין A(−2, 1) ל־B(4, 9), ומה נקודת האמצע שלו?","pt":null,"steps":["משלימים משולש ישר־זווית: הפרש x = 4 − (−2) = 6, הפרש y = 9 − 1 = 8.","6 : 8 : 10 – השלשה 3:4:5 כפול 2, ולכן <b>AB = 10<\/b>.","אמצע: ((−2 + 4)/2 , (1 + 9)/2) = <b>(1, 5)<\/b>."]},"g":{"q":"מה המרחק בין הנקודות (1, 2) ו־(4, 6)?","pt":null,"o":["7","5","25","√7"],"a":1,"g":["חשב את הפרש ה־x ואת הפרש ה־y.","3 ו־4 – איזו שלשה פיתגורית זו?"],"x":"הפרשים 3 ו־4, ולפי 3:4:5 המרחק 5. (7 = 3 + 4 – חיבור במקום פיתגורס.)"},"solo":{"q":"מה שטח המשולש שקודקודיו A(−3, −2), B(5, −2) ו־C(1, 4)?","pt":null,"o":["48","12","24","20"],"a":2,"x":"AB אופקי (אותו y) ואורכו 5 − (−3) = 8. הגובה מ־C אל AB הוא ההפרש בערכי y: 4 − (−2) = 6. שטח = 8 × 6 ÷ 2 = 24. (48 – בלי לחלק ב־2.)"},"bank":[{"t":"נקודות על הצירים","lvl":1,"q":"איזו מהנקודות הבאות נמצאת על ציר ה־y?","pt":null,"table":null,"o":["(−3, 0)","(0, −3)","(3, 3)","(−3, −3)"],"a":1,"x":"על ציר ה־y ערך ה־x הוא 0. (−3, 0) נמצאת על ציר ה־x – החלפה בין x ל־y."},{"t":"אמצע קטע","lvl":1,"q":"מה נקודת האמצע של הקטע שבין (−4, 3) ל־(6, 3)?","pt":null,"table":null,"o":["(1, 3)","(5, 3)","(2, 3)","(1, 0)"],"a":0,"x":"ממוצע ה־x: (−4 + 6)/2 = 1, וה־y נשאר 3. (5 הוא חצי מאורך הקטע 10, לא האמצע.)"},{"t":"מדרגות על ישר","lvl":2,"q":"הנקודות A, B, C, D נמצאות על ישר אחד בסדר הזה, ו־AB = BC = CD. A היא ראשית הצירים ו־D = (9, 12). מה שיעורי C?","pt":null,"table":null,"o":["(3, 4)","(4, 6)","(6, 8)","(6, 9)"],"a":2,"x":"מ־A ל־D שלוש מדרגות שוות, כל אחת ברוחב 3 ובגובה 4. C נמצאת אחרי שתי מדרגות: (6, 8). ((3, 4) היא B.)"},{"t":"מעגל בצירים","lvl":3,"q":"מעגל שמרכזו בראשית הצירים עובר דרך הנקודה (5, 12). איזו מהנקודות הבאות נמצאת גם היא על המעגל?","pt":null,"table":null,"o":["(13, 13)","(7, 10)","(10, 10)","(12, −5)"],"a":3,"x":"הרדיוס √(25 + 144) = 13. נקודה על המעגל מקיימת x² + y² = 169: ל־(12, −5): 144 + 25 = 169 ✓. (7, 10) נותנת 149 ו־(10, 10) נותנת 200."},{"t":"מלבן בצירים","lvl":3,"q":"קודקודי מלבן הם A(−2, −1), B(4, −1), C(4, y), D(−2, y), כאשר y > −1. שטח המלבן 30. מה ערכו של y?","pt":null,"table":null,"o":["5","4","3","6"],"a":1,"x":"רוחב AB = 4 − (−2) = 6, ולכן הגובה 30/6 = 5. y = −1 + 5 = 4. (5 הוא הגובה, לא הערך של y.)"},{"t":"שיפוע","lvl":3,"q":"ישר עובר דרך הנקודות (2, 3) ו־(6, 11). מה ערך ה־y של הנקודה על הישר שבה x = 10?","pt":null,"table":null,"o":["15","20","23","19"],"a":3,"x":"כל מדרגה של 4 ימינה עולה 8 (שיפוע 2). מ־x = 6 ל־x = 10 עוד מדרגה: 11 + 8 = 19."},{"t":"ריבוע לפי אלכסון","lvl":4,"q":"ABCD ריבוע שבו A = (1, 1) ו־C = (5, 5) הם קודקודים נגדיים. מה שטח הריבוע?","pt":null,"table":null,"o":["32","8","16","4√2"],"a":2,"x":"AC הוא אלכסון: הפרשים 4 ו־4, ולכן AC² = 32. שטח ריבוע = אלכסון² ÷ 2 = 16. (32 – מי שחושב ש־AC היא צלע.)"},{"t":"מיתר על ציר","lvl":5,"q":"מעגל שמרכזו (3, 4) ורדיוסו 5. מה אורך הקטע שהמעגל חותך על ציר ה־x?","pt":null,"table":null,"o":["5","6","8","10"],"a":1,"x":"המרחק מהמרכז לציר ה־x הוא 4. משולש ישר־זווית עם יתר 5 (רדיוס) וניצב 4 נותן חצי מיתר 3. לכן המיתר 6 (המעגל חותך את הציר ב־(0, 0) וב־(6, 0))."}]},{"id":"geo-insight","title":"הבנה גיאומטרית: שרטוט גמיש ו'מיקס עם עוגן'","tag":"גיאומטריה","en":false,"source":"ספר גיאומטריה, פרק 'הבנה גיאומטרית' (עמ' 259-278)","rule":["<b>זווית פתיחה:<\/b> כשקצות הזווית קבועים על קטע, ככל שמרחיקים את הקודקוד מהקטע הזווית 'נסגרת' וקטנה. כשהקודקוד ואורך הזרועות קבועים, ככל שהמרחק בין קצות הזרועות גדל – הזווית 'נפתחת' וגדלה.","<b>שרטוט גמיש:<\/b> שרטוט שלא נאמר שהוא מדויק אפשר 'למתוח' – להזיז נקודות ולשנות זוויות בלי לסתור את הנתונים. אז מסיקים רק ממה שנתון. צורה משוכללת היא 'קשיחה' – ממנה מותר להסיק.","<b>מיקס עם עוגן<\/b> (מינימום־מקסימום): כשהתשובות משוות גודל לערך מסוים (למשל 90°), בודקים מה קורה במצב ה'עוגן' – למשל משולש ישר־זווית עם שלשה פיתגורית – ומשווים אליו: יתר ארוך מהעוגן ⇒ הזווית נפתחה (קהה).","בשאלות 'מה נכון בהכרח' עם האפשרות 'אף אחת אינה נכונה בהכרח' – מנסים למתוח את השרטוט לשני מצבים קיצוניים. אם טענה נופלת באחד מהם – היא לא נכונה בהכרח."],"f":["צלעות a ≤ b ≤ c: c² = a² + b² ⇒ ישרה ; c² > a² + b² ⇒ קהה ; c² < a² + b² ⇒ חדה","משולשים עם בסיס משותף וקודקוד על ישר המקביל לבסיס – שווי שטח","שתי צלעות קבועות a, b: השטח מקסימלי (ab/2) כשהזווית ביניהן ישרה"],"traps":["לסמוך על 'מראה העין' בשרטוט שאינו מדויק.","לבחור 'אי אפשר לדעת' מהר מדי – לפעמים יש קשר קבוע (כמו שטח שווה בין מקבילים).","לבדוק רק מצב קיצוני אחד ולהסיק 'בהכרח'.","להתבלבל בכיוון: קודקוד רחוק יותר ⇒ זווית קטנה יותר."],"ex":{"q":"צלעות משולש הן 6, 8 ו־11. האם הזווית שמול הצלע 11 חדה, ישרה או קהה?","pt":null,"steps":["<b>העוגן:<\/b> אם הזווית בין הצלעות 6 ו־8 הייתה ישרה, הצלע שמולה הייתה 10 (שלשה 6:8:10).","בפועל הצלע שמולה 11 – ארוכה יותר מהעוגן, כלומר הזרועות 6 ו־8 'נפתחו' יותר מ־90°.","לכן הזווית <b>קהה<\/b>. (בדיקה: 121 > 36 + 64 = 100.)"]},"g":{"q":"צלעות משולש הן 5, 12 ו־12.5. α היא הזווית שמול הצלע 12.5. מה נכון?","pt":null,"o":["α < 90°","α = 90°","α > 90°","אי אפשר לדעת"],"a":0,"g":["מה היה אורך הצלע השלישית אם הזווית בין 5 ל־12 הייתה ישרה?","12.5 קטן או גדול מהעוגן 13?"],"x":"בעוגן (זווית ישרה) הצלע הייתה 13. בפועל 12.5 < 13, כלומר הזווית 'סגורה' יותר מ־90°: α < 90°."},"solo":{"q":"AB קטע קבוע. P ו־Q הן נקודות על האנך האמצעי של AB, באותו צד של AB, ו־P קרובה יותר ל־AB מאשר Q. מה נכון?","pt":null,"o":["∢APB < ∢AQB","∢APB > ∢AQB","∢APB = ∢AQB","אי אפשר לדעת"],"a":1,"x":"קצות הזווית קבועים (A ו־B). ככל שהקודקוד מתרחק מהקטע הזווית נסגרת. Q רחוקה יותר, ולכן ∢AQB קטנה יותר: ∢APB > ∢AQB."},"bank":[{"t":"שטחים בין מקבילים","lvl":1,"q":"a ו־b ישרים מקבילים. A ו־B הן נקודות על b, ו־AB = 6. P ו־Q הן שתי נקודות שונות על a. מה נכון לגבי שטחי המשולשים PAB ו־QAB?","pt":null,"table":null,"o":["שטח PAB גדול יותר","שטח PAB קטן יותר","השטחים שווים","אי אפשר לדעת"],"a":2,"x":"לשני המשולשים בסיס משותף AB וגובה זהה – המרחק בין המקבילים. לכן השטחים שווים, לא משנה איפה P ו־Q."},{"t":"עוגן פיתגורי","lvl":2,"q":"צלעות משולש הן 7, 24 ו־26. מה סוג הזווית הגדולה ביותר שלו?","pt":null,"table":null,"o":["קהה","חדה","ישרה","אי אפשר לדעת"],"a":0,"x":"העוגן הוא 7:24:25. הצלע הגדולה 26 > 25, ולכן הזווית שמולה 'נפתחה' מעבר ל־90° – קהה."},{"t":"שרטוט גמיש","lvl":3,"q":"ABCD מרובע שבו כל ארבע הצלעות שוות ל־5. איזו מהטענות הבאות נכונה בהכרח?","pt":null,"table":null,"o":["האלכסונים שווים זה לזה","שטחו 25","האלכסונים מאונכים זה לזה","כל זוויותיו ישרות"],"a":2,"x":"המרובע הוא מעוין, ואפשר 'למעוך' אותו – לכן זוויותיו ושטחו אינם קבועים, והאלכסונים שווים רק כשהוא ריבוע. אבל בכל מעוין האלכסונים מאונכים."},{"t":"זווית פתיחה","lvl":3,"q":"במשולש ABC נתון AB = AC = 10, ובמשולש ADE נתון AD = AE = 10. ידוע ש־DE > BC. מה נכון?","pt":null,"table":null,"o":["∢BAC > ∢DAE","∢BAC < ∢DAE","∢BAC = ∢DAE","אי אפשר לדעת"],"a":1,"x":"הזרועות באותו אורך (10). ככל שהמרחק בין קצות הזרועות גדול יותר, הזווית פתוחה יותר. DE > BC, ולכן ∢DAE גדולה יותר."},{"t":"מיקס עם עוגן","lvl":3,"q":"במשולש ABC נתון AB = 6, BC = 8, והזווית B קהה. מה נכון בהכרח לגבי AC?","pt":null,"table":null,"o":["AC < 10","AC = 10","AC > 10","AC > 14"],"a":2,"x":"בעוגן ∢B = 90° היה AC = 10 (6:8:10). זווית קהה 'פותחת' את הזרועות, ולכן AC > 10. מצד שני AC < 6 + 8 = 14, ולכן 'AC > 14' שגוי."},{"t":"שטח מקסימלי","lvl":4,"q":"שתיים מצלעות משולש הן 6 ו־8, והזווית ביניהן אינה ידועה. S הוא שטח המשולש. מה נכון בהכרח?","pt":null,"table":null,"o":["S = 24","S ≤ 24","S ≥ 24","S < 12"],"a":1,"x":"כשהזווית בין הצלעות ישרה, הגובה לצלע 8 הוא 6 כולו והשטח מקסימלי: 24. בכל זווית אחרת הגובה קטן מ־6. לכן S ≤ 24 תמיד, ו־S = 24 רק במקרה אחד."},{"t":"אף לא אחת","lvl":4,"q":"במשולש ABC נתון AB = 5 ו־AC = 7. הזווית A אינה ידועה. איזו מהטענות הבאות נכונה בהכרח?","pt":null,"table":null,"o":["BC > 5","BC < 7","BC = 6","אף אחת מהטענות אינה נכונה בהכרח"],"a":3,"x":"לפי אי־שוויון המשולש 2 < BC < 12. כשהזווית A קטנה מאוד BC יכול להיות 3 (סותר את 'BC > 5'), וכשהיא גדולה BC יכול להיות 11 (סותר את 'BC < 7'). שום טענה אינה מחויבת."},{"t":"זווית ישרה וקוטר","lvl":5,"q":"A ו־B נקודות קבועות, AB = 10. הנקודה P זזה כך שתמיד ∢APB = 90°. מה השטח המקסימלי האפשרי של המשולש APB?","pt":null,"table":null,"o":["50","25","25√3","אין שטח מקסימלי"],"a":1,"x":"כל הנקודות P שבהן ∢APB = 90° נמצאות על מעגל שקוטרו AB (זווית היקפית על קוטר). הגובה מ־P אל AB הוא לכל היותר הרדיוס 5, ולכן השטח המקסימלי 10 × 5 ÷ 2 = 25."}]},{"id":"cht-reading","title":"קריאת טבלה ותרשים: שליפת נתון, יחידות והשוואה","tag":"תרשימים","en":false,"source":"ספר תרשימים, \"הסקה מתרשים/מטבלה\" ו\"גרף עמודות/קווי\", \"גרף קווי רציף\" (עמ' 5-7); יחידות תרגול 1, 4, 6, 13","rule":["בכל פרק כמותי יש מקטע אחד של תרשים או טבלה עם 4-5 שאלות בסדר קושי עולה. לפני שעונים, מקדישים <b>חצי דקה עד דקה<\/b> להבנה: קוראים את ההסבר, את כותרות השורות והעמודות, את <b>היחידות<\/b> (למשל \"באלפים\") ואת המקרא.","הסבר התרשים כמעט תמיד מסתיים ב<b>דוגמה<\/b>. בודקים שהדוגמה מסתדרת עם מה שהבנת – אם לא, חוזרים להסבר. השאלה הראשונה היא בדרך כלל <b>שליפת נתון<\/b>: אם אינך מצליח בה, לא הבנת את התרשים, ועדיף לחזור אליו או לוותר עליו מאשר לבזבז זמן.","בגרף קווי (נקודות מחוברות בקו) הקו רק מראה מגמה – אין לו ערך מספרי בין הנקודות. בגרף <b>רציף<\/b> (כמו טמפרטורה לאורך יממה) לכל נקודה על הקו יש ערך. בטבלה – יש מידע רק על מה שרשום בה.","התרשימים מדויקים (בשונה מסרטוטי גאומטריה), ולכן מותר ומומלץ להסתמך עליהם ולהשתמש ב<b>הערכה<\/b> במקום חישוב מלא כשהתשובות רחוקות זו מזו."],"f":["יחידות: \"באלפים\" ⇐ 25 = 25,000","שאלה 1 = בדיקת הבנה: לא הצלחת? חזור להסבר","תשובות רחוקות זו מזו ⇐ הערכה במקום חישוב","\"שימו לב\": כל שאלה עומדת בפני עצמה – נתון שנוסף בשאלה אחת לא חל על אחרת"],"traps":["להתעלם מהיחידות שבכותרת (באלפים, באחוזים, במאות)","להסיק ערך בין שתי נקודות בגרף קווי לא רציף, או מה קורה אחרי סוף התרשים","לבלבל בין \"הערך הבודד הגבוה ביותר\" לבין \"הסכום הגבוה ביותר\"","לגרור נתון חדש משאלה קודמת לשאלה הבאה"],"ex":{"q":"בטבלה מוצג מספר הספרים שהושאלו בספרייה (באלפים): ינואר – 4, פברואר – 6, מרץ – 5. כמה ספרים הושאלו בסך הכול בשלושת החודשים?","pt":null,"steps":["קודם כול בודקים יחידות: הכותרת אומרת <b>באלפים<\/b>.","סוכמים את המספרים כפי שהם: 4+6+5=15.","ממירים ליחידות האמיתיות: 15 אלף = <b>15,000<\/b> ספרים."]},"g":{"q":"בטבלה מוצגות מכירות גלידה במאות ק\"ג: יוני – 30, יולי – 45, אוגוסט – 40. בכמה ק\"ג גדלו המכירות מיוני ליולי?","pt":null,"o":["15","150","1,500","4,500"],"a":2,"g":["חשב את ההפרש במספרים שבטבלה: 45 פחות 30.","עכשיו זכור שהיחידות הן מאות ק\"ג – הכפל ב־100."],"x":"ההפרש בטבלה הוא 15, והיחידות הן מאות ק\"ג, לכן 15×100=1,500 ק\"ג. 15 היא המלכודת של מי ששכח את היחידות."},"solo":{"q":"בטבלה מוצג מספר התושבים ביישוב בסוף כל שנה זוגית: 2020 – 1,200; 2022 – 1,500; 2024 – 1,600. מה אפשר לקבוע לגבי מספר התושבים בסוף 2021?","pt":null,"o":["בדיוק 1,350","בין 1,200 ל־1,500","1,500","אי אפשר לקבוע לפי הנתונים"],"a":3,"x":"אין בטבלה נתון על 2021. גם אם היינו מציירים קו בין 2020 ל־2022, לקו אין ערך מספרי בין הנקודות – ייתכן שמספר התושבים עלה וירד בדרך. לכן אי אפשר לדעת, ואפילו לא שהוא בין 1,200 ל־1,500."},"bank":[{"t":"שליפת נתון","lvl":1,"q":"כמה אנשים ביקרו במוזיאון המדע בחודש אפריל?","pt":null,"table":{"title":"מספר המבקרים בשלושה מוזיאונים בחצי השנה הראשונה (באלפים)","head":["חודש","מוזיאון הים","מוזיאון המדע","מוזיאון האמנות"],"rows":[["ינואר","12","18","9"],["פברואר","10","20","11"],["מרץ","15","16","14"],["אפריל","22","25","13"],["מאי","19","21","17"],["יוני","26","24","15"]]},"o":["25","2,500","25,000","250,000"],"a":2,"x":"בשורת אפריל ובעמודת מוזיאון המדע רשום 25. שים לב לכותרת: המספרים הם <b>באלפים<\/b>, ולכן מדובר ב־25,000 מבקרים. התשובה 25 היא המלכודת של מי שמתעלם מהיחידות."},{"t":"השוואה בין שורות","lvl":1,"q":"באיזה חודש היה מספר המבקרים הכולל בשלושת המוזיאונים הגדול ביותר?","pt":null,"table":{"title":"מספר המבקרים בשלושה מוזיאונים בחצי השנה הראשונה (באלפים)","head":["חודש","מוזיאון הים","מוזיאון המדע","מוזיאון האמנות"],"rows":[["ינואר","12","18","9"],["פברואר","10","20","11"],["מרץ","15","16","14"],["אפריל","22","25","13"],["מאי" "],["גיל","51 ומעלה","8"],["ספורט מועדף","ריצה","15"],["ספורט מועדף","שחייה","10"],["ספורט מועדף","רכיבה","9"],["ספורט מועדף","כדורגל","6"]]},"o":["12","18","0","6"],"a":3,"x":"בגיל עד 30 יש 12 משתתפים, ו־6 מהם (חובבי הכדורגל) הם גברים לפי הנתון. נשארים לכל היותר 12−6=6 מקומות לנשים, ויש מספיק נשים. שים לב: הנתון הזה תקף לשאלה זו בלבד."},{"t":"טווח אפשרי","lvl":5,"q":"ידוע שבדיוק 10 מהנשים בסקר הן בנות 31–50. מהו הטווח האפשרי של מספר הגברים שגילם עד 30?","pt":null,"table":{"title":"סקר בקרב 40 משתתפים – כל משתתף ענה על שלוש שאלות (כל חלק בטבלה מסתכם ב־40)","head":["נושא","תשובה","מספר משתתפים"],"rows":[["מין","גברים","22"],["מין","נשים","18"],["גיל","עד 30","12"],["גיל","31–50","20"],["גיל","51 ומעלה","8"],["ספורט מועדף","ריצה","15"],["ספורט מועדף","שחייה","10"],["ספורט מועדף","רכיבה","9"],["ספורט מועדף","כדורגל","6"]]},"o":["בין 4 ל־12","בין 2 ל־12","בין 4 ל־8","בין 0 ל־12"],"a":0,"x":"בגיל 31–50 יש 10 נשים ו־10 גברים. נשארות 8 נשים ו־12 גברים לשתי קבוצות הגיל האחרות (12 צעירים + 8 מבוגרים). מקסימום: כל 12 הצעירים גברים (ואז 8 המבוגרים נשים) – 12. מינימום: מכניסים לצעירים את כל 8 הנשים הנותרות ⇐ לפחות 12−8=4 גברים."}]}],"v":[{"id":"vba-analogy-sentence","title":"אנלוגיות: משפט קשר","tag":"אנלוגיות","en":false,"source":"ספר חשיבה מילולית, מבוא ופרק אנלוגיות (עמ' 5-13), קובץ 1","rule":["בכל פרק חשיבה מילולית יש 23 שאלות: 6 אנלוגיות בפתיחה, אחריהן 11-12 שאלות הבנה והסקה, ובסוף קטע קריאה. האנלוגיות מסודרות בסדר קושי עולה, ומומלץ להקדיש לכל אחת חצי דקה עד דקה.","השיטה היא <b>משפט קשר<\/b>: מנסחים משפט קצר שמגדיר בדיוק את הקשר בין שתי המילים המודגשות, ואז <b>מלבישים<\/b> אותו על כל אחד מזוגות התשובות. זוג שהמשפט לא מתאים לו נפסל. גם אחרי שמצאת תשובה שנראית נכונה, ממשיכים לבדוק את השאר.","הדרך הטובה ביותר לנסח משפט קשר היא <b>״מה זה...?״<\/b>: להסביר מילה אחת בעזרת השנייה, כאילו ילד שאל אותך (״מה זה עדר? הרבה כבשים יחד״). דפוס נפוץ נוסף: <b>״המטרה של X היא...״<\/b> (המטרה של מעקה היא למנוע נפילה).","אם כמה תשובות מתאימות למשפט, הוא רחב מדי: <b>מחדדים<\/b> אותו עד שרק זוג ן : זמן","עט : כתיבה"],"a":1,"x":"המטרה של מנעול היא למנוע פריצה, והמטרה של מעקה היא למנוע נפילה. עט משמש לכתיבה – הוא מאפשר אותה ולא מונע אותה, ולכן הקשר הפוך."},{"t":"סדר המילים","lvl":2,"q":"ענף : עץ","pt":null,"table":null,"o":["ספר : פרק","עלה : ירוק","מטבח : מקרר","גלגל : אופניים"],"a":3,"x":"ענף הוא חלק של עץ, וגלגל הוא חלק של אופניים. ב״ספר : פרק״ הסדר הפוך – הפרק הוא חלק מהספר. מקרר רק נמצא במטבח ואינו חלק ממנו."},{"t":"חידוד משפט","lvl":2,"q":"מאפייה : לחם","pt":null,"table":null,"o":["מבשלת : בירה","מסעדה : מלצר","מחסן : סחורה","בית חולים : רופא"],"a":0,"x":"המשפט ״במאפייה יש לחם״ רחב מדי ומתאים גם למחסן. מחדדים: מאפייה היא מקום שבו <b>מייצרים<\/b> לחם – וכך גם מבשלת היא מקום שבו מייצרים בירה. במחסן רק מאחסנים."},{"t":"מה זה","lvl":3,"q":"עצלן : לעבוד","pt":null,"table":null,"o":["פטפטן : לדבר","סקרן : לדעת","פזרן : לחסוך","גרגרן : לאכול"],"a":2,"x":"עצלן הוא מי שנמנע מלעבוד, ופזרן הוא מי שנמנע מלחסוך. פטפטן וגרגרן מרבים לעשות את הפעולה, וסקרן רוצה לדעת – כל אלה הפוכים לכיוון הקשר."},{"t":"משמעות ולא צורה","lvl":3,"q":"ענק : גדול","pt":null,"table":null,"o":["ירקרק : ירוק","חמים : קר","מהיר : איטי","זעיר : קטן"],"a":3,"x":"ענק זה גדול מאוד, וזעיר זה קטן מאוד. ״ירקרק״ מושך בגלל הצורה, אבל ירקרק זה מעט ירוק – ההפך מ״מאוד״."},{"t":"המטרה של","lvl":3,"q":"רסן : סוס","pt":null,"table":null,"o":["אוכף : סוס","הגה : מכונית","דלק : מכונית","שריון : טנק"],"a":1,"x":"המטרה של הרסן היא לשלוט בכיוון התנועה של הסוס, והמטרה של ההגה היא לשלוט בכיוון התנועה של המכונית. אוכף נועד לישיבה, דלק מניע ושריון מגן."},{"t":"חידוד משפט","lvl":4,"q":"מקהלה : זמר","pt":null,"table":null,"o":["צי : ספינה","אשכול : ענב","תזמורת : נגן","ספרייה : ספר"],"a":2,"x":"המשפט ״מקהלה היא קבוצה של זמרים״ מתאים גם לצי ולאשכול. מחדדים: מקהלה היא קבוצה של <b>אנשים שמבצעים יחד יצירה מוזיקלית<\/b> – וזו גם תזמורת של נגנים. ספרייה היא אוסף של חפצים ולא קבוצת מבצעים."}]},{"id":"vba-analogy-relations","title":"אנלוגיות: יחסים מיוחדים","tag":"אנלוגיות","en":false,"source":"ספר חשיבה מילולית, פרק אנלוגיות: מי על מי, לא צריך, פעלים מתאימים, גורם מקשר, ההפך מ־ (עמ' 10-12), קובץ 1","rule":["<b>מי על מי?<\/b> כשהקשר הוא פעולה, חשוב לבדוק מי עושה אותה ועל מי: על עצמו או על אחר. ״התעשר : עשיר״ – נעשה בעצמו עשיר; ״החליש : חלש״ – גרם <b>למישהו אחר<\/b> להיות חלש. מילים שנראות דומות בבניין (התנקם, התעכל, נפגש, נדרס) יכולות לבטא יחסים שונים לגמרי.","<b>ההפך מ־<\/b> הוא אחד היחסים הנפוצים ביותר בבחינה: ״ייבש : רטוב״ – ייבש זה גרם למשהו להפסיק להיות רטוב. אפשר לנסח עם ״הפסיק להיות״ או עם ״לא״.","<b>פעלים מתאימים<\/b>: כששני פעלים מאותו תחום, הקשר הוא ניואנס – לזלול זה לאכול בכמות גדולה ובחמדנות. <b>גורם מקשר<\/b>: לפעמים הקשר עובר דרך מילה שלישית שלא כתובה (ענף הוא חלק של עץ, הרבה עצים הם יער). מנסחים שני משפטים ומחברים.","<b>לא צריך!<\/b> אל תנסח משפט עם ״צריך״ – הוא מתאים כמעט לכל זוג (״מה שמקולקל צריך לתקן״) ולא מבחין בין התשובות."],"f":["התעשר : עשיר = נעשה בעצמו ≠ העשיר : עשיר = גרם לאחר","X : Y = ההפך מ־ ← X זה גרם להפסיק להיות Y","גורם מקשר: [מילה 1] ← מילה נסתרת ← [מילה 2]","בלי ״צריך״ במשפט הקשר"],"traps":["לא לבדוק מי מבצע את הפעולה ועל מי – עצמי, אחר או הדדי","לבחור זוג שבו הפועל גורם להיות Y במקום להפסיק להיות Y","בפעלים מתאימים – לבחור ניואנס הפוך (מעט במקום הרבה)","משפט עם ״צריך״ שמתאים לכל התשובות"],"ex":{"q":"הלביש : לבוש – איזה זוג מקיים יחס דומה? (1) התקרר : קר (2) הרטיב : רטוב (3) התבגר : בוגר (4) נרדם : ישן","pt":null,"steps":["מנסחים: הלביש זה <b>גרם למישהו אחר<\/b> להיות לבוש.","בודקים מי על מי: התקרר, התבגר ונרדם – כל אלה קורים <b>לעצמו<\/b>, ולכן נפסלים.","הרטיב זה גרם למשהו אחר להיות רטוב – מתאים. התשובה <b>(2)<\/b>."]},"g":{"q":"הרחיק : רחוק","pt":null,"o":["התקרב : קרוב","התבגר : בוגר","הגדיל : גדול","גדל : גדול"],"a":2,"g":["נסח משפט קשר ושים לב: מי נעשה רחוק – מי שעשה את הפעולה או מישהו אחר?","הרחיק זה גרם למשהו אחר להיות רחוק. חפש פועל שבו הפעולה נעשית על אחר."],"x":"הרחיק זה גרם למשהו אחר להיות רחוק, והגדיל זה גרם למשהו אחר להיות גדול. התקרב, התבגר וגדל – כל אלה קורים לעושה עצמו."},"solo":{"q":"לרפרף : לקרוא","pt":null,"o":["לשנן : ללמוד","להתעמק : לקרוא","לנמנם : לישון","לחלום : לישון"],"a":2,"x":"לרפרף זה לקרוא בקלילות ובאופן שטחי, ולנמנם זה לישון שינה קלה ושטחית. ״להתעמק : לקרוא״ מושך כי מופיעה אותה מילה, אבל הניואנס הפוך – קריאה עמוקה."},"bank":[{"t":"מי על מי","lvl":2,"q":"החליש : חלש","pt":null,"table":null,"o":["התעשר : עשיר","הרגיז : כועס","נחלש : חלש","התחזק : חזק"],"a":1,"x":"החליש זה גרם למישהו אחר להיות חלש, והרגיז זה גרם למישהו אחר להיות כועס. התעשר, נחלש והתחזק – הפעולה קורית לעושה עצמו."},{"t":"ההפך מ־","lvl":2,"q":"ייבש : רטוב","pt":null,"table":null,"o":["הרטיב : רטוב","הפחיד : מפוחד","שכנע : משוכנע","ריסק : שלם"],"a":3,"x":"ייבש זה גרם למשהו להפסיק להיות רטוב, וריסק זה גרם למשהו להפסיק להיות שלם. בשאר הזוגות הפועל גורם להיות במצב, לא להפסיק להיות בו."},{"t":"פעלים מתאימים","lvl":3,"q":"לזלול : לאכול","pt":null,"table":null,"o":["לגמוע : לשתות","לטעום : לאכול","ללגום : לשתות","לבשל : לאכול"],"a":0,"x":"לזלול זה לאכול בכמות גדולה ובבת אחת, ולגמוע זה לשתות בלגימות גדולות. ללגום זה לשתות מעט – הניואנס ההפוך, וזו המלכודת."},{"t":"גורם מקשר","lvl":3,"q":"ענף : יער","pt":null,"table":null,"o":["דף : ספר","פרק : רומן","דף : ספרייה","חלון : בית"],"a":2,"x":"ענף הוא חלק של עץ, והרבה עצים הם יער. באותו אופן דף הוא חלק של ספר, והרבה ספרים הם ספרייה. ״דף : ספר״ הוא קשר ישיר בלי הגורם המקשר."},{"t":"ההפך מ־","lvl":3,"q":"שחרר : כבול","pt":null,"table":null,"o":["פירק : מפורק","עיקם : ישר","יישר : ישר","קשר : כבול"],"a":1,"x":"שחרר זה גרם להפסיק להיות כבול, ועיקם זה גרם להפסיק להיות ישר. ״קשר : כבול״ ו״יישר : ישר״ הם ״גרם להיות״ – כיוון הפוך."},{"t":"פעלים מתאימים","lvl":4,"q":"לכרסם : לאכול","pt":null,"table":null,"o":["לבלוע : לאכול","לזלול : לאכול","לשאוף : לנשום","ללגום : לשתות"],"a":3,"x":"לכרסם זה לאכול בנגיסות קטנות, וללגום זה לשתות בלגימות קטנות. לזלול זה ההפך (כמות גדולה), ולבלוע זה שלב באכילה ולא אופן שלה."},{"t":"ההפך מ־ / מי על מי","lvl":5,"q":"פייס : זועף","pt":null,"table":null,"o":["הבהיל : נבהל","עודד : נלהב","שעשע : משועשע","ריפא : חולה"],"a":3,"x":"פייס זה גרם למישהו אחר להפסיק להיות זועף, וריפא זה גרם למישהו אחר להפסיק להיות חולה. בשאר הזוגות הפועל גורם לאחר <b>להיות<\/b> במצב – ההפך מהקשר."}]},{"id":"vba-analogy-vocab","title":"אנלוגיות: מילים קשות ופתרון דרך התשובות","tag":"אנלוגיות","en":false,"source":"ספר חשיבה מילולית, פרק אנלוגיות: דני הסנגור, פתרון דרך התשובות, אוצר מילים (עמ' 13-16), תרגול יחידות 1-8 (עמ' 17-24), קובץ 1; מילון עברית – רמת המילים","rule":["השליטה באוצר מילים חשובה בכל הפרק, ובמיוחד באנלוגיות (המילון הפסיכומטרי). כשמילה לא מוכרת, אפשר לנחש: <b>פירוש לפי שורש<\/b> (בציר – מזכיר ״בצר״, קטיף ענבים), <b>הכנסה לביטוי<\/b> מוכר (״מים במשורה״ ← במשורה = בכמות מצומצמת), ו<b>פירוק ביטוי<\/b> לפי הכוונה הציורית ולא המילולית.","<b>דני הסנגור<\/b>: כשקשה לנסח משפט קשר בין פעלים, שמים אותם במשפט פשוט עם דמות: ״דני ליבה את האש, ועכשיו האש גדולה יותר״. זה מספיק כדי לבדוק את התשובות.","<b>פתרון דרך התשובות<\/b>: אם לא מצליחים לחדד את המשפט, מנסחים משפט קשר לכל תשובה שנותרה, ובודקים איזה מהם מתאים בדיוק לזוג המקורי.","פסילה מהירה: לפעמים אפשר לפסול תשובות רק לפי <b>פעיל או סביל<\/b> (״נגזל״ = מי שגזלו ממנו), גם בלי משפט קשר מלא. ומילה מנוקדת בשאלה – הניקוד נועד לרמוז לאיזו משמעות הכוונה."],"f":["מילה לא מוכרת ← שורש / ביטוי מוכר / פירוק ביטוי","פעלים קשים ← ״דני ___, ועכשיו ___״","לא מחדדים? ← משפט קשר לכל תשובה והשוואה לזוג המקורי","פעיל או סביל? – פסילה מהירה"],"traps":["תרגום ביטוי מילולית במקום לפי הכוונה (״העלה חרס בידו״ = לא הצליח)","לבחור תשובה רק כי היא מאותו תחום תוכן כמו השאלה","לבלבל פעיל וסביל (גזלן מול נגזל)","להתעלם מהניקוד שמכוון למשמעות המילה"],"ex":{"q":"בציר : ענבים – איזה זוג מקיים יחס דומה? (1) יין : ענבים (2) מסיק : זיתים (3) פרדס : תפוזים (4) שתילה : עץ","pt":null,"steps":["אם המילה ״בציר״ לא מוכרת, מחפשים שורש או ביטוי: ״עונת הבציר״ – התקופה שבה קוטפים ענבים. משפט הקשר: <b>בציר זה קטיף של ענבים<\/b>.","מלבישים: יין עשוי מענבים – לא קטיף. פרדס הוא מקום שבו גדלים תפוזים – לא קטיף. שתילה היא נטיעה ולא קטיף.","מסיק זה קטיף של זיתים – מתאים. התשובה <b>(2)<\/b>."]},"g":{"q":"במשורה : מעט","pt":null,"o":["בחופזה : לאט","במתינות : מהר","בשפע : הרבה","בעל כורחו : רצון"],"a":2,"g":["הכנס את המילה לביטוי מוכר: ״מים במשורה״. מה פירוש הביטוי?","במשורה זה בכמות מעטה. חפש תואר שמשמעותו ״בכמות של...״ המילה השנייה."],"x":"במשורה זה באופן מעט ומצומצם, ובשפע זה באופן של הרבה. בחופזה ובמתינות מתארים קצב, והמילה השנייה בזוג היא ההפך מהן – קשר אחר."},"solo":{"q":"גלעד : הנצחה","pt":null,"o":["מצבה : קבר","תמרור : הכוונה","שלט : קיר","פסל : אבן"],"a":1,"x":"גלעד הוא אנדרטה, והמטרה שלו היא הנצחה. המטרה של תמרור היא הכוונה. מצבה מושכת כי היא מאותו תחום (זיכרון), אבל הקשר שלה לקבר הוא מיקום ולא מטרה. שלט קשור לקיר רק במיקום, ופסל קשור לאבן כחומר שממנו הוא עשוי."},"bank":[{"t":"פירוש לפי שורש","lvl":2,"q":"מגל : קציר","pt":null,"table":null,"o":["שדה : חיטה","מזמרה : גיזום","מחרשה : אדמה","חקלאי : טרקטור"],"a":1,"x":"מגל הוא כלי שבעזרתו קוצרים, ומזמרה היא כלי שבעזרתו גוזמים. ״מחרשה : אדמה״ מושך, אבל שם המילה השנייה היא החומר שעליו עובדים ולא הפעולה."},{"t":"פירוק ביטוי","lvl":3,"q":"הטה אוזן : הקשיב","pt":null,"table":null,"o":["חרק שיניים : צחק","הרים ידיים : ויתר","עצם עין : ראה","משך בכתפיו : התלהב"],"a":1,"x":"״הטה אוזן״ פירושו הקשיב, ו״הרים ידיים״ פירושו ויתר. חורקים שיניים מכעס או מהתאפקות, עוצמים עין כדי לא לראות, ומושכים בכתפיים מאדישות."},{"t":"מה זה","lvl":3,"q":"גדם : עץ","pt":null,"table":null,"o":["שורש : צמח","עשן : מדורה","בדל : סיגריה","ענף : גזע"],"a":2,"x":"גדם הוא מה שנשאר מעץ אחרי שכרתו את רובו, ובדל הוא מה שנשאר מסיגריה אחרי שעישנו את רובה. שורש וענף הם חלקים של צמח שלם ולא שארית, ועשן הוא תוצר של המדורה ולא מה שנשאר ממנה."},{"t":"פעיל או סביל","lvl":3,"q":"נגזל : גזילה","pt":null,"table":null,"o":["גזלן : גזילה","נאנח : אנחה","נלחם : מלחמה","נשדד : שוד"],"a":3,"x":"נגזל הוא מי שגזלו ממנו – סביל, הפעולה נעשתה עליו. גם נשדד הוא מי ששדדו אותו. גזלן ונלחם פעילים, ונאנח עושה את האנחה בעצמו – אפשר לפסול אותם לפי פעיל/סביל בלבד."},{"t":"דני הסנגור","lvl":4,"q":"ליבה : אש","pt":null,"table":null,"o":["הגביר : קול","כיבה : אש","שמע : קול","הדליק : נר"],"a":0,"x":"״דני ליבה את האש, ועכשיו האש חזקה יותר.״ ״דני הגביר את הקול, ועכשיו הקול חזק יותר.״ הדליק נר זה לגרום לו להתחיל לבעור – לא לחזק משהו שכבר קיים."},{"t":"אוצר מילים","lvl":5,"q":"ביבר : חיות","pt":null,"table":null,"o":["כוורן : דבורים","אוסף : בולים","חממה : צמחים","זואולוג : חיות"],"a":2,"x":"ביבר הוא מקום סגור שבו מגדלים ומחזיקים חיות, וחממה היא מקום סגור שבו מגדלים צמחים. כוורן וזואולוג הם אנשים, ואוסף הוא קבוצה ולא מקום."},{"t":"פתרון דרך התשובות","lvl":4,"q":"מבעבע : בועות","pt":null,"table":null,"o":["מזיע : זיעה","מאוורר : רוח","מבריק : ניקיון","מעונן : שמש"],"a":0,"x":"מבעבע הוא מה שבועות עולות ויוצאות ממנו, ומזיע הוא מי שזיעה יוצאת ממנו. מאוורר יוצר רוח אבל היא לא יוצאת מתוכו; מבריק הוא תוצאה של ניקיון; ומעונן מסתיר את השמש. אם המשפט הראשון לא חד מספיק, נסח משפט לכל זוג והשווה."}]},{"id":"vba-sc-connectors","title":"השלמת משפטים: מילות קישור וקשרים לוגיים","tag":"השלמת משפטים","en":false,"source":"ספר חשיבה מילולית, פרק השלמת משפטים: קשר בין חלקי המשפט, מילות קישור, ביטויי הפתעה, קשרי מחקר (עמ' 63-65), קובץ 1","rule":["בכל פרק יש 3 שאלות השלמת משפטים, בתוך מקטע ההבנה וההסקה. התשובה הנכונה היא זו שיוצרת משפט בעל <b>היגיון פנימי תקין<\/b> – בלי סתירה בין חלקיו. לא מסתמכים על ידע כללי, אלא על מה שכתוב.","המפתח הוא <b>מילות הקישור<\/b>: <b>התאמה<\/b> (בגלל, לכן, כי, שכן, מפני ש...), <b>אי־התאמה<\/b> (הגם ש..., אף, אבל, למרות, אולם), <b>תנאי<\/b> (אם, במקרה ש..., אילולא) ו<b>השוואה<\/b> (בדומה ל..., כפי ש..., בשונה מ...).","<b>ביטויי הפתעה<\/b> (״הופתעתי ש...״, ״קשה להבין מדוע״) מחברים חלקים שאינם מתאימים; <b>ביטויי היעדר הפתעה<\/b> (״אין פלא ש...״, ״מובן כי...״) מחברים חלקים מתאימים.","<b>קשרי מחקר<\/b>: ביטויי תמיכה (מחזק, מבסס, תואם, ראיה ל...) כשהממצא מתאים לטענה, וביטויי הפרכה (מחליש, מפריך, מערער, נזנח) כשהממצא סותר אותה."],"f":["התאמה: לכן, כי, שכן, מפני ש, ואכן","אי־התאמה: אף ש, למרות, אולם, אך, בכל זאת","אין פלא ש / מובן ש = התאמה; הופתע / מפתיע ש = אי־התאמה","ממצא מתאים לטענה ← מחזק; סותר ← מחליש / מפריך"],"traps":["לבחור לפי ידע כללי במקום לפי ההיגיון הפנימי של המשפט","לפספס שמילת הקישור דורשת ניגוד (״למרות״) ולבחור השלמה תואמת","״אין פלא ש...״ מבטא התאמה – לא הפתעה","להתבלבל בכיוון: ממצא שסותר טענה לא ״מחזק״ אותה"],"ex":{"q":"____ שהמבחן היה קל במיוחד, רוב התלמידים נכשלו בו. (1) מכיוון (2) למרות (3) בזכות כך (4) כשם","pt":null,"steps":["מזהים את שני החלקים: ״המבחן קל״ ו״רוב התלמידים נכשלו״. מבחן קל אמור להוביל להצלחה – אז זה <b>ניגוד<\/b>.","צריך מילת קישור של אי־התאמה. ״מכיוון״ ו״בזכות כך״ הן מילות התאמה – נפסלות. ״כשם״ היא מילת השוואה – לא מתאימה.","״למרות שהמבחן היה קל, רוב התלמידים נכשלו״ – משפט תקין. התשובה <b>(2)<\/b>."]},"g":{"q":"הוא התאמן קשה כל השנה, ____ זכה במקום הראשון בתחרות.","pt":null,"o":["ולכן","אך","למרות זאת","אף על פי כן"],"a":0,"g":["האם אימון קשה ״מתאים״ לזכייה או ״סותר״ אותה?","אימון קשה מוביל לזכייה – צריך מילת קישור של התאמה."],"x":"אימון קשה מסביר את הזכייה, ולכן נדרשת מילת התאמה: ״ולכן״. שלוש האפשרויות האחרות מבטאות ניגוד, וזה ייצור סתירה."},"solo":{"q":"____ התחזית צפתה מזג אוויר נאה, הטיול בוטל בגלל סערה פתאומית.","pt":null,"o":["מאחר ש","אף ש","כיוון ש","הואיל ו"],"a":1,"x":"תחזית נאה אמורה לאפשר טיול, אבל הוא בוטל – זה ניגוד, ולכן ״אף ש״. שלוש האפשרויות האחרות הן מילות סיבה (התאמה), כאילו התחזית הנאה גרמה לביטול."},"bank":[{"t":"מילת קישור אחת","lvl":1,"q":"הכביש היה חלק בגלל הגשם, ____ הנהג האט.","pt":null,"table":null,"o":["ובכל זאת","אולם","ולכן","אף שלא"],"a":2,"x":"כביש חלק הוא סיבה טובה להאט – יש כאן התאמה, ולכן ״ולכן״. ״ובכל זאת״ ו״אולם״ יוצרים ניגוד שאינו קיים."},{"t":"ביטויי הפתעה","lvl":2,"q":"____ שהמסעדה נסגרה; במשך שנים כמעט לא נכנסו אליה לקוחות.","pt":null,"table":null,"o":["מפתיע","קשה להבין מדוע","אין פלא","למרבה הפלא"],"a":2,"x":"מסעדה בלי לקוחות צפויה להיסגר, ולכן צריך ביטוי של היעדר הפתעה – ״אין פלא״. שלוש האפשרויות האחרות מבטאות הפתעה, וזה סותר את ההיגיון."},{"t":"השוואה","lvl":2,"q":"____ ספרו הקודם, שזכה לביקורות נלהבות, הרומן החדש של הסופר ____ בעיני המבקרים, ורובם הגדירו אותו כמאכזב.","pt":null,"table":null,"o":["בדומה ל־ / התקבל בהתלהבות","בשונה מ־ / התקבל בצוננות","בדומה ל־ / התקבל בצוננות","בשונה מ־ / זכה לשבחים"],"a":1,"x":"הסוף (״מאכזב״) קובע שהרומן החדש התקבל רע, וזה שונה מהספר הקודם שזכה לביקורות נלהבות – לכן ״בשונה מ־ / התקבל בצוננות״. ״בדומה ל־״ עם קבלה צוננת יוצר סתירה."},{"t":"קשרי מחקר","lvl":3,"q":"הממצאים החדשים ____ את ההשערה כי הדינוזאורים היו בעלי דם חם, ____ נמצא כי קצב גדילתם היה איטי, כמקובל אצל זוחלים בעלי דם קר.","pt":null,"table":null,"o":["מחזקים / שכן","מחלישים / אף ש","מבססים / שהרי","מחלישים / שכן"],"a":3,"x":"גדילה איטית כמו אצל זוחלים בעלי דם קר היא ממצא שסותר את השערת הדם החם – לכן ״מחלישים״, והממצא הוא הנימוק – לכן ״שכן״. ״אף ש״ יוצר ניגוד בין ההחלשה לנימוק שלה."},{"t":"תנאי","lvl":3,"q":"____ הרכבת הייתה מגיעה בזמן, היינו מספיקים להגיע לטקס. ____, היא איחרה בחצי שעה והגענו אחרי שהסתיים.","pt":null,"table":null,"o":["לולא / ואכן","אילו / ואכן","לולא / אלא שבפועל","אילו / אלא שבפועל"],"a":3,"x":"״אילו״ מציג מצב היפותטי שלא קרה (הרכבת לא הגיעה בזמן), ו״אלא שבפועל״ מציג את המציאות שסותרת אותו. ״לולא״ הופך את המשמעות (בלי הגעה בזמן היינו מספיקים – אבסורד), ו״ואכן״ מציג אישור ולא ניגוד."},{"t":"קשרי מחקר","lvl":4,"q":"החוקרת טענה כי שינה מועטה פוגעת בזיכרון. הניסוי שערכה ____ את טענתה: הנבדקים שישנו ארבע שעות בלבד זכרו ____ מילים מאשר אלה שישנו שמונה שעות.","pt":null,"table":null,"o":["החליש / פחות","חיזק / יותר","חיזק / פחות","הפריך / פחות"],"a":2,"x":"אם מי שישן מעט זכר פחות – הממצא מתאים לטענה ולכן ״חיזק / פחות״. ״חיזק / יותר״ סותר: זיכרון טוב יותר אחרי שינה מועטה אינו תומך בטענה. ״החליש״ ו״הפריך״ עם ״פחות״ – ממצא תומך שמוצג כמפריך."},{"t":"שלושה חסרים","lvl":5,"q":"המבקר ____ כי ההצגה ראויה לשבחים, ו____ הופתע כשנודע לו שרוב הצופים ____ ממנה.","pt":null,"table":null,"o":["סבר / לכן / נהנו","לא סבר / לכן / לא נהנו","לא סבר / בכל זאת / נהנו","סבר / לכן / לא נהנו"],"a":3,"x":"המבקר חשב שההצגה טובה, ולכן הופתע לגלות שהצופים לא נהנו – היגיון תקין. ב(1) אין סיבה להפתעה (הם נהנו כמו שציפה). ב(2) הוא חשב שההצגה גרועה – אז אין סיבה שיופתע מכך שלא נהנו. ב(3) ההפתעה צפויה, ולכן ״בכל זאת״ סותר."}]},{"id":"vba-sc-method","title":

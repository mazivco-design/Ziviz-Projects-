 בעלי החיים (סדרה). הפירושים הנפוצים – פקודה, הזמנה וסדר – לא מתאימים ל'שייכת ל־'. זו בדיוק המילה הרב־משמעית שהקורס מזהיר ממנה."},{"t":"refer to","lvl":2,"q":"In paragraph 1, \"they\" (in \"they were sometimes called\") refers to -","pt":"(1) In seventeenth-century London, coffeehouses quickly became centers of public life. For the price of a single cup, a customer could sit for hours, read the latest newspapers, and join conversations with strangers about politics, trade, and science. Because of this, they were sometimes called \"penny universities.\"\n(2) Not everyone welcomed them. King Charles II feared that the coffeehouses encouraged criticism of his government, and in 1675 he ordered them closed. The order caused such a public outcry that it was withdrawn before it ever took effect.\n(3) Some coffeehouses developed close ties to particular trades. Merchants and ship owners gathered at one of them to exchange news about voyages and cargo, and this gathering eventually grew into a major insurance market.","table":null,"o":["customers","newspapers","coffeehouses","strangers"],"a":2,"x":"המשפט מתחיל ב־Because of this, they… – אז חוזרים אחורה, ומבינים מהמשפט הראשון שהנושא הוא בתי הקפה. מה כונה 'אוניברסיטאות בפרוטה'? המקום שבו לומדים ומשוחחים – בתי הקפה. customers, newspapers ו־strangers הם שמות עצם ברבים מאותה פסקה – מסיחים קרובים."},{"t":"refer to – ביטוי","lvl":3,"q":"In paragraph 2, \"The order\" refers to -","pt":"(1) In seventeenth-century London, coffeehouses quickly became centers of public life. For the price of a single cup, a customer could sit for hours, read the latest newspapers, and join conversations with strangers about politics, trade, and science. Because of this, they were sometimes called \"penny universities.\"\n(2) Not everyone welcomed them. King Charles II feared that the coffeehouses encouraged criticism of his government, and in 1675 he ordered them closed. The order caused such a public outcry that it was withdrawn before it ever took effect.\n(3) Some coffeehouses developed close ties to particular trades. Merchants and ship owners gathered at one of them to exchange news about voyages and cargo, and this gathering eventually grew into a major insurance market.","table":null,"o":["the arrangement of tables in a coffeehouse","the king's command to close the coffeehouses","a customer's request for coffee","the public's demand for more newspapers"],"a":1,"x":"המשפט הקודם: he ordered them closed. The order היא הפקודה של המלך לסגור את בתי הקפה. שים לב איך order כאן היא פקודה, ואילו בקטע על הפנדה היא סדרה במיון – לכן תמיד קוראים בהקשר."},{"t":"אוצר מילים","lvl":4,"q":"The word \"withdrawn\" (paragraph 2) is closest in meaning to -","pt":"(1) In seventeenth-century London, coffeehouses quickly became centers of public life. For the price of a single cup, a customer could sit for hours, read the latest newspapers, and join conversations with strangers about politics, trade, and science. Because of this, they were sometimes called \"penny universities.\"\n(2) Not everyone welcomed them. King Charles II feared that the coffeehouses encouraged criticism of his government, and in 1675 he ordered them closed. The order caused such a public outcry that it was withdrawn before it ever took effect.\n(3) Some coffeehouses developed close ties to particular trades. Merchants and ship owners gathered at one of them to exchange news about voyages and cargo, and this gathering eventually grew into a major insurance market.","table":null,"o":["taken out of a bank","canceled","kept secret","removed from a competition"],"a":1,"x":"המשפט: The order caused such a public outcry that it was withdrawn before it ever took effect. פקודה שבוטלה עוד לפני שנכנסה לתוקף = canceled. 'taken out of a bank' (משיכת כסף) ו'removed from a competition' (פרישה מתחרות) הן משמעויות אחרות של withdraw שלא מתאימות לפקודה."},{"t":"refer to – ביטוי","lvl":3,"q":"In paragraph 3, \"this gathering\" refers to -","pt":"(1) In seventeenth-century London, coffeehouses quickly became centers of public life. For the price of a single cup, a customer could sit for hours, read the latest newspapers, and join conversations with strangers about politics, trade, and science. Because of this, they were sometimes called \"penny universities.\"\n(2) Not everyone welcomed them. King Charles II feared that the coffeehouses encouraged criticism of his government, and in 1675 he ordered them closed. The order caused such a public outcry that it was withdrawn before it ever took effect.\n(3) Some coffeehouses developed close ties to particular trades. Merchants and ship owners gathered at one of them to exchange news about voyages and cargo, and this gathering eventually grew into a major insurance market.","table":null,"o":["the insurance market","a group of politicians","the voyages of the ships","the meeting of merchants and ship owners at one coffeehouse"],"a":3,"x":"חוזרים אחורה באותו משפט: Merchants and ship owners gathered at one of them – ההתכנסות של סוחרים ובעלי ספינות. שוק הביטוח מופיע אחרי הביטוי (grew into) – זה מה שההתכנסות הפכה אליו, ולכן הוא לא התשובה. זכור: מחפשים אחורה."},{"t":"מילה רב־משמעית","lvl":5,"q":"In paragraph 3, the word \"ties\" is closest in meaning to -","pt":"(1) In seventeenth-century London, coffeehouses quickly became centers of public life. For the price of a single cup, a customer could sit for hours, read the latest newspapers, and join conversations with strangers about politics, trade, and science. Because of this, they were sometimes called \"penny universities.\"\n(2) Not everyone welcomed them. King Charles II feared that the coffeehouses encouraged criticism of his government, and in 1675 he ordered them closed. The order caused such a public outcry that it was withdrawn before it ever took effect.\n(3) Some coffeehouses developed close ties to particular trades. Merchants and ship owners gathered at one of them to exchange news about voyages and cargo, and this gathering eventually grew into a major insurance market.","table":null,"o":["pieces of cloth worn around the neck","connections","games that end with an equal score","debts"],"a":1,"x":"המשפט: Some coffeehouses developed close ties to particular trades. 'קשרים הדוקים לענפי מסחר מסוימים' = connections. עניבות ותיקו (שוויון במשחק) הם הפירושים המוכרים של tie – מלכודות. debts לא מתאים ל־developed close… to."}]},{"id":"enb-vocab","title":"מילים מבלבלות, פעלים מורכבים וביטויים","tag":"אוצר מילים","en":true,"source":"ספר יסודות אנגלית, פרקים: מילים מבלבלות, פעלים מורכבים, ביטויים (עמ' 17-42); רשימת המילים של הקורס","rule":["הקורס פותח באוצר מילים בסיסי, כי בלי מילים אין הבנה. קבוצה ראשונה: <b>מילים מבלבלות<\/b> – זוגות שנכתבים או נשמעים דומה אבל משמעותם שונה: accept/except/expect, lend/borrow, lose/loose, quiet/quite, whether/weather, than/then. כשמופיעה אחת מהן, קרא את כל המשפט ובדוק איזו מילה מתאימה גם בתחביר וגם במשמעות.","<b>פועל מורכב (Phrasal Verb)<\/b> הוא פועל + מילת יחס שיוצרים יחד משמעות חדשה. run out הוא לא \"לרוץ החוצה\" אלא \"להיגמר\"; call off = לבטל; carry out = לבצע; account for = להסביר / להוות חלק. אל תתרגם מילה-מילה – התייחס לצירוף כיחידה אחת.","<b>ביטויים (Idioms)<\/b> הם צירופים קבועים שמשמעותם אינה סכום המילים: on the other hand = מצד שני, by no means = בשום אופן, as opposed to = בניגוד ל־. את כל אלה לומדים בשינון – הקורס מצרף רשימת מילים מחולקת ליחידות ולנושאים (למשל מילות זמן), ומומלץ לשנן כל מילה יחד עם משפט דוגמה קצר."],"f":["lend = להשאיל למישהו · borrow = לשאול ממישהו","by all means = בוודאי ↔ by no means = בשום אופן","run out (of) = להיגמר · call off = לבטל · carry out = לבצע","account for = להסביר / להוות (חלק מ־)"],"traps":["לתרגם פועל מורכב מילה-מילה (look for הוא \"לחפש\", לא \"להסתכל בשביל\").","לבלבל בין by all means (בהחלט) ל־by no means (בכלל לא) – הם הפוכים לגמרי.","lend/borrow: מי נותן ומי מקבל? I borrow from you, you lend to me.","it's (= it is) מול its (שלו/שלה של חפץ), whose מול who's."],"ex":{"q":"The outdoor concert was ______ because of the storm, and the tickets were refunded.\n(1) carried out  (2) called off  (3) counted on  (4) looked for","pt":null,"steps":["מבינים את ההקשר: הייתה סערה והכסף על הכרטיסים הוחזר – כלומר הקונצרט <b>לא התקיים<\/b>.","מתרגמים כל צירוף כיחידה: carried out = בוצע, called off = בוטל, counted on = סמכו עליו, looked for = חיפשו.","רק \"בוטל\" מתאים להחזר כספי. <b>תשובה (2) called off<\/b>. שים לב: carried out נשמע \"יצא החוצה\" – מלכודת של תרגום מילולי."]},"g":{"q":"Could you ______ me your charger for an hour? Mine is broken.","pt":null,"o":["borrow","lend","owe","rent from"],"a":1,"g":["מי נותן את המטען ומי מקבל אותו? הדובר מבקש שהשני ייתן לו.","איזה פועל פירושו \"להשאיל למישהו\"?"],"x":"lend = להשאיל למישהו אחר – בדיוק מה שהדובר מבקש (\"תשאיל לי\"). borrow הוא הצד השני (\"לשאול ממישהו\"), ולכן Could you borrow me הוא שגוי. owe = להיות חייב."},"solo":{"q":"Before leaving the house, Noa couldn't remember ______ she had locked the back door.","pt":null,"o":["weather","wear","whether","were"],"a":2,"x":"whether = האם – Noa לא זכרה <b>האם<\/b> נעלה את הדלת. weather (מזג אוויר) נשמע דומה אבל הוא שם עצם; wear (ללבוש) ו־were (היו) נשמעים דומה אבל לא מתאימים למשמעות."},"bank":[{"t":"מילים מבלבלות","lvl":1,"q":"Please be ______ in the library; people are trying to study.","pt":null,"table":null,"o":["quite","quit","quiet","quilt"],"a":2,"x":"quiet = שקט. quite (די, למדי) ו־quit (להפסיק/להתפטר) נראות דומה אבל אינן מתאימות כאן."},{"t":"מילים מבלבלות","lvl":1,"q":"Everyone ______ Jonathan came to the meeting; he was sick at home.","pt":null,"table":null,"o":["except","accept","expect","excess"],"a":0,"x":"except = חוץ מ־. כולם הגיעו חוץ מג'ונתן, שהיה חולה. accept = לקבל, expect = לצפות – מלכודת של צליל דומה."},{"t":"פעלים מורכבים","lvl":2,"q":"We had to stop at a gas station because the car was running ______ of fuel.","pt":null,"table":null,"o":["off","into","out","over"],"a":2,"x":"run out of = להיגמר (משהו). הדלק עמד להיגמר, ולכן עצרו בתחנה. run into = להיתקל, run over = לדרוס."},{"t":"פעלים מורכבים","lvl":2,"q":"The research team spent two years ______ the experiment in the desert.","pt":null,"table":null,"o":["carrying out","calling off","breaking into","blowing up"],"a":0,"x":"carry out = לבצע. הצוות ביצע את הניסוי במשך שנתיים. calling off (ביטול) לא נמשך שנתיים, ו־breaking into (פריצה) / blowing up (פיצוץ) לא מתאימים להקשר."},{"t":"פעלים מורכבים","lvl":3,"q":"The new tax ______ only a small part of the city's income; most of the money still comes from tourism.","pt":null,"table":null,"o":["looks for","counts on","accounts for","breaks down"],"a":2,"x":"account for = להוות (חלק מ־). המס החדש מהווה רק חלק קטן מההכנסה. counts on (סומך על) נשמע הגיוני אם מתרגמים מהר, אבל מס לא \"סומך\" על הכנסה."},{"t":"ביטויים","lvl":3,"q":"The plan was ______ perfect, but it was the best one we had.","pt":null,"table":null,"o":["as a matter of fact","by no means","by all means","as well as"],"a":1,"x":"by no means = בשום אופן לא. \"התוכנית <b>בכלל לא<\/b> הייתה מושלמת, <b>אבל<\/b> היא הייתה הטובה ביותר\" – ה־but מחייב ניגוד. by all means (בהחלט) הוא בדיוק ההפך ולא יוצר ניגוד."},{"t":"ביטויים","lvl":4,"q":"______ his brother, who loves crowds and parties, Daniel prefers to spend his weekends alone.","pt":null,"table":null,"o":["As opposed to","As soon as","As long as","As well as"],"a":0,"x":"as opposed to = בניגוד ל־. האח אוהב המונים, דניאל מעדיף להיות לבד – ניגוד. as well as (כמו גם) מצביע על דמיון, ושתי האחרות הן מילות זמן/תנאי."},{"t":"פעלים מורכבים","lvl":5,"q":"While cleaning the attic, Maya ______ a box of letters that her grandfather had written decades earlier.","pt":null,"table":null,"o":["came back","carried on","called for","came across"],"a":3,"x":"come across = למצוא במקרה. מאיה מצאה במקרה קופסת מכתבים. came back = חזרה, carried on = המשיכה, called for = דרשה – אף אחד מהם לא מקבל \"קופסה\" כמושא בהקשר הזה."}]},{"id":"enb-connectors","title":"מילות קישור: מה היחס בין חלקי המשפט","tag":"קשרים לוגיים","en":true,"source":"ספר יסודות אנגלית, פרק מילות קישור – Conjunctions (עמ' 43-50)","rule":["מילת קישור מראה מה <b>היחס<\/b> בין שני חלקי משפט. הקורס מחלק אותן לחמישה סוגים: <b>ניגוד<\/b> (but, however, although, despite, whereas, yet, nevertheless), <b>הוספה<\/b> (and, also, moreover, furthermore, in addition), <b>סיבה<\/b> (because, since, as, due to, thanks to), <b>תוצאה/מסקנה<\/b> (so, therefore, thus, hence, consequently) ו<b>זמן<\/b> (before, after, while, until, as soon as).","השיטה: לפני שמסתכלים על התשובות, קובעים מה הקשר בין שני החלקים – האם הם תומכים זה בזה, סותרים, או שאחד גורם לשני? רק אחר כך בוחרים מילה מהקבוצה המתאימה.","כדאי להכיר גם: unless = if not (אלא אם כן), both…and (גם…וגם), either…or (או…או), neither…nor (לא…ולא), A rather than B (א' ולא ב'). ובדיקה דקדוקית אחרונה: although/because באות לפני <b>משפט<\/b> (עם פועל), ואילו despite/due to/because of באות לפני <b>שם עצם<\/b>."],"f":["although / even though + משפט ↔ despite / in spite of + שם עצם","because / since / as + משפט ↔ because of / due to / owing to + שם עצם","unless = if not","so / therefore / thus / hence / consequently = תוצאה"],"traps":["since יכולה להיות גם \"מאז\" (זמן) וגם \"מפני ש־\" (סיבה); while יכולה להיות \"בזמן ש־\" או \"בעוד ש־\" (ניגוד).","despite of – שגוי. אומרים despite או in spite of.","unless כבר כוללת שלילה: unless you don't… יוצר שלילה כפולה ובדרך כלל הופך את המשמעות.","לבלבל בין סיבה לתוצאה: because מציגה את הסיבה, therefore מציגה את התוצאה."],"ex":{"q":"______ the tickets were expensive, the hall was completely full.\n(1) Because  (2) Although  (3) Therefore  (4) Due to","pt":null,"steps":["קובעים את היחס: כרטיסים יקרים בדרך כלל מרחיקים קהל, ובכל זאת האולם היה מלא – זה <b>ניגוד<\/b>.","מסננים: Because (סיבה) ו־Therefore (תוצאה) לא מבטאות ניגוד. נשארת Although.","בדיקה דקדוקית: אחרי החסר יש משפט עם פועל (the tickets <b>were<\/b> expensive), ולכן Although מתאימה (Due to הייתה דורשת שם עצם). <b>תשובה (2)<\/b>."]},"g":{"q":"The roads were covered with ice, ______ many schools stayed closed.","pt":null,"o":["so","but","although","unless"],"a":0,"g":["האם הכביש הקפוא הוא סיבה לסגירת בתי הספר, או משהו שסותר אותה?","חפש מילה שמציגה את החלק השני כ<b>תוצאה<\/b> של הראשון."],"x":"הקרח גרם לסגירת בתי הספר – יחס של סיבה ותוצאה, ו־so מציגה את התוצאה. but ו־although מבטאות ניגוד, ו־unless (אלא אם כן) היא תנאי."},"solo":{"q":"You will not be allowed to board the plane ______ you show a valid passport.","pt":null,"o":["if","whereas","since","unless"],"a":3,"x":"unless = אלא אם כן: לא תעלה למטוס <b>אלא אם<\/b> תציג דרכון. עם if המשפט אומר \"לא תעלה אם תציג דרכון\" – בדיוק ההפך מההיגיון."},"bank":[{"t":"ניגוד","lvl":1,"q":"Tom studied hard for the final exam; ______, he did not pass it.","pt":null,"table":null,"o":["therefore","however","moreover","because"],"a":1,"x":"למד קשה אבל לא עבר – ניגוד, ולכן however. therefore (תוצאה) ו־moreover (הוספה) לא מתאימות, ו־because לא יכולה לבוא אחרי נקודה-פסיק ולפני פסיק כך."},{"t":"סיבה","lvl":2,"q":"The football match was postponed ______ the heavy snow.","pt":null,"table":null,"o":["although","because","due to","whereas"],"a":2,"x":"השלג הוא הסיבה לדחייה, ואחרי החסר בא שם עצם (the heavy snow) – לכן due to. because בלי of דורשת משפט עם פועל, ולכן היא שגויה כאן."},{"t":"תנאי","lvl":2,"q":"The museum will stay open late ______ the renovation work does not disturb the visitors.","pt":null,"table":null,"o":["as long as","unless","even though","whereas"],"a":0,"x":"as long as = כל עוד. המוזיאון יישאר פתוח <b>כל עוד<\/b> העבודות לא מפריעות. unless יוצרת שלילה כפולה (\"אלא אם לא יפריעו\") שמשמעותה הפוכה."},{"t":"ניגוד","lvl":3,"q":"______ the medicine is expensive, many patients keep buying it because no cheaper option exists.","pt":null,"table":null,"o":["Since","Unless","Therefore","Although"],"a":3,"x":"יקר – ובכל זאת קונים: ניגוד, ולכן Although. Since (מפני ש־) הייתה הופכת את המחיר הגבוה לסיבה לקנייה – לא הגיוני."},{"t":"ניגוד","lvl":3,"q":"Some birds fly thousands of miles south every winter, ______ others stay in the same area all their lives.","pt":null,"table":null,"o":["therefore","whereas","because","as soon as"],"a":1,"x":"שני סוגי ציפורים שמתנהגים הפוך – ניגוד בין שני נושאים, ולכן whereas (בעוד ש־)."},{"t":"ניגוד","lvl":3,"q":"______ having very little formal training, the young architect designed one of the city's most admired buildings.","pt":null,"table":null,"o":["Even though","Because of","Despite","Unless"],"a":2,"x":"מעט הכשרה ובכל זאת הצלחה – ניגוד. אחרי החסר בא צירוף שמני (having…), ולכן Despite. Even though דורשת משפט עם נושא ופועל, ו־Because of הופכת את חוסר ההכשרה לסיבה להצלחה."},{"t":"לא…ולא","lvl":4,"q":"Neither the manager ______ his assistant had been told about the change in the schedule.","pt":null,"table":null,"o":["nor","or","and","but"],"a":0,"x":"הצמד הקבוע הוא neither…nor (לא…ולא). either הולכת עם or, ו־both עם and."},{"t":"ניגוד","lvl":5,"q":"For decades the theory was accepted by almost every scientist in the field; only recently, ______, have researchers begun to question its basic assumptions.","pt":null,"table":null,"o":["therefore","moreover","likewise","however"],"a":3,"x":"החלק הראשון: כולם קיבלו את התאוריה. החלק השני: לאחרונה מטילים בה ספק – ניגוד, ולכן however. therefore היה מציג את הספק כתוצאה של הקבלה, ו־moreover/likewise מצביעות על המשך באותו כיוון."}]},{"id":"enb-word-forms","title":"חלקי דיבר וסיומות: איזו צורה חסרה?","tag":"בניית מילים","en":true,"source":"ספר יסודות אנגלית, פרק חלקי דיבר – Parts of Speech (עמ' 53-64); טבלת סיומות (Suffix)","rule":["לכל מילה במשפט יש תפקיד: <b>שם עצם<\/b> (noun), <b>שם תואר<\/b> (adjective), <b>פועל<\/b> (verb), <b>תואר הפועל<\/b> (adverb) ועוד. הקורס מלמד לזהות את חלק הדיבר לפי <b>הסיומת<\/b> – גם כשלא מכירים את המילה עצמה.","סיומות נפוצות: שם עצם – tion, sion, ance, ence, ment, ness, ity, ship, hood, ism, ist, er/or. שם תואר – ful, less, ous, ive, able/ible, ic, al, ish. פועל – ize, ify, ate, en. תואר הפועל – ly.","השיטה: מסתכלים על <b>המיקום<\/b> של החסר. אחרי a/the או שם תואר → שם עצם. לפני שם עצם או אחרי is/seems → שם תואר. אחרי הנושא (או אחרי to/will) → פועל. כשמתארים פועל או שם תואר → תואר הפועל (ly)."],"f":["the / a + ___ → noun","___ + noun, או is/seems + ___ → adjective","subject / to / will + ___ → verb","verb + ___ (איך?) → adverb (-ly)"],"traps":["friendly, lovely, costly הן <b>שמות תואר<\/b> למרות הסיומת ly.","less בסוף מילה = בלי (fearless = ללא פחד), לא \"פחות\".","לבחור מילה שמשמעותה נכונה אבל חלק הדיבר שלה שגוי (efficiency במקום efficient).","ful = מלא ב־, ולכן helpful = מועיל, לא \"מלא עזרה\" במובן מילולי."],"ex":{"q":"The committee praised the ______ of the new design.\n(1) original  (2) originally  (3) originality  (4) originate","pt":null,"steps":["המיקום: אחרי the ולפני of – המקום של <b>שם עצם<\/b>.","לפי הסיומות: original – שם תואר, originally – תואר הפועל (ly), originate – פועל (ate), originality – שם עצם (ity).","<b>תשובה (3) originality<\/b> (מקוריות). שים לב: לא היה צורך לדעת את פירוש המילה – הסיומת הספיקה."]},"g":{"q":"The nurse spoke ______ to the frightened child.","pt":null,"o":["gentle","gentleness","gently","gentler"],"a":2,"g":["איזו מילה מתארת <b>איך<\/b> האחות דיברה?","מילה שמתארת פועל מסתיימת בדרך כלל ב־ly."],"x":"החסר מתאר את הפועל spoke (איך דיברה?), ולכן צריך תואר הפועל: gently (בעדינות). gentle ו־gentler הם שמות תואר, ו־gentleness הוא שם עצם."},"solo":{"q":"Thanks to her ______ attitude, the team stayed calm during the crisis.","pt":null,"o":["optimism","optimistic","optimist","optimistically"],"a":1,"x":"החסר בא לפני שם העצם attitude ומתאר אותו – צריך שם תואר: optimistic (ic). optimism ו־optimist הם שמות עצם, optimistically הוא תואר הפועל."},"bank":[{"t":"זיהוי חלק דיבר","lvl":1,"q":"The ______ of the new bridge took almost three years.","pt":null,"table":null,"o":["construct","constructive","constructively","construction"],"a":3,"x":"אחרי The צריך שם עצם – construction (סיומת tion). construct הוא פועל, constructive שם תואר, constructively תואר הפועל."},{"t":"זיהוי חלק דיבר","lvl":2,"q":"The new law aims to ______ the tax forms so that anyone can fill them out.","pt":null,"table":null,"o":["simplify","simple","simplicity","simply"],"a":0,"x":"אחרי to צריך פועל – simplify (סיומת ify = להפוך ל־). simple שם תואר, simplicity שם עצם, simply תואר הפועל."},{"t":"משמעות סיומת","lvl":2,"q":"A person who is described as \"fearless\" is ______.","pt":null,"table":null,"o":["full of fear","without fear","afraid of others","causing fear in others"],"a":1,"x":"less = בלי, ללא. fearless = חסר פחד. full of fear מתאים ל־fearful – המלכודת היא לחשוב ש־less פירושה \"פחות\" או להתבלבל עם ful."},{"t":"זיהוי חלק דיבר","lvl":3,"q":"Despite its small size, the new battery is remarkably ______.","pt":null,"table":null,"o":["efficiency","efficiently","efficient","efficiencies"],"a":2,"x":"is remarkably ___: אחרי is (ותואר הפועל remarkably) צריך שם תואר – efficient. efficiency ו־efficiencies הם שמות עצם, ו־efficiently מתאר פעולה ולא את הסוללה."},{"t":"זיהוי חלק דיבר","lvl":3,"q":"The village is famous for the ______ of its people, who welcome every visitor with food and music.","pt":null,"table":null,"o":["generous","generously","generate","generosity"],"a":3,"x":"אחרי the ולפני of צריך שם עצם – generosity (ity). generous שם תואר, generously תואר הפועל, ו־generate הוא פועל אחר לגמרי (לייצר) – מלכודת של דמיון צליל."},{"t":"משמעות סיומת","lvl":3,"q":"Which word describes something that can be easily broken?","pt":null,"table":null,"o":["breakage","breakable","breakthrough","breaker"],"a":1,"x":"able = שאפשר לעשות לו (בר־). breakable = שביר. breakage = שבירה (שם עצם), breakthrough = פריצת דרך, breaker = משהו ששובר."},{"t":"זיהוי חלק דיבר","lvl":4,"q":"The professor's explanation was so ______ that even first-year students followed it easily.","pt":null,"table":null,"o":["comprehensible","comprehension","comprehend","comprehensively"],"a":0,"x":"was so ___ – אחרי so ופועל be צריך שם תואר: comprehensible (ible = שאפשר להבין). comprehension הוא שם עצם (הבנה), comprehend פועל, comprehensively תואר הפועל."},{"t":"משמעות סיומת","lvl":5,"q":"The word \"irreplaceable\" most nearly means ______.","pt":null,"table":null,"o":["easy to replace","replaced again and again","impossible to replace","not yet replaced"],"a":2,"x":"מפרקים: ir (לא) + replace (להחליף) + able (שאפשר). \"שאי אפשר להחליף\" – כלומר יקר ערך וייחודי. replaced again מבוסס על בלבול עם re (שוב), שכבר נמצאת בתוך replace."}]},{"id":"enb-prefixes","title":"תחיליות ושורשים: פענוח מילה לא מוכרת","tag":"בניית מילים","en":true,"source":"טבלת תחיליות וסיומות (Prefix / Suffix) של הקורס, 10 עמ'","rule":["לתחיליות רבות באנגלית יש משמעות קבועה, וזה מאפשר לנחש את פירושה של מילה שלא פגשת. מפרקים את המילה ל<b>תחילית + שורש + סיומת<\/b> ומרכיבים את המשמעות.","תחיליות שלילה/היפוך: un, in, im (לפני m/p), il (לפני l), ir (לפני r), dis, non, a, de. טעות/רע: mis, mal. זמן: pre, ante, fore (לפני), post (אחרי). מספר: mono (1), bi (2), tri (3), semi (חצי), multi/poly (הרבה). מקום ותנועה: sub/under (מתחת), super/over (מעל, יתר), inter (בין), trans (מעבר ל־), ex (החוצה). יחד: co, com, con, syn, sym. נגד: anti, counter. שוב: re. טוב: bene.","שורשים שימושיים: bio (חיים), auto (עצמי), chron (זמן), graph (כתיבה), phon (קול), scope (הסתכלות), meter (מדידה), port (נשיאה), dict (אמירה)."],"f":["un / in / im / il / ir / dis / non = לא, ההפך","pre / ante / fore = לפני · post = אחרי · re = שוב","mono 1 · bi 2 · tri 3 · semi ½ · multi / poly = הרבה","chron = זמן · bio = חיים · auto = עצמי · meter = מדידה"],"traps":["in לא תמיד שלילה: invaluable = יקר מפז (לא \"חסר ערך\"!), intense = עז.","לא כל re היא \"שוב\": research, report, remain – ה־re היא חלק מהמילה.","התחילית נותנת כיוון, לא תרגום מדויק – תמיד בדוק שהמשמעות מתאימה להקשר המשפט.","לבלבל בין hyper (יתר) ל־hypo (תת): hypothermia = חום גוף נמוך."],"ex":{"q":"The word \"predetermined\" most nearly means:\n(1) decided in advance  (2) decided again  (3) not decided  (4) decided wrongly","pt":null,"steps":["מפרקים: pre + determine + d. determine = לקבוע / להחליט.","pre = לפני, ולכן predetermined = שנקבע <b>מראש<\/b>.","בודקים את המסיחים: again מתאים ל־re, not ל־un/in, wrongly ל־mis. <b>תשובה (1)<\/b>."]},"g":{"q":"A \"bilingual\" child ______.","pt":null,"o":["speaks two languages","speaks no languages","learns languages slowly","speaks only one language"],"a":0,"g":["מה פירוש התחילית bi? חשוב על bicycle.","lingu קשור לשפה (כמו linguistics)."],"x":"bi = שניים, lingu = שפה. ילד דו־לשוני מדבר שתי שפות. monolingual היה מתאים לשפה אחת."},"solo":{"q":"Because the old map was ______, the hikers took the wrong trail and got lost.","pt":null,"o":["accurate","accuracy","accurately","inaccurate"],"a":3,"x":"המטיילים הלכו לאיבוד בגלל המפה – לכן היא הייתה <b>לא<\/b> מדויקת: inaccurate (in = לא). accurate הוא ההפך מההיגיון, ו־accuracy/accurately הם חלקי דיבר שגויים אחרי was."},"bank":[{"t":"תחילית זמן/חזרה","lvl":1,"q":"If you \"reheat\" your soup, you ______.","pt":null,"table":null,"o":["heat it too much","stop heating it","heat it again","heat it in advance"],"a":2,"x":"re = שוב. reheat = לחמם מחדש. \"מראש\" מתאים ל־pre, ו\"יותר מדי\" ל־over."},{"t":"תחילית זמן/חזרה","lvl":2,"q":"\"Postwar\" buildings were built ______.","pt":null,"table":null,"o":["before the war","after the war","during the war","instead of the war"],"a":1,"x":"post = אחרי (כמו P.M. = post meridiem, אחרי הצהריים). לפני היה מתאים ל־pre (prewar)."},{"t":"תחילית נגד/יחד","lvl":2,"q":"An \"antiviral\" medicine is used to ______.","pt":null,"table":null,"o":["spread viruses","study viruses","grow viruses","fight viruses"],"a":3,"x":"anti = נגד. תרופה אנטי־ויראלית נלחמת בנגיפים, כמו antibiotic נגד חיידקים."},{"t":"מלכודת in","lvl":3,"q":"The label warned that the liquid was highly ______, so it had to be stored far away from any open flame.","pt":null,"table":null,"o":["fireproof","inflammable","nonflammable","harmless"],"a":1,"x":"צריך לאחסן רחוק מאש – כלומר הנוזל <b>דליק<\/b>: inflammable. כאן in לא שוללת (inflame = להצית), ולכן inflammable = flammable. nonflammable (לא דליק) ו־fireproof (חסין אש) הם ההפך, ו־harmless (לא מזיק) לא מסביר למה להרחיק מאש."},{"t":"תחילית שלילה","lvl":3,"q":"Because the witness's story was ______ with the evidence, the police began to doubt it.","pt":null,"table":null,"o":["consistent","coexistent","inconsistent","predictable"],"a":2,"x":"המשטרה החלה לפקפק – כלומר העדות <b>לא<\/b> התאימה לראיות: inconsistent (in = לא). consistent היא ההפך, וזו המלכודת למי שלא שם לב לתחילית."},{"t":"שורש","lvl":4,"q":"A \"chronometer\" is most likely an instrument for ______.","pt":null,"table":null,"o":["measuring heat","measuring time","recording sound","viewing tiny objects"],"a":1,"x":"chron = זמן (כמו chronological), meter = מדידה. כרונומטר מודד זמן. heat מתאים ל־thermo, sound ל־phon, ו־tiny objects ל־micro + scope."},{"t":"שורש ותחילית","lvl":4,"q":"A \"semiannual\" report is published ______.","pt":null,"table":null,"o":["twice a year","once every two years","every month","once a year"],"a":0,"x":"semi = חצי, annual = שנתי. \"חצי־שנתי\" = כל חצי שנה, כלומר פעמיים בשנה. \"פעם בשנתיים\" נקרא biennial – מלכודת של בלבול עם bi."},{"t":"שורש ותחילית","lvl":5,"q":"A \"misnomer\" is ______.","pt":null,"table":null,"o":["a name given at birth","a person without a name","a name shared by many people","a wrong or misleading name"],"a":3,"x":"mis = בטעות, nom = שם (כמו nominate, nominal). misnomer = שם מוטעה או מטעה, למשל כינוי שאינו מתאר נכון את הדבר."}]},{"id":"enb-sentence-core","title":"ליבת המשפט וביטויים תיאוריים","tag":"מבנה משפט","en":true,"source":"ספר יסודות אנגלית, פרקים: מבנה משפט (עמ' 75-88), סדר המילים במשפט (עמ' 89-92), ביטויים תיאוריים (עמ' 111-114)","rule":["כל משפט באנגלית בנוי מ<b>נושא<\/b> (subject) ו<b>פועל<\/b> (verb), ולרוב גם <b>מושא<\/b> (object). זו ליבת המשפט. במשפט ארוך, הקורס ממליץ למצוא קודם את הליבה ולדלג על ההרחבות שבין פסיקים (who…, which…, a 24-year-old…) – כך מבינים מי עשה מה.","הנושא הוא מה שבא לפני הפועל, <b>חוץ ממה שמופרד בפסיק<\/b> (In 2008, John met Jane – הנושא הוא John). בניגוד לעברית, בכל משפט באנגלית חייב להיות פועל (John is tall), ופועל יכול להיות כמה מילים (has been trying). בנוסף, שם התואר בא <b>לפני<\/b> שם העצם: a new red car.","<b>ביטוי תיאורי פותח<\/b> (introductory modifier) – מבנה שלא קיים בעברית: המשפט נפתח בצירוף שמתחיל ב־ing או ב־V3, ואחריו פסיק. הביטוי מתאר תמיד את <b>מה שבא מיד אחרי הפסיק<\/b>. כדי לתרגם: מתחילים מהנושא שאחרי הפסיק, מוסיפים \"ש־/אשר\", מתרגמים את הביטוי ואז את שאר המשפט."],"f":["נושא + פועל (+ מושא) = ליבת המשפט","V-ing / V3 ..., NOUN ... → הביטוי מתאר את NOUN","adjective + noun (a big black dog)"],"traps":["להתאים את הפועל לשם העצם הקרוב במקום לנושא האמיתי (The box of books <b>is<\/b>…).","לחשוב שתיאור זמן/מקום בתחילת המשפט הוא הנושא.","ביטוי תיאורי שמתאר את הדבר הלא נכון: \"Running to the bus, the bag fell\" – התיק לא רץ.","להניח שמשפט \"בלי פועל\" כמו בעברית תקין באנגלית."],"ex":{"q":"Built in only eighteen months, ______.\n(1) the workers finished the stadium early  (2) the stadium opened ahead of schedule  (3) the city spent very little money  (4) the city's planners were proud","pt":null,"steps":["המשפט נפתח בביטוי תיאורי עם V3 (Built) ופסיק – ולכן מה שבא אחרי הפסיק חייב להיות <b>הדבר שנבנה<\/b>.","מה נבנה? רק האצטדיון. העובדים, העירייה והמתכננים לא \"נבנו בשמונה־עשר חודשים\".","<b>תשובה (2)<\/b>: \"האצטדיון, אשר נבנה בשמונה־עשר חודשים בלבד, נפתח לפני המועד\"."]},"g":{"q":"Last summer, after a long and difficult drought, the farmers in the valley finally received help from the government.\nWhat is the subject of this sentence?","pt":null,"o":["Last summer","a long and difficult drought","the farmers","the government"],"a":2,"g":["דלג על מה שמופרד בפסיקים בתחילת המשפט – אלה תיאורי זמן.","מי <b>קיבל<\/b> (received)? מה שבא ממש לפני הפועל."],"x":"Last summer ו־after a long… drought הם תיאורי זמן המופרדים בפסיקים. מי שביצע את הפעולה received הוא the farmers – זה הנושא. the government הוא חלק מההמשך שאחרי הפועל."},"solo":{"q":"The old bridge, which was built more than a century ago and still carries heavy traffic every day, ______ urgent repairs.","pt":null,"o":["need","needs","needing","to need"],"a":1,"x":"מדלגים על ההרחבה שבין הפסיקים ומקבלים את הליבה: The old bridge ___ urgent repairs. הנושא יחיד (bridge), ולכן needs. need היא המלכודת – היא מתאימה ל־days או ל־repairs, שאינם הנושא. needing ו־to need אינם פועל עיקרי."},"bank":[{"t":"סדר מילים","lvl":1,"q":"Choose the correct sentence.","pt":null,"table":null,"o":["Dana bought a new red bicycle.","Dana bought a bicycle new red.","Dana bought a red bicycle new.","Dana bought bicycle a new red."],"a":0,"x":"באנגלית שמות התואר באים לפני שם העצם: a new red bicycle. בעברית סדר הפוך (אופניים חדשים אדומים), וזו בדיוק המלכודת."},{"t":"פועל חובה","lvl":2,"q":"In 1969, after years of preparation, two astronauts ______ on the Moon for the first time.","pt":null,"table":null,"o":["landing","landed","having landed","to land"],"a":1,"x":"המשפט צריך פועל עיקרי בעבר (1969). landing, having landed ו־to land אינם יכולים לשמש פועל עיקרי לבדם – בלעדיהם אין למשפט פועל."},{"t":"התאמת נושא-פועל","lvl":3,"q":"The number of students who applied to the program this year ______ higher than ever before.","pt":null,"table":null,"o":["were","have been","being","was"],"a":3,"x":"הנושא הוא The number (יחיד), לא students. לכן was. were ו־have been מתאימים לרבים – מלכודת של שם העצם הקרוב."},{"t":"ביטוי תיאורי","lvl":3,"q":"______, the novel became a bestseller within a few weeks.","pt":null,"table":null,"o":["Written in only three months","Writing in only three months","The author wrote it in three months","Having written it in three months"],"a":0,"x":"מה שאחרי הפסיק (the novel) צריך להיות מה שהביטוי מתאר. הרומן <b>נכתב<\/b> (V3: Written). Writing / Having written היו אומרים שהרומן כתב, ו־The author wrote it… יוצר שני משפטים שלמים המחוברים רק בפסיק – שגוי."},{"t":"ביטוי תיאורי","lvl":3,"q":"Hoping to save money, ______.","pt":null,"table":null,"o":["the trip was planned carefully","careful planning was needed","Mark planned the trip carefully","the cost of the trip was reduced"],"a":2,"x":"מי קיווה לחסוך כסף? רק אדם. לכן אחרי הפסיק חייב לבוא Mark. הטיול, התכנון והעלות לא \"מקווים\"."},{"t":"ליבת המשפט","lvl":4,"q":"The museum's new director, a former teacher who spent twenty years working with children, has turned the quiet gallery into a lively learning center.\nAccording to the sentence, who changed the gallery?","pt":null,"table":null,"o":["a group of former teachers","the museum's new director","the children","twenty volunteers"],"a":1,"x":"ליבת המשפט: The museum's new director … has turned the gallery into… . ההרחבה שבין הפסיקים (a former teacher who…) רק מתארת את המנהל. הילדים מוזכרים בהרחבה ואינם הנושא."},{"t":"ביטוי תיאורי","lvl":5,"q":"Discovered by accident in a London laboratory in 1928, ______.","pt":null,"table":null,"o":["Alexander Fleming became famous","scientists quickly began to study penicillin","the history of medicine was changed","penicillin went on to change the history of medicine"],"a":3,"x":"הביטוי Discovered… מתאר את מה שבא אחרי הפסיק – וזה חייב להיות הדבר שהתגלה: הפניצילין. פלמינג, המדענים וההיסטוריה של הרפואה לא \"התגלו במקרה במעבדה\"."}]},{"id":"enb-negation","title":"שלילה: איפה ה\"לא\" מסתתר","tag":"דקדוק משמעות","en":true,"source":"ספר יסודות אנגלית, פרק שלילה (עמ' 93-96)","rule":["בעברית השלילה כמעט תמיד צמודה לפועל (\"לא פגש\"). באנגלית מילת השלילה יכולה לשבת ב<b>נושא<\/b> (No one likes John), ב<b>פועל<\/b> (John did not meet Jane) או ב<b>מושא<\/b> (John likes no one). מילות השלילה העיקריות: no, not, none, neither, never, nobody, no one, nothing, nowhere.","השיטה של הקורס: לא משנה היכן השלילה מופיעה באנגלית – בתרגום לעברית מצמידים \"לא/אינו\" לפועל. John likes no one = \"ג'ון לא אוהב אף אחד\". כך לא מפספסים את המשמעות.","בשאלות ניסוח מחדש כדאי להכיר גם צורות שלילה \"עדינות\": hardly / barely / scarcely = כמעט לא; no longer = כבר לא; not un־ (not uncommon) = שתי שלילות שמבטלות זו את זו → די נפוץ."],"f":["No one / Nobody / None / Neither (בנושא) → \"אף אחד לא…\"","hardly / barely / scarcely = כמעט לא","no longer = כבר לא (פעם כן, היום לא)","not + un/in… = חיובי (not unusual = די רגיל)"],"traps":["לפספס שלילה שמופיעה בנושא או במושא ולא ליד הפועל.","hardly אינה \"קשה\" – היא \"כמעט לא\".","שלילה כפולה (not uncommon) נקראת בטעות כשלילה.","neither of the two = אף אחד משניהם (לא \"אחד מהם\")."],"ex":{"q":"\"The restaurant no longer serves breakfast.\" This means that the restaurant:\n(1) has never served breakfast  (2) used to serve breakfast but does not now  (3) will start serving breakfast soon  (4) serves breakfast only on weekends","pt":null,"steps":["מזהים את השלילה: no longer = <b>כבר לא<\/b>.","\"כבר לא\" אומר שני דברים: בעבר זה קרה, והיום זה לא קורה.","(1) סותרת את \"בעבר כן\", (3) ו־(4) מתארות מצב שבו מגישים ארוחת בוקר. <b>תשובה (2)<\/b>."]},"g":{"q":"\"Nobody on the team knew the answer.\" Which sentence means the same?","pt":null,"o":["Only one team member knew the answer.","All the team members knew the answer.","Some team members knew the answer.","None of the team members knew the answer."],"a":3,"g":["איפה נמצאת השלילה – בנושא, בפועל או במושא?","תרגם עם \"לא\" צמוד לפועל: \"אף אחד בצוות לא…\"."],"x":"Nobody בנושא = \"אף אחד לא ידע\". None of the team members = אף אחד מחברי הצוות – אותה משמעות. שלוש האחרות טוענות שמישהו כן ידע."},"solo":{"q":"\"Neither of the two candidates had the required experience.\" This means that ______.","pt":null,"o":["both candidates lacked the required experience","only one candidate had the required experience","both candidates had the required experience","the second candidate had more experience"],"a":0,"x":"Neither of the two = אף אחד משניהם. שני המועמדים חסרו את הניסיון הנדרש. המלכודת: לקרוא neither כ\"אחד מהם\"."},"bank":[{"t":"שלילה בנושא","lvl":1,"q":"\"No one in the village had ever seen snow before.\" This means that ______.","pt":null,"table":null,"o":["only a few villagers had seen snow","everyone in the village had seen snow","none of the villagers had seen snow before","the villagers saw snow every winter"],"a":2,"x":"No one בנושא + ever = אף אחד מעולם לא. לכן אף אחד מתושבי הכפר לא ראה שלג קודם לכן."},{"t":"שלילה במושא","lvl":2,"q":"\"After the storm, the hikers found no shelter anywhere.\" This means that the hikers ______.","pt":null,"table":null,"o":["found shelter everywhere","could not find shelter anywhere","found shelter in one place","did not look for shelter"],"a":1,"x":"no shelter במושא = \"שום מחסה\". בתרגום מצמידים \"לא\" לפועל: המטיילים <b>לא<\/b> מצאו מחסה בשום מקום. הם כן חיפשו – לכן האפשרות האחרונה שגויה."},{"t":"שלילה עדינה","lvl":2,"q":"The speaker's voice was so weak that the audience could ______ hear him.","pt":null,"table":null,"o":["easily","clearly","always","hardly"],"a":3,"x":"הקול חלש מאוד, ולכן הקהל <b>כמעט לא<\/b> שמע – hardly. שלוש האחרות אומרות שהשמיעה הייתה טובה, וזה סותר את \"so weak\"."},{"t":"שלילה כפולה","lvl":3,"q":"\"Side effects from this medicine are not uncommon.\" This means that side effects are ______.","pt":null,"table":null,"o":["fairly common","extremely rare","never reported","always serious"],"a":0,"x":"not + un = שתי שלילות שמבטלות זו את זו: \"לא נדירות\" = די נפוצות. מי שקורא רק את not או רק את uncommon יגיע ל\"נדיר\" – זו המלכודת."},{"t":"שלילה עדינה","lvl":3,"q":"\"Hardly anyone who came to the lecture left before it ended.\" This means that ______.","pt":null,"table":null,"o":["most people left early","almost everyone stayed until the end","nobody came to the lecture","the lecture ended early"],"a":1,"x":"Hardly anyone = כמעט אף אחד. כמעט אף אחד לא יצא לפני הסוף → כמעט כולם נשארו עד הסוף."},{"t":"שלילה בנושא","lvl":4,"q":"\"Not a single member of the committee voted against the proposal.\" Which statement must be true?","pt":null,"table":null,"o":["Exactly one member voted against the proposal.","Every committee member was absent from the vote.","No committee member opposed the proposal in the vote.","Most members voted against the proposal."],"a":2,"x":"Not a single = אף לא אחד. אף חבר ועדה לא הצביע נגד. \"Exactly one\" נובע מקריאה מוטעית של single כ\"אחד\"."},{"t":"שלילה ומשמעות","lvl":5,"q":"\"It is not that the new plan is too expensive; the real problem is that it will take too long.\" According to the speaker, the main weakness of the plan is its ______.","pt":null,"table":null,"o":["high cost","complexity","lack of support","length of time"],"a":3,"x":"המבנה It is not that X; the real problem is Y שולל את X (המחיר) ומציב את Y (הזמן) כבעיה האמיתית. high cost היא בדיוק מה שהדובר <b>שולל<\/b>."}]},{"id":"enb-passive","title":"סביל (Passive): מי עשה למי","tag":"דקדוק משמעות","en":true,"source":"ספר יסודות אנגלית, פרק סביל – Passive (עמ' 97-104)","rule":["במשפט <b>סביל<\/b> הנושא לא מבצע את הפעולה אלא \"סופג\" אותה: The book was written by J. K. Rowling – הספר לא כתב, אלא נכתב. מבצע הפעולה, אם הוא מוזכר, בא אחרי <b>by<\/b>; ולפעמים הוא בכלל לא מוזכר (My car was stolen).","הסימן הבטוח של הקורס: הצירוף <b>be + V3<\/b> – הטיה כלשהי של be (am, is, are, was, were, been, being, be) ואחריה הצורה השלישית של הפועל (eaten, taken, built, sent). כל משפט סביל מכיל אותו, ורק משפט סביל מכיל אותו. שים לב: <b>have + V3<\/b> (I have told) אינו סביל.","המעבר בין פעיל לסביל: מחליפים בין הנושא למושא ומשנים את צורת הפועל – David ate the cake ↔ The cake was eaten by David. הזמן נשמר: is eaten (הווה), was eaten (עבר), is being eaten (הווה ממושך), has been eaten (הווה מושלם), had been eaten (עבר מושלם), will be eaten (עתיד)."],"f":["סביל = be + V3 (+ by מבצע)","has / have / had + V3 בלי been → פעיל","is being V3 = נעשה עכשיו · has been V3 = כבר נעשה"],"traps":["להחשיב have + V3 כסביל (The chef has prepared the meal – פעיל).","להתבלבל מי ביצע את הפעולה: מה שאחרי by הוא המבצע, לא הנושא.","לבחור צורה פעילה כשהנושא לא יכול לבצע את הפעולה (The letters sent… במקום were sent).","להתעלם מהזמן: was being built (באמצע בנייה) שונה מ־had been built (כבר הסתיים)."],"ex":{"q":"Which sentence is passive?\n(1) The guide has shown us the castle.  (2) The castle was shown to us by the guide.  (3) The guide was showing us the castle.  (4) The guide had shown us the castle.","pt":null,"steps":["מחפשים be + V3. ב־(1) וב־(4) יש has/had + shown – זה have + V3, פעיל.","ב־(3) יש was + showing – be + ing, כלומר עבר ממושך פעיל, לא V3.","ב־(2) יש <b>was shown<\/b> = be + V3, והמבצע מופיע אחרי by. <b>תשובה (2)<\/b>."]},"g":{"q":"The invitations ______ to all the guests last Monday.","pt":null,"o":["sent","were sending","have sent","were sent"],"a":3,"g":["האם ההזמנות שלחו משהו, או שמישהו שלח אותן?","הנושא סופג את הפעולה – צריך be + V3 בעבר (last Monday)."],"x":"ההזמנות לא שלחו – הן <b>נשלחו<\/b>. לכן סביל בעבר: were sent. sent ו־have sent הם פעילים (וכאילו ההזמנות שלחו משהו), ו־were sending הוא עבר ממושך פעיל."},"solo":{"q":"A new children's hospital ______ in our city next year.","pt":null,"o":["will build","builds","will be built","has built"],"a":2,"x":"בית החולים לא בונה – הוא <b>ייבנה<\/b>. next year → עתיד, ולכן will be built (be + V3). שלוש האחרות פעילות, כאילו בית החולים הוא הבונה."},"bank":[{"t":"זיהוי סביל","lvl":1,"q":"Which sentence is passive?","pt":null,"table":null,"o":["The boys have broken the window.","The boys broke the window.","The window was broken by a ball.","The boys were breaking the window."],"a":2,"x":"רק ב־was broken יש be + V3. have broken הוא have + V3 (פעיל), ו־were breaking הוא be + ing (פעיל)."},{"t":"השלמת צורה","lvl":2,"q":"It is believed that the castle ______ in the fourteenth century.","pt":null,"table":null,"o":["was built","built","has built","was building"],"a":0,"x":"הטירה לא בנתה – היא <b>נבנתה<\/b>, ובעבר רחוק. לכן was built. was building היה אומר שהטירה בנתה משהו."},{"t":"השלמת צורה","lvl":3,"q":"Many rare manuscripts ______ in the monastery library since the twelfth century.","pt":null,"table":null,"o":["have kept","have been kept","kept","are keeping"],"a":1,"x":"since מחייבת הווה מושלם, וכתבי היד לא שומרים – הם <b>נשמרים<\/b>. לכן have been kept (have been + V3). have kept הוא הווה מושלם פעיל – המלכודת המרכזית."},{"t":"הבנת משמעות","lvl":3,"q":"\"The painting was being restored when the fire broke out.\" This means that ______.","pt":null,"table":null,"o":["the painting was restored after the fire","the restoration had been completed before the fire","the fire was started by the restorers","experts were in the middle of restoring the painting when the fire started"],"a":3,"x":"was being restored = עבר ממושך סביל: השיקום היה <b>בעיצומו<\/b> ברגע שפרצה השריפה. \"הושלם לפני\" היה דורש had been restored."},{"t":"פעיל ↔ סביל","lvl":4,"q":"\"The suspect had been questioned by two detectives before his lawyer arrived.\" Which sentence is closest in meaning?","pt":null,"table":null,"o":["Two detectives had questioned the suspect before his lawyer arrived.","The suspect had questioned two detectives before his lawyer arrived.","The lawyer arrived before the detectives questioned the suspect.","Two detectives were questioned after the lawyer arrived."],"a":0,"x":"הופכים לפעיל: מה שאחרי by (two detectives) הופך לנושא, והחשוד הופך למושא. הזמן נשמר (had been questioned → had questioned), והסדר נשמר: החקירה הייתה <b>לפני<\/b> הגעת העורך דין."},{"t":"פעיל ↔ סביל","lvl":4,"q":"\"Thousands of trees are cut down every year to make room for new farms.\" Which sentence is closest in meaning?","pt":null,"table":null,"o":["Every year, thousands of trees cut down new farms.","Every year, people cut down thousands of trees to clear land for new farms.","Every year, new farms are cut down to make room for trees.","Thousands of trees grow every year on new farms."],"a":1,"x":"are cut down = סביל בהווה: מישהו (לא מוזכר) כורת את העצים. בגרסה הפעילה הנושא הוא people והעצים הם המושא. שתי האפשרויות הראשונות השגויות הופכות את מי שעושה למי."},{"t":"הבנת משמעות","lvl":5,"q":"\"The decision to close the factory was made without consulting the workers.\" Which statement is closest in meaning?","pt":null,"table":null,"o":["The workers decided to close the factory without consulting anyone.","The workers were consulted, but their opinion was ignored.","The workers were not asked for their opinion before it was decided to close the factory.","The factory was closed although no decision had been made."],"a":2,"x":"was made = ההחלטה <b>התקבלה<\/b> (בידי מישהו שלא מוזכר), without consulting the workers = בלי להתייעץ עם העובדים. העובדים לא החליטו (מלכודת של תפקידים הפוכים), וגם לא שאלו אותם בכלל."}]},{"id":"enb-tenses","title":"זמנים ומשפטי תנאי: מה קרה ומה לא","tag":"דקדוק משמעות","en":true,"source":"ספר יסודות אנגלית, טבלת הזמנים בפרק סביל (עמ' 99) – הרחבה לזמנים ולמשפטי תנאי","rule":["כל זמן באנגלית מספר משהו על <b>מתי<\/b> ועל <b>האם הפעולה הסתיימה<\/b>. Simple – עובדה או פעולה שלמה (David ate). Progressive (be + ing) – פעולה בעיצומה (David was eating). Perfect (have + V3) – פעולה שהושלמה עד נקודה מסוימת (has eaten / had eaten). Past perfect מציין \"עבר שלפני עבר\": By the time we arrived, the movie had started.","מילות זמן עוזרות לבחור: yesterday / ago / in 1990 → עבר פשוט; since / for / already / yet → הווה מושלם; by the time + עבר → עבר מושלם; while / at that moment → ממושך.","<b>משפטי תנאי<\/b> חשובים במיוחד בשאלות ניסוח מחדש, כי הם אומרים מה <b>לא<\/b> קרה. If + הווה, will → תנאי אפשרי (If it rains, we will stay home). If + עבר, would → מצב דמיוני בהווה (If I had time, I would… = אין לי זמן). If + had V3, would have V3 → עבר שלא התממש (If she had left earlier, she would have caught the train = היא לא יצאה מוקדם ופספסה). צורה הפוכה ללא if: Had she left… / Were I rich…"],"f":["If + present, will + V → אפשרי","If + past, would + V → דמיוני בהווה (המציאות הפוכה)","If + had V3, would have V3 → לא קרה בעבר","since / for → have / has + V3"],"traps":["לפרש תנאי מסוג 3 כאילו הדבר קרה – בדיוק להפך: גם התנאי וגם התוצאה <b>לא<\/b> התרחשו.","Had he known… / Were it… בתחילת משפט = If he had known / If it were – לא שאלה.","since עם עבר פשוט (lived since) – שגוי; צריך הווה מושלם.","If I were (ולא was) במצב דמיוני – וזה סימן למצב שאינו אמיתי."],"ex":{"q":"\"If the team had trained harder, it would have won the championship.\" What can we learn?\n(1) The team trained hard and won.  (2) The team did not train hard enough and did not win.  (3) The team will train harder next year.  (4) The team won although it did not train.","pt":null,"steps":["מזהים את המבנה: If + had V3, would have V3 – תנאי מסוג 3, עבר שלא התממש.","הופכים את שני החלקים למציאות: \"לו התאמנה יותר\" → לא התאמנה מספיק; \"הייתה זוכה\" → לא זכתה.","<b>תשובה (2)<\/b>. (3) מדברת על העתיד, ו־(1)/(4) מתארות זכייה – שלא הייתה."]},"g":{"q":"Sarah ______ in Chicago since 2015.","pt":null,"o":["has lived","lives","lived","will live"],"a":0,"g":["איזו מילת זמן מופיעה במשפט?","since מתארת פעולה שהתחילה בעבר ונמשכת עד היום – איזה זמן מתאים לזה?"],"x":"since 2015 = מאז 2015 ועד עכשיו, ולכן הווה מושלם: has lived. lived (עבר פשוט) היה אומר שהיא כבר לא גרה שם, ו־lives לא מתחברת ל־since."},"solo":{"q":"By the time the firefighters arrived, the fire ______ most of the old building.","pt":null,"o":["destroys","had destroyed","has destroyed","will destroy"],"a":1,"x":"By the time + עבר (arrived): ההרס קרה <b>לפני<\/b> שהכבאים הגיעו – עבר שלפני עבר, ולכן עבר מושלם: had destroyed. has destroyed (הווה מושלם) לא מתאים לנקודת זמן בעבר."},"bank":[{"t":"תנאי אפשרי","lvl":1,"q":"If it rains tomorrow, we ______ the picnic.","pt":null,"table":null,"o":["would have canceled","canceled","will cancel","had canceled"],"a":2,"x":"tomorrow + תנאי אפשרי: If + הווה (rains), will + פועל. would have canceled שייך לעבר שלא התממש."},{"t":"בחירת זמן","lvl":2,"q":"I was reading in bed when suddenly the lights ______.","pt":null,"table":null,"o":["went out","go out","have gone out","will go out"],"a":0,"x":"was reading = פעולה בעיצומה בעבר, ופעולה קצרה (when suddenly) קטעה אותה – בעבר פשוט: went out."},{"t":"תנאי דמיוני","lvl":3,"q":"If I ______ more free time, I would learn to play the piano.","pt":null,"table":null,"o":["have","had","will have","would have had"],"a":1,"x":"החלק השני (would learn) מראה תנאי דמיוני בהווה, ולכן בחלק של if בא עבר: If I had. המשמעות: אין לי מספיק זמן. have ו־will have מתאימים ל־will, לא ל־would."},{"t":"הבנת תנאי","lvl":3,"q":"\"If Dan had checked the weather forecast, he would have taken an umbrella.\" What do we learn about Dan?","pt":null,"table":null,"o":["He checked the forecast and took an umbrella.","He checked the forecast but forgot his umbrella.","He will take an umbrella next time.","He did not check the forecast, and he did not take an umbrella."],"a":3,"x":"If + had V3, would have V3 = עבר שלא התממש. דן <b>לא<\/b> בדק את התחזית ו<b>לא<\/b> לקח מטרייה. שתי האפשרויות הראשונות סותרות את \"לא בדק\", והשלישית מדברת על העתיד – דבר שהמשפט לא אומר."},{"t":"בחירת זמן","lvl":3,"q":"The company ______ three new branches since the beginning of the year.","pt":null,"table":null,"o":["opened","opens","has opened","was opening"],"a":2,"x":"since the beginning of the year = מאז ועד עכשיו → הווה מושלם: has opened. opened (עבר פשוט) לא מתחבר ל־since."},{"t":"הבנת תנאי","lvl":4,"q":"\"Were the museum closer to the city center, it would attract more visitors.\" This means that the museum ______.","pt":null,"table":null,"o":["is not close to the city center, so it attracts fewer visitors than it could","was moved closer to the city center last year","is close to the city center and attracts many visitors","will be moved to the city center soon"],"a":0,"x":"Were the museum… = If the museum were – תנאי דמיוני בהווה. במציאות המוזיאון <b>לא<\/b> קרוב למרכז, ולכן מושך פחות מבקרים. Were בתחילת המשפט אינה שאלה."},{"t":"הבנת תנאי","lvl":5,"q":"\"Had the bridge been inspected regularly, the accident might have been avoided.\" Which statement is implied?","pt":null,"table":null,"o":["The bridge was inspected, and the accident was avoided.","The bridge was not inspected regularly.","Regular inspections caused the accident.","The accident will be avoided in the future."],"a":1,"x":"Had the bridge been inspected = If the bridge had been inspected – תנאי מסוג 3 (וגם סביל). המציאות הפוכה: הגשר <b>לא<\/b> נבדק באופן קבוע, והתאונה <b>לא<\/b> נמנעה."}]},{"id":"enb-comparison","title":"מבני השוואה: ארבעה סוגים","tag":"דקדוק משמעות","en":true,"source":"ספר יסודות אנגלית, פרק מבני השוואה (עמ' 105-110)","rule":["הקורס מחלק את ההשוואות שנבדקות בבחינה לארבעה סוגים: <b>שוויון<\/b> A = B (like, similarly to, as…as), <b>אי־שוויון<\/b> A ≠ B (unlike, while, whereas, different from, rather than), <b>יותר/פחות<\/b> A > B (‑er than, more/less … than, not as … as) ו<b>הכי<\/b> – השוואה של A לכל הקבוצה (the ‑est, the most, more … than any other, No … is more … than A).","השיטה: מצמצמים את המשפט ל<b>תמצית ההשוואה<\/b> – מי מול מי, ובאיזה כיוון. \"A is not as tall as B\" מצטמצם ל־B > A. \"No mountain is higher than Everest\" מצטמצם ל\"אוורסט הכי גבוה\".","כל רעיון אפשר לנסח בכמה דרכים: A is older than B = B is younger than A = B is not as old as A = B is less old than A. בשאלות ניסוח מחדש התשובה הנכונה היא לרוב ניסוח אחר של אותה תמצית."],"f":["A is not as X as B  =  B is more X than A","more X than any other = the most X","No … is more X than A  =  A is the most X","Unlike A, B… → ל־A ול־B תכונה הפוכה"],"traps":["not as … as נקראת בטעות כשוויון – היא בעצם \"פחות מ־\".","Unlike מול Like: מילה אחת קטנה הופכת את כל המשמעות.","לבחור the ‑est כשמשווים רק בין שניים (או ‑er than כשמשווים לכל הקבוצה).","בשרשרת השוואות (A > B, C < B) לאבד את הכיוון – כתוב לעצמך את התמצית."],"ex":{"q":"\"No other river in the country is as long as the Green River.\" This means that:\n(1) the Green River is the longest river in the country  (2) all the rivers in the country are the same length  (3) the Green River is shorter than other rivers  (4) there are no long rivers in the country","pt":null,"steps":["מזהים סוג: No other … is as long as A – זה מבנה <b>\"הכי\"<\/b> (A מול כל הקבוצה).","תמצית: אף נהר אחר אינו ארוך כמו הגרין ריבר → הגרין ריבר ארוך מכולם.","<b>תשובה (1)<\/b>. (2) מפרשת as long as כשוויון ומתעלמת מ־No other – זו המלכודת."]},"g":{"q":"Ben is 30 and his sister Ella is 25. Ella is ______ Ben.","pt":null,"o":["older than","not as old as","as old as","the oldest of"],"a":1,"g":["כתוב תמצית: מי מבוגר יותר?","חפש ניסוח שאומר שאלה <b>פחות<\/b> מבוגרת מבן."],"x":"בן (30) מבוגר מאלה (25). Ella is not as old as Ben = אלה פחות מבוגרת מבן – נכון. as old as היא שוויון (גילם לא זהה), ו־older than הפוך."},"solo":{"q":"Whereas the first study focused only on adults, the second study ______.","pt":null,"o":["also focused on adults","was similar to the first one","focused on adults as well","examined only children"],"a":3,"x":"Whereas = בעוד ש־ – מבנה של <b>אי־שוויון<\/b>. החלק השני חייב להיות שונה מהראשון: המחקר השני בדק ילדים. שלוש האפשרויות האחרות מתארות דמיון."},"bank":[{"t":"הכי","lvl":1,"q":"Mount Everest is ______ mountain in the world.","pt":null,"table":null,"o":["higher","as high as","higher than","the highest"],"a":3,"x":"משווים את האוורסט לכל ההרים בעולם – מבנה \"הכי\": the highest. higher than דורש שני דברים מושווים."},{"t":"אי-שוויון","lvl":1,"q":"______ cats, dogs usually need to be walked outside every day.","pt":null,"table":null,"o":["Unlike","Like","Similarly to","As"],"a":0,"x":"חתולים בדרך כלל לא צריכים טיול יומי, כלבים כן – הבדל, ולכן Unlike (שלא כמו). Like ו־Similarly to מבטאות דמיון."},{"t":"יותר/פחות","lvl":2,"q":"Jogging burns ______ calories than walking does.","pt":null,"table":null,"o":["most","the most","more","as many"],"a":2,"x":"המילה than מחייבת השוואה של יותר/פחות: more … than. most / the most שייכות ל\"הכי\", ו־as many דורשת as ולא than."},{"t":"ניסוח מחדש","lvl":3,"q":"\"Train tickets are cheaper than plane tickets, but trains are not as fast as planes.\" Which statement is true according to the sentence?","pt":null,"table":null,"o":["Trains are faster and cheaper than planes.","Planes are faster and more expensive than trains.","Planes are slower but cheaper than trains.","Trains and planes are equally fast."],"a":1,"x":"תמצית: מחיר – רכבת < מטוס; מהירות – רכבת < מטוס (not as fast as = פחות מהיר). כלומר המטוס גם מהיר יותר וגם יקר יותר."},{"t":"שוויון","lvl":3,"q":"\"Like their parents, many young people in the town work in farming.\" This means that ______.","pt":null,"table":null,"o":["farming is a common job for both parents and young people in the town","young people in the town avoid farming, unlike their parents","the parents in the town no longer work in farming","only the parents in the town work in farming"],"a":0,"x":"Like = כמו, בדומה ל־ – מבנה <b>שוויון<\/b>. גם ההורים וגם הצעירים עובדים בחקלאות. שתי המסיחים הראשונים מתארים הבדל, כאילו כתוב Unlike."},{"t":"ניסוח מחדש","lvl":4,"q":"\"Lake Arin is deeper than any other lake in the region.\" Which sentence has the same meaning?","pt":null,"table":null,"o":["Lake Arin is as deep as the other lakes in the region.","Some lakes in the region are deeper than Lake Arin.","Lake Arin is the shallowest lake in the region.","No other lake in the region is as deep as Lake Arin."],"a":3,"x":"deeper than any other = הכי עמוק. אותה תמצית בניסוח אחר: No other lake … is as deep as Lake Arin. אפשרות ראשונה היא שוויון, והאחרות הפוכות."},{"t":"הכי","lvl":5,"q":"\"Of all the cities in the survey, only Oslo had cleaner air than Vienna.\" Which statement must be true?","pt":null,"table":null,"o":["Vienna had the cleanest air in the survey.","Oslo's air was dirtier than Vienna's.","Vienna had the second-cleanest air in the survey.","Vienna had the dirtiest air apart from Oslo."],"a":2,"x":"רק עיר אחת (אוסלו) נקייה יותר מווינה, וכל השאר פחות נקיות ממנה. לכן וינה במקום השני. האפשרות הראשונה מתעלמת מאוסלו, והשתיים האחרונות הופכות את הכיוון."}]}]};
const COURSE_LESSONS={q:[],v:[],e:[]};
if(COURSE)for(const s of ["q","v","e"])for(const t of (COURSE[s]||[])){
  const ids=t.bank.map((b,i)=>{const id=t.id+"-"+(i+1);Q.push({id,s,t:b.t||t.tag,q:b.q,o:b.o,a:b.a,x:b.x,pt:b.pt||null,table:b.table||null,lvl:b.lvl||3,topic:t.id});return id});
  const ei=Math.max(0,t.bank.findIndex(b=>b.lvl===3));
  COURSE_LESSONS[s].push({id:t.id,title:t.title,tag:t.tag,en:!!t.en,source:t.source||"",rule:t.rule||[],f:t.f||[],traps:t.traps||[],ex:t.ex,g:t.g,solo:t.solo,bank:ids[ei],bankIds:ids});
}
const tableHtml=t=>!t?"":`<div class="tbl"><table>${t.title?`<caption>${esc(t.title)}</caption>`:""}<thead><tr>${t.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const BY={v:[],q:[],e:[]};Q.forEach(q=>BY[q.s].push(q));
const SIM_PER=3, SIM_SECONDS=12*60;

// ---- storage (per-viewer, optional)
const KEY="psy-prep-v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
let stats=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(stats))}catch(e){}}
function record(q,choice){const r=stats[q.id]||{n:0,c:0};r.n++;if(choice===q.a)r.c++;r.last=choice===q.a?1:0;stats[q.id]=r;save()}

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const isEn=q=>q.s==="e";
let S=null, timerId=null, confirmReset=false;

// ---- home
function home(){
  clearInterval(timerId);S=null;
  const secHtml=Object.keys(SECTIONS).map(k=>{
    const list=BY[k];const seen=list.filter(q=>stats[q.id]).length;
    const n=list.reduce((s,q)=>s+(stats[q.id]?.n||0),0), c=list.reduce((s,q)=>s+(stats[q.id]?.c||0),0);
    const pct=n?Math.round(c/n*100):null;
    return `<div class="sec"><div class="lbl">${SECTIONS[k].lbl}</div><h3>${SECTIONS[k].name}</h3>
      <div class="sub">${SECTIONS[k].sub}</div>
      <div class="bar"><i style="width:${seen/list.length*100}%"></i></div>
      <div class="meta"><span>נפתרו ${seen} מתוך ${list.length}</span><span>${pct===null?"עוד לא תרגלת":"דיוק "+pct+"%"}</span></div>
      <button class="btn" data-practice="${k}">תרגול</button></div>`}).join("");
  const wrong=Q.filter(q=>stats[q.id]&&stats[q.id].last===0);
  app.innerHTML=`
   <div class="top"><div class="brand">מסלול פסיכומטרי<small>תרגול · סימולציה · הסברים</small></div>
     ${Object.keys(stats).length?`<span class="confirm" id="resetBox"></span>`:""}</div>
   <div class="hero"><h1>תרגול לפסיכומטרי, שאלה אחר שאלה</h1>
     <p>בחר פרק לתרגול חופשי עם הסבר אחרי כל תשובה, או היכנס למיני־סימולציה עם שעון כמו ביום המבחן.</p></div>
   <div class="card feature"><h3>מצב לימוד: צעד אחר צעד</h3><p>לא זוכר איך פותרים? לכל סוג שאלה יש הסבר של השיטה, דוגמה פתורה, תרגיל עם עזרה ותרגיל לבד.</p>
     <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${["v","q","e"].map(s=>`<button class="btn" data-learn="${s}">${{v:"מילולית",q:"כמותית",e:"אנגלית"}[s]}<br><small style="font-weight:400;opacity:.8">${learnDone(s)} / ${LEARN[s].length} נושאים</small></button>`).join("")}</div></div>
   <div class="sections">${secHtml}</div>
   <div class="wide">
     <div class="card"><h3>מיני־סימולציה</h3><p>${SIM_PER*3} שאלות מכל שלושת הפרקים, ${SIM_SECONDS/60} דקות על השעון. התשובות נחשפות רק בסוף.</p>
       <button class="btn alt" id="sim">התחל סימולציה</button></div>
     <div class="card"><h3>חזרה על טעויות</h3><p>${wrong.length?`${wrong.length} שאלות שבפעם האחרונה טעית בהן.`:"כאן יופיעו שאלות שטעית בהן, כדי לחזור עליהן."}</p>
       <button class="btn alt" id="review" ${wrong.length?"":"disabled"}>תרגל טעויות</button></div>
   </div>
   <div class="note">השיעורים והשאלות כאן נכתבו מחדש על בסיס המבנה, השיטות ורמת הקושי של הקורס "הפסיכומטרי של המדינה". השאלות המקוריות של הקורס נמצאות בקבצים שלו. "תרגול" בכל פרק מגריל 15 שאלות מהמאגר. כדי לתרגל גם על מבחנים אמיתיים, אפשר להוריד בחינם מבחנים קודמים מ<a href="https://www.nite.org.il/" target="_blank" rel="noopener">אתר מאל"ו</a>. ההתקדמות נשמרת בדפדפן הזה בלבד.</div>`;
  app.querySelectorAll("[data-practice]").forEach(b=>b.onclick=()=>start("practice",shuffle(BY[b.dataset.practice]).slice(0,15),SECTIONS[b.dataset.practice].name));
  document.getElementById("sim").onclick=startSim;
  app.querySelectorAll("[data-learn]").forEach(b=>b.onclick=()=>learnHome(b.dataset.learn));
  document.getElementById("review").onclick=()=>start("practice",shuffle(wrong),"חזרה על טעויות");
  renderReset();
}
function renderReset(){
  const box=document.getElementById("resetBox");if(!box)return;
  box.innerHTML=confirmReset?`<span>למחוק את כל ההתקדמות?</span><button class="ghost" id="rYes">מחק</button><button class="ghost" id="rNo">ביטול</button>`:`<button class="ghost" id="rAsk">איפוס</button>`;
  if(confirmReset){document.getElementById("rYes").onclick=()=>{stats={};save();confirmReset=false;home()};document.getElementById("rNo").onclick=()=>{confirmReset=false;renderReset()}}
  else document.getElementById("rAsk").onclick=()=>{confirmReset=true;renderReset()};
}

// ---- quiz engine
function start(mode,list,title){S={mode,list,title,i:0,ans:{},checked:{},hint:{},left:SIM_SECONDS};quiz()}
function startSim(){
  const list=["v","q","e"].flatMap(k=>{
    // keep passage questions together and in order
    const picked=shuffle(BY[k]).slice(0,SIM_PER);
    return BY[k].filter(q=>picked.includes(q));
  });
  start("sim",list,"מיני־סימולציה");
  timerId=setInterval(()=>{S.left--;const t=document.getElementById("timer");if(t){t.textContent=fmt(S.left);t.classList.toggle("low",S.left<=60)}if(S.left<=0){clearInterval(timerId);results()}},1000);
}
const fmt=s=>`${Math.floor(Math.max(s,0)/60)}:${String(Math.max(s,0)%60).padStart(2,"0")}`;

function quiz(){
  const q=S.list[S.i], en=isEn(q), d=en?' dir="ltr" lang="en"':'';
  const chosen=S.ans[q.id], checked=S.mode==="practice"&&S.checked[q.id];
  const opts=q.o.map((o,j)=>{
    let cls="opt";
    if(checked){if(j===q.a)cls+=" ok";else if(j===chosen)cls+=" bad"}
    else if(j===chosen)cls+=" sel";
    return `<button class="${cls}" data-j="${j}" ${checked?"disabled":""}><span class="bub">${j+1}</span><span class="tx"${d}>${esc(o)}</span></button>`}).join("");
  const ptxt=q.p?PASSAGES[q.p]:q.pt;
  const passage=(ptxt?`<details class="passage" open><summary>${en?"קטע קריאה (Passage)":"קטע קריאה"}</summary><p${d}>${esc(ptxt)}</p></details>`:"")+tableHtml(q.table);
  const explain=checked?`<div class="explain ${chosen===q.a?"ok":"bad"}"><b>${chosen===q.a?"✓ נכון":"✗ התשובה הנכונה: "+(q.a+1)}</b>${esc(q.x)}${whyBtn(q)}</div>`:"";
  const H=S.mode==="practice"&&HINTS[q.id];
  const hintHtml=!H?"":S.hint[q.id]?`<div class="hint"><div class="hint-lbl">רמז גרפי</div>${H.svg}<p>${H.t}</p></div>`:(checked?"":`<button class="btn alt hintbtn" id="hint">הצג רמז גרפי</button>`);
  const last=S.i===S.list.length-1;
  let next;
  if(S.mode==="practice") next=checked?`<button class="btn" id="next">${last?"לסיכום":"לשאלה הבאה"}</button>`:`<button class="btn" id="check" ${chosen===undefined?"disabled":""}>בדוק תשובה</button>`;
  else next=last?`<button class="btn" id="finish">סיים והגש</button>`:`<button class="btn" id="next">הבאה</button>`;
  const sheet=S.mode==="sim"?`<div class="sheet" aria-label="גיליון תשובות">${S.list.map((x,k)=>`<button data-go="${k}" class="${S.ans[x.id]!==undefined?"done":""} ${k===S.i?"cur":""}" aria-label="שאלה ${k+1}">${k+1}</button>`).join("")}</div>`:"";
  app.innerHTML=`
   <div class="top"><button class="ghost" id="quit">← יציאה</button>
     ${S.mode==="sim"?`<span class="timer ${S.left<=60?"low":""}" id="timer">${fmt(S.left)}</span>`:`<span class="count">${esc(S.title)}</span>`}</div>
   <div class="qhead"><span class="tag">${SECTIONS[q.s].name} · ${esc(q.t)}</span><span class="count">שאלה ${S.i+1} מתוך ${S.list.length}</span></div>
   ${passage}
   <div class="stem"${d}>${esc(q.q)}</div>
   <div class="opts">${opts}</div>
   ${hintHtml}
   ${explain}
   <div class="nav">${S.mode==="sim"&&S.i>0?`<button class="btn alt" id="prev">הקודמת</button>`:"<span></span>"}${next}</div>
   ${sheet}`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[q.id]=+b.dataset.j;quiz()});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on("quit",home);
  on("hint",()=>{S.hint[q.id]=true;quiz()});
  on("check",()=>{S.checked[q.id]=true;record(q,S.ans[q.id]);quiz()});
  on("next",()=>{if(last)results();else{S.i++;quiz();window.scrollTo(0,0)}});
  on("prev",()=>{S.i--;quiz()});
  on("finish",()=>{clearInterval(timerId);results()});
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.i=+b.dataset.go;quiz()});
}

function results(){
  clearInterval(timerId);
  if(S.mode==="sim")S.list.forEach(q=>{if(S.ans[q.id]!==undefined)record(q,S.ans[q.id])});
  const right=S.list.filter(q=>S.ans[q.id]===q.a).length, total=S.list.length;
  const secs=[...new Set(S.list.map(q=>q.s))];
  const bd=secs.map(k=>{const l=S.list.filter(q=>q.s===k);const r=l.filter(q=>S.ans[q.id]===q.a).length;
    return `<div class="card"><p>${SECTIONS[k].name}</p><h3 style="font-variant-numeric:tabular-nums">${r} / ${l.length}</h3><div class="bar"><i style="width:${r/l.length*100}%"></i></div></div>`}).join("");
  const rev=S.list.map((q,k)=>{const c=S.ans[q.id], ok=c===q.a, d=isEn(q)?' dir="ltr" lang="en"':'';
    return `<div class="item ${ok?"":"bad"}"><div class="q"><span>${k+1}. </span><span${d}>${esc(q.q)}</span></div>
      <div class="a">${c===undefined?"לא ענית":"ענית ("+(c+1)+")"} · התשובה הנכונה: (${q.a+1}) <span${d}>${esc(q.o[q.a])}</span></div>
      ${ok?"":`<div class="x">${esc(q.x)}</div>`}</div>`}).join("");
  const timeNote=S.mode==="sim"?`<span>זמן שנוצל: ${fmt(SIM_SECONDS-Math.max(S.left,0))}</span>`:"";
  app.innerHTML=`
   <div class="top"><button class="ghost" id="back">← למסך הראשי</button><span class="count">${esc(S.title)}</span></div>
   <h2 style="font-size:1.6rem">סיכום</h2>
   <div class="score"><span class="big" style="color:var(--ink)">${Math.round(right/total*100)}%</span><span>${right} תשובות נכונות מתוך ${total}</span>${timeNote}</div>
   ${secs.length>1?`<div class="breakdown">${bd}</div>`:""}
   <div class="rev">${rev}</div>
   <div class="nav"><button class="btn alt" id="again">שוב</button><button class="btn" id="home2">למסך הראשי</button></div>`;
  const mode=S.mode, list=S.list, title=S.title;
  document.getElementById("back").onclick=home;
  document.getElementById("home2").onclick=home;
  document.getElementById("again").onclick=()=>mode==="sim"?startSim():start("practice",shuffle(list),title);
  window.scrollTo(0,0);
}
// ================= learn mode =================
const LESSONS_Q=[
{id:"eq",title:`משוואות עם נעלם אחד`,tag:`אלגברה`,
 rule:[`המטרה: להשאיר את x לבד בצד אחד. כל פעולה שעושים בצד אחד עושים גם בצד השני, כדי שהשוויון יישאר.`,`הסדר: קודם מבטלים <b>חיבור וחיסור</b>, ורק אחר כך <b>כפל וחילוק</b>. בסוף מציבים את התשובה במשוואה המקורית כדי לבדוק.`],

${needT?'השאלה מתבססת על טבלת נתונים מקורית: מלא את השדה table בצורה {"title":"...","head":["..."],"rows":[["..."]]}, עם 3 עד 6 שורות.':"בלי טבלה: table הוא null."}
רמת קושי ${G.level} מתוך 6 (${LEVELS[G.level]}). רמה 3 היא הרמה הרגילה של המבחן. כל רמה קשה יותר מהקודמת: יותר שלבים, מספרים פחות נוחים, ניסוח מורכב יותר או מלכודת נפוצה.
${G.hist.length?"אל תחזור על התרגילים האלה ואל תכתוב תרגיל דומה להם:\n- "+G.hist.join("\n- "):""}
${l.en?"השאלה, הקטע והתשובות באנגלית אמריקאית. ההסבר בעברית.":"הכול בעברית."}
${needP?"כלול קטע קריאה קצר של 3 עד 6 משפטים בשדה passage.":"בלי קטע קריאה: passage הוא null."}
קודם פתור את התרגיל בעצמך בשדה solution, ובדוק שיש בדיוק תשובה נכונה אחת מתוך ארבע ושכל שאר התשובות שגויות בבירור.
ענה ב־JSON בלבד, בצורה הזו:
{"solution":"...","passage":null,"table":null,"q":"...","o":["...","...","...","..."],"a":0,"x":"הסבר קצר וברור בעברית, בפנייה לגבר, עד 60 מילים"}
a הוא המיקום של התשובה הנכונה במערך o, מ־0 עד 3.`;
  genCtl=new AbortController();
  try{
    const r=await SAMPLE.json(prompt,{cache:false,signal:genCtl.signal});
    if(!r||typeof r.q!=="string"||!Array.isArray(r.o)||r.o.length!==4||!r.o.every(x=>typeof x==="string")||!Number.isInteger(r.a)||r.a<0||r.a>3||typeof r.x!=="string")throw {code:"invalid_json"};
    const order=shuffle([0,1,2,3]);
    G.q={q:r.q,o:order.map(i=>r.o[i]),a:order.indexOf(r.a),x:r.x,pt:typeof r.passage==="string"&&r.passage.trim()?r.passage:null,
      table:r.table&&Array.isArray(r.table.head)&&Array.isArray(r.table.rows)&&r.table.rows.every(Array.isArray)?{title:String(r.table.title||""),head:r.table.head.map(String),rows:r.table.rows.map(x=>x.map(String))}:null};
    G.n++;G.hist.push(r.q.slice(0,160));if(G.hist.length>8)G.hist.shift();
  }catch(e){if(e&&e.code!=="cancelled")G.err=aiErr(e&&e.code)}
  G.busy=false;genCtl=null;
  if(LS&&LS.stage===4&&LS.gen===G)lesson();
}
home();

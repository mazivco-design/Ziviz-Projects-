.\n\nכמה ערים כבר מנסות להתמודד עם התופעה: הן צובעות גגות בלבן כדי שיחזירו את קרינת השמש, נוטעות עצים לאורך הרחובות ומחליפות משטחי אספלט בחומרים נקבוביים. מתכננים מציינים שלאמצעים האלה יש יתרון כפול: הם מורידים את הטמפרטורה וגם מקטינים את הצורך במזגנים.","table":null,"o":["צביעת הכבישים בצבע כהה כדי שייראו טוב יותר בלילה","הקמת תחנות כוח נוספות בשולי העיר","בניית מגדלים צפופים במקום גינות ציבוריות","הצבת גינות מים ומזרקות בכיכרות, כדי שמים יתאדו מהן"],"a":3,"x":"הפתרונות בקטע פועלים נגד הגורמים העיקריים: מחזירים קרינה, מוסיפים צמחייה ומחליפים משטחים שאוגרים חום. אידוי מים מקרר את הסביבה, בדומה לפעולת הצמחייה שתוארה בפסקה השנייה. צבע כהה ובנייה צפופה דווקא מגבירים את התופעה."},{"t":"טענה נתמכת","lvl":5,"q":"איזו מן הטענות הבאות נתמכת ביותר על ידי הקטע?","pt":"בימי קיץ חמים, הטמפרטורה במרכזה של עיר גדולה יכולה להיות גבוהה בכמה מעלות מהטמפרטורה בשטחים הפתוחים שסביבה. לתופעה הזו קוראים ״אי חום עירוני״. ההבדל בולט במיוחד בשעות הלילה: השדות שמחוץ לעיר מתקררים מהר אחרי השקיעה, ואילו העיר ממשיכה להקרין חום שעות ארוכות.\n\nהסיבה העיקרית לכך היא החומרים שמהם בנויה העיר. אספלט ובטון סופגים חלק גדול מקרינת השמש במהלך היום, אוגרים אותה ומשחררים אותה לאט אל האוויר בלילה. נוסף על כך, בעיר יש מעט צמחייה. עצים ועשבים מקררים את סביבתם באמצעות אידוי מים מעליהם, ובאזור שרובו מכוסה בבניינים ובכבישים התהליך הזה כמעט לא מתקיים. גם מזגנים, כלי רכב ומפעלים פולטים חום, אבל בדרך כלל תרומתם קטנה מזו של החומרים ושל המחסור בצמחייה.\n\nלאי החום יש מחיר. בימי שרב עולה מספר הפונים לחדרי המיון, וצריכת החשמל לקירור מזנקת. כך עולה גם פליטת המזהמים מתחנות הכוח, מה שמחמיר עוד יותר את המצב.\n\nכמה ערים כבר מנסות להתמודד עם התופעה: הן צובעות גגות בלבן כדי שיחזירו את קרינת השמש, נוטעות עצים לאורך הרחובות ומחליפות משטחי אספלט בחומרים נקבוביים. מתכננים מציינים שלאמצעים האלה יש יתרון כפול: הם מורידים את הטמפרטורה וגם מקטינים את הצורך במזגנים.","table":null,"o":["אילו הפסיקו לפעול כל המזגנים בעיר, התופעה הייתה נעלמת","בחורף, הטמפרטורה בעיר נמוכה מהטמפרטורה בסביבתה","ההבדל בין העיר לסביבתה גדול יותר בצהריים מאשר בלילה","עיר שרוב גגותיה מכוסים בצמחייה צפויה להיות קרירה יותר בלילה מעיר דומה שגגותיה מכוסים בזפת כהה"],"a":3,"x":"לפי הקטע, צמחייה מקררת באמצעות אידוי, ומשטחים כהים שאוגרים חום משחררים אותו בלילה. לכן טענה 4 נתמכת היטב. טענה 1 סותרת את הקטע, שאומר שתרומת המזגנים קטנה. טענה 2 לא נאמרת בקטע, וטענה 3 הפוכה לנאמר בפסקה הראשונה."}]},{"id":"vbb-essay","title":"כתיבת חיבור (מטלת כתיבה)","tag":"חיבור","en":false,"source":"ספר חשיבה מילולית, פרק ״חיבור״ (עמ' 391-400 הסבר, מטלות תרגול וחיבורים לדוגמה עד עמ' 469)","rule":["החיבור הוא הפרק הראשון בבחינה. הזמן המומלץ הוא כ-30 דקות, והאורך הוא לפחות 25 שורות (חיבור טוב הוא בדרך כלל 30-40 שורות). הוא נבדק בשני ממדים, <b>תוכן<\/b> ו<b>לשון<\/b>, כל אחד בציון 1-6, ומשקלו כרבע מציון החשיבה המילולית. סוג הכתיבה הנדרש הוא <b>כתיבה עיונית<\/b>: טענה, נימוקים, הוכחות ומסקנה, ברורה ומדויקת וללא ״מריחות״ וחזרות.","<b>מבנה מומלץ:<\/b> פסקת פתיחה (הצגת הנושא + המחלוקת + דעת הכותב) ← פסקת טיעון ראשון ← פסקת טיעון שני ← <b>פסקת עימות<\/b> (טענת נגד והפרכתה) ← סיכום (המסקנה, ואפשר גם המלצה מגשרת). בכל פסקה יש נושא אחד ו<b>משפט מפתח<\/b> בתחילתה. גוף החיבור הוא לפחות מחצית מאורכו.","<b>תהליך העבודה:<\/b> קוראים את המטלה (השאלה המודגשת בסופה היא שאלת החיבור). בוחרים צד שקל לך לנמק, כי הציון לא תלוי בצד שבחרת. בטיוטה מציירים עיגול עם העמדה ומסביבו את הנימוקים, וכל נימוק הופך למשפט מפתח של פסקה. מגוונים את טכניקות השכנוע: הסבר, דוגמה, השוואה ותוצאות מחקר.","<b>לשון:<\/b> מילות קישור מחברות בין משפטים ובין פסקאות (תוספת, ניגוד, תוצאה, השוואה, ניסוח זהיר). עדיף לכתוב משפטים קצרים ופשוטים מאשר משפטים ארוכים שמסתבכים. לא משתמשים בביטויים גבוהים שאתה לא בטוח במשמעותם, וכותבים סימני פיסוק נכונים."],"f":["פתיחה (נושא + מחלוקת + עמדה) ← 2 טיעונים ← עימות ← סיכום","פסקה = נושא אחד + משפט מפתח בתחילתה","ניגוד: אולם, עם זאת, לעומת זאת | תוצאה: לכן, לפיכך, עקב כך","ניסוח זהיר: ייתכן ש-, סביר להניח ש-"],"traps":["להכניס לפתיחה את כל הנימוקים במקום רק להציג את הנושא","להוסיף בסיכום נימוק חדש שלא הופיע בגוף החיבור","״מריחה״: לחזור על אותו רעיון במילים אחרות כדי להאריך","להתעלם מטענת הנגד, או לענות עליה בהתקפה אישית במקום בנימוק"],"ex":{"q":"מטלה: ״האם יש לחייב כל תלמיד תיכון לבצע עבודה התנדבותית?״ איך בונים את שלד החיבור?","pt":null,"steps":["<b>פתיחה:<\/b> הצגת המחלוקת (חובה מול בחירה חופשית) ועמדת הכותב, למשל בעד.","<b>טיעון 1:<\/b> ההתנדבות מחברת את התלמיד לקהילה (טכניקה: הסבר + דוגמה). <b>טיעון 2:<\/b> החוויה מפתחת כישורים שבית הספר לא מלמד (טכניקה: השוואה או מחקר).","<b>עימות:<\/b> ״התנדבות בכפייה אינה התנדבות אמיתית״, והפרכה: גם לימודים הם חובה, ובכל זאת רבים מגלים בהם עניין אמיתי.","<b>סיכום:<\/b> המסקנה שהחובה מוצדקת, ואולי המלצה מגשרת, למשל לאפשר לכל תלמיד לבחור את תחום ההתנדבות."]},"g":{"q":"השלם במילת הקישור המתאימה: ״רבים טוענים שהלימוד מרחוק נוח וחוסך זמן. ______, הוא מקשה על יצירת קשרים חברתיים.״","pt":null,"o":["לכן","כמו כן","עם זאת","כתוצאה מכך"],"a":2,"g":["האם המשפט השני ממשיך את הראשון או מציג צד הפוך?","חפש מילת קישור של ניגוד."],"x":"המשפט השני מציג חיסרון אחרי שהמשפט הראשון הציג יתרון. זה ניגוד, ולכן ״עם זאת״. ״לכן״ ו״כתוצאה מכך״ הן מילות תוצאה, ו״כמו כן״ היא מילת תוספת."},"solo":{"q":"לפי המבנה המומלץ, מה צריך להופיע בפסקת הפתיחה של החיבור?","pt":null,"o":["פירוט מלא של כל הנימוקים בעד ונגד","הצגת הנושא, המחלוקת ועמדת הכותב בקצרה","דוגמה אישית ארוכה, בלי להזכיר את המחלוקת","המסקנה הסופית וההמלצה המגשרת"],"a":1,"x":"הפתיחה ״מכניסה״ את הקורא לחיבור: מציגה את הנושא, את המחלוקת ואת עמדת הכותב, בלי לפרט נימוקים. הפירוט שייך לגוף החיבור, והמסקנה וההמלצה שייכות לסיכום."},"bank":[{"t":"מבנה","lvl":1,"q":"באיזו פסקה, לפי המבנה המומלץ, מציגים את טענת הצד השני ומפריכים אותה?","pt":null,"table":null,"o":["בפסקת הפתיחה","בפסקת הטיעון הראשון","בפסקת העימות שלפני הסיכום","בסיכום"],"a":2,"x":"פסקת העימות באה אחרי שני הטיעונים ולפני הסיכום. בה מציגים טענת נגד ומסבירים למה היא לא משכנעת."},{"t":"מילות קישור","lvl":2,"q":"איזו מילת קישור מתאימה לפתיחת משפט שמסיק מסקנה מהנאמר לפניו?","pt":null,"table":null,"o":["לפיכך","אולם","נוסף על כך","לעומת זאת"],"a":0,"x":"״לפיכך״ מציינת תוצאה או מסקנה. ״אולם״ ו״לעומת זאת״ מציינות ניגוד, ו״נוסף על כך״ מציינת תוספת."},{"t":"משפט מפתח","lvl":3,"q":"זהו גוף של פסקה בחיבור: ״...כאשר בני נוער עובדים בחופשה, הם לומדים לנהל תקציב ולעמוד בלוח זמנים. נוסף על כך, הם נפגשים עם אנשים מרקע שונה ולומדים לעבוד בצוות.״ איזה משפט מתאים ביותר לפתוח את הפסקה כמשפט מפתח?","pt":null,"table":null,"o":["עבודה בחופשה מקנה לבני נוער כישורים חשובים לחיים","יש בני נוער שעובדים בחופשה ויש שלא","כמו שאמרתי בפסקה הקודמת, הנושא חשוב מאוד","האם בני נוער צריכים לעבוד בחופשה?"],"a":0,"x":"משפט מפתח מציג את הרעיון המרכזי של הפסקה, וגוף הפסקה מפרט כישורים (תקציב, זמנים, עבודת צוות). תשובה 2 ניטרלית ולא אומרת כלום. תשובה 3 היא ״מריחה״. תשובה 4 היא שאלת החיבור כולו, לא משפט מפתח של פסקה."},{"t":"מריחה וחזרות","lvl":2,"q":"איזה מן המשפטים הבאים הוא דוגמה ל״מריחה״ שכדאי להימנע ממנה בחיבור?","pt":null,"table":null,"o":["סקר שנערך בבתי ספר מצא שתלמידים מתנדבים מדווחים על תחושת שייכות גבוהה יותר","לכן, החובה להתנדב עשויה לחזק את הקשר בין התלמיד לקהילה","כפי שכבר אמרתי, ושוב אני חוזר ואומר, הנושא הזה הוא נושא חשוב מאוד שחשוב לדון בו","עם זאת, יש לאפשר לכל תלמיד לבחור את תחום ההתנדבות"],"a":2,"x":"משפט 3 חוזר על עצמו (״כפי שכבר אמרתי, ושוב אני חוזר״, ״חשוב... שחשוב״) ולא מוסיף שום תוכן. שאר המשפטים מביאים נתון, מסקנה או הסתייגות."},{"t":"סימני פיסוק","lvl":3,"q":"באיזה מן המשפטים הבאים הפיסוק תקין?","pt":null,"table":null,"o":["יש שלוש סיבות לכך, עלות: זמן ונוחות.","יש שלוש סיבות לכך: עלות, זמן ונוחות.","האם התוכנית תצליח.","לדעתי הצעד נכון!."],"a":1,"x":"נקודתיים באים לפני פירוט, ופסיק מפריד בין פריטי הרשימה (בלי פסיק לפני ״ו״ האחרונה). במשפט 1 הנקודתיים לא במקום. משפט 3 הוא שאלה, ולכן צריך סימן שאלה. במשפט 4 אין להוסיף נקודה אחרי סימן קריאה."},{"t":"הפרכת טענת נגד","lvl":4,"q":"כותב שתומך בחובת התנדבות לתלמידי תיכון רוצה להפריך את טענת הנגד: ״התנדבות בכפייה אינה התנדבות אמיתית.״ איזו הפרכה היא המשכנעת ביותר?","pt":null,"table":null,"o":["מי שטוען כך כנראה לא התנדב מעולם","התנדבות היא דבר חשוב מאוד, ולכן צריך לחייב אותה","ברוב המדינות אין חובת התנדבות לתלמידים","גם הלימודים בבית הספר הם חובה, ובכל זאת רבים מגלים בהם עניין אמיתי. חובה ראשונית יכולה להוביל למחויבות אישית"],"a":3,"x":"הפרכה טובה מתמודדת עם הטענה עצמה, וכאן היא עושה זאת בהשוואה (טכניקת שכנוע). תשובה 1 תוקפת את האדם ולא את הטענה. תשובה 2 חוזרת על העמדה בלי נימוק. תשובה 3 דווקא תומכת בצד השני."},{"t":"סיכום","lvl":4,"q":"חיבור טען שיש להאריך את יום הלימודים, ונימק זאת בצמצום פערים ובהקלה על הורים עובדים. איזה משפט מתאים ביותר לסיכום החיבור?","pt":null,"table":null,"o":["לסיכום, הארכת יום הלימודים תצמצם פערים ותקל על הורים עובדים, ולכן נכון ליישם אותה, אולי תחילה כתוכנית ניסיונית","לסיכום, נוסף על מה שנאמר, הארכת היום תשפר גם את הישגי ישראל בספורט האולימפי","לסיכום, יש בעד ויש נגד, וכל אחד יחליט בעצמו","לסיכום, נושא יום הלימודים הוא נושא שיש בו הרבה דעות"],"a":0,"x":"סיכום טוב מחזיר את המסקנה ונשען על הנימוקים שכבר הוצגו, ואפשר להוסיף המלצה מגשרת (תוכנית ניסיונית). תשובה 2 מכניסה נימוק חדש בסיכום. תשובות 3 ו-4 מתחמקות מהמסקנה, אף שהחיבור הציג עמדה."},{"t":"בחירת טכניקת שכנוע","lvl":5,"q":"בפסקה שבה הכותב טוען שתחבורה ציבורית חינמית תפחית פקקים, איזה משפט מוסיף <b>טכניקת שכנוע שונה<\/b> מהסבר כללי, ובצורה הזהירה המתאימה לכתיבה עיונית?","pt":null,"table":null,"o":["ברור לכולם שזה יפתור את בעיית הפקקים לגמרי","בערים שבהן הונהגה תחבורה ציבורית חינמית דווח על ירידה בשימוש ברכב פרטי, וסביר להניח שתוצאה דומה תתקבל גם אצלנו","פקקים הם דבר מעצבן מאוד שכולם שונאים","תחבורה ציבורית חינמית היא תחבורה שאינה עולה כסף לנוסעים"],"a":1,"x":"משפט 2 מביא דוגמה ממקומות אחרים (טכניקת שכנוע) ומנסח את המסקנה בזהירות (״סביר להניח״). משפט 1 מוחלט ולא מבוסס. משפט 3 רגשי ולא עיוני. משפט 4 רק מגדיר מושג ואינו משכנע."}]}],"e":[{"id":"eng-sc-predict","title":"Sentence Completion: למצוא את הרמז ולנחש מראש","tag":"השלמת משפטים","en":true,"source":"ספר אנגלית: מבוא (עמ' 5-9), השלמת משפטים – הסבר ותרגול פתוח (עמ' 13-17), יחידות 1-20 (עמ' 19-58)","rule":["בכל שאלת השלמת משפטים יש <b>רמז תוכני<\/b> בתוך המשפט עצמו – מילה או חלק משפט שמכתיבים מה חסר. השאלות לא בודקות ידע כללי: לא צריך לדעת היסטוריה או ביולוגיה, רק לקרוא נכון את הרמז.","שיטת העבודה של הקורס: קרא את המשפט, תרגם אותו בראש לעברית, <b>עצור<\/b> ונסח לעצמך השלמה (אפילו בעברית) <b>לפני<\/b> שאתה מסתכל על התשובות. רק אז עבור על ארבע האפשרויות וחפש מילה שמשמעותה דומה לניחוש שלך. בסוף קרא את המשפט המלא וודא שהוא הגיוני.","ארבע התשובות תמיד מאותו חלק דיבר, ואין ביניהן קשר של משמעות (לא מילים נרדפות ולא הפכים). לכן רק תשובה אחת מתאימה בכלל, והאחרות פשוט לא משתלבות במשפט. 8 השאלות מסודרות מהקלה לקשה, ומומלץ להקדיש כחצי דקה לשאלה."],"f":["קרא ← תרגם בראש ← נחש השלמה ← רק אז התשובות ← קרא שוב את המשפט המלא","רמז תוכני = מילה במשפט שקשורה לחסר (painters ← art)","אין צורך בידע כללי – התשובה נובעת מהמשפט","מצאת מילה מוכרת שמתאימה לניחוש? זו התשובה, גם אם יש לידה מילים לא מוכרות"],"traps":["לקפוץ לתשובות מיד: תשובות שנראות דומות (in…ible / in…ent) מבלבלות ומבזבזות זמן","לבחור מילה קשה ולא מוכרת רק כי היא 'נשמעת חכמה'","להסתמך על ידע כללי במקום על הרמז שבמשפט","לקרוא רק חצי משפט – לעיתים הרמז נמצא בחלק השני, אחרי פסיק או נקודה-פסיק"],"ex":{"q":"After decades of colonial rule, the island finally gained its ______ in 1962, and its first president was elected that same year.","pt":null,"steps":["תרגום בראש: 'אחרי עשרות שנים של שלטון קולוניאלי, האי השיג סוף סוף את ה___ שלו ב־1962, ונשיאו הראשון נבחר באותה שנה'.","הרמז: <b>colonial rule<\/b> בצד אחד ו־<b>first president<\/b> בצד השני. מה מקבלים אחרי שלטון זר? עצמאות. הניחוש שלי: <b>independence<\/b>.","רק עכשיו עוברים על התשובות ומחפשים מילה שפירושה 'עצמאות' (independence / sovereignty). כל שאר המילים, מוכרות או לא, לא מעניינות אותי.","בדיקה: קוראים את המשפט המלא עם המילה שבחרתי – הוא הגיוני, וזו התשובה."]},"g":{"q":"Bees play a central role in agriculture because they ______ many of the crops that people eat.","pt":null,"o":["pollinate","decorate","translate","postpone"],"a":0,"g":["מה הקשר בין דבורים לבין יבולים? מה דבורים עושות לפרחים?","חפש פועל שפירושו 'מאביקות'. נסה לתרגם כל אפשרות ולהציב אותה במשפט."],"x":"pollinate = מאביקות. הרמז הוא bees יחד עם crops: דבורים מעבירות אבקה בין פרחים, וכך היבולים מתפתחים. decorate (מקשטות), translate (מתרגמות) ו־postpone (דוחות) לא משתלבות במשפט בכלל."},"solo":{"q":"Unlike most reptiles, which lay eggs, some snakes give birth to live ______.","pt":null,"o":["fossils","offspring","climates","shadows"],"a":1,"x":"offspring = צאצאים. הרמזים הם lay eggs ו־give birth: מדובר על הולדה. Unlike מסמן ניגוד בין הטלת ביצים לבין לידה של צאצאים חיים. fossils (מאובנים) מפתה כי היא 'מדעית', אבל מאובנים לא נולדים."},"bank":[{"t":"רמז תוכני","lvl":1,"q":"The museum's new exhibit features paintings and ______ by artists from across Latin America.","pt":null,"table":null,"o":["sculptures","vaccines","harvests","verdicts"],"a":0,"x":"sculptures = פסלים. הרמזים paintings, artists ו־museum מראים שחסר עוד סוג של יצירת אמנות. חיסונים, יבולים ופסקי דין לא מוצגים בתערוכה של אמנים."},{"t":"רמז תוכני","lvl":1,"q":"A healthy adult's heart at rest beats between 60 and 100 times per ______.","pt":null,"table":null,"o":["mile","degree","minute","gallon"],"a":2,"x":"minute = דקה. הביטוי times per אחרי טווח מספרים של פעימות דורש יחידת זמן, ו־minute היא יחידת הזמן היחידה בין התשובות. mile (מייל), degree (מעלה) ו־gallon (גלון) הן יחידות של מרחק, טמפרטורה ונפח."},{"t":"רמז תוכני","lvl":2,"q":"Because the bridge had been badly ______ by the earthquake, engineers closed it to all traffic.","pt":null,"table":null,"o":["elected","admired","damaged","rehearsed"],"a":2,"x":"damaged = ניזוק. הרמזים הם earthquake ו־closed it: רעידת אדמה גרמה לגשר משהו רע, ולכן סגרו אותו. elected (נבחר), admired (זכה להערצה) ו־rehearsed (עבר חזרות) לא מתאימים לגשר ולרעידת אדמה."},{"t":"רמז תוכני","lvl":2,"q":"Polar bears have a thick layer of fat that ______ them from the extreme cold of the Arctic.","pt":null,"table":null,"o":["insults","insulates","inspects","inherits"],"a":1,"x":"insulates = מבודדת. שכבת שומן עבה שומרת על הדוב מפני הקור. כל התשובות מתחילות ב־ins ונראות דומות, וזה בדיוק המקרה שבו כדאי לנחש לפני שמסתכלים: 'מגינה/מבודדת'. insults (מעליבה), inspects (בודקת) ו־inherits (יורשת) לא הגיוניות."},{"t":"רמז תוכני","lvl":3,"q":"The ancient city was so well ______ under layers of volcanic ash that archaeologists found loaves of bread still in the ovens.","pt":null,"table":null,"o":["abandoned","exaggerated","preserved","negotiated"],"a":2,"x":"preserved = נשמרה. המבנה so well … that מראה שהחסר הוא הסיבה לכך שנמצא לחם שלם בתנורים: העיר נשמרה היטב. abandoned (ננטשה) מפתה כי ערים כאלה אכן ננטשו, אבל 'ננטשה כל כך טוב' לא מסביר את הלחם השלם."},{"t":"רמז תוכני","lvl":3,"q":"Early maps of the region were notoriously ______, often placing rivers and mountains dozens of miles from their actual locations.","pt":null,"table":null,"o":["generous","fragile","obedient","inaccurate"],"a":3,"x":"inaccurate = לא מדויקות. החלק שאחרי הפסיק מסביר את החסר: נהרות והרים סומנו עשרות מיילים ממקומם. fragile (שבירות) מפתה כי מפות ישנות באמת שבירות, אבל זה לא מה שהחלק השני של המשפט מתאר."},{"t":"רמז בהסבר שאחרי ;","lvl":4,"q":"The senator's speech was deliberately ______; she avoided committing to any position so that neither side could criticize her.","pt":null,"table":null,"o":["nocturnal","ambiguous","perishable","meticulous"],"a":1,"x":"ambiguous = עמום, דו־משמעי. הנקודה-פסיק מבשרת שהחלק השני מסביר את החסר: היא נמנעה מלהתחייב לעמדה כלשהי, כלומר דיברה בעמימות. meticulous (קפדני) הוא תכונה טובה של נאום, אבל לא מתאים להסבר. nocturnal (לילי) ו־perishable (מתקלקל) לא מתאימים לנאום בכלל."},{"t":"רמז מורכב","lvl":5,"q":"Although the drug proved effective in laboratory trials, its use in patients was ______ by severe side effects that appeared only after months of treatment.","pt":null,"table":null,"o":["vindicated","replenished","curtailed","embellished"],"a":2,"x":"curtailed = הוגבל, צומצם. Although מסמן ניגוד: התרופה הצליחה במעבדה, אבל תופעות לוואי קשות פגעו בשימוש בה. vindicated (הוצדק) הפוך לכיוון שהמשפט דורש. replenished (חודש, מולא מחדש) ו־embellished (קושט) לא משתלבים בהיגיון של המשפט."}]},{"id":"eng-sc-connectors","title":"Sentence Completion: מילות קישור וכיוון המשפט","tag":"השלמת משפטים","en":true,"source":"ספר אנגלית: מבוא – 'התמקדות במבנה ובלוגיקה' (עמ' 8), השלמת משפטים (עמ' 13-17), יחידות 1-20 (עמ' 19-58)","rule":["חלק גדול מהרמזים הוא <b>מבני<\/b>: מילת קישור שקובעת את היחס בין שני חלקי המשפט. <b>ניגוד<\/b> (but, although, despite, however, unlike, while) – החסר הפוך בכיוונו לחלק האחר. <b>סיבה ותוצאה<\/b> (because, since, therefore, so…that, as a result) – החסר גורם לחלק האחר או נובע ממנו. <b>הוספה<\/b> (and, also, moreover, not only… but also) – החסר באותו כיוון.","טריק שימושי: תן ל'חור' <b>מטען<\/b> – חיובי או שלילי – לפי מילת הקישור, עוד לפני שאתה יודע מה המילה המדויקת. למשל: 'למרות שהאולם היה קטן, ההופעה הייתה ___' ← משהו חיובי. כך אפשר לפסול חלק מהתשובות גם בלי להבין את כולן.","לפעמים החסר הוא מילת הקישור עצמה. אז שאל: מה היחס בין שני החלקים? אם החלק השני מפתיע ביחס לראשון – ניגוד; אם הוא מסביר אותו – סיבה; אם הוא נובע ממנו – תוצאה. הקורס ממליץ להקיף את מילות הקישור כבר בקריאה הראשונה, ולשים לב גם לסימני פיסוק: נקודה-פסיק ונקודתיים מבשרים לרוב הסבר או הרחבה."],"f":["ניגוד: but, although, though, despite, however, yet, while, unlike, nevertheless","סיבה ← תוצאה: because, since, due to / therefore, thus, consequently, so…that","הוספה: and, moreover, furthermore, also, not only… but also","; או : ← החלק השני מסביר את הראשון"],"traps":["despite / because of באים לפני שם עצם, although / because לפני משפט שלם – כשהחסר הוא מילת קישור, גם הדקדוק פוסל תשובות","לפספס שלילה (not, by no means, far from) שהופכת את המטען של החסר","לבלבל בין because (סיבה) לבין therefore (תוצאה) – הכיוון הפוך","while יכול לסמן זמן ('בזמן ש') או ניגוד ('בעוד ש') – הכרע לפי ההקשר"],"ex":{"q":"Although the new phone is ______ than earlier models, it sold poorly because of its high price.","pt":null,"steps":["סמן את מילת הקישור: <b>Although<\/b> = למרות ש – יש ניגוד בין שני חלקי המשפט.","החלק השני שלילי (הטלפון נמכר גרוע). לכן החסר חייב להיות <b>חיובי<\/b> – משהו טוב בטלפון, למשל 'מתקדם יותר'.","בתשובות מחפשים מילה חיובית בצורת השוואה (more advanced / superior) ופוסלים מיד כל מילה שלילית (כמו slower או heavier).","בדיקה: 'למרות שהטלפון מתקדם יותר מהדגמים הקודמים, הוא נמכר גרוע בגלל המחיר' – יש ניגוד והמשפט הגיוני."]},"g":{"q":"The hikers were exhausted after the long climb; ______, they continued walking until they reached the summit.","pt":null,"o":["therefore","nevertheless","for example","similarly"],"a":1,"g":["מה היחס בין 'היו מותשים' לבין 'המשיכו ללכת עד הפסגה'? זה צפוי או מפתיע?","מפתיע = ניגוד. חפש מילת קישור שמבטאת ניגוד."],"x":"nevertheless = למרות זאת. מטיילים מותשים היו אמורים לעצור, והם דווקא המשיכו – זה ניגוד. therefore (לכן) היה מתאים רק אם החלק השני היה תוצאה צפויה, למשל 'they stopped to rest'."},"solo":{"q":"The desert receives almost no rainfall; ______, very few plants can survive there.","pt":null,"o":["however","in contrast","consequently","meanwhile"],"a":2,"x":"consequently = כתוצאה מכך. מעט גשם הוא הסיבה, ומעט צמחים הם התוצאה. however ו־in contrast מבטאות ניגוד, אבל אין כאן הפתעה – זה בדיוק מה שצפוי. meanwhile (בינתיים) מבטאת זמן ולא סיבה."},"bank":[{"t":"ניגוד","lvl":1,"q":"Most birds can fly, ______ penguins and ostriches cannot.","pt":null,"table":null,"o":["because","but","so","therefore"],"a":1,"x":"but = אבל. רוב הציפורים עפות, ופינגווינים ויענים – לא: זה ניגוד. because, so ו־therefore מבטאות סיבה ותוצאה, ואין כאן קשר כזה."},{"t":"סיבה ותוצאה","lvl":1,"q":"The outdoor concert was moved indoors ______ the heavy rain.","pt":null,"table":null,"o":["although","unless","because of","despite"],"a":2,"x":"because of = בגלל. הגשם הוא הסיבה להעברת ההופעה פנימה. despite (למרות) הופכת את ההיגיון. although ו־unless לא יכולות לבוא לפני שם עצם בלבד (the heavy rain), ולכן גם הדקדוק פוסל אותן."},{"t":"מטען לפי ניגוד","lvl":2,"q":"Despite its small size, the hummingbird is a remarkably ______ traveler, migrating thousands of miles each year.","pt":null,"table":null,"o":["tireless","fragile","clumsy","reluctant"],"a":0,"x":"tireless = בלתי נלאה. Despite its small size מחייב ניגוד לגודל הקטן: משהו חזק ומרשים, וזה גם מה שמוסבר בסוף (נודד אלפי מיילים). fragile (שביר) הוא המלכודת – הוא ממשיך את 'קטן' במקום להיות מנוגד לו."},{"t":"הוספה","lvl":2,"q":"The new law not only reduced air pollution ______ improved public health in the city.","pt":null,"table":null,"o":["so that","even though","rather than","but also"],"a":3,"x":"but also = אלא גם. הצירוף not only מחייב להשלים אותו ב־but also. even though ו־rather than יוצרות ניגוד שאין לו מקום כאן, ו־so that (כדי ש) לא מתאימה דקדוקית לפני הפועל improved."},{"t":"ניגוד + מטען","lvl":3,"q":"While the critics dismissed the novel as shallow, readers found it ______ and bought it in record numbers.","pt":null,"table":null,"o":["tedious","obscure","profound","illegible"],"a":2,"x":"profound = עמוק. While מסמן כאן ניגוד בין המבקרים (שטחי) לבין הקוראים, ולכן החסר הפוך ל'שטחי' – וגם מסביר למה קנו את הספר בהמוניו. tedious (משעמם) ו־obscure (סתום) שליליים, ולא מתאימים לרכישה במספרי שיא."},{"t":"סיבה ותוצאה","lvl":3,"q":"Since the original documents were destroyed in a fire, historians must ______ on later copies to reconstruct the events.","pt":null,"table":null,"o":["object","rely","retire","frown"],"a":1,"x":"rely on = להסתמך על. Since מציג סיבה: המסמכים המקוריים נשרפו, ולכן ההיסטוריונים נאלצים להסתמך על עותקים מאוחרים. object (להתנגד), retire (לפרוש) ו־frown on (להסתייג מ־) לא יעזרו לשחזר את האירועים."},{"t":"שלילה הופכת מטען","lvl":4,"q":"The results were by no means ______; in fact, they confirmed exactly what the researchers had predicted.","pt":null,"table":null,"o":["conclusive","significant","accurate","unexpected"],"a":3,"x":"unexpected = בלתי צפויות. by no means = בשום אופן לא, ו־in fact מחזק את החלק הראשון: התוצאות אישרו בדיוק את התחזית, כלומר הן בשום אופן לא היו מפתיעות. conclusive, significant ו־accurate יוצרות 'התוצאות בכלל לא היו מדויקות/משמעותיות', וזה סותר את 'אישרו בדיוק'."},{"t":"שלילה הופכת מטען","lvl":5,"q":"Far from ______ the region's economy, the new highway drew business away from small towns, many of which never recovered.","pt":null,"table":null,"o":["stimulating","devastating","isolating","documenting"],"a":0,"x":"stimulating = מעודד, ממריץ. Far from X פירושו 'לא רק שלא X, אלא ההפך'. החלק השני שלילי (הכביש פגע בעיירות), ולכן החסר הוא מה שציפו שיקרה – שהכביש יעודד את הכלכלה. devastating הוא המלכודת: הוא באותו כיוון כמו החלק השני, ו־far from דורש כיוון הפוך."}]},{"id":"eng-sc-wordparts","title":"Sentence Completion: פירוק מילים ומילים קשות","tag":"השלמת משפטים","en":true,"source":"ספר אנגלית: מבוא – אוצר מילים ו'שימוש בהיגיון לפיצוי על פערי ידע' (עמ' 7-8), השלמת משפטים – דגשים (עמ' 13, 17), יחידות מתקדמות (עמ' 40-58)","rule":["מילים ארוכות רבות באנגלית בנויות מ־<b>תחילית + שלד + סופית<\/b>. לעיתים קרובות אתה מכיר את השלד אבל לא מזהה אותו בתוך מילה ארוכה (unforgettable = un + forget + able). הקורס מסכם: <b>'את התחיליות לדעת, את הסופיות להכיר'<\/b> – תחילית ושלד מספיקים בדרך כלל כדי להבין את הכיוון.","בשאלות האחרונות של המקטע גם המשפט וגם התשובות קשים. שם משלבים שני כלים: קודם מחליטים מה המשמעות או המטען של החסר (לפי הרמז), ואחר כך מפרקים כל תשובה ובודקים אם הכיוון שלה מתאים. תחיליות שלילה (un-, in-, im-, dis-, non-) או הסופית less- (בלי) מאפשרות לפסול מהר.","זכור גם את עיקרון הקורס 'שימוש בהיגיון כדי לפצות על פערי ידע': גם אם מילה במשפט לא מוכרת לך, מילה מוכרת אחרת לידה (כמו medicine ליד physicians) מספיקה כדי להבין מה חסר."],"f":["un-, in-, im-, il-, ir-, dis-, non- = לא; mis- = בטעות","-less = בלי; -ful = מלא ב־; -able / -ible = שאפשר ל־","re- = שוב; pre- = לפני; post- = אחרי","inter- = בין; trans- = מעבר; sub- = מתחת; bio- = חיים"],"traps":["in- לא תמיד שלילה: invaluable = יקר מפז, inflammable = דליק","מילים שנראות דומות (insulate / insult) – השלד קובע, לא הצליל","לנחש לפי צליל: physicians הם רופאים, לא פיזיקאים","לפסול מילה מוכרת רק כי היא 'קלה מדי' – לפעמים התשובה הקלה היא הנכונה"],"ex":{"q":"The instructions were so ______ that even the engineers could not figure out how to assemble the machine.","pt":null,"steps":["הרמז: so … that <b>even the engineers could not<\/b> – החסר שלילי, משהו כמו 'לא מובנות'.","נניח שבתשובות מופיעה המילה incomprehensible ואתה לא מכיר אותה. פרק: <b>in<\/b> (לא) + <b>comprehens<\/b> (להבין, כמו comprehension) + <b>ible<\/b> (שאפשר) = 'שאי אפשר להבין'.","שים לב למלכודת: comprehensive (מקיף) – אותו שלד, אבל בלי שלילה ובמשמעות אחרת. הוראות מקיפות לא היו מבלבלות מהנדסים.","בדיקה: 'ההוראות היו כל כך לא מובנות, שאפילו המהנדסים לא הצליחו להבין איך להרכיב את המכונה' – הגיוני."]},"g":{"q":"Many ancient manuscripts are ______; scholars have tried for centuries but still cannot read the faded writing.","pt":null,"o":["portable","illegible","reliable","edible"],"a":1,"g":["האם החסר חיובי או שלילי? מה פירוש cannot read?","חפש מילה עם תחילית שלילה ושלד שקשור לקריאה (leg, כמו ב־legible)."],"x":"illegible = שאי אפשר לקרוא. il (לא) + leg (קריאה, כמו legible) + ible (שאפשר). החלק שאחרי הנקודה-פסיק מסביר: אי אפשר לקרוא את הכתב הדהוי. portable (נייד), reliable (אמין) ו־edible (אכיל) לא קשורות לקושי בקריאה."},"solo":{"q":"Because the new plastic is ______, it breaks down naturally in the soil within a few months instead of remaining there for centuries.","pt":null,"o":["waterproof","transparent","biodegradable","rechargeable"],"a":2,"x":"biodegradable = מתכלה. bio (חיים, טבע) + degrade (להתפרק) + able (שאפשר) = 'שמתפרק באופן טבעי', וזה בדיוק מה שהחלק השני מתאר. waterproof (עמיד למים), transparent (שקוף) ו־rechargeable (נטען) לא מסבירות התפרקות באדמה."},"bank":[{"t":"סופית less-","lvl":1,"q":"The old bridge is now ______, so drivers must use the new one built next to it.","pt":null,"table":null,"o":["harmless","useless","fearless","priceless"],"a":1,"x":"useless = חסר תועלת, שאי אפשר להשתמש בו. use + less (בלי). לכן הנהגים חייבים להשתמש בגשר החדש. harmless (לא מזיק), fearless (חסר פחד) ו־priceless (יקר מפז) לא מסבירות למה צריך גשר אחר."},{"t":"תחילית re-","lvl":1,"q":"After the storm destroyed the town's library, volunteers helped to ______ it within a year.","pt":null,"table":null,"o":["rebuild","misread","preview","outnumber"],"a":0,"x":"rebuild = לבנות מחדש. re (שוב) + build (לבנות). אחרי שהסופה הרסה את הספרייה, מתנדבים עזרו לבנות אותה שוב. misread (לקרוא לא נכון), preview (לצפות מראש) ו־outnumber (לעלות במספר על) לא מתאימות."},{"t":"תחילית mis-","lvl":2,"q":"The letter never arrived because it had been ______ to an old address.","pt":null,"table":null,"o":["overpaid","prescribed","misdirected","uncovered"],"a":2,"x":"misdirected = נשלח ליעד הלא נכון. mis (בטעות) + directed (הופנה). זו הסיבה שהמכתב לא הגיע. overpaid (שולם ביתר), prescribed (נרשם במרשם) ו־uncovered (נחשף) לא מתאימות ל'אל כתובת ישנה'."},{"t":"תחילית inter-","lvl":2,"q":"The conference was truly ______, with participants from more than forty countries.","pt":null,"table":null,"o":["intermittent","international","interior","interrupted"],"a":1,"x":"international = בינלאומי. inter (בין) + national (לאומי). משתתפים מיותר מארבעים מדינות. כל התשובות מתחילות ב־inter כדי לבלבל: intermittent (לסירוגין), interior (פנימי) ו־interrupted (שנקטע) לא מוסברות על ידי משתתפים ממדינות רבות."},{"t":"in- שאינה שלילה","lvl":3,"q":"The volunteers' help was ______; without it, the rescue would have failed completely.","pt":null,"table":null,"o":["invisible","incidental","inaudible","invaluable"],"a":3,"x":"invaluable = יקר מפז, חשוב מאוד. זו מלכודת קלאסית: in כאן לא הופכת את value ל'חסר ערך', אלא פירושה 'שאי אפשר להעריך את ערכו'. ההסבר (בלי העזרה החילוץ היה נכשל) מאשר שמדובר בעזרה חיונית. incidental (שולי) סותר את ההסבר."},{"t":"שלד מוכר","lvl":3,"q":"Because the comet passes close to Earth only once every 76 years, most people see it just once in their lives, when it becomes ______ in the night sky.","pt":null,"table":null,"o":["edible","audible","visible","flexible"],"a":2,"x":"visible = נראה לעין. vis (ראייה, כמו vision) + ible (שאפשר). אנשים 'רואים' את השביט כשהוא נראה בשמי הלילה. audible (נשמע) נשמע דומה, אבל שביט לא נשמע. edible (אכיל) ו־flexible (גמיש) לא קשורות."},{"t":"פירוק מילה קשה","lvl":4,"q":"The witness's account was ______: every detail she gave was later confirmed by video footage.","pt":null,"table":null,"o":["irrelevant","irrefutable","irregular","irresponsible"],"a":1,"x":"irrefutable = שאי אפשר להפריך. ir (לא) + refute (להפריך) + able (שאפשר). הנקודתיים מבשרים הסבר: כל פרט אושר בצילומים. irrelevant (לא רלוונטי), irregular (לא סדיר) ו־irresponsible (חסר אחריות) לא מוסברים על ידי אישור הפרטים."},{"t":"פירוק מילה קשה","lvl":5,"q":"Critics described the policy as ______, arguing that it had been introduced too early, before anyone had studied its possible consequences.","pt":null,"table":null,"o":["posthumous","transparent","subterranean","premature"],"a":3,"x":"premature = מוקדם מדי, בטרם עת. pre (לפני) + mature (בשל). ההסבר: המדיניות הוכנסה מוקדם מדי. posthumous (לאחר המוות), transparent (שקוף) ו־subterranean (תת־קרקעי) – תחיליות אחרות ומשמעויות שלא מתאימות להסבר."}]},{"id":"eng-rs-meaning","title":"Restatements: לשמור על הרעיון, לא על המילים","tag":"ניסוח מחדש","en":true,"source":"ספר אנגלית: ניסוח מחדש – הסבר ותרגול (עמ' 105-114), יחידות 1-18 (עמ' 115-150)","rule":["במקטע השני (4 שאלות, כדקה לשאלה) מופיע משפט, ועליך לבחור את הניסוח שמביע <b>את אותו רעיון<\/b>. הרעיון הוא העיקר, ובחירת המילים היא הטפל: אותן מילים בדיוק יכולות להביע רעיון אחר (Nice John loves Jane ≠ Jane loves nice John), ומילים שונות לגמרי יכולות להביע אותו רעיון.","הקורס מונה ארבע דרכים לנסח מחדש: <b>שינוי סדר מילים<\/b> (In 2009, John met Jane), <b>מילים נרדפות<\/b> (smart ← intelligent), <b>החלפת מילים<\/b> במילים לא נרדפות ששומרות על המשמעות (vegetarian ← does not eat meat), ו<b>שינוי מבנה המשפט<\/b> – למשל מפעיל לסביל.","שיטת העבודה: קרא, תרגם בראש והבן את המבנה – מי עושה מה, ומה היחס בין החלקים. כשיש סיבה ותוצאה, כתוב לעצמך חץ: סיבה ← תוצאה. מותר שהתשובה תציג קודם את התוצאה (results from, is caused by), אבל אסור שהיא תהפוך את הכיוון. תשובה נכונה יכולה להשמיט פרט שולי, אבל לעולם לא מוסיפה מידע."],"f":["A causes B = B results from A = B is caused by A = B is the outcome of A","A leads to / results in B ≠ A results from B","פעיל ↔ סביל: X wrote Y = Y was written by X","Never was X more Y than in Z = at no other time was X as Y as in Z"],"traps":["תשובה עם אותן מילים בדיוק, אבל בתפקידים הפוכים (מי עשה למי)","היפוך סיבה ותוצאה: results in מול results from","לפסול תשובה רק כי היא נראית שונה מאוד מהמשפט, למרות שהיא אומרת בדיוק את אותו דבר","תשובה שמשמיטה פרט נכונה רק אם אין תשובה מלאה יותר"],"ex":{"q":"Air pollution is responsible for many cases of asthma in children.","pt":null,"steps":["חלץ את הרעיון: זיהום אוויר ← אסתמה אצל ילדים (סיבה ← תוצאה). שים לב גם ל־<b>many<\/b>: הרבה מקרים, לא כולם.","תשובה כמו 'Asthma in children is responsible for much air pollution' – אותן מילים, כיוון הפוך: <b>נפסלת<\/b>.","תשובה כמו 'Many children develop asthma as a result of polluted air' – מתחילה בתוצאה ומשתמשת במילים אחרות, אבל הכיוון והכמות נשמרו: <b>מתאימה<\/b>.","תשובה כמו 'Air pollution is linked to asthma' – רק 'יש קשר', בלי כיוון ובלי כמות: חלשה מדי כשיש תשובה מלאה יותר."]},"g":{"q":"The Great Wall of China was built over many centuries by several different dynasties.","pt":null,"o":["Several dynasties were built along the Great Wall of China.","Construction of the Great Wall of China spanned centuries and involved a number of dynasties.","The Great Wall of China was built in a single century by one powerful dynasty.","Many centuries ago, the Great Wall of China divided several different dynasties."],"a":1,"g":["מי בנה? מה נבנה? כמה זמן זה לקח?","חפש תשובה שבה החומה היא הדבר שנבנה, לאורך מאות שנים, על ידי כמה שושלות – גם אם המילים שונות."],"x":"הנכונה משתמשת במבנה אחר (construction spanned = הבנייה נמשכה) ובמילה נרדפת (a number of = several), אבל שומרת על הכול: החומה נבנתה, לאורך מאות שנים, על ידי כמה שושלות. בתשובה שבה השושלות 'נבנו' התפקידים התהפכו, תשובה אחרת סותרת (מאה אחת, שושלת אחת), והתשובה על 'divided' מוסיפה מידע (החומה חילקה בין שושלות)."},"solo":{"q":"Few scientists today doubt that the dinosaurs became extinct after a large asteroid struck the Earth.","pt":null,"o":["Few scientists today have studied the asteroid that struck the Earth before the dinosaurs became extinct.","Scientists today doubt that an asteroid had anything to do with the extinction of the dinosaurs.","A large asteroid struck the Earth after the dinosaurs had become extinct.","Most scientists today believe that the dinosaurs' extinction followed the impact of a large asteroid."],"a":3,"x":"few doubt (מעטים מטילים ספק) = most believe (רובם מאמינים), ו'נכחדו אחרי הפגיעה' = 'ההכחדה באה בעקבות הפגיעה'. בתשובה על 'Few scientists have studied' המילים few ו־scientists נשארו, אבל הרעיון השתנה לגמרי (סלט מילים). התשובה ש'מדענים מטילים ספק' הופכת את המשמעות, והתשובה על 'after the dinosaurs had become extinct' הופכת את סדר האירועים."},"bank":[{"t":"פעיל ↔ סביל","lvl":1,"q":"Marie Curie discovered the element polonium in 1898.","pt":null,"table":null,"o":["Polonium was discovered by Marie Curie in 1898.","Marie Curie discovered several elements in 1898, including polonium.","In 1898, the element polonium was named after Marie Curie.","Marie Curie was born in 1898, the year polonium was discovered."],"a":0,"x":"הנכונה היא אותו משפט בסביל: פולוניום התגלה על ידי מארי קירי ב־1898. בתשובה על 'כמה יסודות' יש מידע נוסף, בתשובה על 'נקרא על שמה' יש מידע אחר, ובאחרונה 1898 הפכה לשנת הלידה שלה – שינוי משמעות."},{"t":"מידע נוסף","lvl":1,"q":"The museum is closed on Mondays.","pt":null,"table":null,"o":["The museum is open every day except Monday.","The museum is closed on Mondays and holidays.","The museum does not open its doors on Mondays.","On Mondays, the museum closes early."],"a":2,"x":"does not open its doors = is closed (החלפת מילים). התשובה 'open every day except Monday' מפתה, אבל מוסיפה מידע שלא נאמר – שבכל שאר הימים המוזיאון פתוח. 'and holidays' מוסיפה מידע, ו'closes early' משנה את המשמעות (נסגר מוקדם ולא סגור)."},{"t":"סיבה ותוצאה","lvl":2,"q":"Heavy rains in the mountains often lead to flooding in the valley below.","pt":null,"table":null,"o":["Flooding in the valley often causes heavy rains in the mountains.","Flooding in the valley below is frequently the result of heavy rains in the mountains.","Heavy rains in the mountains always flood the valley below.","Heavy rains fall more often in the mountains than in the valley below."],"a":1,"x":"גשם ← הצפה. הנכונה מתחילה בתוצאה (flooding is the result of heavy rains), אבל הכיוון נשמר, ו־frequently = often. בתשובה עם causes הכיוון התהפך, בתשובה עם always יש הקצנה, והתשובה על 'more often in the mountains' משווה כמויות גשם – רעיון אחר."},{"t":"החלפת מילים","lvl":2,"q":"Unlike her brother, Sarah has never left the town where she was born.","pt":null,"table":null,"o":["Sarah and her brother both still live in the town where they were born.","Sarah left her hometown before her brother did.","Sarah's brother has never visited the town where Sarah lives.","Sarah's brother has left the town where he was born, but Sarah never has."],"a":3,"x":"Unlike her brother אומר שאחיה כן עזב, והיא – מעולם לא. הנכונה מפרקת את זה לשני חלקים עם but (ניגוד נשמר). התשובה ששניהם עדיין גרים שם מתעלמת מ־Unlike, 'Sarah left her hometown' אומרת שהיא עזבה, ו־'never visited' מוסיפה מידע על ביקורים."},{"t":"מבנה Never was","lvl":3,"q":"Never was the city's population larger than at the end of the nineteenth century.","pt":null,"table":null,"o":["The city's population grew fastest at the end of the nineteenth century.","At the end of the nineteenth century, the city was larger than any other city.","At no other time was the city's population as large as at the end of the nineteenth century.","The city's population has never been large, even at the end of the nineteenth century."],"a":2,"x":"Never was X larger than at Z = בשום זמן אחר X לא היה גדול כמו ב־Z, כלומר אז האוכלוסייה הייתה בשיאה. 'grew fastest' מדברת על קצב ולא על גודל, 'larger than any other city' משווה לערים אחרות (מידע נוסף), ו־'has never been large' מפרשת את never כ'אף פעם לא הייתה גדולה' – הבנה שגויה של המבנה."},{"t":"הקצנה ושמירה על הסתייגות","lvl":3,"q":"Some researchers believe that regular exercise may slow the effects of aging on the brain.","pt":null,"table":null,"o":["According to some researchers, the brain's aging process might be slowed by regular exercise.","Regular exercise prevents the brain from aging.","Researchers agree that exercise is the best way to slow aging.","Some researchers believe that aging makes regular exercise harder."],"a":0,"x":"המשפט מסויג פעמיים: some researchers (רק חלק) ו־may (אולי). הנכונה שומרת על שתי ההסתייגויות (according to some researchers, might), ועוברת לסביל. 'prevents' מקצינה (מונעת לגמרי), 'Researchers agree… the best way' מקצינה ומוסיפה, ו־'aging makes regular exercise harder' הופכת סיבה ותוצאה."},{"t":"ניגוד + אוצר מילים","lvl":4,"q":"Although the expedition failed to reach the summit, it collected data that proved invaluable to later climbers.","pt":null,"table":null,"o":["Because the expedition collected valuable data, it was unable to reach the summit.","Later climbers reached the summit by using data from an earlier, successful expedition.","The data collected by the expedition was of little value, since it never reached the summit.","The expedition did not reach the summit, but the information it gathered was extremely useful to those who climbed after it."],"a":3,"x":"Although = ניגוד, ו־invaluable = יקר ערך מאוד (לא 'חסר ערך'!). הנכונה שומרת על הניגוד באמצעות but. Because יוצר קשר סיבתי שלא קיים, התשובה על משלחת 'successful' (שהצליחה) סותרת את failed, ו־'of little value' נופלת במלכודת של invaluable."},{"t":"מבנה not until","lvl":5,"q":"It was not until the invention of the printing press that books became affordable to ordinary people.","pt":null,"table":null,"o":["Ordinary people could afford books even before the printing press was invented.","The printing press was invented so that ordinary people could afford books.","Only after the printing press was invented could ordinary people afford books.","Once books became affordable, ordinary people invented the printing press."],"a":2,"x":"It was not until X that Y = רק אחרי X קרה Y. הנכונה אומרת בדיוק את זה עם only after. התשובה עם even before סותרת, התשובה עם so that מוסיפה מטרה שלא נאמרה (הדפוס הומצא כדי ש־), ו־'ordinary people invented the printing press' הופכת את סדר האירועים."}]},{"id":"eng-rs-eliminate","title":"Restatements: ארגז הכלים לפסילת תשובות","tag":"ניסוח מחדש","en":true,"source":"ספר אנגלית: ניסוח מחדש – 'איך פוסלים תשובות' ו'ארגז כלים' (עמ' 108-114), יחידות 1-18 (עמ' 115-150)","rule":["בניסוח מחדש עובדים <b>בפסילה<\/b>: עוברים על כל ארבע התשובות ופוסלים, גם אחרי שמצאת תשובה שנראית נכונה (אלא אם הזמן ממש לוחץ). ואם פסלת שלוש – קרא בכל זאת את הרביעית עד הסוף, כדי לוודא שהיא באמת אומרת את מה שהמשפט אומר.","שלוש עילות פסילה מרכזיות: <b>(1) מידע נוסף<\/b> – פרט שלא נאמר, כולל 'סלט מילים' שמערבב את חלקי המשפט (מה מתאר את מה, מי עשה מה). <b>(2) מבנה משפט<\/b> – אם יש ניגוד, הוספה, זמן או סיבה, אותו יחס חייב להישמר; מילת קישור ממשפחה אחרת = פסילה. <b>(3) הקצנה / נחרצות<\/b> – some הופך ל־all, may ל־always, often ל־never.","כלי עזר מהקורס: <b>בלוקים<\/b> – שמות (אנשים, מקומות, יצירות), מילים קשות שלא משפיעות על המבנה, ורצפים של פריטים. החלף אותם בראש באות ('ה־A האיסלנדי') ובדוק רק את המבנה. ועוד: הקפת מילות קישור, הפרדת חלקי המשפט בלוכסן, 'תקציר' בעברית לכל חלק במשפט ארוך, ו<b>הבנה דרך התשובות<\/b> – לפעמים התשובות עצמן מתרגמות לך מילה קשה."],"f":["פוסלים על: מידע נוסף / שינוי היחס בין החלקים / הקצנה","some ≠ all; may ≠ will; often ≠ always; few ≠ none","בלוק = שם או מילה קשה שאפשר להחליף באות","משפט ארוך? חלק בלוכסנים ותן לכל חלק תקציר בעברית"],"traps":["לעצור בתשובה הראשונה שנראית טוב – תשובה עם הקצנה קטנה נראית כמעט מושלמת","להיתקע על מילה קשה במשפט במקום להתייחס אליה כבלוק","לפספס שינוי זמן: was once rejected מול is still rejected","תשובה שמוסיפה 'כי' / 'כדי' – קשר סיבתי או מטרה שלא הופיעו במקור"],"ex":{"q":"The Icelandic sagas, written in the thirteenth century, describe events that took place some three hundred years earlier.","pt":null,"steps":["בלוק: The Icelandic sagas = A. המשפט בפשטות: A נכתבו במאה ה־13 ומתארים אירועים שקרו כ־300 שנה לפני כן. חלק בלוכסן: A / נכתבו במאה ה־13 / מתארים אירועים מוקדמים ב־300 שנה.","תשובה כמו 'A, which date from the thirteenth century, deal with events that happened roughly three centuries before they were written' – שומרת על כל החלקים: <b>מתאימה<\/b>.","תשובה כמו 'A describe events of the thirteenth century' – מערבבת: זמן הכתיבה הפך לזמן האירועים. <b>סלט מילים – נפסלת<\/b>.","תשובה כמו 'A are the most accurate record of early Icelandic history' – <b>מידע נוסף והקצנה – נפסלת<\/b>."]},"g":{"q":"Some species of bats can live for more than thirty years.","pt":null,"o":["All bats live for over thirty years.","Some bats live thirty years longer than other animals.","Certain types of bats are able to live longer than three decades.","Bats that live for thirty years are a rare species."],"a":2,"g":["כמה עטלפים? מה בדיוק נאמר על שלושים שנה?","פסול תשובה שמקצינה (All) או שמוסיפה מידע חדש. מה נשאר?"],"x":"Certain types = Some species, ו־three decades = thirty years. 'All bats' היא הקצנה, התשובה על 'thirty years longer than other animals' מערבבת ומוסיפה השוואה, ו־'a rare species' מוסיפה מידע (מין נדיר)."},"solo":{"q":"Although Antarctica is covered in ice, it is classified as a desert because it receives very little precipitation.","pt":null,"o":["Despite its ice cover, Antarctica is considered a desert, since very little precipitation falls there.","Antarctica is classified as a desert because it is covered in ice.","Antarctica, which receives little precipitation, is the largest desert in the world.","Antarctica receives very little precipitation; therefore, it is covered in ice."],"a":0,"x":"במשפט שני יחסים: ניגוד (Although – קרח מול מדבר) וסיבה (because – מעט משקעים). הנכונה שומרת על שניהם (Despite, since). התשובה שאומרת שהיא מדבר 'בגלל הקרח' מחליפה את הסיבה, 'the largest desert' מוסיפה מידע, ו־'therefore, it is covered in ice' יוצרת קשר סיבתי חדש בין משקעים לקרח."},"bank":[{"t":"הקצנה","lvl":1,"q":"Many people find it difficult to fall asleep after drinking coffee in the evening.","pt":null,"table":null,"o":["Coffee in the evening always prevents people from sleeping.","Many people drink coffee in the evening because they cannot sleep.","People who cannot fall asleep should drink coffee in the evening.","Drinking coffee in the evening makes it hard for a lot of people to fall asleep."],"a":3,"x":"a lot of people = many people, ו־hard = difficult. always היא הקצנה (במקור – הרבה אנשים, לא תמיד ולא כולם). 'because they cannot sleep' הופכת סיבה ותוצאה, ו־'should drink coffee' מוסיפה המלצה שלא הופיעה."},{"t":"מידע נוסף","lvl":2,"q":"The Amazon River carries more water than any other river in the world.","pt":null,"table":null,"o":["The Amazon is the longest river in the world.","No other river in the world carries as much water as the Amazon.","The Amazon carries more water than any other river except the Nile.","The Amazon River provides water to more people than any other river."],"a":1,"x":"'אף נהר אחר לא נושא כמות מים כמו האמזונס' = האמזונס נושא יותר מים מכל נהר אחר. 'longest' מחליפה כמות מים באורך, 'except the Nile' סותרת את המקור, ו־'provides water to more people' מדברת על מספר אנשים – רעיון אחר."},{"t":"שמירה על ניגוד","lvl":2,"q":"The sculptor was famous during his lifetime, but his work was almost forgotten after his death.","pt":null,"table":null,"o":["Because the sculptor was famous, his work was forgotten after his death.","The sculptor's work became famous only after his death.","Although the sculptor was well known while alive, his work was largely forgotten once he died.","The sculptor was famous during his lifetime, and his work remained popular after his death."],"a":2,"x":"but מסמן ניגוד, והנכונה שומרת עליו עם Although; largely = almost. Because יוצר קשר סיבתי שלא קיים, 'became famous only after his death' הופכת את הסדר, ו־'remained popular' מוחקת את הניגוד ואומרת את ההפך."},{"t":"בלוקים","lvl":3,"q":"The axolotl, a salamander native to a few lakes near Mexico City, can regrow entire limbs.","pt":null,"table":null,"o":["Found in only a small number of lakes near Mexico City, the axolotl is a salamander capable of growing back whole limbs.","All salamanders native to Mexico City can regrow their limbs.","The axolotl lives in many lakes throughout Mexico and can regrow some of its organs.","Near Mexico City, a few lakes have been named after the axolotl."],"a":0,"x":"axolotl הוא בלוק (שם) – החלף אותו ב־A. A הוא סלמנדרה מכמה אגמים ליד מקסיקו סיטי, ומסוגל לגדל מחדש גפיים שלמות. הנכונה משתמשת במילים נרדפות (growing back = regrow, whole = entire). 'All salamanders' מכלילה, 'many lakes throughout Mexico' סותרת את a few lakes near Mexico City, ו־'named after the axolotl' מוסיפה מידע."},{"t":"זמן","lvl":3,"q":"The theory, which was once widely rejected, is now accepted by most physicists.","pt":null,"table":null,"o":["Most physicists have always accepted the theory.","A theory that many people once dismissed has since won the acceptance of the majority of physicists.","The theory is still rejected by most physicists.","The theory is accepted today by every physicist who once rejected it."],"a":1,"x":"יש כאן שני זמנים: פעם נדחתה, היום מקובלת. הנכונה שומרת על שניהם: once dismissed (פעם נדחתה), has since won the acceptance (ומאז התקבלה), the majority = most. 'always accepted' ו־'still rejected' מוחקות את השינוי בזמן, ו־every היא הקצנה."},{"t":"סלט מילים","lvl":4,"q":"The novelist, whose first book was rejected by eleven publishers, later won the country's most prestigious literary prize.","pt":null,"table":null,"o":["Eleven publishers rejected the novelist's prize-winning first book.","The novelist's first book won the country's most prestigious literary prize after being rejected eleven times.","Eleven publishers turned down the novelist's first book; later, the novelist received the nation's top literary award.","The novelist won eleven literary prizes after the first book was rejected."],"a":2,"x":"שני פרטים נפרדים: הספר הראשון נדחה על ידי 11 מו״לים, והסופר זכה מאוחר יותר בפרס. הנכונה שומרת עליהם בנפרד (turned down = rejected, top award = most prestigious prize). שתי תשובות מצמידות את הפרס לספר הראשון – סלט מילים שלא נאמר במקור, ו־'won eleven literary prizes' מעבירה את המספר 11 מהמו״לים לפרסים."},{"t":"שלילה והסתייגות","lvl":5,"q":"It is by no means certain that the ancient city was destroyed by an earthquake rather than by invaders.","pt":null,"table":null,"o":["It is certain that invaders, not an earthquake, destroyed the ancient city.","There is no certainty that an earthquake, and not an invasion, was what destroyed the ancient city.","The ancient city was destroyed by both an earthquake and invaders.","It is by no means certain that the ancient city was ever destroyed."],"a":1,"x":"המשפט לא קובע כלום – הוא אומר שלא בטוח שרעידת אדמה (ולא פולשים) החריבה את העיר. הנכונה שומרת על אי־הוודאות ועל הניגוד בין שתי האפשרויות. 'It is certain' הופכת אי־ודאות לוודאות, 'both' מוסיפה מידע, ו־'was ever destroyed' מעבירה את הספק לשאלה אם העיר בכלל נהרסה – ספק אחר."}]},{"id":"eng-rc-general","title":"Reading Comprehension: רעיון מרכזי ושאלות פסקה","tag":"הבנת הנקרא","en":true,"source":"ספר אנגלית: הבנת הנקרא – סוגי שאלות כלליות (עמ' 183-185), תרגול פסקאות (עמ' 190-199), יחידות תרגול (עמ' 200 ואילך)","rule":["במקטע השלישי יש שני קטעים (180-400 מילים), ואחרי כל אחד 5 שאלות – לפי סדר ההופעה בקטע, לא לפי קושי. כ־6 דקות לקטע, והקטע הראשון בדרך כלל קל יותר. כלל הקורס: שאלה <b>כללית<\/b> (על כל הקטע) – דלג והשאר לסוף; שאלה <b>ספציפית<\/b> (מילה, שורה, פסקה) – פתור מיד. כשתגיע לשאלה הכללית, כבר תכיר את רוב הקטע.","<b>שאלת רעיון מרכזי<\/b> (The text is mainly about / A good title for the text / The main purpose of the text): קרא לעומק רק את 'צמתי המידע' – הפסקה הראשונה והמשפט הראשון בכל פסקה – ורפרף על השאר. הרעיון המרכזי חוזר לאורך כל הקטע, ולכן מילה לא מוכרת פה ושם לא תפיל אותך.","<b>שאלת פסקה<\/b> (The second paragraph mainly discusses / The main purpose of the last paragraph): התשובה מתייחסת לפסקה כולה – שים לב למילה main(ly). לרוב המשפט הראשון מספיק, ומילת קישור בפתיחת הפסקה (However, In addition) מלמדת מה היחס שלה לפסקה הקודמת. זכור: הקטע הוא חלק ממאמר, והפסקה האחרונה <b>אינה סיכום<\/b> – יש לה רעיון משלה."],"f":["כללית ← לסוף; ספציפית ← עכשיו","רעיון מרכזי = פסקה ראשונה + המשפט הראשון בכל פסקה","מסיחים: רחב מדי / צר מדי (נכון רק לפסקה אחת)","main(ly) + paragraph = שאלת פסקה (לא שאלת קטע)"],"traps":["תשובה צרה מדי: נכונה ומופיעה בקטע, אבל מכסה רק פסקה אחת או פרט אחד","תשובה רחבה מדי: נושא כללי יותר ממה שהקטע עוסק בו","לחשוב שהפסקה האחרונה מסכמת את הקטע","לבחור תשובה רק כי היא נכונה עובדתית – השאלה היא מה העיקר, לא מה הופיע"],"ex":{"q":"The main purpose of the text is to -","pt":"(1) Over the past two decades, beehives have begun to appear in unexpected places: on the roofs of office buildings, in schoolyards, and even on apartment balconies. In cities such as London, Paris, and New York, the number of registered hives has grown dramatically, and beekeeping has become a popular hobby among people who have never lived on a farm.\n(2) Supporters of urban beekeeping argue that cities can be surprisingly good homes for bees. Parks, gardens, and tree-lined streets offer a wide variety of flowers, and many cities use fewer pesticides than farms do. Some studies have even found that city bees produce as much honey as their rural relatives.\n(3) However, some ecologists warn that the trend may have unintended consequences. Honeybees compete for nectar and pollen with hundreds of species of wild bees, many of which are already in decline. When too many hives are placed in a small area, these wild species may struggle to find enough food. For this reason, several cities have begun to ask whether they should limit the number of hives allowed in each neighborhood.","steps":["זו שאלה כללית – בבחינה היא נדחית לסוף. קורא רק את צמתי המידע: פסקה 1 כולה, ואת המשפט הראשון של פסקאות 2 ו־3.","פסקה 1: כוורות מופיעות בערים – <b>מגמה<\/b>. פסקה 2: 'Supporters… argue' – <b>טיעונים בעד<\/b>. פסקה 3: '<b>However<\/b>, some ecologists warn' – <b>חשש<\/b>. יחד: להציג מגמה ולדון ביתרונותיה ובחסרונותיה.","מסיח צר מדי: 'to explain why cities use fewer pesticides' – פרט מפסקה 2 בלבד. מסיח רחב מדי: 'to describe the history of beekeeping' – הקטע לא עוסק בכל ההיסטוריה של גידול דבורים.","התשובה: to describe a growing trend and discuss its possible benefits and risks."]},"g":{"q":"The third paragraph mainly discusses -","pt":"(1) Over the past two decades, beehives have begun to appear in unexpected places: on the roofs of office buildings, in schoolyards, and even on apartment balconies. In cities such as London, Paris, and New York, the number of registered hives has grown dramatically, and beekeeping has become a popular hobby among people who have never lived on a farm.\n(2) Supporters of urban beekeeping argue that cities can be surprisingly good homes for bees. Parks, gardens, and tree-lined streets offer a wide variety of flowers, and many cities use fewer pesticides than farms do. Some studies have even found that city bees produce as much honey as their rural relatives.\n(3) However, some ecologists warn that the trend may have unintended consequences. Honeybees compete for nectar and pollen with hundreds of species of wild bees, many of which are already in decline. When too many hives are placed in a small area, these wild species may struggle to find enough food. For this reason, several cities have begun to ask whether they should limit the number of hives allowed in each neighborhood.","o":["the reasons city bees produce more honey","a possible drawback of keeping many hives in cities","the history of wild bees in Europe","how to register a beehive in a large city"],"a":1,"g":["קרא את המשפט הראשון של פסקה 3. איזו מילת קישור פותחת אותה, ומה היא אומרת על היחס לפסקה 2?","However + warn ← הפסקה מציגה בעיה או חשש. חפש תשובה שמתארת חיסרון."],"x":"הפסקה נפתחת ב־However ובאזהרה של אקולוגים: ריבוי כוורות עלול לפגוע בדבורי בר. זה חיסרון אפשרי של המגמה. הדבש של דבורי העיר שייך לפסקה 2, ועל היסטוריה של דבורי בר או רישום כוורות לא נכתב בכלל."},"solo":{"q":"A good title for the text would be -","pt":"(1) Over the past two decades, beehives have begun to appear in unexpected places: on the roofs of office buildings, in schoolyards, and even on apartment balconies. In cities such as London, Paris, and New York, the number of registered hives has grown dramatically, and beekeeping has become a popular hobby among people who have never lived on a farm.\n(2) Supporters of urban beekeeping argue that cities can be surprisingly good homes for bees. Parks, gardens, and tree-lined streets offer a wide variety of flowers, and many cities use fewer pesticides than farms do. Some studies have even found that city bees produce as much honey as their rural relatives.\n(3) However, some ecologists warn that the trend may have unintended consequences. Honeybees compete for nectar and pollen with hundreds of species of wild bees, many of which are already in decline. When too many hives are placed in a small area, these wild species may struggle to find enough food. For this reason, several cities have begun to ask whether they should limit the number of hives allowed in each neighborhood.","o":["Wild Bees in Decline","How to Start a Beehive on Your Roof","City Hives: A Growing Hobby and Its Costs","Why Farms Use Pesticides"],"a":2,"x":"כותרת טובה מכסה את כל הקטע: מגמה (a growing hobby) וגם החשש (its costs). 'Wild Bees in Decline' צרה מדי – רק חלק מפסקה 3. 'How to Start a Beehive' מבטיחה הוראות שאין בקטע, ו'Farms' הוא פרט שולי מפסקה 2."},"bank":[{"t":"שאלת פסקה","lvl":1,"q":"The first paragraph mainly describes -","pt":"(1) Over the past two decades, beehives have begun to appear in unexpected places: on the roofs of office buildings, in schoolyards, and even on apartment balconies. In cities such as London, Paris, and New York, the number of registered hives has grown dramatically, and beekeeping has become a popular hobby among people who have never lived on a farm.\n(2) Supporters of urban beekeeping argue that cities can be surprisingly good homes for bees. Parks, gardens, and tree-lined streets offer a wide variety of flowers, and many cities use fewer pesticides than farms do. Some studies have even found that city bees produce as much honey as their rural relatives.\n(3) However, some ecologists warn that the trend may have unintended consequences. Honeybees compete for nectar and pollen with hundreds of species of wild bees, many of which are already in decline. When too many hives are placed in a small area, these wild species may struggle to find enough food. For this reason, several cities have begun to ask whether they should limit the number of hives allowed in each neighborhood.","table":null,"o":["the spread of beekeeping to urban areas","the dangers of keeping bees on balconies","the decline of farms in Europe","the reasons bees prefer cities"],"a":0,"x":"פסקה 1 מתארת איך כוורות מופיעות בגגות, בחצרות ובמרפסות בערים, ואיך גידול דבורים הפך לתחביב עירוני – התפשטות לערים. על סכנות אין בה מילה, על ירידת החקלאות לא נכתב, והסיבות לכך שערים טובות לדבורים מופיעות רק בפסקה 2."},{"t":"מבנה הקטע","lvl":3,"q":"Which of the following best describes the organization of the text?","pt":"(1) Over the past two decades, beehives have begun to appear in unexpected places: on the roofs of office buildings, in schoolyards, and even on apartment balconies. In cities such as London, Paris, and New York, the number of registered hives has grown dramatically, and beekeeping has become a popular hobby among people who have never lived on a farm.\n(2) Supporters of urban beekeeping argue that cities can be surprisingly good homes for bees. Parks, gardens, and tree-lined streets offer a wide variety of flowers, and many cities use fewer pesticides than farms do. Some studies have even found that city bees produce as much honey as their rural relatives.\n(3) However, some ecologists warn that the trend may have unintended consequences. Honeybees compete for nectar and pollen with hundreds of species of wild bees, many of which are already in decline. When too many hives are placed in a small area, these wild species may struggle to find enough food. For this reason, several cities have begun to ask whether they should limit the number of hives allowed in each neighborhood.","table":null,"o":["A problem is presented, followed by three possible solutions.","A trend is described, followed by arguments in its favor and then a concern about it.","Two cities are compared, and one is shown to be better for bees.","A scientific study is described, and its results are then rejected."],"a":1,"x":"לפי המשפטים הראשונים: פסקה 1 – מגמה, פסקה 2 – Supporters argue (בעד), פסקה 3 – However… warn (חשש). אין בקטע פתרונות, אין השוואה בין שתי ערים, ואף מחקר לא נדחה."},{"t":"מטרת פסקה","lvl":3,"q":"The main purpose of the second paragraph is to -","pt":"(1) Over the past two decades, beehives have begun to appear in unexpected places: on the roofs of office buildings, in schoolyards, and even on apartment balconies. In cities such as London, Paris, and New York, the number of registered hives has grown dramatically, and beekeeping has become a popular hobby among people who have never lived on a farm.\n(2) Supporters of urban beekeeping argue that cities can be surprisingly good homes for bees. Parks, gardens, and tree-lined streets offer a wide variety of flowers, and many cities use fewer pesticides than farms do. Some studies have even found that city bees produce as much honey as their rural relatives.\n(3) However, some ecologists warn that the trend may have unintended consequences. Honeybees compete for nectar and pollen with hundreds of species of wild bees, many of which are already in decline. When too many hives are placed in a small area, these wild species may struggle to find enough food. For this reason, several cities have begun to ask whether they should limit the number of hives allowed in each neighborhood.","table":null,"o":["criticize ecologists who oppose urban beekeeping","compare honey from different countries","present reasons why cities may be suitable for bees","explain why farmers use pesticides"],"a":2,"x":"המשפט הראשון בפסקה 2 הוא הטענה המרכזית שלה: ערים יכולות להיות בית טוב לדבורים, ושאר הפסקה נותנת נימוקים (פרחים, פחות חומרי הדברה, דבש). האקולוגים מופיעים רק בפסקה 3, והפסקה לא מבקרת אותם. honey ו־pesticides הם פרטים בתוך הפסקה ולא המטרה שלה."},{"t":"רעיון מרכזי","lvl":2,"q":"The text is mainly about -","pt":"(1) For most of human history, the floor of the deep ocean was less well known than the surface of the Moon. Sailors could measure depth only by lowering a weighted rope until it touched bottom, a slow method that produced just a handful of measurements on each voyage.\n(2) This changed in the early twentieth century with the development of echo sounding. A ship sends a pulse of sound toward the sea floor and records how long the echo takes to return; because the speed of sound in water is known, the depth can be calculated. Within a few decades, ships crossing the Atlantic had recorded thousands of depth readings.\n(3) These readings revealed features that no one had expected. Running down the middle of the Atlantic was an enormous chain of underwater mountains, longer than any mountain range on land. Its discovery later provided key evidence for the theory that the continents slowly move apart.\n(4) Even today, however, only about a quarter of the ocean floor has been mapped in high detail. Satellites can estimate the shape of the sea floor from tiny variations in the height of the ocean surface, but these estimates miss many smaller features, such as underwater volcanoes less than a mile wide.","table":null,"o":["the theory that continents move apart","efforts to measure and map the ocean floor","the dangers faced by early sailors","how satellites are used to study the Moon"],"a":1,"x":"כל פסקה עוסקת במדידה ובמיפוי של קרקעית האוקיינוס: חבל משקולת, הד קולי, מה התגלה, וכמה עוד לא מופה. התיאוריה על תנועת היבשות היא צרה מדי (משפט אחד בפסקה 3), והירח מוזכר רק להשוואה."},{"t":"שאלת פסקה","lvl":3,"q":"The last paragraph mainly discusses -","pt":"(1) For most of human history, the floor of the deep ocean was less well known than the surface of the Moon. Sailors could measure depth only by lowering a weighted rope until it touched bottom, a slow method that produced just a handful of measurements on each voyage.\n(2) This changed in the early twentieth century with the development of echo sounding. A ship sends a pulse of sound toward the sea floor and records how long the echo takes to return; because the speed of sound in water is known, the depth can be calculated. Within a few decades, ships crossing the Atlantic had recorded thousands of depth readings.\n(3) These readings revealed features that no one had expected. Running down the middle of the Atlantic was an enormous chain of underwater mountains, longer than any mountain range on land. Its discovery later provided key evidence for the theory that the continents slowly move apart.\n(4) Even today, however, only about a quarter of the ocean floor has been mapped in high detail. Satellites can estimate the shape of the sea floor from tiny variations in the height of the ocean surface, but these estimates miss many smaller features, such as underwater volcanoes less than a mile wide.","table":null,"o":["the invention of echo sounding","the discovery of an underwater mountain chain","the speed of sound in water","the limits of current knowledge about the ocean floor"],"a":3,"x":"פסקה 4 נפתחת ב־Even today, however, only about a quarter… – גם היום רוב הקרקעית לא מופתה בפירוט, והלוויינים מפספסים פרטים קטנים. זה עיסוק במגבלות הידע. שים לב: הפסקה האחרונה לא מסכמת את הקטע, יש לה רעיון משלה. שאר התשובות שייכות לפסקאות 2 ו־3."},{"t":"קשר בין פסקאות","lvl":4,"q":"The third paragraph is related to the second paragraph in that it -","pt":"(1) For most of human history, the floor of the deep ocean was less well known than the surface of the Moon. Sailors could measure depth only by lowering a weighted rope until it touched bottom, a slow method that produced just a handful of measurements on each voyage.\n(2) This changed in the early twentieth century with the development of echo sounding. A ship sends a pulse of sound toward the sea floor and records how long the echo takes to return; because the speed of sound in water is known, the depth can be calculated. Within a few decades, ships crossing the Atlantic had recorded thousands of depth readings.\n(3) These readings revealed features that no one had expected. Running down the middle of the Atlantic was an enormous chain of underwater mountains, longer than any mountain range on land. Its discovery later provided key evidence for the theory that the continents slowly move apart.\n(4) Even today, however, only about a quarter of the ocean floor has been mapped in high detail. Satellites can estimate the shape of the sea floor from tiny variations in the height of the ocean surface, but these estimates miss many smaller features, such as underwater volcanoes less than a mile wide.","table":null,"o":["presents findings made possible by the method described in the second paragraph","describes an older method that echo sounding replaced","argues that the method in the second paragraph was inaccurate","summarizes the first two paragraphs"],"a":0,"x":"פסקה 3 נפתחת ב־These readings revealed – אותן מדידות של ההד הקולי מפסקה 2 חשפו רכס הרים ענק. כלומר, היא מציגה את הממצאים של השיטה. השיטה הישנה (חבל משקולת) מופיעה בפסקה 1, אין טענה שהשיטה לא מדויקת, והפסקה לא מסכמת."},{"t":"כותרת","lvl":5,"q":"Which of the following would be the most suitable title for the text?","pt":"(1) For most of human history, the floor of the deep ocean was less well known than the surface of the Moon. Sailors could measure depth only by lowering a weighted ורה). כשהשאלה כללית מדי (According to the first paragraph) – קרא קודם את ארבע התשובות, ואז סרוק את הפסקה. התשובה הנכונה היא בעצם <b>ניסוח מחדש<\/b> של משפט מהקטע, ובשאלות קשות היא תופיע במילים אחרות.","<b>שאלת הסקה<\/b> (It can be inferred / It can be understood that): התשובה <b>לא<\/b> כתובה – צריך לקחת את מה שכתוב צעד אחד קטן קדימה. אתר את המשפט, קרא אותו בעיון, נסח מסקנה בעצמך, ורק אז עבור לתשובות. מסיחים נפוצים: ציטוט של מה שכתוב (נכון, אבל זו לא הסקה), ומסקנה שמתרחקת מדי מהטקסט.","<b>שאלת תפקיד פרט<\/b> (The author mentions X in order to / The word \"only\" is used to / X is in quotation marks because): שואלים <b>למה<\/b> הפרט מופיע, ולא מה הוא אומר. קרא את המשפט ושאל את עצמך: מה הוא משרת? דוגמה לטענה? ניגוד (However)? מירכאות סביב מילה מסמנות לרוב שימוש לא מילולי או הסתייגות של הכותב. המסיח הנפוץ: תשובה שחוזרת על תוכן הפרט במקום על התפקיד שלו."],"f":["פרט = כתוב; הסקה = צעד אחד מעבר; תפקיד = למה זה כתוב","משפט = מנקודה עד נקודה, לא שורה","EXCEPT: מצא את השלוש שכן מופיעות – הנותרת היא התשובה","מירכאות סביב מילה ← שימוש מושאל, אירוני או מסויג"],"traps":["מסיח 'ממקום אחר בקטע' – פרט שבאמת מופיע, אבל בפסקה אחרת ולא עונה על השאלה","סילוף קטן: אותן מילים כמו בקטע, עם not או always שנוספו","בהסקה: לבחור ציטוט ישיר מהקטע, או מסקנה מרחיקת לכת","בתפקיד פרט: לבחור תשובה שמתארת את הפרט עצמו ולא את המטרה שלו"],"ex":{"q":"It can be inferred from the second paragraph that lighthouse keepers -","pt":"(1) Before the age of electronic navigation, lighthouses were among the most important safety tools available to sailors. Their beams warned ships away from rocks and shallow water, and each lighthouse flashed in its own pattern so that captains could tell which one they were looking at.\n(2) Keeping these lights burning was demanding work. Keepers had to climb the tower several times each night to trim the wick and refill the oil, and in stormy weather they sometimes went without sleep for days. Because many lighthouses stood on remote islands, keepers and their families could b faster than they can write by hand. It might seem obvious that recording more of a lecture would lead to better learning. A number of studies, however, suggest the opposite.\n(2) In one experiment, students watched a lecture and took notes either by hand or on a laptop. Those who typed wrote down far more words, often copying the speaker almost word for word. Yet when they were tested later, the students who had written by hand answered questions about the main concepts more accurately.\n(3) Researchers believe the explanation lies in the slowness of handwriting. Because hand-writers cannot record everything, they are forced to decide what is important and to put ideas into their own words. This extra mental effort, the researchers argue, helps the material stick in memory.","table":null,"o":["introduce findings that contradict a common assumption","give an example of how laptops are used","show that typing is faster than writing","summarize the results of a single experiment"],"a":0,"x":"לפני however מוצגת הנחה 'מובנת מאליה' (יותר רישום = יותר למידה), ואחריו – מחקרים שמראים את ההפך. however משמשת להציג ממצאים שסותרים את ההנחה. 'typing is faster' היא תוכן מהקטע ולא תפקיד המילה – המסיח הקלאסי."},{"t":"הסקה","lvl":4,"q":"It can be inferred from the text that the researchers would most likely agree that -","pt":"(1) Many students today take notes on laptops, which allow them to type faster than they can write by hand. It might seem obvious that recording more of a lecture would lead to better learning. A number of studies, however, suggest the opposite.\n(2) In one experiment, students watched a lecture and took notes either by hand or on a laptop. Those who typed wrote down far more words, often copying the speaker almost word for word. Yet when they were tested later, the students who had written by hand answered questions about the main concepts more accurately.\n(3) Researchers believe the explanation lies in the slowness of handwriting. Because hand-writers cannot record everything, they are forced to decide what is important and to put ideas into their own words. This extra mental effort, the researchers argue, helps the material stick in memory.","table":null,"o":["students should stop attending lectures","laptops cause students to forget everything they hear","taking fewer notes is always better than taking many","processing information actively can improve learning"],"a":3,"x":"בפסקה 3 החוקרים טוענים שהמאמץ לבחור את העיקר ולנסח במילים שלך עוזר לזכור. מכאן הצעד הקטן: עיבוד פעיל של מידע משפר למידה. 'stop attending lectures' רחוקה מהקטע, ו־'forget everything' ו־'always better' הן הקצנות."},{"t":"תפקיד פרט","lvl":5,"q":"The author mentions that hand-writers \"cannot record everything\" (paragraph 3) in order to -","pt":"(1) Many students today take notes on laptops, which allow them to type faster than they can write by hand. It might seem obvious that recording more of a lecture would lead to better learning. A number of studies, however, suggest the opposite.\n(2) In one experiment, students watched a lecture and took notes either by hand or on a laptop. Those who typed wrote down far more words, often copying the speaker almost word for word. Yet when they were tested later, the students who had written by hand answered questions about the main concepts more accurately.\n(3) Researchers believe the explanation lies in the slowness of handwriting. Because hand-writers cannot record everything, they are forced to decide what is important and to put ideas into their own words. This extra mental effort, the researchers argue, helps the material stick in memory.","table":null,"o":["criticize students who write slowly","explain how a limitation can turn into an advantage","show that laptops are more efficient than pens","prove that handwritten notes are less complete and therefore less useful"],"a":1,"x":"הפרט מוצג כחיסרון (אי אפשר לרשום הכול), אבל המשפט ממשיך: לכן הם נאלצים לבחור ולנסח, וזה עוזר לזכור. התפקיד: להראות איך מגבלה הופכת ליתרון. התשובה על 'less complete and therefore less useful' מצטטת חלק נכון (less complete) ומסיקה ממנו את ההפך ממה שהקטע אומר."}]},{"id":"eng-rc-vocab-ref","title":"Reading Comprehension: אוצר מילים בהקשר ו־refer to","tag":"הבנת הנקרא","en":true,"source":"ספר אנגלית: הבנת הנקרא – שאלות אוצר מילים ו־refer to (עמ' 188-189), תרגול פסקאות (עמ' 190-199), יחידות תרגול (עמ' 200 ואילך)","rule":["<b>שאלת אוצר מילים<\/b> (can best be replaced by / is closest in meaning to): השאלה מפנה בדיוק למקום, ולכן היא מהירה. אבל אל תקפוץ לתשובות לפי הפירוש שאתה מכיר: קרא את <b>המשפט כולו<\/b> (לא רק את השורה) והבן את המילה בהקשר. המרכז הארצי אוהב מילים עם כמה פירושים, ומשתמש דווקא בפירוש הפחות נפוץ: poor = גרוע, patient = סבלני, uniform = אחיד, bank = גדה, party = צד, term = תקופת כהונה.","התשובות אחידות מבחינה תחבירית: אם כולן מסתיימות ב־ed, תרגם את כולן כאותו סוג פועל (עבר או סביל). אם כולן מסתיימות ב־s, החלט אם כולן פעלים או כולן שמות עצם ברבים, ותרגם בעקביות.","<b>שאלת refer to<\/b> (In line 6, \"it\" refers to / \"this belief\" refers to): מצא את המילה, חזור לתחילת המשפט וקרא אותו. אם המילה בתחילת המשפט, או שלא מצאת – חזור משפט אחד אחורה. <b>תמיד מחפשים אחורה<\/b>, לא קדימה: התשובה מופיעה במפורש בקטע, לפני המילה. המסיח הנפוץ: שם עצם אחר מאותו משפט או מאותה פסקה."],"f":["קרא את המשפט כולו, לא רק את השורה","מילה מוכרת? בדוק אם כאן היא בפירוש הנדיר","refer to ← חפש אחורה; it / its = יחיד, they / these = רבים","בדיקה: הצב את התשובה במקום המילה וקרא שוב את המשפט"],"traps":["לבחור את הפירוש הנפוץ בלי לבדוק את ההקשר (cold = גם הצטננות, poor = גם גרוע)","ב־refer to: לבחור שם עצם שמופיע אחרי הכינוי","לבחור שם עצם קרוב שלא מתאים במספר (they ← שם עצם ביחיד)","לתרגם את התשובות בחוסר עקביות (אחת כפועל, אחרת כשם עצם)"],"ex":{"q":"The word \"poor\" (paragraph 2) is closest in meaning to -","pt":"(1) The giant panda has long puzzled biologists. Although it belongs to the order of meat-eating mammals, almost its entire diet consists of bamboo. Its digestive system, however, is still that of a carnivore, so the panda can absorb only a small fraction of the nutrients in the plants it eats.\n(2) To make up for this poor diet, pandas spend as much as fourteen hours a day feeding. They also save energy by moving slowly and resting often; one study found that a panda uses far less energy each day than most other mammals of a similar size.\n(3) For decades, the panda's survival seemed uncertain. The loss of forests had split the remaining population into small, isolated groups. In recent years, however, the creation of protected reserves has allowed panda numbers to recover, and in 2016 the species was moved from \"endangered\" to \"vulnerable\" on an international list of threatened animals.","steps":["הפירוש המוכר של poor הוא 'עני' – אבל לפני שעוברים לתשובות, קוראים את המשפט כולו: To make up for this poor diet, pandas spend as much as fourteen hours a day feeding.","this poor diet מתייחס למה שנאמר בפסקה 1: הפנדה מפיקה רק מעט מהחומרים המזינים מהבמבוק. תזונה 'ענייה' כאן = <b>דלה, באיכות נמוכה<\/b>.","בתשובות: low-quality מתאימה. 'lacking money' היא הפירוש הנפוץ – המלכודת. 'unlucky' (מסכן) גם היא פירוש של poor, אבל לא מתאימה לתזונה.","בדיקה: To make up for this low-quality diet… – הגיוני, וזו התשובה."]},"g":{"q":"In paragraph 1, the word \"Its\" (in \"Its digestive system\") refers to -","pt":"(1) The giant panda has long puzzled biologists. Although it belongs to the order of meat-eating mammals, almost its entire diet consists of bamboo. Its digestive system, however, is still that of a carnivore, so the panda can absorb only a small fraction of the nutrients in the plants it eats.\n(2) To make up for this poor diet, pandas spend as much as fourteen hours a day feeding. They also save energy by moving slowly and resting often; one study found that a panda uses far less energy each day than most other mammals of a similar size.\n(3) For decades, the panda's survival seemed uncertain. The loss of forests had split the remaining population into small, isolated groups. In recent years, however, the creation of protected reserves has allowed panda numbers to recover, and in 2016 the species was moved from \"endangered\" to \"vulnerable\" on an international list of threatened animals.","o":["bamboo","the order of meat-eating mammals","the giant panda","its entire diet"],"a":2,"g":["Its נמצאת בתחילת המשפט – חזור משפט אחד אחורה.","למי יש מערכת עיכול? הצב כל תשובה במקום Its ובדוק אם המשפט הגיוני."],"x":"חוזרים אחורה: המשפט מתחיל ב־Its, אז קוראים את המשפט הקודם ואת זה שלפניו. מי שיש לו מערכת עיכול של טורף הוא הפנדה, שהיא הנושא של כל הפסקה. לבמבוק ולתזונה אין מערכת עיכול, ו'הסדרה של היונקים טורפי הבשר' היא קבוצה ולא בעל חיים אחד שאוכל במבוק."},"solo":{"q":"The word \"recover\" (paragraph 3) is closest in meaning to -","pt":"(1) The giant panda has long puzzled biologists. Although it belongs to the order of meat-eating mammals, almost its entire diet consists of bamboo. Its digestive system, however, is still that of a carnivore, so the panda can absorb only a small fraction of the nutrients in the plants it eats.\n(2) To make up for this poor diet, pandas spend as much as fourteen hours a day feeding. They also save energy by moving slowly and resting often; one study found that a panda uses far less energy each day than most other mammals of a similar size.\n(3) For decades, the panda's survival seemed uncertain. The loss of forests had split the remaining population into small, isolated groups. In recent years, however, the creation of protected reserves has allowed panda numbers to recover, and in 2016 the species was moved from \"endangered\" to \"vulnerable\" on an international list of threatened animals.","o":["increase again after a decline","become healthy after an illness","find something that was stolen","cover something again"],"a":0,"x":"המשפט: protected reserves have allowed panda numbers to recover – מספר הפנדות. מספרים לא 'מחלימים ממחלה' (הפירוש הנפוץ – המלכודת), אלא עולים שוב אחרי ירידה, וזה מתאים גם לשינוי ל־vulnerable. 'find something that was stolen' (להשיב רכוש גנוב) הוא פירוש אחר של recover שלא מתאים למספרים, ו־'cover again' היא פירוק שגוי של המילה (re + cover)."},"bank":[{"t":"refer to","lvl":1,"q":"In paragraph 2, \"They\" (in \"They also save energy\") refers to -","pt":"(1) The giant panda has long puzzled biologists. Although it belongs to the order of meat-eating mammals, almost its entire diet consists of bamboo. Its digestive system, however, is still that of a carnivore, so the panda can absorb only a small fraction of the nutrients in the plants it eats.\n(2) To make up for this poor diet, pandas spend as much as fourteen hours a day feeding. They also save energy by moving slowly and resting often; one study found that a panda uses far less energy each day than most other mammals of a similar size.\n(3) For decades, the panda's survival seemed uncertain. The loss of forests had split the remaining population into small, isolated groups. In recent years, however, the creation of protected reserves has allowed panda numbers to recover, and in 2016 the species was moved from \"endangered\" to \"vulnerable\" on an international list of threatened animals.","table":null,"o":["pandas","hours","nutrients","biologists"],"a":0,"x":"חוזרים אחורה: המשפט הקודם (בתוך אותה פסקה) הוא pandas spend as much as fourteen hours a day feeding. מי שחוסך אנרגיה בתנועה איטית ובמנוחה הן הפנדות. hours הוא שם עצם קרוב ברבים – המסיח הקלאסי – אבל שעות לא נעות לאט."},{"t":"אוצר מילים","lvl":2,"q":"The word \"split\" (paragraph 3) could best be replaced by -","pt":"(1) The giant panda has long puzzled biologists. Although it belongs to the order of meat-eating mammals, almost its entire diet consists of bamboo. Its digestive system, however, is still that of a carnivore, so the panda can absorb only a small fraction of the nutrients in the plants it eats.\n(2) To make up for this poor diet, pandas spend as much as fourteen hours a day feeding. They also save energy by moving slowly and resting often; one study found that a panda uses far less energy each day than most other mammals of a similar size.\n(3) For decades, the panda's survival seemed uncertain. The loss of forests had split the remaining population into small, isolated groups. In recent years, however, the creation of protected reserves has allowed panda numbers to recover, and in 2016 the species was moved from \"endangered\" to \"vulnerable\" on an international list of threatened animals.","table":null,"o":["joined","hidden","divided","reduced"],"a":2,"x":"המשפט: The loss of forests had split the remaining population into small, isolated groups. פיצל לקבוצות קטנות ומבודדות = divided. joined הפוך, hidden לא מתאים ל־into groups, ו־reduced (צמצם) מתאר מספר ולא חלוקה לקבוצות."},{"t":"מילה רב־משמעית","lvl":4,"q":"In paragraph 1, the word \"order\" is closest in meaning to -","pt":"(1) The giant panda has long puzzled biologists. Although it belongs to the order of meat-eating mammals, almost its entire diet consists of bamboo. Its digestive system, however, is still that of a carnivore, so the panda can absorb only a small fraction of the nutrients in the plants it eats.\n(2) To make up for this poor diet, pandas spend as much as fourteen hours a day feeding. They also save energy by moving slowly and resting often; one study found that a panda uses far less energy each day than most other mammals of a similar size.\n(3) For decades, the panda's survival seemed uncertain. The loss of forests had split the remaining population into small, isolated groups. In recent years, however, the creation of protected reserves has allowed panda numbers to recover, and in 2016 the species was moved from \"endangered\" to \"vulnerable\" on an international list of threatened animals.","table":null,"o":["a command","a request for goods","an arrangement in sequence","a group of related animals"],"a":3,"x":"המשפט: it belongs to the order of meat-eating mammals. 'שייכת ל־order של יונקים טורפים' = קבוצה במיון

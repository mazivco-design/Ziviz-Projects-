"השלמת משפטים: תמצות ופסילה","tag":"השלמת משפטים","en":false,"source":"ספר חשיבה מילולית, פרק השלמת משפטים: איך פותרים, תקציר, זיהוי היגיון פנימי, דוגמאות עם 2-4 חסרים (עמ' 63-74); תרגול יחידות 1-20 (עמ' 75-94) ופתרונות מפורטים (עמ' 96-156), קבצים 1-3","rule":["שלבי הפתרון: קוראים את המשפט עם ההשלמה הראשונה, <b>מקצרים<\/b> אותו במילים שלך, <b>מציבים<\/b> תשובות ופוסלים מה שלא מתאים. אם מצאת תשובה שבוודאות אינה יוצרת סתירה – אפשר לסמן ולהמשיך.","הטכניקה החשובה ביותר היא <b>תמצות<\/b> (״תקציר״): מנקים את המשפט מתיאורים ומשאירים שלד – למשל ״רופאים ממליצים לישון פחות״ / ״יעקב החליט לישון יותר״ – ואז בודקים אם מילת הקישור שמחברת ביניהם (״ולכן״) מתאימה לקשר האמיתי.","<b>בדיקת חלק מהמשפט<\/b>: לא תמיד צריך את כל החסרים. אם בתחילת המשפט יש חלק קבוע, מתחילים ממנו. כדאי להציב קודם תשובות עם <b>התחלה דומה<\/b> – כך זוכרים את החלק הראשון ובודקים רק את מה שמשתנה.","זהירות עם <b>שלילה כפולה<\/b>: ״לא מתנגד לביטול״ = תומך בביטול. כשיש כמה מילות שלילה, מתרגמים אותן למילה חיובית אחת לפני שבודקים את הקשר."],"f":["תמצות: חלק א׳ (מילים שלך) + מילת קישור + חלק ב׳ (מילים שלך)","לא מתנגד ל־ = תומך ב־","תשובה בלי סתירה בוודאות ← לסמן ולהמשיך","ככל ש־X יותר, כך Y יותר / פחות – לבדוק את הכיוון בשני המשפטים"],"traps":["לקרוא את כל ההשלמה כרצף ארוך בלי לתמצת – ולהתבלבל","לפספס שלילה כפולה (״אין זה מפתיע ש... לא...״)","לבדוק רק חסר אחד ולשכוח שגם החסרים האחרים צריכים להתאים","להסתמך על ידע כללי – הבחינה בודקת רק היגיון פנימי"],"ex":{"q":"ככל שהמים ____ יותר, כך ____ החמצן המומס בהם. לכן בקיץ, כשהמים ____, הדגים נאלצים להתמודד עם ____ חמצן. (1) חמים / קטנה כמות / מתחממים / מחסור ב־ (2) חמים / גדלה כמות / מתחממים / מחסור ב־ (3) קרים / קטנה כמות / מתחממים / מחסור ב־ (4) חמים / קטנה כמות / מתחממים / שפע של","pt":null,"steps":["מתמצתים את הכלל מהמשפט הראשון לפי כל תשובה, ואת התוצאה מהמשפט השני. מילת הקישור ״לכן״ דורשת שהתוצאה תנבע מהכלל.","(1): מים חמים ← פחות חמצן; בקיץ המים מתחממים ← מחסור בחמצן – <b>נובע<\/b>. (2): חמים ← יותר חמצן, אבל מחסור – סתירה. (3): קרים ← פחות חמצן, כלומר חמים ← יותר חמצן, ובכל זאת מחסור – סתירה.","(4): חמים ← פחות חמצן, אבל ״שפע״ – סתירה. התשובה <b>(1)<\/b>."]},"g":{"q":"נועה ____ לשחות, ולכן ____ להצטרף לחברותיה לבריכה.","pt":null,"o":["אוהבת / סירבה","אוהבת / שמחה","שונאת / שמחה","אינה אוהבת / מיהרה"],"a":1,"g":["מילת הקישור היא ״ולכן״ – החלק השני צריך לנבוע מהראשון.","תמצת כל תשובה: ״נועה אוהבת לשחות ← שמחה להצטרף״. איזה צירוף נובע באמת?"],"x":"מי שאוהבת לשחות שמחה ללכת לבריכה – ״ולכן״ מתאים. בשאר הצירופים החלק השני סותר את הראשון: אוהבת וסירבה, שונאת ושמחה, אינה אוהבת ומיהרה."},"solo":{"q":"הספר ____ בקרב קוראים צעירים, ____ המבקרים קטלו אותו.","pt":null,"o":["נחל הצלחה / משום ש","נכשל / אף ש","נכשל / אלא ש","נחל הצלחה / אף ש"],"a":3,"x":"הצלחה בקרב הקוראים למרות ביקורת קשה – ניגוד, ולכן ״אף ש״. ב״נחל הצלחה / משום ש״ הביקורת הקשה היא הסיבה להצלחה – אין היגיון. ״נכשל / אף ש״: כישלון אחרי ביקורת קשה אינו ניגוד."},"bank":[{"t":"שני חסרים","lvl":2,"q":"דנה ____ מאוד מטיסות, ולכן ____ לנסוע לחו״ל ברכבת ובאונייה.","pt":null,"table":null,"o":["נהנית / מעדיפה","אינה חוששת / נאלצת","חוששת / מעדיפה","חוששת / נמנעת"],"a":2,"x":"תמצות: ״דנה מפחדת לטוס ← לכן מעדיפה רכבת ואונייה״ – תקין. ״חוששת / נמנעת״ פירושו שהפחד מטיסות גורם לה להימנע מרכבת – אין קשר."},{"t":"בדיקת חלק מהמשפט","lvl":2,"q":"____ שהסרט זכה בפרסים רבים, הוא נכשל בקופות; ____, רוב הצופים כלל לא שמעו עליו.","pt":null,"table":null,"o":["מכיוון / יתרה מזאת","למרות / למעשה","בזכות כך / למעשה","למרות / לעומת זאת"],"a":1,"x":"החלק הראשון לבדו פוסל שתי תשובות: פרסים וכישלון הם ניגוד, ולכן ״למרות״. בחלק השני, ״רוב הצופים לא שמעו עליו״ מסביר ומפרט את הכישלון – ״למעשה״ מתאים, ו״לעומת זאת״ יוצר ניגוד שלא קיים."},{"t":"שלילה כפולה","lvl":3,"q":"שר האוצר הודיע כי הוא ____ לתוכנית, שכן לדבריו אין סיבה ____ אותה.","pt":null,"table":null,"o":["יתנגד / לבטל","לא יתנגד / לאשר","לא יתנגד / לבטל","יתנגד / שלא לאשר"],"a":2,"x":"״לא יתנגד״ = יתמוך, ו״אין סיבה לבטל״ = יש לקיים. תמיכה מנומקת בכך שאין סיבה לבטל – תקין. ״יתנגד / שלא לאשר״: אין סיבה שלא לאשר = כדאי לאשר, ובכל זאת הוא מתנגד – סתירה."},{"t":"שלושה חסרים","lvl":3,"q":"בניגוד לאחיה, ש____ לבזבז את כספו, רותם ____ כל שקל, ולכן ____ לה חסכונות רבים.","pt":null,"table":null,"o":["נוהג / מבזבזת / הצטברו","נמנע / חוסכת / הצטברו","נוהג / חוסכת / לא נותרו","נוהג / חוסכת / הצטברו"],"a":3,"x":"״בניגוד ל־״ דורש התנהגות הפוכה: האח מבזבז ורותם חוסכת, ומכאן (״ולכן״) הצטברו לה חסכונות. ב״נמנע / חוסכת״ שניהם חוסכים – אין ניגוד; ב״לא נותרו״ התוצאה סותרת את החיסכון."},{"t":"ככל ש... כך","lvl":4,"q":"החוקר האמין שככל שהחממה ____ יותר, כך הצמחים בה גדלים מהר יותר. ____, הוא הופתע לגלות שבחממה המוארת ביותר, הצמחים גדלו ____.","pt":null,"table":null,"o":["מוארת / לכן / לאט במיוחד","מוצלת / לכן / לאט במיוחד","מוארת / לפיכך / מהר במיוחד","מוצלת / למרות זאת / מהר במיוחד"],"a":0,"x":"הוא ציפה שאור מאיץ גדילה, ולכן הופתע כשבחממה המוארת ביותר הצמחים גדלו לאט – תקין. ב(2) הוא ציפה שצל מאיץ, אז גדילה איטית באור צפויה ואינה מפתיעה. ב(3) התוצאה תואמת את הציפייה – אין הפתעה. ב(4) ההפתעה נובעת מהציפייה, ולכן ״למרות זאת״ (ניגוד) לא מתאים."},{"t":"שלילה כפולה","lvl":4,"q":"אין זה ____ שהמחזה, ש____ על ידי רוב המבקרים, ____ הקהל.","pt":null,"table":null,"o":["מפתיע / שובח / לא משך את","מוזר / נקטל / כבש את","מפליא / נקטל / לא משך את","מפליא / שובח / אכזב את"],"a":2,"x":"״אין זה מפליא״ = צפוי. צפוי שמחזה שנקטל בביקורות לא ימשוך קהל – תקין. בשאר האפשרויות התוצאה הפוכה לביקורת (שובח ולא משך, נקטל וכבש, שובח ואכזב), כך שהיא דווקא מפתיעה – והמשפט אומר שאינה מפתיעה."},{"t":"ארבעה חסרים","lvl":5,"q":"הממצאים ____ כי הירידה במספר הדבורים נובעת ממחלה, ____ משימוש בחומרי הדברה; ____ החוקרים ממליצים ____ את השימוש בחומרים אלה.","pt":null,"table":null,"o":["מעידים / ולא / לכן / לצמצם","אינם מעידים / אלא / למרות זאת / לצמצם","אינם מעידים / אלא / לכן / להרחיב","אינם מעידים / אלא / לכן / לצמצם"],"a":3,"x":"תמצות: הסיבה אינה מחלה אלא חומרי ההדברה, ולכן ממליצים לצמצם אותם – תקין. ב(1) הסיבה היא מחלה, אז אין סיבה לצמצם הדברה. ב(2) ״למרות זאת״ מציג את ההמלצה המתבקשת כניגוד. ב(3) ממליצים להרחיב את מה שגורם לנזק."}]},{"id":"vba-claims-basics","title":"טענות: תנאי, קיום ושקילות","tag":"טענות","en":false,"source":"ספר חשיבה מילולית, פרק טענות: טענת תנאי, טענה שקולה, ״אין״, ״רק״, דו־צדדית, תנאי מספיק והכרחי, טענת קיום (עמ' 157-159), קובץ 3","rule":["יש שני סוגי טענות. <b>טענת תנאי (כלל)<\/b> קובעת כלל: ״כל הגלולות סגולות״ = <b>אם<\/b> יש גלולה, <b>אז<\/b> היא סגולה (גלולה ← סגול). היא לא אומרת שיש גלולות בכלל. <b>טענת קיום<\/b> מעידה שיש לפחות פרט אחד: ״יש פיל לבן״ – ולא קובעת שום כלל.","<b>טענה שקולה<\/b>: לכל טענת תנאי יש טענה שקולה – שוללים את שני האגפים והופכים את כיוון החץ: רקדן ← גמיש שקול ל־לא גמיש ← לא רקדן. אבל ״גמיש ← רקדן״ (היפוך בלי שלילה) ו״לא רקדן ← לא גמיש״ (שלילה בלי היפוך) <b>אינן<\/b> שקולות.","<b>״אין״<\/b> הוא כלל: ״אין כלבים מעופפים״ = כלב ← לא מעופף. <b>״רק״<\/b> מסמן את התוצאה: ״רק שחורים עשויים לצפצף״ = מצפצף ← שחור (החץ הולך אל המילה שאחרי ״רק״). <b>״כל... ורק...״<\/b> היא טענה דו־צדדית: X ↔ Y, ואפשר לשלול את שני הצדדים בלי להפוך.","<b>תנאי מספיק<\/b>: אם הוא מתקיים, התוצאה בטוחה (אבל אפשר להגיע אליה גם בלעדיו). <b>תנאי הכרחי<\/b>: בלעדיו התוצאה לא תתקיים, אבל הוא לבדו לא מבטיח אותה."],"f":["כל X הם Y ⟺ X ← Y ⟺ לא Y ← לא X","אין X שהם Y ⟺ X ← לא Y","רק X הם Y ⟺ Y ← X","מספיק: תנאי ← תוצאה; הכרחי: תוצאה ← תנאי"],"traps":["להפוך את החץ בלי לשלול (״כל הרקדנים גמישים״ אינו אומר שכל הגמישים רקדנים)","לשלול בלי להפוך (״מי שאינו רקדן אינו גמיש״ – לא נובע)","לקרוא ״רק״ כאילו היה ״כל״ – החץ הפוך","להסיק קיום מטענת כלל (״כל הגלולות סגולות״ אינו אומר שיש גלולות)"],"ex":{"q":"״רק מי שעבר את מבחן הכניסה יכול להתקבל לחוג.״ מה נובע בוודאות? (1) כל מי שעבר את המבחן התקבל (2) מי שלא התקבל לא עבר את המבחן (3) מי שהתקבל לחוג עבר את המבחן (4) יש מי שעבר את המבחן","pt":null,"steps":["״רק״ מסמן את התוצאה: החץ הולך אל ״עבר את המבחן״. כותבים: <b>התקבל ← עבר<\/b>. השקולה: לא עבר ← לא התקבל.","(1) עבר ← התקבל – היפוך בלי שלילה, לא נובע. (2) לא התקבל ← לא עבר – שלילה בלי היפוך, לא נובע. (4) טענת קיום – כלל אינו מעיד שיש מישהו כזה.","(3) התקבל ← עבר – זו בדיוק הטענה. התשובה <b>(3)<\/b>."]},"g":{"q":"נתון: ״אם יורד גשם, הכביש רטוב.״ איזו טענה שקולה לה?","pt":null,"o":["אם הכביש רטוב, יורד גשם","אם לא יורד גשם, הכביש אינו רטוב","אם הכביש אינו רטוב, לא יורד גשם","אם הכביש אינו רטוב, יורד גשם"],"a":2,"g":["כתוב את הטענה כחץ: גשם ← רטוב.","כדי לקבל טענה שקולה, שלול את שני האגפים והפוך את כיוון החץ."],"x":"גשם ← רטוב שקול ל־לא רטוב ← לא גשם. (1) היא היפוך בלי שלילה – הכביש יכול להיות רטוב גם מצינור. (2) היא שלילה בלי היפוך. (4) סותרת את הטענה."},"solo":{"q":"נתון: מעבר טסט הוא תנאי הכרחי לקבלת רישיון נהיגה. מה נכון בהכרח?","pt":null,"o":["מי שעבר טסט בהכרח קיבל רישיון","מי שקיבל רישיון עבר טסט","מי שלא קיבל רישיון לא עבר טסט","מעבר טסט הוא תנאי מספיק לקבלת רישיון"],"a":1,"x":"תנאי הכרחי: בלעדיו אין תוצאה, כלומר רישיון ← טסט. לכן מי שקיבל רישיון עבר טסט. אבל טסט לבדו לא מבטיח רישיון, ולכן (1) ו(4) לא נובעות, ו(3) היא שלילה בלי היפוך."},"bank":[{"t":"טענה שקולה","lvl":1,"q":"נתון: כל הציפורים במכלאה מטילות ביצים. מה נובע בוודאות?","pt":null,"table":null,"o":["כל מה שמטיל ביצים במכלאה הוא ציפור","אם בעל חיים במכלאה אינו מטיל ביצים, הוא אינו ציפור","אם בעל חיים במכלאה אינו ציפור, הוא אינו מטיל ביצים","יש במכלאה ציפור שאינה מטילה ביצים"],"a":1,"x":"ציפור ← מטילה ביצים, והשקולה: לא מטיל ← לא ציפור. (1) היא היפוך בלי שלילה – אולי גם זוחלים במכלאה מטילים ביצים. (3) היא שלילה בלי היפוך. (4) סותרת את הנתון."},{"t":"רק","lvl":2,"q":"נתון: רק תלמידים שהגישו את כל העבודות יקבלו תעודת הצטיינות. מה נובע בוודאות?","pt":null,"table":null,"o":["כל מי שהגיש את כל העבודות יקבל תעודת הצטיינות","מי שלא יקבל תעודה לא הגיש את כל העבודות","מי שיקבל תעודת הצטיינות הגיש את כל העבודות","יש תלמיד שיקבל תעודת הצטיינות"],"a":2,"x":"החץ הולך אל המילים שאחרי ״רק״: תעודה ← הגיש הכל. (1) היא היפוך – הגשת העבודות לבדה אינה מבטיחה תעודה. (2) שלילה בלי היפוך. (4) טענת קיום שאינה נובעת מכלל."},{"t":"אין","lvl":2,"q":"נתון: אין בבריכה דגים שהם צבעוניים. איזו טענה שקולה לנתון?","pt":null,"table":null,"o":["כל הדגים בבריכה צבעוניים","רק דגים צבעוניים נמצאים בבריכה","יש בבריכה דגים שאינם צבעוניים","כל הדגים בבריכה אינם צבעוניים"],"a":3,"x":"״אין״ הוא כלל: דג בבריכה ← לא צבעוני, כלומר כל הדגים בבריכה אינם צבעוניים. (3) היא טענת קיום – הנתון לא מבטיח שיש דגים בבריכה בכלל."},{"t":"מספיק והכרחי","lvl":3,"q":"נתון: תואר שני הוא תנאי הכרחי לקבלה לתפקיד, אך אינו תנאי מספיק. מה נכון בהכרח?","pt":null,"table":null,"o":["כל בעלי התואר השני שהגישו מועמדות התקבלו","ייתכן שמועמד בעל תואר שני לא יתקבל","מועמד ללא תואר שני עשוי להתקבל","כל מי שלא התקבל אינו בעל תואר שני"],"a":1,"x":"הכרחי ולא מספיק: בלי תואר אין קבלה, אבל גם עם תואר לא מובטחת קבלה – ולכן ייתכן שבעל תואר לא יתקבל. (1) הופכת אותו למספיק, (3) סותרת את ״הכרחי״, ו(4) היא היפוך שלא נובע."},{"t":"דו־צדדית","lvl":3,"q":"נתון: כל תושבי הכפר, ורק הם, מקבלים את העיתון המקומי. איזו טענה אינה נכונה?","pt":null,"table":null,"o":["מי שאינו תושב הכפר אינו מקבל את העיתון","מי שמקבל את העיתון הוא תושב הכפר","יש תושב כפר שאינו מקבל את העיתון","מי שאינו מקבל את העיתון אינו תושב הכפר"],"a":2,"x":"טענה דו־צדדית: תושב ↔ מקבל. לכן אפשר לשלול את שני הצדדים: לא תושב ↔ לא מקבל. (1), (2) ו(4) נובעות. (3) סותרת את ״כל תושבי הכפר מקבלים״."},{"t":"שקולה עם שלילה","lvl":4,"q":"נתון: כל מי שאינו מתאמן בקביעות אינו משתתף בתחרות. מה נובע בוודאות?","pt":null,"table":null,"o":["כל מי שמתאמן בקביעות משתתף בתחרות","כל המשתתפים בתחרות מתאמנים בקביעות","רק מי שאינו מתאמן אינו משתתף","יש משתתף בתחרות שאינו מתאמן בקביעות"],"a":1,"x":"לא מתאמן ← לא משתתף. בשלילת שני האגפים והיפוך: משתתף ← מתאמן. (1) היא היפוך בלי שלילה של השקולה. (3) פירושה לא משתתף ← לא מתאמן – היפוך שלא נובע. (4) סותרת."},{"t":"רק עם שלילה","lvl":5,"q":"נתון: רק מי שאינם מעשנים רשאים להיכנס לחדר הכושר. איזו טענה שקולה לנתון?","pt":null,"table":null,"o":["אין מעשן שרשאי להיכנס לחדר הכושר","כל מי שאינו מעשן רשאי להיכנס","רק מעשנים אינם רשאים להיכנס","כל מי שאינו רשאי להיכנס הוא מעשן"],"a":0,"x":"״רק״ מסמן תוצאה: רשאי ← לא מעשן, והשקולה: מעשן ← לא רשאי, כלומר אין מעשן רשאי. (2) היא היפוך. (3) ו(4) אומרות אותו דבר: לא רשאי ← מעשן, שקול ל־לא מעשן ← רשאי – גם זה היפוך שאינו נובע."}]},{"id":"vba-claims-combine","title":"טענות: סתירה ושרשור","tag":"טענות","en":false,"source":"ספר חשיבה מילולית, פרק טענות: סתירת טענות, שילוב ושרשור טענות, נובע בנפרד (עמ' 159-160); תרגול ופתרונות (עמ' 161-176), קובץ 3","rule":["<b>סתירת טענת תנאי<\/b>: מחפשים טענת קיום שמכילה את התנאי עם <b>התוצאה ההפוכה<\/b>. את ״מדריך ← גבוה״ סותר ״יש מדריך שאינו גבוה״, ולא ״יש גבוה שאינו מדריך״. טענת תנאי אחת לא יכולה לסתור טענת תנאי אחרת. דרך מהירה: מוסיפים ״לא״ (״לא כל הכלבים חומים״) או מחליפים ״אין״ ב״יש״.","<b>שרשור טענות<\/b>: מחברים טענות על ידי איבר משותף – התוצאה של אחת היא התנאי של השנייה: עורב ← עף, עף ← מזמזם, ולכן עורב ← מזמזם. אם יש טענה עם ״רק״, מתרגמים אותה לחץ לפני השרשור. אם האיבר המשותף לא מופיע כך, מחליפים טענה בשקולה שלה.","שילוב של שתי טענות כלל נותן <b>כלל<\/b>; שילוב של כלל עם טענת קיום נותן <b>טענת קיום<\/b> (״כל העורבים עפים״ + ״יש עורבים שחורים״ = ״יש עורבים שחורים שעפים״).","<b>נובע בנפרד<\/b>: קוראים את הטענה הראשונה ומחפשים תשובות שנובעות ממנה; מתוכן בודקים אילו נובעות גם מהשנייה. כדי לסתור צירוף, משרשרים קודם ואז מחפשים דוגמה שעומדת בתנאי ולא בתוצאה."],"f":["סותר את X ← Y: ״יש X שאינו Y״","X ← Y וגם Y ← Z ⟹ X ← Z","כלל + כלל = כלל; כלל + קיום = קיום","״לא ייתכן ש...״ = לחפש מה סותר את השרשור"],"traps":["לסתור עם ״יש Y שאינו X״ – זה לא סותר","לשרשר בלי איבר משותף אמיתי","להסיק כלל משילוב של כלל וקיום","לבחור תשובה שנובעת רק מאחת הטענות כשנשאל ״נובע מכל אחת בנפרד״"],"ex":{"q":"נתון: כל השחקנים הגבוהים בקבוצה הם שחקני הגנה. אף שחקן הגנה בקבוצה אינו קלע מצטיין. קיומו של איזה שחקן בקבוצה יסתור את הנתונים? (1) שחקן נמוך שהוא קלע מצטיין (2) שחקן גבוה שאינו קלע מצטיין (3) שחקן גבוה שהוא קלע מצטיין (4) שחקן הגנה נמוך","pt":null,"steps":["מתרגמים לחצים: גבוה ← הגנה; הגנה ← לא קלע מצטיין (״אף... אינו״ = כלל).","משרשרים דרך האיבר המשותף ״הגנה״: <b>גבוה ← הגנה ← לא קלע מצטיין<\/b>.","סותר את השרשור שחקן שעומד בתנאי (גבוה) ולא בתוצאה (כן קלע מצטיין). התשובה <b>(3)<\/b>. השאר אינם עומדים בתנאי, או עומדים גם בתוצאה."]},"g":{"q":"נתון: כל החתולים בבית ישנים על הספה. כל מי שישן על הספה משיר עליה שערות. מה נובע בוודאות?","pt":null,"o":["כל מי שמשיר שערות הוא חתול","כל מי שישן על הספה הוא חתול","כל החתולים בבית משירים שערות על הספה","יש בבית חתול שאינו ישן על הספה"],"a":2,"g":["כתוב את שתי הטענות כחצים ומצא איבר משותף.","חתול ← ישן על הספה ← משיר שערות. מה התנאי הראשון ומה התוצאה האחרונה?"],"x":"שרשור: חתול ← ישן על הספה ← משיר שערות, ולכן כל החתולים משירים שערות. (1) ו(2) הן היפוכים שלא נובעים – גם הכלב עשוי לישון על הספה. (4) סותרת את הנתון."},"solo":{"q":"הטענה: ״אין בכיתה תלמיד שלא הגיש את העבודה.״ איזה ממצא יסתור אותה?","pt":null,"o":["תלמיד בכיתה שהגיש את העבודה באיחור","תלמיד בכיתה שלא הגיש את העבודה","תלמיד מכיתה אחרת שלא הגיש את העבודה","תלמיד בכיתה שהגיש עבודה גרועה"],"a":1,"x":"״אין... שלא הגיש״ = כל תלמידי הכיתה הגישו. סותרים בהחלפת ״אין״ ב״יש״: יש בכיתה תלמיד שלא הגיש. הגשה באיחור או גרועה היא עדיין הגשה, ותלמיד מכיתה אחרת אינו עומד בתנאי."},"bank":[{"t":"סתירה","lvl":2,"q":"הטענה: כל העובדים במשרד דוברים ספרדית. איזה ממצא יסתור אותה?","pt":null,"table":null,"o":["אדם הדובר ספרדית שאינו עובד במשרד","עובד במשרד הדובר גם צרפתית","אדם שאינו עובד במשרד ואינו דובר ספרדית","עובד במשרד שאינו דובר ספרדית"],"a":3,"x":"עובד ← דובר ספרדית. הסתירה: עומד בתנאי (עובד במשרד) ולא בתוצאה (לא דובר). ״דובר ספרדית שאינו עובד״ הוא היפוך – לא סותר."},{"t":"שרשור","lvl":2,"q":"נתון: כל הכנרים בתזמורת למדו בקונסרבטוריון. כל מי שלמד בקונסרבטוריון יודע לקרוא תווים. מה נובע בהכרח?","pt":null,"table":null,"o":["כל מי שיודע לקרוא תווים הוא כנר","כל מי שלמד בקונסרבטוריון הוא כנר","כל הכנרים בתזמורת יודעים לקרוא תווים","יש כנר בתזמורת שאינו יודע לקרוא תווים"],"a":2,"x":"כנר ← קונסרבטוריון ← קורא תווים. (1) ו(2) הן היפוכים שאינם נובעים, ו(4) סותרת את השרשור."},{"t":"כלל + קיום","lvl":3,"q":"נתון: כל הצמחים בחממה זקוקים להשקיה יומית. יש בחממה צמחים טרופיים. מה נובע בהכרח?","pt":null,"table":null,"o":["כל הצמחים הטרופיים זקוקים להשקיה יומית","כל הצמחים הזקוקים להשקיה יומית הם טרופיים","אין צמחים טרופיים מחוץ לחממה","יש צמחים טרופיים הזקוקים להשקיה יומית"],"a":3,"x":"כלל + קיום = קיום: הצמחים הטרופיים שבחממה זקוקים להשקיה יומית, ולכן יש טרופיים כאלה. (1) מסיקה כלל על כל הטרופיים – גם אלה שמחוץ לחממה, ועליהם אין מידע."},{"t":"לא ייתכן","lvl":3,"q":"נתון: בחנות, כל מוצרי החשמל נמכרים עם אחריות. אף מוצר המיוצר בחו״ל אינו נמכר עם אחריות. לכן לא ייתכן שבחנות יש מוצר ש־","pt":null,"table":null,"o":["אינו מוצר חשמל ומיוצר בחו״ל","הוא מוצר חשמל המיוצר בארץ","נמכר בלי אחריות ומיוצר בארץ","הוא מוצר חשמל המיוצר בחו״ל"],"a":3,"x":"חו״ל ← בלי אחריות, ובשקולה: עם אחריות ← לא חו״ל. שרשור: חשמל ← אחריות ← לא מחו״ל. לכן מוצר חשמל מחו״ל סותר את הנתונים. שאר המוצרים אפשריים."},{"t":"נובע בנפרד","lvl":4,"q":"אורי: ״כל הספרים על המדף העליון הם רומנים.״ מיכל: ״רק ספרים בכריכה קשה נמצאים על המדף העליון.״ איזו מסקנה נובעת מדברי כל אחד מהם בנפרד? (ספר עיון אינו רומן.)","pt":null,"table":null,"o":["אין על המדף העליון רומן בכריכה רכה","אין על המדף העליון ספר עיון בכריכה קשה","כל הרומנים נמצאים על המדף העליון","אין על המדף העליון ספר עיון בכריכה רכה"],"a":3,"x":"אורי: מדף עליון ← רומן, ולכן אין שם ספרי עיון כלל. מיכל: מדף עליון ← כריכה קשה, ולכן אין שם ספרים בכריכה רכה. ספר עיון בכריכה רכה נפסל לפי כל אחד מהם. (1) נובעת רק מדברי מיכל, ו(2) רק מדברי אורי."},{"t":"סתירת צירוף","lvl":4,"q":"נתון: רק מי שגר בעיר יכול להיות חבר במועדון השחמט. כל חברי מועדון השחמט משתתפים בטורניר. קיומו של מי מהבאים יסתור את הנתונים?","pt":null,"table":null,"o":["חבר מועדון שגר בעיר ואינו משתתף בטורניר","תושב העיר שאינו חבר במועדון ומשתתף בטורניר","אדם שאינו גר בעיר ומשתתף בטורניר","תושב העיר שאינו חבר במועדון ואינו משתתף בטורניר"],"a":0,"x":"״רק״: חבר ← גר בעיר. ועוד: חבר ← משתתף. חבר מועדון שאינו משתתף סותר את הנתון השני. שאר האנשים אינם חברי מועדון, ועליהם הנתונים לא קובעים דבר."},{"t":"כלל + כלל","lvl":5,"q":"נתון: מי שקיבל ציון 90 ומעלה במבחן פטור מעבודה. רק מי שהגיש את כל התרגילים קיבל ציון 90 ומעלה. איזו טענה נכונה בהכרח?","pt":null,"table":null,"o":["כל מי שהגיש את כל התרגילים פטור מעבודה","כל מי שפטור מעבודה הגיש את כל התרגילים","מי שלא הגיש את כל התרגילים אינו פטור מעבודה","אם מישהו קיבל 90 ומעלה, הוא הגיש את כל התרגילים ופטור מעבודה"],"a":3,"x":"90+ ← פטור, ו־90+ ← הגיש הכל. כלומר מי שקיבל 90+ עומד בשתי התוצאות. (1) הופכת את ״רק״. (2) ו(3) מניחות שהדרך היחידה לפטור היא ציון 90 ומעלה – הנתונים לא אומרים זאת."}]},{"id":"vba-sentence-understanding","title":"הבנת משפט","tag":"הבנה והסקה","en":false,"source":"ספר חשיבה מילולית, פרק הבנת משפט: משפטים רב־משמעיים, סידור משפטים, משתמע ומילים מעידות, הנחה סמויה (עמ' 177-192), קובץ 3","rule":["יש משפטים שאפשר להבין <b>ביותר מדרך אחת<\/b>: תיאור שמתייחס לאחת משתי מילים (״החתונה של המלך ג׳ורג׳ שהייתה מפוארת...״), כינוי שייכות (״שלו״), צירוף שמתאר מקום או נושא. שואלים: למי או למה המילה הזאת מתייחסת? אם יש שתי אפשרויות – המשפט רב־משמעי.","כשהשאלה היא ״מה <b>לא<\/b> ייתכן לפי המשפט״, בודקים כל תשובה מול <b>כל<\/b> הפירושים: תשובה נפסלת רק אם היא לא מתאימה לאף פירוש.","<b>סידור משפטים<\/b>: מנתחים את הקטע כמו בהשלמת משפטים – מתמצתים כל חלק, מזהים איפה מילת הקישור לא תואמת את הקשר האמיתי, ומחפשים את התיקון שמבטל את הסתירה (ולא תיקון שרק משנה פרטים).","שאלות <b>משתמע / מילה מעידה / הנחה<\/b>: קוראים לאט, מתרגמים ביטויים כמו ״נאלץ״, ״אילו״, ״לא כל״. <b>הנחה סמויה<\/b> היא משהו שלא נאמר, אבל בלעדיו הטענה מתמוטטת. תשובה שאינה קשורה לטענה כלל – אינה הנחה שלה."],"f":["רב־משמעות: למי מתייחס התיאור / הכינוי?","״לא ייתכן לפי המשפט״ = לא מתאים לאף פירוש","אילו X, היה Y ⟹ X לא קרה (ולכן גם Y לא)","הנחה סמויה = בלעדיה המסקנה לא מחזיקה"],"traps":["לבדוק תשובה מול פירוש אחד בלבד","לתקן פרט שולי במקום את הקשר הלוגי שגורם לסתירה","לבחור תשובה נכונה בעולם אבל לא נובעת מהמשפט","״לא כל X הם Y״ פירושו ״יש X שאינו Y״, לא ״אין X שהוא Y״"],"ex":{"q":"בתקנון התחרות נקבע: ״לתחרות יכולים להירשם רק סטודנטים ומרצים מהפקולטה למשפטים.״ איזו אפשרות אינה מתיישבת עם אף פירוש של המשפט? (1) סטודנט לרפואה נרשם (2) מרצה לרפואה נרשם (3) סטודנט למשפטים נרשם (4) מרצה למשפטים לא נרשם","pt":null,"steps":["מזהים את הרב־משמעות: ״מהפקולטה למשפטים״ יכול להתייחס רק למרצים (פירוש א׳: כל סטודנט + מרצי משפטים) או לשניהם (פירוש ב׳: סטודנטים ומרצים למשפטים).","בודקים כל תשובה מול שני הפירושים: (1) סטודנט לרפואה מותר לפי פירוש א׳ – ייתכן. (3) מותר לפי שניהם. (4) ״רק״ לא מחייב להירשם – ייתכן.","(2) מרצה לרפואה אסור לפי שני הפירושים. התשובה <b>(2)<\/b>."]},"g":{"q":"איזה מהמשפטים הבאים אפשר להבין ביותר מדרך אחת?","pt":null,"o":["הכלב נבח על הדוור","אכלתי תפוח אדום בבוקר","ראיתי את הילד עם הטלסקופ","השעון בכיתה מאחר בחמש דקות"],"a":2,"g":["חפש צירוף שאפשר לחבר ליותר ממילה אחת במשפט.","״עם הטלסקופ״ – מי מחזיק אותו? אני או הילד?"],"x":"״ראיתי את הילד עם הטלסקופ״: אולי השתמשתי בטלסקופ כדי לראות אותו, ואולי הילד החזיק טלסקופ. בשאר המשפטים יש פירוש אחד בלבד."},"solo":{"q":"רונית: ״כדאי לי לקנות את המכונית הזאת, כי היא חסכונית בדלק.״ על איזו הנחה מתבססים דבריה?","pt":null,"o":["כל המכוניות החסכוניות זולות","המכונית הזאת היא המהירה ביותר","לרונית אין מכונית אחרת","חיסכון בדלק הוא שיקול חשוב בעיני רונית"],"a":3,"x":"המסקנה (״כדאי לי לקנות״) מבוססת על חיסכון בדלק – היא מניחה שזה שיקול חשוב בשבילה. בלי ההנחה הזאת הנימוק לא מוביל למסקנה. שאר התשובות לא נדרשות לטיעון."},"bank":[{"t":"רב־משמעות","lvl":2,"q":"שלושה מהמשפטים הבאים אפשר להבין ביותר מדרך אחת. איזה משפט משמעותו חד־משמעית?","pt":null,"table":null,"o":["ראיתי את השכן עם המשקפת","ההורים של יואב ודנה הגיעו לאסיפה","המורה ביקשה מהתלמידה להביא את המחברת שלה","הספרנית החזירה את הספר למדף העליון"],"a":3,"x":"(1) מי החזיק במשקפת? (2) ההורים של שניהם, או ההורים של יואב ודנה עצמה? (3) המחברת של המורה או של התלמידה? רק במשפט (4) יש פירוש אחד."},{"t":"משתמע – אילו","lvl":3,"q":"דני: ״אילו ידעתי שהכביש חסום, הייתי יוצא מהבית מוקדם יותר.״ מה משתמע מדבריו?","pt":null,"table":null,"o":["דני ידע מראש שהכביש חסום","הכביש לא היה חסום","דני לא יצא מהבית מוקדם יותר","דני יצא מוקדם אך בכל זאת איחר"],"a":2,"x":"״אילו״ מתאר מצב שלא קרה: דני לא ידע, ולכן גם לא יצא מוקדם. (1) סותרת את ״אילו״, (2) הפוכה – מדבריו משתמע שהכביש דווקא היה חסום, ו(4) סותרת את המסקנה."},{"t":"הנחה סמויה","lvl":3,"q":"מנהל בית ספר: ״מאז שהוכנסו מחשבים לכיתות, הציונים עלו; לכן המחשבים הם שגרמו לשיפור.״ על איזו הנחה מתבסס המנהל?","pt":null,"table":null,"o":["התלמידים אוהבים ללמוד בעזרת מחשבים","באותה תקופה לא היה שינוי אחר שיכול להסביר את עליית הציונים","גם בבתי ספר אחרים הוכנסו מחשבים","המחשבים עלו לבית הספר כסף רב"],"a":1,"x":"המנהל מסיק סיבה מכך ששני דברים קרו יחד. זה תקף רק אם אין הסבר אחר לעלייה (למשל מורים חדשים או מבחנים קלים יותר). שאר התשובות אינן נחוצות לטיעון."},{"t":"מילה מעידה","lvl":3,"q":"עיתונאית: ״הוועדה נאלצה לפרסם את הדוח, אף שחבריה ביקשו לגנוז אותו בטענה שהוא חושף מידע רגיש.״ איזו מילה בדבריה מעידה שהפרסום נעשה בכפייה?","pt":null,"table":null,"o":["לפרסם","נאלצה","לגנוז","רגיש"],"a":1,"x":"״נאלצה״ פירושו שהיא עשתה זאת כי לא הייתה לה ברירה – כלומר בכפייה. ״לגנוז״ מתאר מה רצו החברים, לא את אופן הפרסום, ו״רגיש״ מתאר את המידע."},{"t":"סידור משפטים","lvl":4,"q":"בקטע הבא יש פגם בהיגיון: ״בשנה שעברה ירדה בעיר כמות מועטה של גשם – פחות מ־300 מ״מ. לפיכך, המאגרים התמלאו עד אפס מקום.״ איזה תיקון יהפוך אותו לבעל היגיון פנימי?","pt":null,"table":null,"o":["החלפת ״פחות מ־300 מ״מ״ ב״פחות מ־200 מ״מ״","החלפת ״התמלאו עד אפס מקום״ ב״התמלאו כמעט עד הסוף״","החלפת ״מועטה״ ב״קטנה״","החלפת ״לפיכך״ ב״למרות זאת״"],"a":3,"x":"תמצות: ״ירד מעט גשם״ + ״המאגרים התמלאו״ – זה ניגוד, אבל ״לפיכך״ מציג אותו כתוצאה. ״למרות זאת״ מתקן את הקשר. שאר התיקונים משנים פרטים ומשאירים את הסתירה."},{"t":"לא כל","lvl":4,"q":"״לא כל מי שזכה במלגה הגיש את הבקשה בזמן, אך כל מי שהגיש בזמן – זכה.״ מה נובע מהמשפט?","pt":null,"table":null,"o":["כל הזוכים הגישו את הבקשה בזמן","כל מי שלא הגיש בזמן לא זכה","יש זוכה שלא הגיש את הבקשה בזמן","מספר הזוכים קטן ממספר המגישים בזמן"],"a":2,"x":"״לא כל הזוכים הגישו בזמן״ = יש זוכה שלא הגיש בזמן. (1) סותרת זאת, וכך גם (2). ו(4) הפוכה: כל המגישים בזמן זכו, ויש עוד זוכים – אז הזוכים רבים יותר."},{"t":"רב־משמעות – לא ייתכן","lvl":4,"q":"המשפט: ״דנה סיפרה לאחותה שהמכונית שלה נגנבה.״ איזו אפשרות אינה מתיישבת עם אף פירוש של המשפט?","pt":null,"table":null,"o":["נגנבה המכונית של דנה","נגנבה המכונית של אחותה של דנה","נגנבה המכונית של אמן של השתיים","דנה היא שמסרה את המידע על הגניבה"],"a":2,"x":"״שלה״ יכול להתייחס לדנה או לאחותה – ולכן (1) ו(2) אפשריות, כל אחת לפי פירוש אחר. (4) נכונה לפי כל פירוש. המכונית של האם אינה מתאימה לאף פירוש, כי ״שלה״ לא יכול להתייחס למי שלא מוזכרת במשפט."}]},{"id":"vba-paragraph","title":"הבנת פסקה","tag":"הבנה והסקה","en":false,"source":"ספר חשיבה מילולית, פרק הבנת פסקה: דוגמאות ותרגול (עמ' 193-203), קובץ 3; פתרונות בהמשך הספר","rule":["בשאלות הבנת פסקה מובאת פסקה של כמה שורות ושאלה אחת. חלק מהשאלות דורשות הבנה של מה שכתוב במפורש, וחלקן דורשות להבין את <b>כוונת הכותב<\/b>, להסיק מסקנה, או לזהות את עיקר הטענה.","שיטת העבודה: קוראים את הפסקה ומזהים את <b>המבנה<\/b> – מה הטענה המרכזית, מה הדוגמה, מה הדעה הנגדית (מילים כמו ״ואולם״, ״לעומת זאת״, ״למעשה״ מסמנות תפנית). אחר כך בודקים כל תשובה <b>מול הכתוב<\/b> ומצביעים על השורה שמבססת אותה.","סוגי שאלות נפוצים: <b>מה משתמע<\/b>, <b>עיקר הטענה<\/b> (סיכום), <b>מדוע מוזכר פרט<\/b> (מה תפקידו בטיעון), <b>מה מחליש / מחזק<\/b> טענה, ו<b>מה אינו נובע<\/b>. בשאלת סיכום, תשובה שמתמקדת בפרט אחד או מוסיפה טענה שלא נאמרה – נפסלת.","המלכודת העיקרית: תשובה שנשמעת הגיונית ואפילו נכונה בעולם, אבל <b>לא כתובה ולא נובעת<\/b> מהפסקה. ההפך גם נכון – אל תפסול תשובה רק כי היא מנוסחת במילים אחרות מהפסקה."],"f":["כל תשובה ← להצביע על השורה שמבססת אותה","״ואולם / למעשה / לעומת זאת״ = תפנית בטיעון","מדוע מוזכר פרט? = מה התפקיד שלו בטיעון","מחליש טענה = פוגע בהנחה שעליה היא נשענת"],"traps":["תשובה נכונה בעולם אבל לא נובעת מהפסקה","לייחס לכותב את הדעה שהוא מציג רק כדי לחלוק עליה","בשאלת סיכום – לבחור פרט נכון במקום העיקר","לפסול תשובה רק כי היא מנוסחת במילים אחרות"],"ex":{"q":"מה משתמע מהפסקה? (1) כל תנומה בצהריים משפרת את הריכוז (2) התועלת של תנומה תלויה במשך שלה (3) מבוגרים צריכים לישון שעה בצהריים (4) תנומה קצרה גורמת לבלבול","pt":"חוקרי שינה מצאו כי מבוגרים שנוהגים לנמנם בצהריים פחות מחצי שעה מתפקדים טוב יותר במבחני ריכוז אחר הצהריים. לעומת זאת, תנומה של יותר משעה נקשרה לתחושת עייפות ובלבול לאחר היקיצה.","steps":["מזהים את המבנה: ממצא על תנומה קצרה (מועילה), ואחרי ״לעומת זאת״ – ממצא על תנומה ארוכה (מזיקה).","בודקים מול הכתוב: (1) לא נכון – תנומה ארוכה נקשרה לבלבול. (3) הפוך לממצאים. (4) הבלבול נקשר לתנומה <b>ארוכה<\/b>.","(2) מסכמת את שני הממצאים יחד: קצרה מועילה, ארוכה מזיקה. התשובה <b>(2)<\/b>."]},"g":{"q":"איזו מהטענות הבאות נכונה לפי הפסקה?","pt":"לטאות רבות מסוגלות להשיל את זנבן כשטורף תופס בו. הזנב המושל ממשיך לפרפר דקות אחדות ומסיח את דעת הטורף, והלטאה נמלטת. הזנב צומח מחדש, אך הזנב החדש קצר יותר, ואין בו חוליות עצם אלא מוט של סחוס.","o":["הזנב החדש זהה לזנב המקורי","השלת הזנב מסייעת ללטאה להימלט מטורף","לטאה יכולה להשיל את זנבה פעם אחת בלבד","הזנב המושל מפסיק לזוז מיד"],"a":1,"g":["מצא בפסקה את המשפט שמסביר מה קורה אחרי שהזנב מושל.","״מסיח את דעת הטורף, והלטאה נמלטת״ – איזו תשובה אומרת את זה במילים אחרות?"],"x":"כתוב שהזנב המושל מסיח את דעת הטורף והלטאה נמלטת – כלומר ההשלה עוזרת להימלט. (1) ו(4) סותרות את הכתוב, ועל (3) הפסקה לא אומרת דבר."},"solo":{"q":"מה תפקיד המשפט הראשון בפסקה?","pt":"רבים סבורים שהגמל אוגר מים בדבשת שלו. למעשה, הדבשת מכילה בעיקר שומן, המשמש מאגר אנרגיה. את יכולתו לשרוד ימים רבים ללא שתייה הגמל חב לכך שגופו מאבד מעט מאוד נוזלים, ולכך שהוא מסוגל לשתות כמות עצומה של מים בבת אחת.","o":["להציג את הטענה המרכזית של הפסקה","לתאר ממצא מחקרי חדש","להציג תפיסה רווחת שהפסקה מבקשת לתקן","להסביר כיצד הגמל שורד במדבר"],"a":2,"x":"המילה ״למעשה״ בתחילת המשפט השני מסמנת תיקון: המשפט הראשון מציג אמונה נפוצה, והמשך הפסקה מראה שהיא שגויה. לכן זו אינה הטענה המרכזית ולא ההסבר להישרדות."},"bank":[{"t":"מה הבעיה","lvl":1,"q":"מהי הבעיה המתוארת בפסקה?","pt":"בעשור האחרון גדל מאוד מספר הכוורות שמחזיקים חובבים על גגות בערים גדולות. בתחילה ראו בכך מגמה אקולוגית חיובית, שכן דבורי דבש מאביקות צמחים. ואולם מחקרים חדשים מצאו כי בשכונות שבהן הכוורות צפופות במיוחד, ירד מספר מיני דבורי הבר: דבורי הדבש מתחרות בהן על צוף ואבקה, ואלה אינם מספיקים לכולן. החוקרים אינם ממליצים לאסור על גידול דבורים בעיר, אלא לקשור את מספר הכוורות המותר בכל אזור לכמות הצמחייה הפורחת בו.","table":null,"o":["דבורי הדבש מפסיקות להאביק צמחים בעיר","תחרות על מזון בין דבורי דבש לדבורי בר באזורים עם כוורות רבות","החובבים אינם יודעים לטפל בכוורות","דבורי הבר תוקפות את דבורי הדבש"],"a":1,"x":"אחרי ״ואולם״ מתוארת הבעיה: במקומות שבהם הכוורות צפופות, דבורי הדבש מתחרות עם דבורי הבר על צוף ואבקה. שאר התשובות לא כתובות בפסקה."},{"t":"פרט מפורש","lvl":2,"q":"מה ממליצים החוקרים?","pt":"בעשור האחרון גדל מאוד מספר הכוורות שמחזיקים חובבים על גגות בערים גדולות. בתחילה ראו בכך מגמה אקולוגית חיובית, שכן דבורי דבש מאביקות צמחים. ואולם מחקרים חדשים מצאו כי בשכונות שבהן הכוורות צפופות במיוחד, ירד מספר מיני דבורי הבר: דבורי הדבש מתחרות בהן על צוף ואבקה, ואלה אינם מספיקים לכולן. החוקרים אינם ממליצים לאסור על גידול דבורים בעיר, אלא לקשור את מספר הכוורות המותר בכל אזור לכמות הצמחייה הפורחת בו.","table":null,"o":["לאסור על גידול דבורים בערים","להעביר את כל הכוורות אל מחוץ לעיר","להגביל את מספר הכוורות בכל אזור לפי הצמחייה הפורחת בו","לשתול צמחים שאינם מושכים דבורי בר"],"a":2,"x":"המשפט האחרון אומר במפורש שהחוקרים <b>אינם<\/b> ממליצים לאסור, אלא לקשור את מספר הכוורות לכמות הצמחייה הפורחת. (1) היא בדיוק מה שהם דוחים."},{"t":"משתמע","lvl":3,"q":"מה משתמע מהפסקה?","pt":"בעשור האחרון גדל מאוד מספר הכוורות שמחזיקים חובבים על גגות בערים גדולות. בתחילה ראו בכך מגמה אקולוגית חיובית, שכן דבורי דבש מאביקות צמחים. ואולם מחקרים חדשים מצאו כי בשכונות שבהן הכוורות צפופות במיוחד, ירד מספר מיני דבורי הבר: דבורי הדבש מתחרות בהן על צוף ואבקה, ואלה אינם מספיקים לכולן. החוקרים אינם ממליצים לאסור על גידול דבורים בעיר, אלא לקשור את מספר הכוורות המותר בכל אזור לכמות הצמחייה הפורחת בו.","table":null,"o":["דבורי הבר אינן מאביקות צמחים","הגידול במספר הכוורות לא הביא שום תועלת","בשכונות שאין בהן כוורות, מספר מיני דבורי הבר עלה","בשכונה עם צמחייה פורחת רבה, יותר כוורות עשויות להיות מותרות"],"a":3,"x":"אם מספר הכוורות המותר נקבע לפי כמות הצמחייה הפורחת, הרי שבמקום עם הרבה צמחייה יותר כוורות יהיו מותרות. על (1) ו(3) הפסקה לא אומרת דבר, ו(2) מוגזמת – דבורי הדבש כן מאביקות."},{"t":"עיקר הטענה","lvl":3,"q":"מהו עיקר טענתה של לוין?","pt":"היסטוריונים נוטים לייחס אמינות נמוכה לזיכרונות שכתבו מדינאים לאחר פרישתם: הכותבים מבקשים להצדיק את מעשיהם, והם כותבים שנים רבות אחרי האירועים. ואולם החוקרת מירב לוין טוענת כי דווקא העיוותים האלה הם מקור מידע רב־ערך. לדבריה, מה שמדינאי בוחר להסתיר או לייפות מלמד אותנו על הנורמות של תקופתו – על מה שנחשב בה מביש או ראוי לשבח. משום כך היא מציעה לקרוא זיכרונות לא כתיעוד של מה שקרה, אלא כתיעוד של האופן שבו הכותב רצה שיזכרו אותו.","table":null,"o":["זיכרונות של מדינאים מדויקים יותר משנהוג לחשוב","יש להימנע משימוש בזיכרונות כמקור היסטורי","מדינאים מסתירים בזיכרונותיהם רק פרטים שוליים","גם זיכרונות לא מדויקים יכולים ללמד על ערכי התקופה שבה נכתבו"],"a":3,"x":"לוין מסכימה שהזיכרונות מעוותים, אבל טוענת שהעיוותים עצמם מלמדים על הנורמות של התקופה. (1) מייחסת לה טענה על דיוק שהיא לא טוענת. (2) היא ההפך מעמדתה."},{"t":"יישום","lvl":4,"q":"לפי לוין, אם מדינאי השמיט מזיכרונותיו את חלקו בהחלטה שנויה במחלוקת, מה אפשר ללמוד מכך?","pt":"היסטוריונים נוטים לייחס אמינות נמוכה לזיכרונות שכתבו מדינאים לאחר פרישתם: הכותבים מבקשים להצדיק את מעשיהם, והם כותבים שנים רבות אחרי האירועים. ואולם החוקרת מירב לוין טוענת כי דווקא העיוותים האלה הם מקור מידע רב־ערך. לדבריה, מה שמדינאי בוחר להסתיר או לייפות מלמד אותנו על הנורמות של תקופתו – על מה שנחשב בה מביש או ראוי לשבח. משום כך היא מציעה לקרוא זיכרונות לא כתיעוד של מה שקרה, אלא כתיעוד של האופן שבו הכותב רצה שיזכרו אותו.","table":null,"o":["שלא היה לו חלק בהחלטה","שבתקופתו החלטה כזאת נחשבה כנראה לדבר שאין להתגאות בו","שהזיכרונות שלו חסרי ערך","שההחלטה הייתה נכונה"],"a":1,"x":"לפי לוין, מה שמדינאי בוחר להסתיר מלמד על מה שנחשב בתקופתו מביש. (1) מסיקה מההשמטה עובדה על מה שקרה – בדיוק מה שלוין מציעה לא לעשות."},{"t":"מחליש","lvl":5,"q":"איזה מהממצאים הבאים, אם יתגלה, יחליש במידה הרבה ביותר את גישתה של לוין?","pt":"היסטוריונים נוטים לייחס אמינות נמוכה לזיכרונות שכתבו מדינאים לאחר פרישתם: הכותבים מבקשים להצדיק את מעשיהם, והם כותבים שנים רבות אחרי האירועים. ואולם החוקרת מירב לוין טוענת כי דווקא העיוותים האלה הם מקור מידע רב־ערך. לדבריה, מה שמדינאי בוחר להסתיר או לייפות מלמד אותנו על הנורמות של תקופתו – על מה שנחשב בה מביש או ראוי לשבח. משום כך היא מציעה לקרוא זיכרונות לא כתיעוד של מה שקרה, אלא כתיעוד של האופן שבו הכותב רצה שיזכרו אותו.","table":null,"o":["הזיכרונות נכתבו עשרות שנים אחרי האירועים","גם יומנים שנכתבו בזמן אמת אינם מדויקים לגמרי","מדינאים רבים ייפו את חלקם בהחלטות שהצליחו","מדינאים השמיטו פרטים מזיכרונותיהם באופן אקראי, בלי קשר לאופן שבו ייתפסו"],"a":3,"x":"הגישה של לוין נשענת על ההנחה שההשמטות והייפויים <b>מכוונים<\/b> לפי מה שנחשב ראוי. אם ההשמטות אקראיות, הן לא מלמדות דבר על הנורמות. (1) כבר מוזכר בפסקה ואינו פוגע בטענה, (2) לא רלוונטי, ו(3) דווקא תומך בה."},{"t":"מדוע מוזכר","lvl":4,"q":"מדוע מוזכרת בפסקה ההוצאה על תיקון נזקי שיטפון?","pt":"בשנות החמישים הציעו כלכלנים אחדים להעריך את רווחתה של מדינה לפי התוצר הלאומי לנפש בלבד. מבקריהם הצביעו על כך שמדד זה אינו מבחין בין הוצאה על בניית בתי ספר לבין הוצאה על תיקון נזקי שיטפון: שתיהן מגדילות את התוצר באותה מידה. מכאן, טענו, שמדינה שנפגעת שוב ושוב מאסונות טבע עשויה להיראות לפי המדד משגשגת יותר.","table":null,"o":["כדי להראות שמדינות משקיעות יותר בתיקון נזקים מאשר בחינוך","כדי להמחיש שהמדד עשוי לעלות גם בעקבות אירועים שפוגעים ברווחה","כדי לטעון שאסונות טבע משפרים את כלכלת המדינה","כדי להסביר מדוע הוצע המדד בשנות החמישים"],"a":1,"x":"המבקרים מביאים את נזקי השיטפון כדוגמה להוצאה שמגדילה את התוצר אף שהיא נובעת מפגיעה – כדי להראות שהמדד אינו משקף רווחה. (3) מבלבלת בין ״להיראות משגשגת לפי המדד״ לבין ״להשתפר באמת״."}]},{"id":"vbb-parables","title":"משלים והשוואות","tag":"הבנה והסקה","en":false,"source":"ספר חשיבה מילולית, פרק ״משלים והשוואות״ (עמ' 217-232)","rule":["בשאלות משל מתוארת <b>התרחשות אמיתית<\/b>, ומישהו מגיב עליה ב<b>משפט דימויי<\/b> (משל, השוואה, פתגם). השאלה בודקת אם הבנת מה הדובר באמת התכוון לומר, גם כשהוא לא אמר את זה במפורש. זה ה״קריאה בין השורות״ של הפרק.","השיטה: (1) לזהות את ההתרחשות האמיתית: מי, מה קרה, על מה מדברים. (2) לפרק את המשל לרכיבים ולמצוא לכל רכיב את ה<b>מקבילה<\/b> שלו במציאות. (3) לנסח לעצמך במילים פשוטות מה המסר, ורק אז לעבור על התשובות.","סוגי השאלות בפרק: מה כוונת הדובר; למה מקביל רכיב מסוים במשל; באיזה הקשר סביר שנאמרו הדברים; איזה מצב דומה בהיגיון שלו; אילו שני משפטים קרובים במשמעותם; ומה <b>אינו<\/b> משתמע מהשיחה.","כשיש דיאלוג, כל דובר עונה למשל של השני. כדאי לבדוק מה כל אחד מהם טוען ואם השני מקבל את ההנחה של הראשון או מערער עליה."],"f":["משל = התרחשות אמיתית + דימוי, ולכל רכיב בדימוי יש מקבילה במציאות","קודם מנסחים את המסר לבד, ורק אחר כך קוראים את התשובות","מצב אנלוגי = אותו מבנה היגיון, לא אותו נושא"],"traps":["לפרש את המשל מילולית (״הוא באמת מדבר על דגים״)","לבחור תשובה שנכונה בפני עצמה אבל לא מתאימה להקבלה שבמשל","בשאלות ״מצב דומה״: לבחור תשובה שהנושא שלה זהה, אבל ההיגיון שלה שונה","בשאלות ״אינו משתמע״: לשכוח את השלילה ולסמן את הטענה הראשונה שמתאימה"],"ex":{"q":"נועה סיפרה לאחיה שהיא מתכננת לפתוח מחר מאפייה גדולה, אף שמעולם לא אפתה לקהל. אחיה ענה לה: ״גם מי שלומד לשחות מתחיל ליד החוף, לא בלב הים.״ מה הייתה כוונתו?","pt":null,"steps":["<b>ההתרחשות האמיתית:<\/b> נועה, בלי ניסיון, רוצה לפתוח מיד עסק גדול.","<b>פירוק המשל:<\/b> ״ללמוד לשחות״ מקביל לרכישת ניסיון באפייה מסחרית. ״ליד החוף״ מקביל להתחלה קטנה ובטוחה, ו״לב הים״ מקביל למאפייה גדולה.","<b>המסר:<\/b> כדאי שנועה תתחיל בקטן (למשל דוכן או הזמנות מהבית) ותגדל בהדרגה.","לכן תשובה כמו ״אל תפתחי מאפייה בכלל״ שגויה, כי המשל לא אוסר לשחות. הוא רק ממליץ להתחיל ליד החוף."]},"g":{"q":"יואב התלונן שהוא לא מתקדם בלימודי הגיטרה. חברו אמר לו: ״מי שמשקה עציץ פעם בחודש, שלא יתפלא שהוא לא פורח.״ מה כוונת החבר?","pt":null,"o":["יואב בחר כלי נגינה שאינו מתאים לו","יואב אינו מתאמן באופן קבוע ומספיק","יואב צריך לחכות בסבלנות, כי התקדמות לוקחת זמן","יואב צריך להחליף מורה"],"a":1,"g":["מה מקביל ל״השקיית העציץ״ בסיפור של יואב?","ומה אומר ״פעם בחודש״ על התדירות?"],"x":"השקיה מקבילה לאימון, ו״פעם בחודש״ פירושו אימון נדיר מדי. החבר אומר שהסיבה לחוסר ההתקדמות היא שיואב לא מתאמן מספיק. תשובה 3 מפתה, אבל המשל לא אומר ״חכה״. הוא אומר ״השקה יותר״."},"solo":{"q":"מנהלת בית ספר אמרה למורה חדש שרצה לשנות בבת אחת את כל תוכנית הלימודים: ״מי שמסובב את ההגה בחדות באמצע נסיעה מהירה, עלול להתהפך.״ במשל שלה, ״סיבוב חד של ההגה״ מקביל ל-","pt":null,"o":["עבודתו היומיומית של המורה","החשש של המנהלת מפני המורה","שינוי כל תוכנית הלימודים בבת אחת","התלמידים שלומדים בבית הספר"],"a":2,"x":"בהתרחשות האמיתית, המורה רוצה לעשות שינוי גדול ומהיר. זו המקבילה ל״סיבוב חד״. ״הנסיעה המהירה״ היא שגרת בית הספר שכבר פועלת, ו״להתהפך״ פירושו שהשינוי עלול לגרום לנזק."},"bank":[{"t":"כוונת הדובר","lvl":1,"q":"מיכל דחתה שוב ושוב את הבדיקה של רכבה, עד שהוא נתקע באמצע הדרך. השכן שלה אמר: ״תיקון קטן היום חוסך שיפוץ גדול מחר.״ מה רצה השכן לומר?","pt":null,"table":null,"o":["כדאי לטפל בבעיות קטנות לפני שהן גדלות","כדאי לקנות רכב חדש במקום לתקן ישן","תיקונים במוסך יקרים יותר מבעבר","אין טעם לתקן רכב שכבר נתקע"],"a":0,"x":"״תיקון קטן היום״ מקביל לבדיקה שמיכל דחתה, ו״שיפוץ גדול מחר״ מקביל לתקלה החמורה. המסר הוא שטיפול מוקדם חוסך נזק גדול יותר."},{"t":"שני משפטים דומים","lvl":2,"q":"לפניך ארבעה משפטים:\nא. אין עשן בלי אש.\nב. מי שזורע רוח קוצר סופה.\nג. אם כולם מדברים על משהו, כנראה יש בו משהו.\nד. אל תדחה למחר את מה שאפשר לעשות היום.\nלשניים מן המשפטים משמעות דומה. אילו הם?","pt":null,"table":null,"o":["א ו-ב","א ו-ד","ב ו-ג","א ו-ג"],"a":3,"x":"גם ״אין עשן בלי אש״ וגם משפט ג אומרים שלשמועה או לרושם כללי יש בדרך כלל בסיס במציאות. משפט ב עוסק בתוצאות קשות של מעשים רעים, ומשפט ד עוסק בדחיינות."},{"t":"ההקשר","lvl":3,"q":"עמית אמר לרונית: ״אין טעם לצבוע את הקירות כשהגג דולף.״ באיזה הקשר סביר ביותר שנאמרו הדברים?","pt":null,"table":null,"o":["רונית הציעה לתקן תקלה חמורה במוצר של החברה לפני ההשקה","רונית הציעה לשפץ את גג המשרד לפני החורף","רונית הציעה לעצב מחדש את אתר החברה, בזמן שהמוצר עצמו מלא תקלות","רונית התלוננה שמחיר הצבע התייקר"],"a":2,"x":"״לצבוע קירות״ מקביל לשיפור חיצוני (עיצוב האתר), ו״גג דולף״ מקביל לבעיה יסודית (התקלות במוצר). עמית אומר שקודם צריך לטפל ביסוד. בתשובה 1 רונית בעצם מציעה לתקן את הגג, ולכן עמית לא היה מתנגד. תשובות 2 ו-4 לוקחות את המשל מילולית."},{"t":"מצב דומה בהיגיון","lvl":3,"q":"שירה אמרה: ״אי אפשר לשפוט ספר על פי פרק אחד שקראת בו.״ איזה מן המשפטים הבאים דומה ביותר בהיגיון שלו לטענתה של שירה?","pt":null,"table":null,"o":["אי אפשר להבין ספר בלי לדעת את השפה שבה נכתב","אי אפשר להעריך עונה שלמה של קבוצה לפי משחק אחד","ספר טוב חייב לפתוח בפרק מעניין","מי שקורא הרבה ספרים כותב טוב יותר"],"a":1,"x":"ההיגיון של שירה: אין לשפוט שלם לפי חלק קטן ממנו. גם במשפט על הקבוצה שופטים עונה שלמה לפי משחק בודד. בשאר התשובות יש ספרים, אבל לא את מבנה ההיגיון של ״חלק מול שלם״. זה הפיתוי של ״אותו נושא״."},{"t":"רכיב במשל","lvl":2,"q":"רז, שחקן כדורסל צעיר, התלונן שהמאמן לא נותן לו לשחק בגמר. המאמן ענה: ״לא שולחים חייל לחזית לפני שסיים טירונות.״ במשל, ״הטירונות״ מקבילה ל-","pt":null,"table":null,"o":["משחק הגמר","תקופת האימונים והמשחקים הקלים שרז צריך לעבור","הקבוצה היריבה","המאמן עצמו"],"a":1,"x":"״החזית״ היא משחק הגמר, ו״הטירונות״ היא שלב ההכשרה שקודם לה, כלומר האימונים והמשחקים הקלים שבהם רז צובר ניסיון."},{"t":"אינו משתמע","lvl":4,"q":"דן: ״מאז שהחלפנו את המאמן, הקבוצה שלנו היא כמו ספינה בלי רב-חובל.״\nגלעד: ״ספינה בלי רב-חובל עדיין יכולה להגיע לנמל, אם הצוות יודע לנווט.״\nאיזה מן הבאים <b>אינו<\/b> משתמע מן השיחה?","pt":null,"table":null,"o":["דן סבור שמאז ההחלפה הקבוצה פועלת בלי הכוונה","דן מייחס את מצב הקבוצה לשינוי בצוות האימון","גלעד סבור שהשחקנים יכולים להצליח גם בלי הכוונה טובה מהמאמן","גלעד סבור שהמאמן החדש טוב יותר מהקודם"],"a":3,"x":"גלעד לא מתווכח עם התיאור של דן (״אין רב-חובל״). הוא רק טוען שהצוות יכול להסתדר גם כך. מכאן אי אפשר להסיק שהוא חושב שהמאמן החדש טוב יותר. שלוש הטענות האחרות עולות ישירות מהמשלים."},{"t":"דוגמה נוספת לתופעה","lvl":4,"q":"בבית מסוים, כל אחד מבני המשפחה בטוח שמישהו אחר כבר יוציא את הזבל, ולכן הזבל נשאר בבית ימים שלמים. איזה מן המצבים הבאים הוא דוגמה נוספת לאותה תופעה?","pt":null,"table":null,"o":["עובד לא דיווח על תקלה במכונה כי חשש שיאשימו אותו בה","עשרות עוברים ושבים ראו פנס רחוב שבור, אבל איש לא דיווח לעירייה, כי כל אחד הניח שמישהו אחר כבר דיווח","דיירי בניין קבעו תורנות לניקוי חדר המדרגות, ואחד הדיירים השתמט מהתור שלו","כל תלמידי הכיתה הגישו את העבודה באיחור, כי המורה לא קבעה תאריך הגשה ברור"],"a":1,"x":"התופעה היא פיזור אחריות: כשרבים יכולים לפעול, כל אחד מניח שמישהו אחר יעשה זאת, ולכן איש לא פועל. רק בתשובה 2 זה המנגנון. בתשובה 1 הסיבה היא פחד, בתשובה 3 אחד משתמט מחובה מוגדרת, ובתשובה 4 הבעיה היא הוראה לא ברורה."}]},{"id":"vbb-strengthen-weaken","title":"מחזק / מחליש","tag":"הבנה והסקה","en":false,"source":"ספר חשיבה מילולית, פרק ״מחזק/מחליש״ (עמ' 233-250)","rule":["בשאלות האלה מופיעים <b>נתון<\/b> (מידע ודאי שאי אפשר להתווכח איתו) ו<b>מסקנה<\/b> (מה שסביר להסיק ממנו). אחר כך מוסיפים מידע חדש, וצריך להחליט אם הוא הופך את המסקנה ל<b>יותר<\/b> סבירה (מחזק), ל<b>פחות<\/b> סבירה (מחליש), או שאינו נוגע בה.","<b>דרכים להחליש:<\/b> הסבר חלופי לנתון (״הוא לא אוהב פיצה, פשוט רק היא מגיעה עד אליו״), דוגמה סותרת, ערעור היסוד שעליו נשענת המסקנה, והיפוך סיבה ותוצאה (״ביצה ותרנגולת״).","<b>דרכים לחזק:<\/b> שלילת הסבר חלופי, דוגמה תומכת נוספת, וחיזוק היסוד של המסקנה. מידע שעוסק באותו נושא אבל לא נוגע בקשר בין הנתון למסקנה הוא <b>לא קשור<\/b>.","שיטה: נסח לעצמך במשפט אחד מה המסקנה טוענת ועל מה היא נשענת. כל מידע חדש בודקים מול <b>המסקנה<\/b>, לא מול הנתון. כשיש שתי מסקנות, בודקים כל אחת בנפרד."],"f":["מחליש: הסבר חלופי | דוגמה סותרת | ערעור יסוד | היפוך סיבה ותוצאה","מחזק: שלילת הסבר חלופי | דוגמה תומכת | חיזוק יסוד","מתאם ≠ סיבתיות: בדוק גורם שלישי ואת הכיוון ההפוך"],"traps":["מידע שעוסק באותו נושא נראה רלוונטי, אבל הוא לא משנה את סבירות המסקנה","לבדוק את המידע מול הנתון במקום מול המסקנה","לחשוב ש״מחליש״ פירושו ״מפריך לגמרי״. מספיק שהמסקנה נעשית פחות סבירה","בשאלות ״איזה אינו מחליש״, התשובה יכולה להיות גם מידע מחזק"],"ex":{"q":"נתון: בחנות מסוימת נמכרות בכל חורף הרבה יותר מטריות כחולות מאדומות. מסקנה: לקוחות החנות מעדיפים מטריות כחולות. מידע נוסף: בחלון הראווה של החנות מוצגות רק מטריות כחולות, והאדומות מאוחסנות במחסן. האם המידע מחזק או מחליש את המסקנה?","pt":null,"steps":["המסקנה נשענת על ההנחה שהמכירות משקפות <b>העדפה<\/b> של הלקוחות.","המידע הנוסף מציע <b>הסבר חלופי<\/b>: אנשים קונים כחול כי זה מה שהם רואים, לא בהכרח כי הם מעדיפים אותו.","הסבר חלופי מקטין את הסבירות של המסקנה, ולכן המידע <b>מחליש<\/b> אותה (אבל לא מפריך: ייתכן שהם בכל זאת מעדיפים כחול)."]},"g":{"q":"נתון: עידו מזמין פיצה כמעט בכל ערב. מסקנה: עידו אוהב פיצה. מידע נוסף: כשהציעו לעידו לבחור בין פיצה להמבורגר באותו מחיר, הוא בחר בפיצה. מה השפעת המידע על המסקנה?","pt":null,"o":["מחזק את המסקנה","מחליש את המסקנה","אינו קשור למסקנה","מפריך את המסקנה"],"a":0,"g":["האם המידע מתאר מקרה נוסף שבו עידו בוחר בפיצה?","במקרה הזה הבחירה הייתה חופשית ובאותו מחיר. זו דוגמה תומכת."],"x":"המידע הוא דוגמה תומכת: עידו בחר בפיצה כשהייתה לו חלופה שווה במחיר. בגלל זה סביר יותר שהוא באמת אוהב פיצה, ולכן המידע מחזק את המסקנה."},"solo":{"q":"נתון: עידו מזמין פיצה כמעט בכל ערב. מסקנה: עידו אוהב פיצה. מידע נוסף: הפיצרייה היא העסק היחיד בשכונה שמבצע משלוחים בשעה שבה עידו חוזר מהעבודה. מה השפעת המידע על המסקנה?","pt":null,"o":["מחזק את המסקנה","אינו קשור למסקנה","מחליש את המסקנה","מוכיח שהמסקנה נכונה"],"a":2,"x":"המידע נותן הסבר חלופי להזמנות: אולי עידו מזמין פיצה כי אין לו אפשרות אחרת, לא כי הוא אוהב אותה. לכן המידע מחליש את המסקנה."},"bank":[{"t":"לא קשור","lvl":1,"q":"נתון: עידו מזמין פיצה כמעט בכל ערב. מסקנה: עידו אוהב פיצה. מידע נוסף: עידו אוהב לצפות במשחקי כדורגל. מה השפעת המידע על המסקנה?","pt":null,"table":null,"o":["מחזק את המסקנה","מחליש את המסקנה","אינו קשור למסקנה","מחזק ומחליש באותה מידה"],"a":2,"x":"המידע עוסק בעידו, אבל לא אומר שום דבר על היחס שלו לפיצה. לכן הוא לא קשור למסקנה."},{"t":"הסבר חלופי (גורם שלישי)","lvl":3,"q":"במחקר נמצא שתלמידים שאוכלים ארוחת בוקר מקבלים בממוצע ציונים גבוהים יותר מתלמידים שאינם אוכלים. החוקרים הסיקו שארוחת בוקר משפרת את ההישגים בלימודים. איזה מן הנתונים הבאים <b>מחליש<\/b> את המסקנה?","pt":null,"table":null,"o":["גם בבית ספר בעיר אחרת נמצאו תוצאות דומות","תלמידים שאוכלים ארוחת בוקר הם ברובם ילדים להורים שמקדישים זמן רב לעזרה בשיעורי הבית","בשבוע שבו בית הספר חילק ארוחת בוקר לכל התלמידים, עלה הציון הממוצע","ארוחת בוקר מזינה כוללת חלבונים ופחמימות"],"a":1,"x":"תשובה 2 מציעה גורם שלישי: מעורבות ההורים יכולה להסביר גם את ארוחת הבוקר וגם את הציונים, ולכן היא מחלישה. תשובות 1 ו-3 מחזקות את המסקנה (דוגמה תומכת וניסוי שבו רק ארוחת הבוקר השתנתה), ותשובה 4 לא נוגעת לקשר."},{"t":"היפוך סיבה ותוצאה","lvl":3,"q":"סקר מצא שאנשים שמגדלים כלב מדווחים על פחות בדידות מאנשים שאין להם כלב. מכאן הוסק שגידול כלב מפחית בדידות. איזה מן הנתונים הבאים <b>מחליש<\/b> את המסקנה?","pt":null,"table":null,"o":["כלבים צריכים לצאת לטיול לפחות פעמיים ביום","במחקר המשך, אנשים שאימצו כלב דיווחו על ירידה בבדידות בשנה שאחרי האימוץ","אנשים עם חיי חברה עשירים נוטים יותר לאמץ כלב, כי חבריהם מעודדים אותם ועוזרים להם לטפל בו","גם אנשים שמגדלים חתול מדווחים על פחות בדידות"],"a":2,"x":"תשובה 3 הופכת את כיוון הסיבתיות: ייתכן שמי שכבר פחות בודד הוא זה שמאמץ כלב, ולא שהכלב מפחית בדידות. תשובה 2 מחזקת את המסקנה, תשובה 1 לא קשורה, ותשובה 4 לא פוגעת במסקנה על כלבים."},{"t":"איזה אינו מחליש","lvl":3,"q":"אחרי שהוצבה מצלמת מהירות בכביש בין-עירוני, ירד מספר התאונות בו בכ-30% בתוך שנה. מכאן הוסק שהמצלמה הפחיתה את מספר התאונות. איזה מן הנתונים הבאים <b>אינו מחליש<\/b> את המסקנה?","pt":null,"table":null,"o":["באותה שנה הותקנה בכביש תאורת לילה חדשה","באותה שנה נפתח כביש עוקף, וחלק גדול מהתנועה עבר אליו","בכבישים סמוכים שאין בהם מצלמה ירד מספר התאונות באותה שנה בשיעור דומה","נהגים רבים מאטים כשהם רואים את השלט שמזהיר מפני המצלמה"],"a":3,"x":"שלוש התשובות הראשונות מציעות הסבר אחר לירידה: תאורה, פחות תנועה, או ירידה כללית שאינה קשורה למצלמה. תשובה 4 מתארת מנגנון שבו המצלמה גורמת לנהיגה זהירה, ולכן היא דווקא מחזקת את המסקנה."},{"t":"שתי מסקנות","lvl":4,"q":"על פי הניסוי שבקטע: מתברר שצמחי קבוצה ב הושקו בחצי מכמות המים שקיבלו שתי הקבוצות האחרות. מה השפעת המידע?","pt":"חקלאית רצתה לבדוק את השפעתם של שני דשנים על צמחי עגבנייה. היא חילקה שתילים זהים לשלוש קבוצות: קבוצה א קיבלה דשן X, קבוצה ב קיבלה דשן Y, וקבוצה ג לא קיבלה דשן. אחרי חודשיים הגובה הממוצע היה 30 ס״מ בקבוצה א, 20 ס״מ בקבוצה ב ו-15 ס״מ בקבוצה ג. החקלאית הסיקה שתי מסקנות:\nמסקנה א: דשן X יעיל יותר מדשן Y.\nמסקנה ב: כל אחד משני הדשנים מגביר את הצמיחה.","table":null,"o":["המידע מחזק את מסקנה א ומחליש את מסקנה ב","המידע מחליש את מסקנה א ומחזק את מסקנה ב","המידע מחזק את שתי המסקנות","המידע מחליש את שתי המסקנות"],"a":1,"x":"מסקנה א נחלשת, כי ייתכן שקבוצה ב גדלה פחות בגלל מחסור במים ולא בגלל הדשן. מסקנה ב מתחזקת: אפילו עם פחות מים, קבוצה ב גדלה יותר מקבוצה ג. לכן הדשן Y כנראה עוזר, ואולי אפילו יותר ממה שנמדד."},{"t":"שתי מסקנות","lvl":4,"q":"על פי הניסוי שבקטע: מתברר שכל צמחי קבוצה ג גדלו בחלקה מוצלת, ואילו קבוצות א ו-ב גדלו בשמש מלאה. מה השפעת המידע?","pt":"חקלאית רצתה לבדוק את השפעתם של שני דשנים על צמחי עגבנייה. היא חילקה שתילים זהים לשלוש קבוצות: קבוצה א קיבלה דשן X, קבוצה ב קיבלה דשן Y, וקבוצה ג לא קיבלה דשן. אחרי חודשיים הגובה הממוצע היה 30 ס״מ בקבוצה א, 20 ס״מ בקבוצה ב ו-15 ס״מ בקבוצה ג. החקלאית הסיקה שתי מסקנות:\nמסקנה א: דשן X יעיל יותר מדשן Y.\nמסקנה ב: כל אחד משני הדשנים מגביר את הצמיחה.","table":null,"o":["המידע מחליש את שתי המסקנות","המידע מחזק את מסקנה א ומחליש את מסקנה ב","המידע מחליש את מסקנה א בלבד","המידע מחליש את מסקנה ב ואינו נוגע למסקנה א"],"a":3,"x":"ההשוואה בין א ל-ב לא השתנתה, כי שתיהן גדלו בשמש. לכן מסקנה א לא מושפעת. אבל הצמיחה הנמוכה של קבוצה ג יכולה לנבוע מהצל ולא מהיעדר דשן, ולכן מסקנה ב נחלשת."},{"t":"מחזק","lvl":2,"q":"דורית הבחינה שבימים שבהם היא שותה קפה אחרי ארבע אחר הצהריים, היא נרדמת מאוחר. היא הסיקה שקפה מאוחר פוגע בשינה שלה. איזה מן הנתונים הבאים <b>מחזק<\/b> את מסקנתה?","pt":null,"table":null,"o":["בשבוע שבו שתתה קפה נטול קפאין באותן שעות, היא נרדמה בשעה הרגילה","דורית שותה קפה מאוחר בעיקר בימים שבהם היא עובדת עד שעות הלילה","גם בעלה של דורית נרדם מאוחר לפעמים","דורית מעדיפה קפה עם חלב"],"a":0,"x":"תשובה 1 שוללת הסבר חלופי שקשור להרגל או לשעה: כשרק הקפאין הוסר, השינה חזרה לרגיל. זה מחזק את המסקנה. תשובה 2 דווקא מחלישה (עבודה עד הלילה היא הסבר אחר), ותשובות 3 ו-4 לא קשורות."}]},{"id":"vbb-scientific","title":"חשיבה מדעית","tag":"הבנה והסקה","en":false,"source":"ספר חשיבה מילולית, פרק ״חשיבה מדעית״ (עמ' 251-267)","rule":["בשאלות האלה מתואר תהליך של <b>ניסוי או מחקר<\/b>, בדרך כלל בשלושה חלקים: איך נערך המחקר, מה התוצאות, ומה המסקנה. אין צורך במונחים אקדמיים. מספיק להבין באופן אינטואיטיבי אם הנתונים באמת מבססים את המסקנה.","<b>הכלל הראשון:<\/b> כדי שמסקנה מניסוי תהיה קבילה, הקבוצות שמשווים צריכות להיות <b>דומות זו לזו ככל האפשר בכל דבר, חוץ מהגורם שבודקים<\/b>. אם הן נבדלות גם במשהו נוסף (גיל, עונה, מקום), אי אפשר לדעת מה גרם לתוצאה.","<b>הכלל השני:<\/b> מכך ששני דברים מופיעים יחד, אי אפשר להסיק שאחד מהם גורם לשני. ייתכן שהסיבתיות הפוכה, או שגורם שלישי משפיע על שניהם. בנוסף, צריך לשים לב לנתונים חסרים: מספרים מוחלטים בלי גודל הקבוצה, או קבוצה שלא נבדקה.","סוגי שאלות: בחירת קבוצות מתאימות לניסוי, בדיקה נוספת שצריך לערוך, ממצא שתומך בהשערה, הסבר חלופי לממצא, ההנחה שהחוקר הסתמך עליה, ומסקנה אחרת שאפשר להסיק מאותם נתונים."],"f":["קבוצות הניסוי זהות בכל דבר חוץ מהגורם הנבדק","מתאם ≠ סיבתיות: כיוון הפוך? גורם שלישי?","״גורם יחיד״: עם הגורם תמיד מקבלים תוצאה אחת, ובלעדיו תמיד את השנייה","מספרים מוחלטים בלי גודל הקבוצה = מידע חסר"],"traps":["לבחור קבוצות שנבדלות בשני מאפיינים (למשל גם גיל וגם הגורם הנבדק)","להסיק סיבה ותוצאה מסקר שבו שני דברים פשוט מופיעים יחד","להשוות מספרים מוחלטים בין קבוצות בגדלים שונים","לפספס הנחה סמויה, כמו ״העונה לא משפיעה״ כשמשווים חודשים שונים"],"ex":{"q":"טל רוצה לבדוק אם קריאה לפני השינה מגבירה את הסיכוי לחלומות נעימים. אילו שתי קבוצות הכי מתאימות להשוואה?","pt":null,"steps":["הגורם הנבדק הוא <b>קריאה לפני השינה<\/b>. כל השאר צריך להיות זהה.","״ילדים שקוראים לעומת מבוגרים שקוראים״: הקבוצות נבדלות בגיל ולא בגורם הנבדק. פסול.","״ילדים שלא קוראים לעומת מבוגרים שקוראים״: נבדלות בשני דברים, ולכן לא נדע מה השפיע. פסול.","<b>״מבוגרים שקוראים לעומת מבוגרים שלא קוראים״<\/b>: נבדלות רק בקריאה. זו ההשוואה המתאימה."]},"g":{"q":"חוקרת רוצה לבדוק אם האזנה למוזיקה בזמן הלמידה משפרת את הזכירה. איזו השוואה מתאימה ביותר?","pt":null,"o":["סטודנטים שלומדים עם מוזיקה לעומת תלמידי תיכון שלומדים בשקט","סטודנטים שלומדים מתמטיקה עם מוזיקה לעומת סטודנטים שלומדים היסטוריה בשקט","סטודנטים שלומדים אותו חומר באותו חדר, חלקם עם מוזיקה וחלקם בשקט","סטודנטים שלומדים עם מוזיקה בספרייה לעומת סטודנטים שלומדים בשקט בבית"],"a":2,"g":["מהו הגורם הנבדק?","באיזו תשובה הקבוצות נבדלות <b>רק<\/b> בגורם הזה?"],"x":"רק בתשובה 3 ההבדל היחיד בין הקבוצות הוא המוזיקה. בשאר התשובות יש הבדל נוסף (גיל, נושא הלימוד או מקום), ולכן אי אפשר לדעת מה השפיע על הזכירה."},"solo":{"q":"מורה רצתה לבדוק אם משחקי לוח משפרים את ההישגים בחשבון. היא נתנה לכיתה ז1 לשחק במשחקי לוח חצי שעה ביום במשך חודש, ומצאה שהציונים של הכיתה בחשבון עלו. איזו בדיקה נוספת הכי חשובה כדי לבסס את המסקנה?","pt":null,"o":["לבדוק אם תלמידי ז1 נהנו מהמשחקים","לבדוק את השינוי בציוני החשבון באותו חודש בכיתה מקבילה שלא שיחקה","לבדוק מה היו ציוני ז1 בחשבון בשנה שעברה","לבדוק אם תלמידי ז1 משחקים במשחקי לוח גם בבית"],"a":1,"x":"חסרה קבוצת ביקורת. ייתכן שהציונים היו עולים בכל מקרה (חומר קל יותר, תרגול רגיל). רק השוואה לכיתה דומה שלא שיחקה תראה אם העלייה נובעת מהמשחקים."},"bank":[{"t":"מידע חסר","lvl":1,"q":"בשנה מסוימת נפטרו בבית חולים א 40 מטופלים ובבית חולים ב 20 מטופלים. עיתונאי הסיק מכך שבית חולים ב מטפל טוב יותר. איזה מידע חסר ביותר כדי להעריך את המסקנה?","pt":null,"table":null,"o":["כמה עולה יום אשפוז בכל אחד מבתי החולים","באיזו עיר נמצא כל אחד מבתי החולים","כמה מטופלים נפטרו בבית חולים א בשנה שלפני כן","כמה מטופלים טופלו בסך הכול בכל אחד מבתי החולים"],"a":3,"x":"מספר מוחלט של נפטרים לא אומר הרבה בלי גודל הקבוצה. אם בבית חולים א טופלו פי ארבעה מטופלים, שיעור התמותה בו דווקא נמוך יותר."},{"t":"ממצא תומך","lvl":2,"q":"השערה: ציפורי שיר בעיר שרות בצליל גבוה יותר מציפורים בכפר, כדי שישמעו אותן מעל רעש התנועה. איזה מן הממצאים הבאים תומך ביותר בהשערה?","pt":null,"table":null,"o":["ציפורים בעיר שרות פחות שעות ביום מציפורים בכפר","באותה עיר, הציפורים שרות בצליל נמוך יותר בימים שבהם התנועה דלילה","ציפורים בכפר שרות שירים ארוכים יותר","רעש תנועה פוגע בשמיעה של בני אדם"],"a":1,"x":"בתשובה 2 אותן ציפורים, באותו מקום, משנות את גובה הצליל כשרק רמת הרעש משתנה. זו בדיוק התחזית של ההשערה. שאר התשובות לא עוסקות בגובה הצליל או בקשר שלו לרעש."},{"t":"מסקנה אחרת מאותם נתונים","lvl":3,"q":"סקר מצא שבקרב בעלי משרות בכירות, שיעור הקוראים הקבועים של עיתון כלכלי גבוה יותר מאשר בשאר האוכלוסייה. עורך העיתון הסיק שקריאת עיתון כלכלי עוזרת להגיע למשרה בכירה. לאיזו מסקנה <b>אחרת<\/b> סביר שאפשר להגיע מאותם נתונים?","pt":null,"table":null,"o":["מי שאינו קורא עיתון כלכלי לא יגיע למשרה בכירה","הגעה למשרה בכירה גורמת לאנשים להתעניין יותר בעיתונות כלכלית","רוב קוראי העיתונים הכלכליים הם בעלי משרות בכירות","עיתונים כלכליים אינם משפיעים כלל על הקריירה"],"a":1,"x":"הנתונים מראים רק ששני הדברים מופיעים יחד. ייתכן שהכיוון הפוך: התפקיד הבכיר הוא שמוביל לקריאה. תשובה 1 קיצונית מדי. תשובה 3 מבלבלת כיוון: שיעור גבוה בקרב הבכירים לא אומר שרוב הקוראים בכירים. תשובה 4 לא נובעת מהנתונים."},{"t":"הנחה סמויה","lvl":3,"q":"חוקר רצה לבדוק אם תוסף מזון חדש מגביר את ייצור החלב של פרות. בחודש ינואר הוא נתן את התוסף לעדר, בחודש יולי לא נתן אותו לאותו עדר, והשווה בין כמויות החלב. על איזו הנחה התבסס החוקר?","pt":null,"table":null,"o":["התוסף אינו מזיק לבריאות הפרות","פרות בעדרים אחרים יגיבו לתוסף באותו אופן","כמות החלב שפרה מייצרת אינה מושפעת מעונת השנה","כל הפרות בעדר אוכלות כמות מזון זהה"],"a":2,"x":"שתי התקופות שהוא משווה נבדלות גם בתוסף וגם בעונה. כדי לייחס את ההבדל לתוסף, החוקר חייב להניח שהעונה לא משפיעה על כמות החלב. שאר ההנחות לא נחוצות להשוואה הזו."},{"t":"הסבר חלופי","lvl":3,"q":"בעיר מסוימת נמצא שבשכונות שבהן יש יותר גינות ציבוריות, הדיירים מדווחים על מצב רוח טוב יותר. איזה מן הבאים <b>אינו<\/b> יכול לשמש הסבר חלופי לממצא, כלומר הסבר שבו הגינות אינן הגורם למצב הרוח?","pt":null,"table":null,"o":["השכונות שבהן יש הרבה גינות הן גם השכונות המבוססות בעיר, ומצב כלכלי טוב משפר את מצב הרוח","אנשים אופטימיים נוטים לבחור לגור בשכונות ירוקות","דיירים שמבלים בגינה שעה ביום מדווחים על שיפור במצב רוחם לעומת התקופה שלפני שהגינה נפתחה","בשכונות עם הרבה גינות יש פחות רעש תנועה, ושקט משפר את מצב הרוח"],"a":2,"x":"תשובה 3 אינה הסבר חלופי. היא מחזקת את הטענה שהגינות עצמן משפרות את מצב הרוח. תשובות 1 ו-4 מציעות גורם שלישי (כלכלה, שקט), ותשובה 2 מציעה כיוון הפוך (מצב הרוח משפיע על בחירת השכונה)."},{"t":"גורם יחיד","lvl":4,"q":"בוטנאי בודק את ההשערה שהחומר M הוא <b>הגורם היחיד<\/b> שקובע אם עלי הצמח יהיו משוננים או חלקים. הוא בדק מאות צמחים, חלקם עם M וחלקם בלעדיו. איזה מן הממצאים הבאים תומך בהשערה?","pt":null,"table":null,"o":["בצמחים עם M נמצאו גם עלים משוננים וגם חלקים. בצמחים בלי M נמצאו רק עלים חלקים","בצמחים עם M נמצאו רק עלים משוננים. בצמחים בלי M נמצאו גם עלים משוננים וגם חלקים","בצמחים עם M נמצאו רק עלים משוננים. בצמחים בלי M נמצאו רק עלים חלקים","בצמחים עם M נמצאו רק עלים חלקים. בצמחים בלי M נמצאו גם עלים משוננים וגם חלקים"],"a":2,"x":"אם M הוא הגורם היחיד, אז כל הצמחים עם M צריכים להיות מסוג אחד, וכל הצמחים בלי M מהסוג השני. אם בקבוצה כלשהי מופיעים שני הסוגים, יש גורם נוסף שמשפיע על צורת העלה. רק בתשובה 3 אין ״ערבוב״ באף קבוצה."},{"t":"בחירת קבוצות","lvl":4,"q":"חוקר רוצה לבדוק את הטענה שלימוד שפה זרה בילדות מקל על לימוד שפה זרה נוספת בבגרות. איזה מחקר מתאים ביותר לבדיקת הטענה?","pt":null,"table":null,"o":["השוואה בין מבוגרים שלמדו אנגלית בילדותם למבוגרים שלמדו אנגלית בבגרותם, במהירות שבה הם קוראים באנגלית","השוואה בין מבוגרים שלמדו בילדותם שפה זרה למבוגרים שלא למדו, במהירות שבה כל אחד מהם לומד בבגרות שפה חדשה שאיש מהם לא הכיר","בדיקה של מהירות הלימוד של ילדים שלומדים שתי שפות זרות בבת אחת","השוואה בין מבוגרים שלמדו שפה זרה בילדותם, במהירות שבה הם לומדים בבגרות את אותה שפה שוב"],"a":1,"x":"צריך שתי קבוצות של מבוגרים שנבדלות רק בכך שאחת למדה שפה זרה בילדות. את שתיהן בודקים בלימוד של שפה <b>חדשה<\/b> לכולם, כדי שלאף קבוצה לא יהיה יתרון של היכרות קודמת. תשובה 1 לא בודקת שפה נוספת, תשובה 3 לא בודקת בגרות, ובתשובה 4 אין קבוצה להשוואה."}]},{"id":"vbb-rules","title":"שאלות כללים","tag":"כללים ושיבוצים","en":false,"source":"ספר חשיבה מילולית, פרק ״כללים ושיבוצים״, חלק א׳ ״כללים״ (עמ' 269-271, תרגול עמ' 279 ואילך)","rule":["שאלות ״כללים ושיבוצים״ נחשבות ל<b>טכניות<\/b>: הפתרון תלוי פחות בהבנת טקסט ויותר בעבודה מסודרת. בשאלות כללים מקבלים כמה כללים (של משחק, של קבלה למוסד וכדומה), וצריך לבדוק איזו תשובה מתיישבת איתם.","<b>שלב ראשון: לתמצת את הכללים<\/b> בכתב קצר עם חצים. ״אם אמריקאי אז קומי״ נכתב <b>אמריקאי → קומי<\/b>. ״אם ורק אם״ נכתב בחץ דו-כיווני <b>↔<\/b>, כלומר הכלל פועל בשני הכיוונים.","<b>שלב שני: לעבור על התשובות<\/b> ולבדוק כל אחת מול כל כלל. ברגע שתשובה מפרה כלל אחד, היא נפסלת. בשאלות ״איזה יכול להיות״, כשמוצאים תשובה שעומדת בכל הכללים, אין צורך לבדוק את השאר.","חשוב לזכור: מ-<b>A → B<\/b> נובע גם <b>לא B → לא A<\/b> (שלילת התוצאה), אבל <b>לא<\/b> נובע B → A, ולא נובע לא A → לא B."],"f":["A → B  שקול ל-  לא B → לא A","A → B  אינו אומר B → A","A ↔ B: אם יש A יש B, ואם אין A אין B","״או״ בכלל = לפחות אחד מהתנאים מתקיים"],"traps":["להפוך את כיוון החץ (״כל מי שנרשם קיבל חולצה״ ≠ ״כל מי שקיבל חולצה נרשם״)","לשכוח את הכיוון השני ב״אם ורק אם״","לבדוק תשובה מול כלל אחד בלבד ולשכוח את השני","בשאלות ״בהכרח״: לבחור תשובה שאפשרית, אבל לא מחויבת"],"ex":{"q":"במסעדה: (א) אם המנה צמחונית, היא מוגשת בצלחת ירוקה. (ב) כל מנה שמחירה מעל 50 ש״ח מוגשת עם לחם. איזו מנה <b>יכולה<\/b> להיות מוגשת במסעדה? (1) מנה צמחונית בצלחת לבנה ב-40 ש״ח. (2) מנה בשרית בצלחת ירוקה ב-60 ש״ח, בלי לחם. (3) מנה בשרית בצלחת לבנה ב-70 ש״ח, עם לחם.","pt":null,"steps":["<b>תמצות:<\/b> צמחונית → צלחת ירוקה. מחיר מעל 50 → לחם.","(1) צמחונית בצלחת לבנה מפרה את כלל א. נפסלת.","(2) 60 ש״ח בלי לחם מפרה את כלל ב. נפסלת. (צלחת ירוקה למנה בשרית מותרת, כי הכלל לא אוסר זאת.)","(3) בשרית, ולכן כלל א לא חל עליה. מעל 50 ועם לחם, ולכן כלל ב מתקיים. <b>זו התשובה.<\/b>"]},"g":{"q":"כלל: כל מי שנרשם לסדנה קיבל חולצה. ידוע שגלית <b>לא<\/b> קיבלה חולצה. מה נובע בהכרח?","pt":null,"o":["גלית נרשמה מאוחר מדי","גלית לא נרשמה לסדנה","כל מי שקיבל חולצה נרשם לסדנה","גלית לא רצתה חולצה"],"a":1,"g":["תמצת: נרשם → חולצה.","מה נובע כשהתוצאה (חולצה) לא מתקיימת?"],"x":"מ״נרשם → חולצה״ נובע ״אין חולצה → לא נרשם״. לכן גלית לא נרשמה. תשובה 3 היא היפוך החץ, והוא לא נובע מהכלל. תשובות 1 ו-4 לא נובעות מהנתונים."},"solo":{"q":"בתחרות בישול: (א) אם ורק אם שם התבשיל מתחיל באות מ׳, הוא חריף. (ב) אם ורק אם התבשיל מכיל אורז, הוא מוגש בקערה. איזה תבשיל <b>יכול<\/b> להיות מוגש בתחרות?","pt":null,"o":["מרק חריף, בלי אורז, שמוגש בקערה","פשטידה חריפה עם אורז, שמוגשת בקערה","מקלובה לא חריפה עם אורז, שמוגשת בקערה","מג׳דרה חריפה עם אורז, שמוגשת בקערה"],"a":3,"x":"המרק מוגש בקערה בלי אורז, וזה מפר את כלל ב (קערה רק אם יש אורז). הפשטידה חריפה אבל לא מתחילה במ׳, וזה מפר את כלל א. המקלובה מתחילה במ׳, ולכן חייבת להיות חריפה. המג׳דרה עומדת בשני הכללים."},"bank":[{"t":"יכול להיות","lvl":1,"q":"כללי השאלת ספרים בספרייה: (א) ספר עיון מושאל לשבוע בלבד. (ב) מי שמשאיל יותר משלושה ספרים חייב להציג תעודה. איזה מקרה <b>יכול<\/b> להתרחש בספרייה?","pt":null,"table":null,"o":["דנה השאילה ספר עיון לשבועיים","יוסי השאיל חמישה רומנים לשבוע, בלי להציג תעודה","מאיה השאילה שני ספרי עיון לשבוע, בלי להציג תעודה","רון השאיל ארבעה ספרים לשלושה ימים, בלי להציג תעודה"],"a":2,"x":"מאיה השאילה שני ספרים בלבד, ולכן היא לא צריכה תעודה, וספרי העיון הושאלו לשבוע. תשובה 1 מפרה את כלל א, ותשובות 2 ו-4 מפרות את כלל ב."},{"t":"שלילת התוצאה","lvl":2,"q":"כלל: אם יורד גשם, המשחק נדחה. ידוע שהמשחק <b>לא<\/b> נדחה. מה נובע בהכרח?","pt":null,"table":null,"o":["לא ירד גשם","ירד גשם, אבל חלש","אם המשחק נדחה, ירד גשם","המשחק לא היה אמור להידחות בשום מקרה"],"a":0,"x":"גשם → נדחה, ולכן לא נדחה → לא ירד גשם. תשובה 3 היא היפוך החץ: ייתכן שמשחק נדחה גם מסיבה אחרת. תשובה 2 סותרת את הכלל."},{"t":"משחק משפטים","lvl":3,"q":"במשחק מילים, כל שחקן בתורו אומר משפט אחד שחייב לעמוד בכללים האלה:\nא. במשפט יש בדיוק מילה אחת יותר מבמשפט הקודם.\nב. המשפט מתחיל באות שבה הסתיימה המילה האחרונה של המשפט הקודם (אות סופית נחשבת כמו האות הרגילה).\nג. אסור לחזור על מילה מהמשפט הקודם.\nשחקן א׳ אמר: ״הים כחול היום״. מה <b>יכול<\/b> להיות המשפט של שחקן ב׳?","pt":null,"table":null,"o":["מים קרים מרעננים","מחר הים יהיה סוער","בבוקר נלך אל החוף","מחר נלך אל החוף"],"a":3,"x":"המשפט הקודם בן שלוש מילים ומסתיים ב-ם, ולכן צריך משפט בן ארבע מילים שמתחיל ב-מ, בלי המילים הים, כחול, היום. תשובה 1 בת שלוש מילים בלבד. תשובה 2 חוזרת על ״הים״. תשובה 3 מתחילה ב-ב. תשובה 4 עומדת בכל הכללים."},{"t":"אם ורק אם","lvl":3,"q":"בכל שנה חגית מקבלת ליום הולדתה מתנה שעומדת בשני הכללים:\n- אם ורק אם שם המתנה מתחיל באות א׳, היא יקרה.\n- אם ורק אם שם המתנה מתחיל באות ש׳, היא נוצצת.\nמה <b>יכולה<\/b> להיות המתנה שקיבלה השנה?","pt":null,"table":null,"o":["ארנק יקר ונוצץ","שרשרת נוצצת ויקרה","שעון נוצץ שאינו יקר","בושם יקר שאינו נוצץ"],"a":2,"x":"שעון מתחיל ב-ש, ולכן חייב להיות נוצץ (מתקיים). הוא לא מתחיל ב-א, ולכן אסור שיהיה יקר (מתקיים). הארנק נוצץ אבל לא מתחיל ב-ש. השרשרת יקרה אבל לא מתחילה ב-א. הבושם יקר בלי להתחיל ב-א."},{"t":"שרשרת כללים","lvl":4,"q":"בתחרות אפייה: (א) כל עוגה שמנצחת בשלב הראשון עולה לגמר. (ב) כל עוגה שעולה לגמר ומכילה שוקולד מוגשת לשופט הראשי. ידוע שהעוגה של רותם מכילה שוקולד, ושהיא <b>לא<\/b> הוגשה לשופט הראשי. מה נובע בהכרח?","pt":null,"table":null,"o":["העוגה עלתה לגמר, אבל הפסידה בו","העוגה ניצחה בשלב הראשון, אבל לא עלתה לגמר","העוגה לא ניצחה בשלב הראשון","לא ניתן לדעת אם העוגה ניצחה בשלב הראשון"],"a":2,"x":"לפי כלל ב, אילו עוגת שוקולד הייתה עולה לגמר, היא הייתה מוגשת לשופט. היא לא הוגשה, ולכן לא עלתה לגמר. לפי כלל א, אילו ניצחה בשלב הראשון, הייתה עולה לגמר. לכן היא לא ניצחה. תשובה 2 סותרת את כלל א, ותשובה 1 סותרת את כלל ב."},{"t":"מה לא יכול להיות הכלל","lvl":4,"q":"ארבעה מועמדים ניסו להתקבל לוועדה:\n- אור, בעלת תואר ראשון בכלכלה ותואר שני במשפטים, התקבלה.\n- בר, בעל תואר ראשון בכלכלה, התקבל.\n- גל, בעלת תואר ראשון במשפטים, לא התקבלה.\n- דן, בעל תואר ראשון ושני בפיזיקה, לא התקבל.\n(למועמדים אין תארים נוספים.) איזה מן הבאים <b>לא יכול<\/b> להיות תנאי הקבלה לוועדה?","pt":null,"table":null,"o":["מתקבלים רק בעלי תואר בכלכלה","מתקבלים בעלי תואר ראשון בכלכלה, וגם כל מי שיש לו תואר שני","מתקבלים בעלי תואר ראשון בכלכלה, וגם מי שיש לו שני תארים בתחומים שונים","לא מתקבל מי שאין לו תואר בכלכלה"],"a":1,"x":"לפי תנאי 2, דן, שיש לו תואר שני, היה צריך להתקבל, אבל הוא לא התקבל. לכן תנאי 2 לא יכול להיות התנאי. שאר התנאים מתיישבים עם ארבעת המקרים: אור ובר בעלי תואר בכלכלה, ולגל ולדן אין תואר כזה ואין להם שני תארים בתחומים שונים."},{"t":"בדיוק אחד צודק","lvl":5,"q":"שלושה חברים ניחשו באיזה יום יתקיים המבחן (בין יום א׳ ליום ה׳):\nאלון: ״ביום ב׳ או ביום ד׳.״\nבני: ״ביום ד׳ או ביום ה׳.״\nגיא: ״ביום ב׳, ביום ג׳ או ביום ה׳.״\nהתברר שבדיוק אחד מהם צדק. באיזה יום התקיים המבחן?","pt":null,"table":null,"o":["יום ב׳","יום ג׳","יום ד׳","יום ה׳"],"a":1,"x":"בודקים כל יום: ב׳: אלון וגיא צודקים (שניים). ג׳: רק גיא צודק (אחד). ד׳: אלון ובני צודקים (שניים). ה׳: בני וגיא צודקים (שניים). (ביום א׳ איש אינו צודק.) לכן המבחן התקיים ביום ג׳."}]},{"id":"vbb-arrangements","title":"שאלות שיבוצים","tag":"כללים ושיבוצים","en":false,"source":"ספר חשיבה מילולית, פרק ״כללים ושיבוצים״, חלק ב׳ ״שיבוצים״ (עמ' 272-278, תרגול ותשובות עד עמ' 294)","rule":["בשאלות שיבוצים מקבלים כמה נתונים וצריך לסדר לפיהם פריטים: בשורה, במגדל, בכלובים, לפי גיל וגובה. לפעמים יש כמה שאלות על אותם נתונים, ויש גם שאלות עם נתון שתקף רק לשאלה אחת. אז צריך לזכור לא להשתמש בו בשאר השאלות.","<b>מתחילים בנתון העוגן<\/b>: נתון שאפשר לשבץ בוודאות (״המחברת במקום הימני ביותר״). אחריו משבצים את הנתונים שנשענים עליו. תמיד <b>משרטטים<\/b>: אם אין שרטוט בשאלה, מציירים משבצות לבד.","לא תמיד אפשר להגיע לסידור אחד ויחיד. אז הדרך היעילה היא <b>למצוא סידור אפשרי אחד ולבדוק לפיו את התשובות<\/b>. אם נשארו כמה תשובות, בונים סידור אפשרי נוסף כדי להכריע. זה דומה להצבת ערכים בפרק הכמותי.","כשיש שני סוגי נתונים (למשל גיל וגובה), מציירים לכל סוג <b>ציר נפרד<\/b> ומסמנים עליו את הסדר. כך לא מתבלבלים בין ״מבוגר מ-״ ל״גבוה מ-״."],"f":["קודם נתון עוגן, אחר כך הנתונים שנשענים עליו","״בהכרח״ = נכון בכל סידור אפשרי. ״ייתכן״ = נכון לפחות בסידור אחד","שני סוגי נתונים = שני צירים נפרדים"],"traps":["להתחיל מנתון יחסי (״צמוד ל-״) במקום מנתון ודאי","להסיק ״בהכרח״ מסידור אפשרי אחד בלבד","לבלבל בין ״משמאל ל-״ ובין ״צמוד משמאל ל-״","לגרור נתון שניתן לשאלה אחת גם לשאלות האחרות"],"ex":{"q":"ארבעה חפצים מסודרים בשורה: ספר, מחברת, קלמר ועיפרון. ידוע: העיפרון לא צמוד לקלמר; הספר נמצא משמאל לעיפרון (צמוד); המחברת במקום הימני ביותר. איזה חפץ במקום השמאלי ביותר?","pt":null,"steps":["<b>נתון עוגן:<\/b> המחברת במקום הימני ביותר. [? ? ? מחברת]","העיפרון והקלמר לא צמודים, ולכן אחד מהם צמוד למחברת והשני בקצה השמאלי.","הספר צמוד משמאל לעיפרון, ולכן העיפרון לא יכול להיות בקצה השמאלי. מכאן שהעיפרון צמוד למחברת והספר משמאלו: [קלמר, ספר, עיפרון, מחברת].","<b>הקלמר<\/b> במקום השמאלי ביותר."]},"g":{"q":"ארבעה ספרים עומדים על מדף, במקומות 1 עד 4 משמאל לימין: אדום, כחול, ירוק וצהוב. הירוק במקום 1. הכחול צמוד לירוק. הצהוב לא במקום 4. איזה ספר במקום 4?","pt":null,"o":["הצהוב","הכחול","האדום","לא ניתן לקבוע"],"a":2,"g":["העוגן: ירוק במקום 1. מי חייב להיות במקום 2?","נשארו מקומות 3 ו-4 לצהוב ולאדום. הצהוב לא במקום 4."],"x":"ירוק במקום 1. הכחול צמוד אליו, ולכן במקום 2. הצהוב לא במקום 4, ולכן הוא במקום 3, והאדום במקום 4."},"solo":{"q":"יואב בנה מגדל מארבע קוביות (מקום 1 למטה, מקום 4 למעלה): קוביית עץ ירוקה, קוביית עץ לבנה, קוביית מתכת ירוקה וקוביית מתכת לבנה. ידוע: אין שתי קוביות סמוכות באותו צבע; שתי קוביות העץ לא סמוכות זו לזו; הקובייה התחתונה היא קוביית העץ הירוקה. איזו קובייה במקום 3?","pt":null,"o":["קוביית העץ הלבנה","קוביית המתכת הירוקה","קוביית המתכת הלבנה","לא ניתן לקבוע"],"a":1,"x":"הצבעים מתחלפים: ירוק, לבן, ירוק, לבן (מלמטה). במקום 1 העץ הירוק, ולכן במקום 3 הירוק הנותר, כלומר המתכת הירוקה. מכאן שמקום 2 (לבן) לא יכול להיות עץ, כי הוא צמוד לעץ שבמקום 1, ולכן הוא המתכת הלבנה, והעץ הלבן במקום 4."},"bank":[{"t":"שיבוץ בזוגות","lvl":2,"q":"שישה ילדים, שניים מכיתה א׳, שניים מכיתה ב׳ ושניים מכיתה ג׳, יושבים בשלוש סירות, שניים בכל סירה. בכל סירה יושבים ילדים משתי כיתות <b>שונות<\/b>. ידוע שבאחת הסירות יושבים ילד מכיתה א׳ וילד מכיתה ב׳. מה נכון <b>בהכרח<\/b>?","pt":null,"table":null,"o":["יש סירה ששני ילדיה מכיתה א׳","אין סירה שבה יושבים ילד מכיתה א׳ וילד מכיתה ג׳","יש סירה שבה יושבים ילד מכיתה ב׳ וילד מכיתה ג׳","בשתי סירות יושבים ילד מכיתה א׳ וילד מכיתה ב׳"],"a":2,"x":"נשארו ילד מא׳, ילד מב׳ ושני ילדים מג׳. שני ילדי ג׳ לא יכולים לשבת יחד, ולכן כל אחד מהם יושב בסירה אחרת: אחד עם ילד א׳ ואחד עם ילד ב׳. לכן בהכרח יש סירה של ב׳ ו-ג׳."},{"t":"שני צירים","lvl":3,"q":"אלה, בתיה וגאיה הן שלוש אחיות בגילים שונים ובגבהים שונים. אלה מבוגרת מבתיה ונמוכה ממנה. גאיה גבוהה מבתיה. מה <b>אינו<\/b> ייתכן?","pt":null,"table":null,"o":["גאיה היא הצעירה מבין השלוש","האחות המבוגרת ביותר היא הנמוכה ביותר","בתיה היא המבוגרת מבין השלוש","גאיה מבוגרת מאלה"],"a":2,"x":"ציר גובה: אלה < בתיה < גאיה (סדר מלא). ציר גיל: אלה מבוגרת מבתיה, ומקומה של גאיה לא ידוע. לכן בתיה לא יכולה להיות המבוגרת, כי אלה מבוגרת ממנה. שאר האפשרויות ייתכנו בהתאם למקומה של גאיה בציר הגיל (למשל, אם אלה המבוגרת, היא גם הנמוכה)."},{"t":"שורה, בהכרח","lvl":4,"q":"על פי הנתונים שבקטע, מה נכון <b>בהכרח<\/b>?","pt":"חמישה חברים, רון, שי, טל, נוי ואור, עומדים בשורה, במקומות 1 עד 5 משמאל לימין. ידוע:\n- רון ושי עומדים צמודים זה לזה.\n- טל עומד משמאל לרון (לאו דווקא צמוד אליו).\n- נוי עומדת באחד מקצות השורה.\n- אור אינו עומד צמוד לטל.","table":null,"o":["רון עומד במקום 2","נוי עומדת בקצה הימני","שי עומד צמוד לאור","טל עומד באחד משני המקומות השמאליים"],"a":3,"x":"יש ארבעה סידורים אפשריים: טל-רון-שי-אור-נוי, טל-שי-רון-אור-נוי, נוי-טל-רון-שי-אור ונוי-טל-שי-רון-אור. בכולם טל במקום 1 או 2. כל אחת משאר הטענות נכונה רק בחלק מהסידורים (למשל, כשנוי בקצה השמאלי, רון לא במקום 2)."},{"t":"שורה, נתון נוסף","lvl":3,"q":"על פי הנתונים שבקטע, ובהנחה הנוספת (לשאלה זו בלבד) שנוי עומדת בקצה הימני: מי עומד במקום 4?","pt":"חמישה חברים, רון, שי, טל, נוי ואור, עומדים בשורה, במקומות 1 עד 5 משמאל לימין. ידוע:\n- רון ושי עומדים צמודים זה לזה.\n- טל עומד משמאל לרון (לאו דווקא צמוד אליו).\n- נוי עומדת באחד מקצות השורה.\n- אור אינו עומד צמוד לטל.","table":null,"o":["רון","שי","אור","לא ניתן לקבוע"],"a":2,"x":"נוי במקום 5, ולכן מקומות 1 עד 4 נשארים לטל, לזוג רון-שי ולאור. טל משמאל לרון, ואור לא צמוד לטל. רון חייב להיות מימין לטל ושי צמוד לרון, ולכן טל במקום 1 או 2. אם טל במקום 2, הזוג במקומות 3-4 ואור במקום 1, צמוד לטל, וזה אסור. לכן טל במקום 1, הזוג במקומות 2-3 ואור במקום 4."},{"t":"סידור אפשרי ובדיקה","lvl":4,"q":"הילה בנתה מגדל מארבע קוביות (מקום 1 למטה): קוביית עץ אדומה, קוביית עץ כחולה, קוביית פלסטיק אדומה וקוביית זכוכית כחולה. ידוע: אין שתי קוביות סמוכות באותו צבע; אין שתי קוביות סמוכות מאותו חומר; הקובייה התחתונה עשויה עץ. מה נכון <b>בהכרח<\/b>?","pt":null,"table":null,"o":["קובייה 1 אדומה","קובייה 2 עשויה זכוכית","קובייה 3 כחולה","קובייה 4 עשויה עץ"],"a":3,"x":"קוביות העץ לא סמוכות, ואחת מהן במקום 1, ולכן השנייה במקום 3 או 4. אם היא במקום 3, הקובייה במקום 2 צמודה לשתי קוביות עץ בצבעים שונים (אדום וכחול), ואין לה צבע אפשרי. לכן העץ השני במקום 4. סידור אפשרי אחד: עץ כחול, פלסטיק אדום, זכוכית כחולה, עץ אדום. סידור אפשרי שני: עץ אדום, זכוכית כחולה, פלסטיק אדום, עץ כחול. רק טענה 4 נכונה בשניהם."},{"t":"שיבוץ בטבלה","lvl":5,"q":"שלושה עובדים, אבי, בתיה וגדי, עובדים כל אחד במחלקה אחרת (שיווק, כספים, פיתוח) ומגיעים לעבודה בכלי תחבורה אחר (אוטובוס, אופניים, רכב). ידוע:\n- העובד מהכספים מגיע באוטובוס.\n- בתיה אינה בפיתוח ואינה מגיעה ברכב.\n- אבי מגיע באופניים.\nמה נכון <b>בהכרח<\/b>?","pt":null,"table":null,"o":["גדי עובד בשיווק","בתיה עובדת בכספים","אבי עובד בשיווק","גדי מגיע באוטובוס"],"a":1,"x":"אבי מגיע באופניים. בתיה לא מגיעה ברכב, ולכן היא מגיעה באוטובוס, וגדי ברכב. מי שמגיע באוטובוס עובד בכספים, ולכן בתיה בכספים. המחלקה של אבי ושל גדי (שיווק או פיתוח) לא נקבעת, ולכן תשובות 1 ו-3 לא בהכרח נכונות."}]},{"id":"vbb-reading","title":"הבנת הנקרא","tag":"הבנת הנקרא","en":false,"source":"ספר חשיבה מילולית, פרק ״הבנת הנקרא״ (עמ' 295-390: הסבר בעמ' 295-296, יחידות תרגול 1-19 ותשובות)","rule":["בבחינה מופיע קטע עיוני אחד (לפעמים שני קטעים קצרים) ואחריו 5-6 שאלות, בזמן מומלץ של כדקה לשאלה. השאלות מופיעות <b>לפי סדר הופעת התשובות בקטע<\/b>, ולכן אפשר לחפש כל תשובה רק בחלק הרלוונטי.","יש שני סוגי שאלות. <b>שאלות נקודתיות<\/b> מפנות לשורה, למילה או לפסקה מסוימת, ופותרים אותן מיד. בשאלה שמפנה לשורה מתחילים לקרוא <b>משפט אחד לפני<\/b> השורה המצוינת. <b>שאלות כלליות<\/b> (כותרת, מטרת הכותב, מבנה הקטע) מופיעות בדרך כלל ראשונות או אחרונות. מדלגים עליהן ופותרים אותן בסוף, אחרי שכבר הבנת את הקטע.","דגשים: <b>משפט המפתח<\/b> של פסקה הוא בדרך כלל המשפט הראשון שלה, ואפשר לקרוא רק את המשפטים הראשונים כדי לקבל תמונה כללית. הפסקה האחרונה <b>אינה<\/b> בהכרח סיכום, כי הקטע הוא חלק ממאמר ארוך יותר. בשאלה על פסקה שלמה כדאי לקרוא את המשפט הראשון והאחרון שלה כדי להבין את תפקידה.","התשובה הנכונה חייבת להיות מבוססת על הכתוב. תשובה שנשמעת נכונה מהידע הכללי שלך, אבל לא נאמרת או משתמעת בקטע, היא מלכודת."],"f":["השאלות לפי סדר הקטע: מחפשים את התשובה ליד התשובה הקודמת","שאלה כללית: לפתור בסוף","שאלת שורה: להתחיל משפט אחד לפני","משפט מפתח = בדרך כלל המשפט הראשון בפסקה"],"traps":["לבחור תשובה נכונה מהידע הכללי שלא מבוססת על הקטע","תשובה שמעתיקה מילים מהקטע אבל משנה את הקשר ביניהן (סיבה ותוצאה, מי אמר מה)","להניח שהפסקה האחרונה היא סיכום הקטע","בשאלות ״איזה אינו מוזכר״: לשכוח את השלילה"],"ex":{"q":"מדוע, לפי הפסקה הראשונה, ההבדלים בין השעות המקומיות לא הפריעו לפני תקופת הרכבת?","pt":"עד אמצע המאה ה-19 קבעה כל עיר את שעתה לפי השמש: כשהשמש הגיעה לנקודה הגבוהה ביותר בשמיים, הראו שעוני העיר שתים-עשרה. משום כך השעה בעיר אחת הייתה שונה במעט מהשעה בעיר שממזרח לה או ממערב לה. כל עוד אנשים נעו ממקום למקום ברגל או בכרכרה, ההבדלים הקטנים האלה לא הפריעו לאיש: מסע בין שתי ערים נמשך ימים, ואיש לא נזקק לתיאום מדויק.\n\nהרכבת שינתה את התמונה. כשנוסעים יכלו לעבור מאות קילומטרים ביום אחד, לוחות הזמנים של חברות הרכבות הפכו לסבך של שעות מקומיות. בתחנות גדולות נתלו לעיתים כמה שעונים זה לצד זה, וכל אחד מהם הראה שעה אחרת. נוסעים החמיצו רכבות כי לא ידעו לפי איזה שעון לנהוג. וגרוע מכך, חוסר התיאום בין התחנות הגביר את הסכנה שרכבות שנוסעות על אותה מסילה ייפגשו בה.\n\nהפתרון שאימצו חברות הרכבות היה חלוקה של היבשה לאזורי זמן: בתוך כל אזור כל השעונים מראים אותה שעה, וההפרש בין אזור לאזור הוא שעה שלמה. בתחילה זה היה הסדר פנימי של החברות, ורבים התנגדו לו. היו שטענו שהשמש, ולא חברה מסחרית, צריכה לקבוע מתי צהריים. רק כעבור שנים רבות עוגנה השיטה בחוק, ובהדרגה התקבלה כמובנת מאליה.\n\nיש הרואים בסיפור הזה דוגמה לאופן שבו טכנולוגיה חדשה משנה לא רק את מה שאנו עושים, אלא גם את האופן שבו אנו תופסים מושגים בסיסיים. הזמן, שנחשב בעבר לתופעה טבעית שהשמש מכתיבה, הפך להסכם חברתי שנקבע לפי צורכי התחבורה והמסחר.","steps":["זו שאלה נקודתית שמפנה לפסקה הראשונה, ולכן מחפשים רק שם.","המשפט הרלוונטי: ״כל עוד אנשים נעו... ברגל או בכרכרה... מסע בין שתי ערים נמשך ימים, ואיש לא נזקק לתיאום מדויק.״","<b>התשובה:<\/b> הנסיעות היו איטיות, ולכן לא היה צורך לתאם שעות בדיוק בין ערים.","מלכודת אפשרית: ״לא היו אז שעונים בערים״. זה סותר את הקטע, שאומר שהשעונים הראו שתים-עשרה בצהריים."]},"g":{"q":"איזו מן הכותרות הבאות מתאימה ביותר לקטע?","pt":"עד אמצע המאה ה-19 קבעה כל עיר את שעתה לפי השמש: כשהשמש הגיעה לנקודה הגבוהה ביותר בשמיים, הראו שעוני העיר שתים-עשרה. משום כך השעה בעיר אחת הייתה שונה במעט מהשעה בעיר שממזרח לה או ממערב לה. כל עוד אנשים נעו ממקום למקום ברגל או בכרכרה, ההבדלים הקטנים האלה לא הפריעו לאיש: מסע בין שתי ערים נמשך ימים, ואיש לא נזקק לתיאום מדויק.\n\nהרכבת שינתה את התמונה. כשנוסעים יכלו לעבור מאות קילומטרים ביום אחד, לוחות הזמנים של חברות הרכבות הפכו לסבך של שעות מקומיות. בתחנות גדולות נתלו לעיתים כמה שעונים זה לצד זה, וכל אחד מהם הראה שעה אחרת. נוסעים החמיצו רכבות כי לא ידעו לפי איזה שעון לנהוג. וגרוע מכך, חוסר התיאום בין התחנות הגביר את הסכנה שרכבות שנוסעות על אותה מסילה ייפגשו בה.\n\nהפתרון שאימצו חברות הרכבות היה חלוקה של היבשה לאזורי זמן: בתוך כל אזור כל השעונים מראים אותה שעה, וההפרש בין אזור לאזור הוא שעה שלמה. בתחילה זה היה הסדר פנימי של החברות, ורבים התנגדו לו. היו שטענו שהשמש, ולא חברה מסחרית, צריכה לקבוע מתי צהריים. רק כעבור שנים רבות עוגנה השיטה בחוק, ובהדרגה התקבלה כמובנת מאליה.\n\nיש הרואים בסיפור הזה דוגמה לאופן שבו טכנולוגיה חדשה משנה לא רק את מה שאנו עושים, אלא גם את האופן שבו אנו תופסים מושגים בסיסיים. הזמן, שנחשב בעבר לתופעה טבעית שהשמש מכתיבה, הפך להסכם חברתי שנקבע לפי צורכי התחבורה והמסחר.","o":["תולדות השעון המכני","סכנות הנסיעה ברכבת במאה ה-19","כיצד הרכבת שינתה את הדרך שבה אנו קובעים את השעה","המאבק בין חברות הרכבות על לוחות הזמנים"],"a":2,"g":["זו שאלה כללית. נסח לעצמך במשפט אחד מה רצף הקטע: לפני הרכבת, הבעיה, הפתרון, המשמעות.","איזו כותרת מכסה את כל הרצף, ולא רק פרט אחד ממנו?"],"x":"הקטע עוסק במעבר משעה מקומית לפי השמש לאזורי זמן בגלל הרכבת, ובמשמעות של המעבר הזה. כותרת 2 מתארת רק פרט מהפסקה השנייה. כותרות 1 ו-4 לא מופיעות בקטע (לא מסופר על מאבק בין חברות)."},"solo":{"q":"לפי הפסקה השנייה, מהו הגורם שתרומתו לאי החום העירוני קטנה יחסית?","pt":"בימי קיץ חמים, הטמפרטורה במרכזה של עיר גדולה יכולה להיות גבוהה בכמה מעלות מהטמפרטורה בשטחים הפתוחים שסביבה. לתופעה הזו קוראים ״אי חום עירוני״. ההבדל בולט במיוחד בשעות הלילה: השדות שמחוץ לעיר מתקררים מהר אחרי השקיעה, ואילו העיר ממשיכה להקרין חום שעות ארוכות.\n\nהסיבה העיקרית לכך היא החומרים שמהם בנויה העיר. אספלט ובטון סופגים חלק גדול מקרינת השמש במהלך היום, אוגרים אותה ומשחררים אותה לאט אל האוויר בלילה. נוסף על כך, בעיר יש מעט צמחייה. עצים ועשבים מקררים את סביבתם באמצעות אידוי מים מעליהם, ובאזור שרובו מכוסה בבניינים ובכבישים התהליך הזה כמעט לא מתקיים. גם מזגנים, כלי רכב ומפעלים פולטים חום, אבל בדרך כלל תרומתם קטנה מזו של החומרים ושל המחסור בצמחייה.\n\nלאי החום יש מחיר. בימי שרב עולה מספר הפונים לחדרי המיון, וצריכת החשמל לקירור מזנקת. כך עולה גם פליטת המזהמים מתחנות הכוח, מה שמחמיר עוד יותר את המצב.\n\nכמה ערים כבר מנסות להתמודד עם התופעה: הן צובעות גגות בלבן כדי שיחזירו את קרינת השמש, נוטעות עצים לאורך הרחובות ומחליפות משטחי אספלט בחומרים נקבוביים. מתכננים מציינים שלאמצעים האלה יש יתרון כפול: הם מורידים את הטמפרטורה וגם מקטינים את הצורך במזגנים.","o":["האספלט והבטון שאוגרים חום","המחסור בצמחייה בעיר","החום שנפלט ממזגנים, מכלי רכב וממפעלים","החזרת קרינת השמש מגגות לבנים"],"a":2,"x":"בסוף הפסקה השנייה כתוב שמזגנים, כלי רכב ומפעלים פולטים חום, ״אבל בדרך כלל תרומתם קטנה מזו של החומרים ושל המחסור בצמחייה״. גגות לבנים הם חלק מהפתרון ולא גורם לבעיה."},"bank":[{"t":"פרט שאינו מוזכר","lvl":1,"q":"על פי הפסקה השנייה, איזו מן הבעיות הבאות <b>לא<\/b> נגרמה בגלל ריבוי השעות המקומיות?","pt":"עד אמצע המאה ה-19 קבעה כל עיר את שעתה לפי השמש: כשהשמש הגיעה לנקודה הגבוהה ביותר בשמיים, הראו שעוני העיר שתים-עשרה. משום כך השעה בעיר אחת הייתה שונה במעט מהשעה בעיר שממזרח לה או ממערב לה. כל עוד אנשים נעו ממקום למקום ברגל או בכרכרה, ההבדלים הקטנים האלה לא הפריעו לאיש: מסע בין שתי ערים נמשך ימים, ואיש לא נזקק לתיאום מדויק.\n\nהרכבת שינתה את התמונה. כשנוסעים יכלו לעבור מאות קילומטרים ביום אחד, לוחות הזמנים של חברות הרכבות הפכו לסבך של שעות מקומיות. בתחנות גדולות נתלו לעיתים כמה שעונים זה לצד זה, וכל אחד מהם הראה שעה אחרת. נוסעים החמיצו רכבות כי לא ידעו לפי איזה שעון לנהוג. וגרו ":"שאלה נקודתית","lvl":1,"q":"מדוע ההבדל בטמפרטורה בין העיר לסביבתה בולט במיוחד בלילה?","pt":"בימי קיץ חמים, הטמפרטורה במרכזה של עיר גדולה יכולה להיות גבוהה בכמה מעלות מהטמפרטורה בשטחים הפתוחים שסביבה. לתופעה הזו קוראים ״אי חום עירוני״. ההבדל בולט במיוחד בשעות הלילה: השדות שמחוץ לעיר מתקררים מהר אחרי השקיעה, ואילו העיר ממשיכה להקרין חום שעות ארוכות.\n\nהסיבה העיקרית לכך היא החומרים שמהם בנויה העיר. אספלט ובטון סופגים חלק גדול מקרינת השמש במהלך היום, אוגרים אותה ומשחררים אותה לאט אל האוויר בלילה. נוסף על כך, בעיר יש מעט צמחייה. עצים ועשבים מקררים את סביבתם באמצעות אידוי מים מעליהם, ובאזור שרובו מכוסה בבניינים ובכבישים התהליך הזה כמעט לא מתקיים. גם מזגנים, כלי רכב ומפעלים פולטים חום, אבל בדרך כלל תרומתם קטנה מזו של החומרים ושל המחסור בצמחייה.\n\nלאי החום יש מחיר. בימי שרב עולה מספר הפונים לחדרי המיון, וצריכת החשמל לקירור מזנקת. כך עולה גם פליטת המזהמים מתחנות הכוח, מה שמחמיר עוד יותר את המצב.\n\nכמה ערים כבר מנסות להתמודד עם התופעה: הן צובעות גגות בלבן כדי שיחזירו את קרינת השמש, נוטעות עצים לאורך הרחובות ומחליפות משטחי אספלט בחומרים נקבוביים. מתכננים מציינים שלאמצעים האלה יש יתרון כפול: הם מורידים את הטמפרטורה וגם מקטינים את הצורך במזגנים.","table":null,"o":["כי בלילה פועלים בעיר יותר מזגנים","כי חומרי הבנייה משחררים בלילה את החום שאגרו ביום","כי השדות סופגים יותר קרינה בלילה","כי בלילה אין רוח בעיר"],"a":1,"x":"בפסקה השנייה מוסבר שאספלט ובטון אוגרים קרינה במהלך היום ״ומשחררים אותה לאט אל האוויר בלילה״. לכן העיר ממשיכה להקרין חום אחרי השקיעה. שאר ההסברים לא מופיעים בקטע."},{"t":"קשר בין רעיונות","lvl":3,"q":"בפסקה השלישית מתואר תהליך שבו -","pt":"בימי קיץ חמים, הטמפרטורה במרכזה של עיר גדולה יכולה להיות גבוהה בכמה מעלות מהטמפרטורה בשטחים הפתוחים שסביבה. לתופעה הזו קוראים ״אי חום עירוני״. ההבדל בולט במיוחד בשעות הלילה: השדות שמחוץ לעיר מתקררים מהר אחרי השקיעה, ואילו העיר ממשיכה להקרין חום שעות ארוכות.\n\nהסיבה העיקרית לכך היא החומרים שמהם בנויה העיר. אספלט ובטון סופגים חלק גדול מקרינת השמש במהלך היום, אוגרים אותה ומשחררים אותה לאט אל האוויר בלילה. נוסף על כך, בעיר יש מע
